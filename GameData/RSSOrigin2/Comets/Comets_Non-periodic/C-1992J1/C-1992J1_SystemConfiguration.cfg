// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[C-1992J1]
	{
		@Orbit
		{
			@inclination = 102.5256284927688
			@longitudeOfAscendingNode = 199.5643504201578
			@argumentOfPeriapsis = 74.01376067088150
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[C-1992J1]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 16799
			}
		}
		@ScaledVersion
		{
			@fadeStart = 3692
			@fadeEnd = 3817
		}
		@PQS
		{
			@fadeStart = 3817
			@fadeEnd = 4220
			@deactivateAltitude = 4220
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[C-1992J1]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
