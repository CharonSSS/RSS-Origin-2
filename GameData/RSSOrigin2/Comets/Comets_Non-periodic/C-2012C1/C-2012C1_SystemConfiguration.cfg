// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[C-2012C1]
	{
		@Orbit
		{
			@inclination = 107.5465276680520
			@longitudeOfAscendingNode = 296.2538600756867
			@argumentOfPeriapsis = 258.8306814400345
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[C-2012C1]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2608
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 6961
			}
		}
		@ScaledVersion
		{
			@fadeStart = 2108
			@fadeEnd = 2223
		}
		@PQS
		{
			@fadeStart = 2223
			@fadeEnd = 2608
			@deactivateAltitude = 2608
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[C-2012C1]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
