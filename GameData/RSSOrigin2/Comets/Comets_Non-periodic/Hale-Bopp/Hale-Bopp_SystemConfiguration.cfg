// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Hale-Bopp]
	{
		@Orbit
		{
			@inclination = 94.40273731857700
			@longitudeOfAscendingNode = 281.6927908242101
			@argumentOfPeriapsis = 107.6612559045810
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Hale-Bopp]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 7893
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 27129
			}
		}
		@ScaledVersion
		{
			@fadeStart = 7039
			@fadeEnd = 7243
		}
		@PQS
		{
			@fadeStart = 7243
			@fadeEnd = 7893
			@deactivateAltitude = 7893
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Hale-Bopp]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Hale-Bopp]
	{
		@Scatter,*
		{
			@Distribution
			{
				//@spawnChance /= 4
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Hale-Bopp]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Hale-Bopp]
	{
		@gravitational_parameter = 5.83982271250000e-04 km^3/s^2
		@angular_frequency       = 1.46855524079400e+03 deg / d
		@reference_radius        = 9.26348163852945e+00 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Hale-Bopp]
	{
		@x    = +4.24417682269888e+08 km
		@y    = -1.24717057148559e+09 km
		@z    = -2.28447123573020e+09 km
		@vx   = -3.31793541042218e-01 km/s
		@vy   = +8.51761425131450e-01 km/s
		@vz   = +2.14892844710400e+00 km/s
	}
}

