@Kopernicus:LAST[RSSOrigin2]
{
	@Body[103P-Hartley2]
	{
		@Properties
		{
			@radius *= 1.29
			@mass *= 2.146689
			@timewarpAltitudeLimits[*, ] *= 1.29
			@ScienceValues
			{
				@flyingAltitudeThreshold *= 1.29
				@spaceAltitudeThreshold *= 1.29
			}
		}
		@PQS
		{
			@fadeEnd = 3216
			@deactivateAltitude = 3216
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity *= 1.29
					@offset *= 1.29
				}
			}
		}
	}
}
