// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[10P-Tempel2]
	{
		@Orbit
		{
			@inclination = 20.60805691667399
			@longitudeOfAscendingNode = 31.61285298551242
			@argumentOfPeriapsis = 283.8971270202634
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[10P-Tempel2]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 4715
			}
		}
		@ScaledVersion
		{
			@fadeStart = 535
			@fadeEnd = 774
		}
		@PQS
		{
			@fadeStart = 774
			@fadeEnd = 2348
			@deactivateAltitude = 2348
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[10P-Tempel2]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[10P-Tempel2]
	{
		@Scatter,*
		{
			@Distribution
			{
				//@spawnChance /= 4
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[10P-Tempel2]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[10P-Tempel2]
	{
		@gravitational_parameter = 1.87708587187500e-06 km^3/s^2
		@angular_frequency       = 1.93115780062600e+03 deg / d
		@reference_radius        = 1.32499995583394e+00 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[10P-Tempel2]
	{
		@x    = -1.42036368847468e+08 km
		@y    = +6.30582013186198e+07 km
		@z    = +4.76397344682750e+07 km
		@vx   = -5.10642593607320e-01 km/s
		@vy   = -5.17180210133535e+00 km/s
		@vz   = -1.49433951323398e+00 km/s
	}
}

