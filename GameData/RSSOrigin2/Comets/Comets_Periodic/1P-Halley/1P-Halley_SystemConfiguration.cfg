// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[1P-Halley]
	{
		@Orbit
		{
			@inclination = 159.4728804934515
			@longitudeOfAscendingNode = 131.8872188397127
			@argumentOfPeriapsis = 188.0181531335215
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[1P-Halley]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 6607
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1741
			@fadeEnd = 2065
		}
		@PQS
		{
			@fadeStart = 2065
			@fadeEnd = 3443
			@deactivateAltitude = 3443
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[1P-Halley]
	{
		@PQS
		{
			@maxLevel -= 1
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[1P-Halley]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 1.1486983549970
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[1P-Halley]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[1P-Halley]
	{
		@gravitational_parameter = 9.17144156998125e-07 km^3/s^2
		@angular_frequency       = 3.27272727272720e+02 deg / d
		@reference_radius        = 1.14685170416705e+00 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[1P-Halley]
	{
		@x    = -7.30454360585338e+08 km
		@y    = +1.09325657152667e+09 km
		@z    = +6.92970574393565e+07 km
		@vx   = +4.31268563214109e-01 km/s
		@vy   = +1.20922406965199e-01 km/s
		@vz   = +1.50743538275011e-01 km/s
	}
}

