				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 20189
			}
		}
		@ScaledVersion
		{
			@fadeStart = 2658
			@fadeEnd = 2790
		}
		@PQS
		{
			@fadeStart = 2790
			@fadeEnd = 3228
			@deactivateAltitude = 3228
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[29P-Schwassmann-Wachmann1]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
