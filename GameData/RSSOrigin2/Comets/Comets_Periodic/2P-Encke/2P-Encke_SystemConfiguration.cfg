// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[2P-Encke]
	{
		@Orbit
		{
			@inclination = 33.97387869042004
			@longitudeOfAscendingNode = 351.1354068303579
			@argumentOfPeriapsis = 169.1185535159235
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[2P-Encke]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 3.51
			@mass /= 12.320099999999998
			@rotationPeriod /= 1.873499399519519
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2364
			@timewarpAltitudeLimits[*, ] /= 3.51
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 3.51
				@spaceAltitudeThreshold = 2895
			}
		}
		@ScaledVersion
		{
			@fadeStart = 480
			@fadeEnd = 715
		}
		@PQS
		{
			@fadeStart = 715
			@fadeEnd = 2364
			@deactivateAltitude = 2364
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 3.51
					@offset /= 3.51
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[2P-Encke]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 3.979585392875
				@minAltitude /= 3.51
				@maxAltitude /= 3.51
				@altitudeFadeRangeAlternate /= 3.51
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[2P-Encke]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 3.51
			@_LowMidBlendEnd /= 3.51
			@_MidHighBlendStart /= 3.51
			@_MidHighBlendEnd /= 3.51
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 3.51
			@maxTerrainAltitude /= 3.51
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[2P-Encke]
	{
		@gravitational_parameter = 1.89603094536570e-07 km^3/s^2
		@angular_frequency       = 1.46052826958759e+03 deg / d
		@reference_radius        = 5.79273500001644e-01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[2P-Encke]
	{
		@x    = +1.42394394546420e+08 km
		@y    = -3.01512581244963e+07 km
		@z    = -5.42434014804700e+06 km
		@vx   = -1.54514787864774e+00 km/s
		@vy   = +2.85999450023749e+00 km/s
		@vz   = +1.81550470670395e+00 km/s
