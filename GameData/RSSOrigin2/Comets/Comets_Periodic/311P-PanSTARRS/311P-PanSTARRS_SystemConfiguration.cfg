// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[311P-PanSTARRS]
	{
		@Orbit
		{
			@inclination = 24.71774650596339
			@longitudeOfAscendingNode = 348.2564484422146
			@argumentOfPeriapsis = 73.9190713768004
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[311P-PanSTARRS]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@sphereOfInfluence /= 4
		}
	}
}
