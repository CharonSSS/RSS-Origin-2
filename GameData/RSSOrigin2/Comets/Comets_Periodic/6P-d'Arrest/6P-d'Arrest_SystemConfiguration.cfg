// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[6P-d'Arrest]
	{
		@Orbit
		{
			@inclination = 15.21092806250110
			@longitudeOfAscendingNode = 56.74543776800629
			@argumentOfPeriapsis = 262.9085170779635
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[6P-d'Arrest]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 3.03
			@mass /= 9.1809
			@rotationPeriod /= 1.740689518552921
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 3.03
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 3.03
				@spaceAltitudeThreshold = 2580
			}
		}
		@ScaledVersion
		{
			@fadeStart = 363
			@fadeEnd = 574
		}
		@PQS
		{
			@fadeStart = 574
			@fadeEnd = 2264
			@deactivateAltitude = 2264
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 3.03
					@offset /= 3.03
				}
			}
		}
	}
}
