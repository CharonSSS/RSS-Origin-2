// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[81P-Wild2]
	{
		@Orbit
		{
			@inclination = 21.21561401436097
			@longitudeOfAscendingNode = 6.212453078896018
			@argumentOfPeriapsis = 172.1407656283782
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[81P-Wild2]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 3.13
			@mass /= 9.796899999999999
			@rotationPeriod /= 1.769180601295413
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2465
			@timewarpAltitudeLimits[*, ] /= 3.13
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 3.13
				@spaceAltitudeThreshold = 3202
			}
		}
		@ScaledVersion
		{
			@fadeStart = 596
			@fadeEnd = 850
		}
		@PQS
		{
			@fadeStart = 850
			@fadeEnd = 2465
			@deactivateAltitude = 2465
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 3.13
					@offset /= 3.13
				}
			}
		}
	}
}
