// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[8P-Tuttle]
	{
		@Orbit
		{
			@inclination = 58.24734789285136
			@longitudeOfAscendingNode = 285.7863684907828
			@argumentOfPeriapsis = 179.5979625938779
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[8P-Tuttle]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 2.95
			@mass /= 8.7025
			@rotationPeriod /= 1.717556403731767
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 3532
			@timewarpAltitudeLimits[*, ] /= 2.95
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 2.95
				@spaceAltitudeThreshold = 6228
			}
		}
		@ScaledVersion
		{
			@fadeStart = 3032
			@fadeEnd = 3150
		}
		@PQS
		{
			@fadeStart = 3150
			@fadeEnd = 3532
			@deactivateAltitude = 3532
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 2.95
					@offset /= 2.95
				}
			}
		}
	}
}
