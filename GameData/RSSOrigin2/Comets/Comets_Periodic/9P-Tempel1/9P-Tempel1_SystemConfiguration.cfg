// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[9P-Tempel1]
	{
		@Orbit
		{
			@inclination = 28.84768206344194
			@longitudeOfAscendingNode = 20.69967399306521
			@argumentOfPeriapsis = 229.1345825898974
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[9P-Tempel1]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 3430
			}
		}
		@ScaledVersion
		{
			@fadeStart = 563
			@fadeEnd = 811
		}
		@PQS
		{
			@fadeStart = 811
			@fadeEnd = 2421
			@deactivateAltitude = 2421
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[9P-Tempel1]
	{
		@PQS
		{
			@maxLevel -= 1
		}
	}
}
