@Kopernicus:LAST[RSSOrigin2]
{
	@Body[2I-Borisov]
	{
		@Properties
		{
			@radius *= 2.55
			@mass *= 16.581375
			@timewarpAltitudeLimits[*, ] *= 2.55
			@ScienceValues
			{
				@flyingAltitudeThreshold *= 2.55
				@spaceAltitudeThreshold *= 2.55
			}
		}
		@PQS
		{
			@fadeEnd = 2214
			@deactivateAltitude = 2214
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity *= 2.55
					@offset *= 2.55
				}
			}
		}
	}
}
@ParallaxScatters:LAST[RSSOrigin2]
{
	@Body[2I-Borisov]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 2.800233187847
				@minAltitude *= 2.55
				@altitudeFadeRangeAlternate *= 2.55
			}
		}
	}
}
@ParallaxTerrain:LAST[RSSOrigin2]
{
	@Body[2I-Borisov]
	{
		@ShaderProperties
		{
