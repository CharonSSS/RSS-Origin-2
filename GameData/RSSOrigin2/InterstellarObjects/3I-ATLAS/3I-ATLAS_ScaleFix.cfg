@Kopernicus:LAST[RSSOrigin2]
{
	@Body[3I-ATLAS]
	{
		@Properties
		{
			@radius *= 1.62
			@mass *= 4.251528
			@timewarpAltitudeLimits[*, ] *= 1.62
			@ScienceValues
			{
				@flyingAltitudeThreshold *= 1.62
				@spaceAltitudeThreshold *= 1.62
			}
		}
		@PQS
		{
			@fadeEnd = 2216
			@deactivateAltitude = 2216
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity *= 1.62
					@offset *= 1.62
				}
			}
		}
	}
}
@ParallaxScatters:LAST[RSSOrigin2]
{
	@Body[3I-ATLAS]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 1.700068873676
				@minAltitude *= 1.62
				@altitudeFadeRangeAlternate *= 1.62
			}
		}
	}
}
@ParallaxTerrain:LAST[RSSOrigin2]
{
	@Body[3I-ATLAS]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart *= 1.62
			@_LowMidBlendEnd *= 1.62
			@_MidHighBlendStart *= 1.62
			@_MidHighBlendEnd *= 1.62
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude *= 1.62
			@maxTerrainAltitude *= 1.62
		}
	}
}
