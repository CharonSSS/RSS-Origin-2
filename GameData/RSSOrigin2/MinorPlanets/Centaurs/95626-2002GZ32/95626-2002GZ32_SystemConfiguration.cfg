// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[2002GZ32]
	{
		@Orbit
		{
			@inclination = 23.542178308226756
			@longitudeOfAscendingNode = 38.28874723600996
			@argumentOfPeriapsis = 227.1819530776042
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[2002GZ32]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 41358
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 97181
			}
		}
		@ScaledVersion
		{
			@fadeStart = 39113
			@fadeEnd = 39663
		}
		@PQS
		{
			@fadeStart = 39663
			@fadeEnd = 41358
			@deactivateAltitude = 41358
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[2002GZ32]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
