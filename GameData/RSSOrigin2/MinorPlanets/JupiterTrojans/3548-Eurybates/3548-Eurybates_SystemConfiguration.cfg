// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Eurybates]
	{
		@Orbit
		{
			@inclination = 29.779559035779585
			@longitudeOfAscendingNode = 11.28906488297281
			@argumentOfPeriapsis = 57.72565644540149
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Eurybates]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 1.28
			@mass /= 1.6384
			@rotationPeriod /= 1.131370849898476
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 14161
			@timewarpAltitudeLimits[*, ] /= 1.28
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.28
				@spaceAltitudeThreshold = 74547
			}
		}
		@ScaledVersion
		{
			@fadeStart = 11932
			@fadeEnd = 12454
		}
		@PQS
		{
			@fadeStart = 12454
			@fadeEnd = 14161
			@deactivateAltitude = 14161
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.28
					@offset /= 1.28
				}
			}
		}
	}
}
