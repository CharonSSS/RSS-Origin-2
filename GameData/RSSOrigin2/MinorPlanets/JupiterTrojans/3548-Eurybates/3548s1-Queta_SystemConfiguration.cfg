// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Queta]
	{
		@Orbit
		{
			@semiMajorAxis /= 1.28
		}
		@Properties
		{
			@radius /= 1.28
			@mass /= 1.6384
			@rotationPeriod /= 1.131370849898476
			@inverseRotThresholdAltitude = 2115
			@timewarpAltitudeLimits[*, ] /= 1.28
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.28
				@spaceAltitudeThreshold = 2099
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1616
			@fadeEnd = 1729
		}
		@PQS
		{
			@fadeStart = 1729
			@fadeEnd = 2116
			@deactivateAltitude = 2116
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.28
					@offset /= 1.28
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Queta]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 1.311991334535
				@minAltitude /= 1.28
				@maxAltitude /= 1.28
				@altitudeFadeRangeAlternate /= 1.28
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Queta]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 1.28
			@_LowMidBlendEnd /= 1.28
			@_MidHighBlendStart /= 1.28
			@_MidHighBlendEnd /= 1.28
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 1.28
			@maxTerrainAltitude /= 1.28
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Queta]
	{
		@gravitational_parameter = 3.17735889770508e-08 km^3/s^2
		@angular_frequency       = 7.40314450566549e+00 deg / d
		@reference_radius        = 4.68750011011995e-01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Queta]
	{
		@x    = +1.85285749117535e+08 km
		@y    = -1.81494181359704e+07 km
		@z    = -3.09239481406878e+07 km
		@vx   = +5.16215626545818e-01 km/s
		@vy   = +5.87305798709456e+00 km/s
		@vz   = +3.23644634729839e+00 km/s
	}
}

