// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Patroclus]
	{
		@Orbit
		{
			@inclination = 41.959162531942134
			@longitudeOfAscendingNode = 23.22971489416624
			@argumentOfPeriapsis = 328.5329776440506
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Patroclus]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 38693
			}
		}
		@ScaledVersion
		{
			@fadeStart = 6723
			@fadeEnd = 7001
		}
		@PQS
		{
			@fadeStart = 7001
			@fadeEnd = 7908
			@deactivateAltitude = 7908
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Patroclus]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
