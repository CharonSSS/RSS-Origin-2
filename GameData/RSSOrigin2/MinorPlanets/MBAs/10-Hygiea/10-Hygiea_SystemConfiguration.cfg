// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Hygiea]
	{
		@Orbit
		{
			@inclination = 24.608356998373658
			@longitudeOfAscendingNode = 351.222379515225
			@argumentOfPeriapsis = 244.8892240275957
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Hygiea]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 143388
			}
		}
		@ScaledVersion
		{
			@fadeStart = 14081
			@fadeEnd = 14897
		}
		@PQS
		{
			@fadeStart = 14897
			@fadeEnd = 17640
			@deactivateAltitude = 17640
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Hygiea]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
