// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Camilla]
	{
		@Orbit
		{
			@inclination = 13.568868758607953
			@longitudeOfAscendingNode = 3.414340266641943
			@argumentOfPeriapsis = 114.7127344099136
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Camilla]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			!inverseRotThresholdAltitude = DELETE
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 108883
			}
		}
		@ScaledVersion
		{
			@fadeStart = 33703
			@fadeEnd = 34481
		}
		@PQS
		{
			@fadeStart = 34481
			@fadeEnd = 36925
			@deactivateAltitude = 36925
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Camilla]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
