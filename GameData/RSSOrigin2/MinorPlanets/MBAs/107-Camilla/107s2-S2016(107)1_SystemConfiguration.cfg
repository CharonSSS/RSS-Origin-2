// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2016_107_1]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			%sphereOfInfluence = 2500
			@inverseRotThresholdAltitude = 2300
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 2280
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1658
			@fadeEnd = 1771
		}
		@PQS
		{
			@fadeStart = 1771
			@fadeEnd = 2158
			@deactivateAltitude = 2158
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
