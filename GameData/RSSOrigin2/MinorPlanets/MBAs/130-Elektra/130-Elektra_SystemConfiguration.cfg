// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Elektra]
	{
		@Orbit
		{
			@inclination = 13.370144783616517
			@longitudeOfAscendingNode = 71.85378200088256
			@argumentOfPeriapsis = 313.3877494315212
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Elektra]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 1.73
			@mass /= 2.9929
			@rotationPeriod /= 1.315294643796590
			@inverseRotThresholdAltitude = 64268
			@timewarpAltitudeLimits[*, ] /= 1.73
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.73
				@spaceAltitudeThreshold = 183258
			}
		}
		@ScaledVersion
		{
			@fadeStart = 59010
			@fadeEnd = 60283
		}
		@PQS
		{
			@fadeStart = 60283
			@fadeEnd = 64268
			@deactivateAltitude = 64268
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.73
					@offset /= 1.73
				}
			}
		}
	}
}
