// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2003_130_1]
	{
		@Orbit
		{
			@semiMajorAxis /= 1.73
		}
		@Properties
		{
			@radius /= 1.73
			@mass /= 2.9929
			@rotationPeriod /= 1.315294643796590
			@inverseRotThresholdAltitude = 2892
			@timewarpAltitudeLimits[*, ] /= 1.73
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.73
				@spaceAltitudeThreshold = 6301
			}
		}
		@ScaledVersion
		{
			@fadeStart = 2395
			@fadeEnd = 2511
		}
		@PQS
		{
			@fadeStart = 2511
			@fadeEnd = 2895
			@deactivateAltitude = 2895
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.73
					@offset /= 1.73
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2003_130_1]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 1.73
				@minAltitude /= 1.73
				@maxAltitude /= 1.73
				@altitudeFadeRangeAlternate /= 1.73
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2003_130_1]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 1.73
			@_LowMidBlendEnd /= 1.73
			@_MidHighBlendStart /= 1.73
			@_MidHighBlendEnd /= 1.73
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 1.73
			@maxTerrainAltitude /= 1.73
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[S-2003_130_1]
	{
		@gravitational_parameter = 4.03513427424906e-06 km^3/s^2
		@angular_frequency       = 8.96861982537228e+01 deg / d
		@reference_radius        = 1.73410400821627e+00 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[S-2003_130_1]
	{
		@x    = -9.18476286693806e+07 km
		@y    = +7.72372175076776e+07 km
		@z    = +2.59043682918965e+07 km
		@vx   = -6.13190394325438e+00 km/s
		@vy   = -5.04606400400333e+00 km/s
		@vz   = +9.94426487452125e-01 km/s
	}
}

