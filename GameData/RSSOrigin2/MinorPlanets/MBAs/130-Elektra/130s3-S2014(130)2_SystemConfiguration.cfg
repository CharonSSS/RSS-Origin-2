// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2014_130_2]
	{
		@Orbit
		{
			@semiMajorAxis /= 1.73
		}
		@Properties
		{
			@radius /= 1.73
			@mass /= 2.9929
			@rotationPeriod /= 1.315294643796590
			@sphereOfInfluence = 2500
			@inverseRotThresholdAltitude = 2300
			@timewarpAltitudeLimits[*, ] /= 1.73
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.73
				@spaceAltitudeThreshold = 2046
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1601
			@fadeEnd = 1714
		}
		@PQS
		{
			@fadeStart = 1714
			@fadeEnd = 2101
			@deactivateAltitude = 2101
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.73
					@offset /= 1.73
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2014_130_2]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 1.73
				@minAltitude /= 1.73
				@maxAltitude /= 1.73
				@altitudeFadeRangeAlternate /= 1.73
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2014_130_2]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 1.73
			@_LowMidBlendEnd /= 1.73
			@_MidHighBlendStart /= 1.73
			@_MidHighBlendEnd /= 1.73
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 1.73
			@maxTerrainAltitude /= 1.73
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[S-2014_130_2]
	{
		@gravitational_parameter = 7.53842023438805e-08 km^3/s^2
		@angular_frequency       = 2.93825491922064e+02 deg / d
		@reference_radius        = 4.62427736455438e-01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[S-2014_130_2]
	{
		@x    = -9.18471340348402e+07 km
		@y    = +7.72371018404480e+07 km
		@z    = +2.59042994844203e+07 km
		@vx   = -6.12079494149956e+00 km/s
		@vy   = -5.05642698024822e+00 km/s
		@vz   = +9.89007769708030e-01 km/s
	}
}

