// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[APL]
	{
		@Orbit
		{
			@inclination = 26.200437748761495
			@longitudeOfAscendingNode = 7.592428026145133
			@argumentOfPeriapsis = 305.9031287280782
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[APL]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 2.29
			@mass /= 5.2441
			@rotationPeriod /= 1.513274595042156
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2312
			@timewarpAltitudeLimits[*, ] /= 2.29
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 2.29
				@spaceAltitudeThreshold = 2732
			}
		}
		@ScaledVersion
		{
			@fadeStart = 419
			@fadeEnd = 642
		}
		@PQS
		{
			@fadeStart = 642
			@fadeEnd = 2312
			@deactivateAltitude = 2312
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 2.29
					@offset /= 2.29
				}
			}
		}
	}
}
