// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Psyche]
	{
		@Orbit
		{
			@inclination = 20.80248363238551
			@longitudeOfAscendingNode = 4.198455262629066
			@argumentOfPeriapsis = 12.39884536441261
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Psyche]
	{
		@Properties
		{
			@ScienceValues
			{
				@spaceAltitudeThreshold = 76764
			}
		}
		@ScaledVersion
		{
			@fadeStart = 20765
			@fadeEnd = 21338
		}
		@PQS
		{
			@fadeStart = 21338
			@fadeEnd = 23152
			@deactivateAltitude = 23152
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Psyche]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Psyche]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Psyche]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Psyche]
	{
		@gravitational_parameter = 9.55228143687500e-02 km^3/s^2
		@angular_frequency       = 4.11820781696854e+03 deg / d
		@reference_radius        = 2.74840728753645e+01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Psyche]
	{
		@x    = +9.32454320221310e+07 km
		@y    = -2.04458458697901e+07 km
		@z    = -1.03328582630777e+07 km
		@vx   = +1.75655415536463e+00 km/s
		@vy   = +9.07086924628550e+00 km/s
