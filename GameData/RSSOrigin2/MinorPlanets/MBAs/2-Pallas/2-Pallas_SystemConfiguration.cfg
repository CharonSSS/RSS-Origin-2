// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Pallas]
	{
		@Orbit
		{
			@inclination = 11.866418513393604
			@longitudeOfAscendingNode = 162.1825251950695
			@argumentOfPeriapsis = 322.1737710222511
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Pallas]
	{
		@Properties
		{
			!inverseRotThresholdAltitude = DELETE
			@ScienceValues
			{
				@spaceAltitudeThreshold = 171512
			}
		}
		@ScaledVersion
		{
			@fadeStart = 33045
			@fadeEnd = 34294
		}
		@PQS
		{
			@fadeStart = 34294
			@fadeEnd = 38330
			@deactivateAltitude = 38330
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Pallas]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Pallas]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Pallas]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Pallas]
	{
		@gravitational_parameter = 8.59496764221875e-01 km^3/s^2
		@angular_frequency       = 2.21160720000000e+03 deg / d
		@reference_radius        = 6.41615625682785e+01 km
	}
}
