// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Alexhelios]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 4276
			}
		}
		@ScaledVersion
		{
			@fadeStart = 507
			@fadeEnd = 743
		}
		@PQS
		{
			@fadeStart = 743
			@fadeEnd = 2338
			@deactivateAltitude = 2338
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Alexhelios]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 4.5947934199881
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Alexhelios]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Alexhelios]
	{
		@gravitational_parameter = 2.50278116250000e-06 km^3/s^2
		@angular_frequency       = 2.67091496349230e+02 deg / d
		@reference_radius        = 1.11250001326708e+00 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Alexhelios]
	{
		@x    = -1.22738010894117e+08 km
		@y    = +1.65651094004529e+06 km
		@z    = -1.67681561202969e+07 km
		@vx   = -1.14469353077229e+00 km/s
		@vy   = -7.06942059403815e+00 km/s
		@vz   = -1.77702794901463e+00 km/s
	}
}

