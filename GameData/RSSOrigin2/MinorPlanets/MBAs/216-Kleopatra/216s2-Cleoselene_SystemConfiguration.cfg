// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Cleoselene]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 2310
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 3584
			}
		}
		@ScaledVersion
		{
			@fadeStart = 450
			@fadeEnd = 677
		}
		@PQS
		{
			@fadeStart = 677
			@fadeEnd = 2310
			@deactivateAltitude = 2310
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Cleoselene]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 4.5947934199881
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Cleoselene]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Cleoselene]
	{
		@gravitational_parameter = 1.66852077500000e-06 km^3/s^2
		@angular_frequency       = 4.05365403433330e+02 deg / d
		@reference_radius        = 8.62500013714255e-01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Cleoselene]
	{
		@x    = -1.22738278797982e+08 km
		@y    = +1.65661799010002e+06 km
		@z    = -1.67681561202969e+07 km
		@vx   = -1.14932431250889e+00 km/s
		@vy   = -7.08100395966430e+00 km/s
		@vz   = -1.76314405818758e+00 km/s
	}
}

