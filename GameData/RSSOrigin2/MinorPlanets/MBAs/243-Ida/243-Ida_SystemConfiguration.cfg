// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Ida]
	{
		@Orbit
		{
			@inclination = 24.37082518056422
			@longitudeOfAscendingNode = 358.4493192694786
			@argumentOfPeriapsis = 75.35388878217782
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Ida]
	{
		@Properties
		{
			@radius /= 1.27
			@mass /= 1.6129
			@rotationPeriod /= 1.126942766958464
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 1.27
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.27
				@spaceAltitudeThreshold = 45379
			}
		}
		@ScaledVersion
		{
			@fadeStart = 24217
			@fadeEnd = 24232
		}
		@PQS
		{
			@fadeStart = 24232
			@fadeEnd = 24276
			@deactivateAltitude = 24276
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.27
					@offset /= 1.27
				}
			}
		}
	}
}
