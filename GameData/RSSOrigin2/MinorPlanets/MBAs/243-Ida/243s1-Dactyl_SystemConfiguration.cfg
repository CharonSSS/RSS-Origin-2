// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Dactyl]
	{
		@Orbit
		{
			@semiMajorAxis /= 1.27
		}
		@Properties
		{
			@radius /= 1.27
			@mass /= 1.6129
			@rotationPeriod /= 1.126942766958464
			@inverseRotThresholdAltitude = 2224
			@timewarpAltitudeLimits[*, ] /= 1.27
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.27
				@spaceAltitudeThreshold = 2456
			}
		}
		@ScaledVersion
		{
			@fadeStart = 314
			@fadeEnd = 512
		}
		@PQS
		{
			@fadeStart = 512
			@fadeEnd = 2224
			@deactivateAltitude = 2224
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.27
					@offset /= 1.27
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Dactyl]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 1.300720823632
				@minAltitude /= 1.27
				@maxAltitude /= 1.27
				@altitudeFadeRangeAlternate /= 1.27
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Dactyl]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 1.27
			@_LowMidBlendEnd /= 1.27
			@_MidHighBlendStart /= 1.27
			@_MidHighBlendEnd /= 1.27
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 1.27
			@maxTerrainAltitude /= 1.27
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Dactyl]
	{
		@gravitational_parameter = 1.24138193936388e-07 km^3/s^2
		@angular_frequency       = 5.80693932101833e+02 deg / d
		@reference_radius        = 5.51181120554935e-01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Dactyl]
	{
		@x    = -9.76982540001574e+07 km
		@y    = -4.59412936085040e+07 km
		@z    = -2.20387440161761e+07 km
		@vx   = +3.68064684489763e+00 km/s
		@vy   = -7.04052488411084e+00 km/s
		@vz   = -3.14545868869428e+00 km/s
	}
}

