// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Steins]
	{
		@Orbit
		{
			@inclination = 30.126563666150204
			@longitudeOfAscendingNode = 16.64892595141353
			@argumentOfPeriapsis = 290.9523381764012
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Steins]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2425
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 3290
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1925
			@fadeEnd = 2039
		}
		@PQS
		{
			@fadeStart = 2039
			@fadeEnd = 2425
			@deactivateAltitude = 2425
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Steins]
	{
		@PQS
		{
			@maxLevel -= 1
		}
	}
}
