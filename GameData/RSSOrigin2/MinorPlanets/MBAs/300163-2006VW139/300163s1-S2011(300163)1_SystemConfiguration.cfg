// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2011_300163_1]
	{
		@Orbit
		{
			@semiMajorAxis /= 1.22
		}
		@Properties
		{
			@radius /= 1.22
			@mass /= 1.4884
			@rotationPeriod /= 1.104536101718726
			@sphereOfInfluence /= 1.22
			@timewarpAltitudeLimits[*, ] /= 1.22
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.22
				@spaceAltitudeThreshold = 3004
			}
		}
		@ScaledVersion
		{
			@fadeStart = 519
			@fadeEnd = 761
		}
		@PQS
		{
			@fadeStart = 761
			@fadeEnd = 2397
			@deactivateAltitude = 2397
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.22
					@offset /= 1.22
				}
			}
		}
	}
}
