// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Scottmanley]
	{
		@Orbit
		{
			@inclination = 24.627857313672518
			@longitudeOfAscendingNode = 358.7170661440936
			@argumentOfPeriapsis = 110.9667605055137
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Scottmanley]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2199
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 2620
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1700
			@fadeEnd = 1813
		}
		@PQS
		{
			@fadeStart = 1813
			@fadeEnd = 2200
			@deactivateAltitude = 2200
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
