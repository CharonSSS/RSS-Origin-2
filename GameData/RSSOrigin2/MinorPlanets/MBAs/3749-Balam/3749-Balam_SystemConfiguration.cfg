// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Balam]
	{
		@Orbit
		{
			@inclination = 26.21760481970356
			@longitudeOfAscendingNode = 349.0587219635705
			@argumentOfPeriapsis = 119.046248859776
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Balam]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@sphereOfInfluence /= 4
		}
	}
}
