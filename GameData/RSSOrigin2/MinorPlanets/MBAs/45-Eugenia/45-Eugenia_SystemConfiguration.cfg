// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Eugenia]
	{
		@Orbit
		{
			@inclination = 18.163264523696274
			@longitudeOfAscendingNode = 11.04337137245513
			@argumentOfPeriapsis = 222.6528818617142
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Eugenia]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 22954
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 70614
			}
		}
		@ScaledVersion
		{
			@fadeStart = 20809
			@fadeEnd = 21326
		}
		@PQS
		{
			@fadeStart = 21326
			@fadeEnd = 22954
			@deactivateAltitude = 22954
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Eugenia]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
