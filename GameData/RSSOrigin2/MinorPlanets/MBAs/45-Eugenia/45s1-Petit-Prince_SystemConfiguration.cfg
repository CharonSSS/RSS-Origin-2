// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Petit-Prince]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 2502
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 4039
			}
		}
		@ScaledVersion
		{
			@fadeStart = 2002
			@fadeEnd = 2117
		}
		@PQS
		{
			@fadeStart = 2117
			@fadeEnd = 2502
			@deactivateAltitude = 2502
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Petit-Prince]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 4.5947934199881
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Petit-Prince]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Petit-Prince]
	{
		@gravitational_parameter = 1.04491113534375e-06 km^3/s^2
		@angular_frequency       = 1.52818335230440e+02 deg / d
		@reference_radius        = 8.75000021067292e-01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Petit-Prince]
	{
		@x    = -3.12511318760123e+07 km
		@y    = +9.61842376810270e+07 km
		@z    = +3.28519775340928e+07 km
		@vx   = -8.04753152990240e+00 km/s
		@vy   = -3.12768044139029e+00 km/s
		@vz   = -5.06241776190165e-01 km/s
	}
}

