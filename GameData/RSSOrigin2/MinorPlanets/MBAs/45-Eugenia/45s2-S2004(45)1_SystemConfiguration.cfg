// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2004_45_1]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			%sphereOfInfluence = 2500
			@inverseRotThresholdAltitude = 2300
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 2814
			}
		}
		@ScaledVersion
		{
			@fadeStart = 335
			@fadeEnd = 538
		}
		@PQS
		{
			@fadeStart = 538
			@fadeEnd = 2232
			@deactivateAltitude = 2232
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
