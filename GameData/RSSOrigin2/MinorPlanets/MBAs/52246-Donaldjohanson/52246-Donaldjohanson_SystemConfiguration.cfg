// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Donaldjohanson]
	{
		@Orbit
		{
			@inclination = 23.301810232804634
			@longitudeOfAscendingNode = 348.8482900905222
			@argumentOfPeriapsis = 125.4920337880371
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Donaldjohanson]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 3.15
			@mass /= 9.9225
			@rotationPeriod /= 1.774823934929885
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 3.15
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 3.15
				@spaceAltitudeThreshold = 5047
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1301
			@fadeEnd = 1616
		}
		@PQS
		{
			@fadeStart = 1616
			@fadeEnd = 3099
			@deactivateAltitude = 3099
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 3.15
					@offset /= 3.15
				}
			}
		}
	}
}
