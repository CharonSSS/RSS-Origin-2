{
	@Body[Annefrank]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 3.25
			@mass /= 10.5625
			@rotationPeriod /= 1.802775637731990
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 3.25
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 3.25
				@spaceAltitudeThreshold = 3710
			}
		}
		@ScaledVersion
		{
			@fadeStart = 786
			@fadeEnd = 1063
		}
		@PQS
		{
			@fadeStart = 1063
			@fadeEnd = 2632
			@deactivateAltitude = 2632
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 3.25
					@offset /= 3.25
				}
			}
		}
	}
}
