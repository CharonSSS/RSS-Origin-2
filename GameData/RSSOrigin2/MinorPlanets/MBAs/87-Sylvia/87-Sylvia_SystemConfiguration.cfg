// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Sylvia]
	{
		@Orbit
		{
			@inclination = 28.40408478436693
			@longitudeOfAscendingNode = 22.8692746714523
			@argumentOfPeriapsis = 314.4416716616495
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Sylvia]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			!inverseRotThresholdAltitude = DELETE
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 106928
			}
		}
		@ScaledVersion
		{
			@fadeStart = 29706
			@fadeEnd = 30497
		}
		@PQS
		{
			@fadeStart = 30497
			@fadeEnd = 32998
			@deactivateAltitude = 32998
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Sylvia]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
