// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Romulus]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 12374
			}
		}
		@ScaledVersion
		{
			@fadeStart = 4268
			@fadeEnd = 4589
		}
		@PQS
		{
			@fadeStart = 4589
			@fadeEnd = 5704
			@deactivateAltitude = 5704
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Romulus]
	{
		@PQS
		{
			@maxLevel -= 1
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Romulus]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 1.1486983549970
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Romulus]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Romulus]
	{
		@gravitational_parameter = 1.93965540093750e-05 km^3/s^2
		@angular_frequency       = 1.98722025207858e+02 deg / d
		@reference_radius        = 2.37500000561479e+00 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Romulus]
	{
		@x    = -1.34537922579715e+08 km
		@y    = -3.29936519781713e+07 km
		@z    = +1.17032905664242e+07 km
		@vx   = +1.66643339199002e+00 km/s
		@vy   = -6.37873601402335e+00 km/s
		@vz   = -3.48923479344441e+00 km/s
	}
}

