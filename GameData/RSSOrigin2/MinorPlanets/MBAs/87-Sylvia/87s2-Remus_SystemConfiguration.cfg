// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Remus]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			%sphereOfInfluence = 2500
			@inverseRotThresholdAltitude = 2300
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 3353
			}
		}
		@ScaledVersion
		{
			@fadeStart = 334
			@fadeEnd = 536
		}
		@PQS
		{
			@fadeStart = 536
			@fadeEnd = 2217
			@deactivateAltitude = 2217
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Remus]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 4.5947934199881
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Remus]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Remus]
	{
		@gravitational_parameter = 8.34260387500000e-07 km^3/s^2
		@angular_frequency       = 5.41322411118556e+02 deg / d
		@reference_radius        = 8.37500023129502e-01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Remus]
	{
		@x    = -1.34537958552407e+08 km
		@y    = -3.29940075196108e+07 km
		@z    = +1.17033104915710e+07 km
		@vx   = +1.68355006616344e+00 km/s
		@vy   = -6.39163782677215e+00 km/s
		@vz   = -3.49097956743086e+00 km/s
	}
}

