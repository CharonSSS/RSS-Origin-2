// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Minerva]
	{
		@Orbit
		{
			@inclination = 31.978694545466002
			@longitudeOfAscendingNode = 1.464532592957585
			@argumentOfPeriapsis = 277.2017914183162
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Minerva]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 3.2
			@mass /= 10.24
			@rotationPeriod /= 1.788854381999830
			@timewarpAltitudeLimits[*, ] /= 3.2
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 3.2
				@spaceAltitudeThreshold = 66835
			}
		}
		@ScaledVersion
		{
			@fadeStart = 12515
			@fadeEnd = 13004
		}
		@PQS
		{
			@fadeStart = 13004
			@fadeEnd = 14588
			@deactivateAltitude = 14588
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 3.2
					@offset /= 3.2
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Minerva]
	{
		@PQS
		{
			@maxLevel -= 1
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Minerva]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 3.6289832093897
				@minAltitude /= 3.2
				@maxAltitude /= 3.2
				@altitudeFadeRangeAlternate /= 3.2
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Minerva]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 3.2
			@_LowMidBlendEnd /= 3.2
			@_MidHighBlendStart /= 3.2
			@_MidHighBlendEnd /= 3.2
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 3.2
			@maxTerrainAltitude /= 3.2
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Minerva]
	{
		@gravitational_parameter = 2.18341585791016e-02 km^3/s^2
		@angular_frequency       = 2.58380205388033e+03 deg / d
		@reference_radius        = 2.39991268944375e+01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Minerva]
	{
		@x    = +9.71079735225683e+07 km
		@y    = -7.20224884386875e+06 km
		@z    = -6.06733681690047e+06 km
		@vx   = +2.14400999638772e+00 km/s
		@vy   = +7.82929352384420e+00 km/s
		@vz   = +4.85577301016385e+00 km/s
