//}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Aegis]
	{
		@Orbit
		{
			@semiMajorAxis /= 3.2
		}
		@Properties
		{
			@radius /= 3.2
			@mass /= 10.24
			@rotationPeriod /= 1.788854381999830
			%sphereOfInfluence = 2500
			@inverseRotThresholdAltitude = 2300
			@timewarpAltitudeLimits[*, ] /= 3.2
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 3.2
				@spaceAltitudeThreshold = 2673
			}
		}
		@ScaledVersion
		{
			@fadeStart = 351
			@fadeEnd = 559
		}
		@PQS
		{
			@fadeStart = 559
			@fadeEnd = 2251
			@deactivateAltitude = 2251
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 3.2
					@offset /= 3.2
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Aegis]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 3.594719240073
				@minAltitude /= 3.2
				@maxAltitude /= 3.2
				@altitudeFadeRangeAlternate /= 3.2
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Aegis]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 3.2
			@_LowMidBlendEnd /= 3.2
			@_MidHighBlendStart /= 3.2
			@_MidHighBlendEnd /= 3.2
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 3.2
			@maxTerrainAltitude /= 3.2
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Aegis]
	{
		@gravitational_parameter = 2.38807035921875e-07 km^3/s^2
		@angular_frequency       = 2.67659009775366e+02 deg / d
		@reference_radius        = 5.62500027899503e-01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Aegis]
	{
		@x    = +9.71078641354572e+07 km
		@y    = -7.20208683019355e+06 km
		@z    = -6.06733681690047e+06 km
		@vx   = +2.14592016497363e+00 km/s
		@vy   = +7.83058321635348e+00 km/s
		@vz   = +4.86610311520672e+00 km/s
	}
}

