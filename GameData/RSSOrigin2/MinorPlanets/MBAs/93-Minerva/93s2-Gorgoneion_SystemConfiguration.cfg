// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Gorgoneion]
	{
		@Orbit
		{
			@semiMajorAxis /= 3.2
		}
		@Properties
		{
			@radius /= 3.2
			@mass /= 10.24
			@rotationPeriod /= 1.788854381999830
			%sphereOfInfluence = 2500
			@inverseRotThresholdAltitude = 2300
			@timewarpAltitudeLimits[*, ] /= 3.2
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 3.2
				@spaceAltitudeThreshold = 2380
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1703
			@fadeEnd = 1816
		}
		@PQS
		{
			@fadeStart = 1816
			@fadeEnd = 2203
			@deactivateAltitude = 2203
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 3.2
					@offset /= 3.2
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Gorgoneion]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 3.594719240073
				@minAltitude /= 3.2
				@maxAltitude /= 3.2
				@altitudeFadeRangeAlternate /= 3.2
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Gorgoneion]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 3.2
			@_LowMidBlendEnd /= 3.2
			@_MidHighBlendStart /= 3.2
			@_MidHighBlendEnd /= 3.2
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 3.2
			@maxTerrainAltitude /= 3.2
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Gorgoneion]
	{
		@gravitational_parameter = 1.67764549798828e-07 km^3/s^2
		@angular_frequency       = 5.77722775204906e+02 deg / d
		@reference_radius        = 4.99999997232597e-01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Gorgoneion]
	{
		@x    = +9.71078996149214e+07 km
		@y    = -7.20218546876169e+06 km
		@z    = -6.06739051484752e+06 km
		@vx   = +2.14215599058433e+00 km/s
		@vy   = +7.83719037800791e+00 km/s
		@vz   = +4.86764477099223e+00 km/s
	}
}

