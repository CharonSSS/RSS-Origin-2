// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Gaspra]
	{
		@Orbit
		{
			@inclination = 22.5861052903075
			@longitudeOfAscendingNode = 349.7400837001258
			@argumentOfPeriapsis = 31.76064069279404
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Gaspra]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 3646
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 7647
			}
		}
		@ScaledVersion
		{
			@fadeStart = 2027
			@fadeEnd = 2347
		}
		@PQS
		{
			@fadeStart = 2347
			@fadeEnd = 3646
			@deactivateAltitude = 3646
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Gaspra]
	{
		@PQS
		{
			@maxLevel -= 1
		}
	}
}
