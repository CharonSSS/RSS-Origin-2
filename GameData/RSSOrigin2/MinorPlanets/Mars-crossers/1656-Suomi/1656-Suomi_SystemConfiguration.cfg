	{
		@Orbit
		{
			@inclination = 2.4119096839989416
			@longitudeOfAscendingNode = 132.2863968318637
			@argumentOfPeriapsis = 330.9780036400044
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Suomi]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 2.01
			@mass /= 4.040099999999999
			@rotationPeriod /= 1.417744687875782
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 2.01
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 2.01
				@spaceAltitudeThreshold = 6473
			}
		}
		@ScaledVersion
		{
			@fadeStart = 999
			@fadeEnd = 1279
		}
		@PQS
		{
			@fadeStart = 1279
			@fadeEnd = 2687
			@deactivateAltitude = 2687
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 2.01
					@offset /= 2.01
				}
			}
		}
	}
}
