// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2020_1656_1]
	{
		@Orbit
		{
			@semiMajorAxis /= 2.01
		}
		@Properties
		{
			@radius /= 2.01
			@mass /= 4.040099999999999
			@rotationPeriod /= 1.417744687875782
			@timewarpAltitudeLimits[*, ] /= 2.01
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 2.01
				@spaceAltitudeThreshold = 2221
			}
		}
		@ScaledVersion
		{
			@fadeStart = 228
			@fadeEnd = 400
		}
		@PQS
		{
			@fadeStart = 400
			@fadeEnd = 2153
			@deactivateAltitude = 2153
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 2.01
					@offset /= 2.01
				}
			}
		}
	}
}
