// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Braille]
	{
		@Orbit
		{
			@inclination = 26.76197729755089
			@longitudeOfAscendingNode = 288.4549616582712
			@argumentOfPeriapsis = 303.4880950780384
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Braille]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@sphereOfInfluence /= 4
		}
	}
}
