// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Florence]
	{
		@Orbit
		{
			@inclination = 44.581353209882444
			@longitudeOfAscendingNode = 347.6215154636976
			@argumentOfPeriapsis = 14.02384398485402
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Florence]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@sphereOfInfluence /= 4
		}
	}
}
