@Kopernicus:LAST[RSSOrigin2]
{
	@Body[Bennu]
	{
		@Properties
		{
			@radius *= 1.91
			@mass *= 6.967871
			@timewarpAltitudeLimits[*, ] *= 1.91
			@ScienceValues
			{
				@flyingAltitudeThreshold *= 1.91
				@spaceAltitudeThreshold *= 1.91
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1646
			@fadeEnd = 1759
		}
		@PQS
		{
			@fadeStart = 1759
			@fadeEnd = 2146
			@deactivateAltitude = 2146
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity *= 1.91
					@offset *= 1.91
				}
			}
		}
	}
}
