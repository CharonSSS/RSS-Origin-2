// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Icarus]
	{
		@Orbit
		{
			@inclination = 32.827627394339984
			@longitudeOfAscendingNode = 46.05448097898629
			@argumentOfPeriapsis = 78.1360703172389
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Icarus]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 1.36
			@mass /= 1.8496000000000004
			@rotationPeriod /= 1.166190378969060
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2208
			@timewarpAltitudeLimits[*, ] /= 1.36
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.36
				@spaceAltitudeThreshold = 2404
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1709
			@fadeEnd = 1822
		}
		@PQS
		{
			@fadeStart = 1822
			@fadeEnd = 2209
			@deactivateAltitude = 2209
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.36
					@offset /= 1.36
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Icarus]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 1.402467478237
				@minAltitude /= 1.36
				@maxAltitude /= 1.36
				@altitudeFadeRangeAlternate /= 1.36
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
