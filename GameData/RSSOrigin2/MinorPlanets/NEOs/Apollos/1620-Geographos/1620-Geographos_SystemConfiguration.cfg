// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Geographos]
	{
		@Orbit
		{
			@inclination = 36.090166974630975
			@longitudeOfAscendingNode = 351.4668398652481
			@argumentOfPeriapsis = 261.3846548945847
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Geographos]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 1.73
			@mass /= 2.9929
			@rotationPeriod /= 1.315294643796590
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 3149
			@timewarpAltitudeLimits[*, ] /= 1.73
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.73
				@spaceAltitudeThreshold = 5191
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1356
			@fadeEnd = 1674
		}
		@PQS
		{
			@fadeStart = 1674
			@fadeEnd = 3149
			@deactivateAltitude = 3149
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.73
					@offset /= 1.73
				}
			}
		}
	}
}
