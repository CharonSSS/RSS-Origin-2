// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Daedalus]
	{
		@Orbit
		{
			@inclination = 45.54073890046597
			@longitudeOfAscendingNode = 3.738401164169825
			@argumentOfPeriapsis = 329.021603877956
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Daedalus]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 2.57
			@mass /= 6.6049
			@rotationPeriod /= 1.603121954188140
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2256
			@timewarpAltitudeLimits[*, ] /= 2.57
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 2.57
				@spaceAltitudeThreshold = 2554
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1756
			@fadeEnd = 1870
		}
		@PQS
		{
			@fadeStart = 1870
			@fadeEnd = 2256
			@deactivateAltitude = 2256
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 2.57
					@offset /= 2.57
				}
			}
		}
	}
}
