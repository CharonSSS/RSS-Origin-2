@Kopernicus:LAST[RSSOrigin2]
{
	@Body[Itokawa]
	{
		@Properties
		{
			@radius *= 4.61
			@mass *= 97.972181
			@timewarpAltitudeLimits[*, ] *= 4.61
			@ScienceValues
			{
				@flyingAltitudeThreshold *= 4.61
				@spaceAltitudeThreshold *= 4.61
			}
		}
		@PQS
		{
			@fadeEnd = 3028
			@deactivateAltitude = 3028
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity *= 4.61
					@offset *= 4.61
				}
			}
		}
	}
}
