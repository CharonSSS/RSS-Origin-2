	{
		@Orbit
		{
			@inclination = 30.50316464297404
			@longitudeOfAscendingNode = 313.148633569237
			@argumentOfPeriapsis = 269.7038221805491
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Phaethon]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 2927
			}
		}
		@ScaledVersion
		{
			@fadeStart = 400
			@fadeEnd = 619
		}
		@PQS
		{
			@fadeStart = 619
			@fadeEnd = 2287
			@deactivateAltitude = 2287
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
