// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Toutatis]
	{
		@Orbit
		{
			@inclination = 23.182776593031637
			@longitudeOfAscendingNode = 1.0363919913587
			@argumentOfPeriapsis = 40.74181915378396
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Toutatis]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 1.87
			@mass /= 3.4969000000000006
			@rotationPeriod /= 1.367479433117734
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 1.87
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.87
				@spaceAltitudeThreshold = 4614
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1132
			@fadeEnd = 1438
		}
		@PQS
		{
			@fadeStart = 1438
			@fadeEnd = 2944
			@deactivateAltitude = 2944
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.87
					@offset /= 1.87
				}
			}
		}
	}
}
