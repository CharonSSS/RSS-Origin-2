// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Aten]
	{
		@Orbit
		{
			@inclination = 24.61656996416603
			@longitudeOfAscendingNode = 47.64809457676172
			@argumentOfPeriapsis = 212.7929824760233
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Aten]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 1.38
			@mass /= 1.9043999999999996
			@rotationPeriod /= 1.174734012447073
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2156
			@timewarpAltitudeLimits[*, ] /= 1.38
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.38
				@spaceAltitudeThreshold = 2234
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1657
			@fadeEnd = 1770
		}
		@PQS
		{
			@fadeStart = 1770
			@fadeEnd = 2157
			@deactivateAltitude = 2157
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.38
					@offset /= 1.38
				}
			}
		}
	}
}
