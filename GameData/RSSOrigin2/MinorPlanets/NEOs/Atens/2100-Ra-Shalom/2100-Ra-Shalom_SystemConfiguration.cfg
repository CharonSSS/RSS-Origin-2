// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Ra-Shalom]
	{
		@Orbit
		{
			@inclination = 8.245824945775599
			@longitudeOfAscendingNode = 16.91265125365674
			@argumentOfPeriapsis = 150.5278608634302
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Ra-Shalom]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 1.96
			@mass /= 3.8416
			@rotationPeriod /= 1.4
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2346
			@timewarpAltitudeLimits[*, ] /= 1.96
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.96
				@spaceAltitudeThreshold = 2842
			}
		}
		@ScaledVersion
		{
			@fadeStart = 459
			@fadeEnd = 690
		}
		@PQS
		{
			@fadeStart = 690
			@fadeEnd = 2346
			@deactivateAltitude = 2346
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.96
					@offset /= 1.96
				}
			}
		}
	}
}
