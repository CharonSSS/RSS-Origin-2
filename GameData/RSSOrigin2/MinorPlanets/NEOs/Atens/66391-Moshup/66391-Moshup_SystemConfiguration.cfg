// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Moshup]
	{
		@Orbit
		{
			@inclination = 34.92707723077485
			@longitudeOfAscendingNode = 276.6487101103548
			@argumentOfPeriapsis = 153.5001875622496
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Moshup]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@sphereOfInfluence /= 4
		}
	}
}
