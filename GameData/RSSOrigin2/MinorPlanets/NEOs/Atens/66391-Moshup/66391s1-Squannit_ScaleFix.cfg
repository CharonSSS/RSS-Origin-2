@Kopernicus:LAST[RSSOrigin2]
{
	@Body[Squannit]
	{
		@Orbit
		{
			@semiMajorAxis *= 2.42
		}
		@Properties
		{
			@radius *= 2.42
			@mass *= 14.172488
			%sphereOfInfluence = 2500
			@inverseRotThresholdAltitude = 2300
			@timewarpAltitudeLimits[*, ] *= 2.42
			@ScienceValues
			{
				@flyingAltitudeThreshold *= 2.42
				@spaceAltitudeThreshold *= 2.42
			}
		}
		@PQS
		{
			@fadeEnd = 2313
			@deactivateAltitude = 2313
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity *= 2.42
					@offset *= 2.42
				}
			}
		}
	}
}
@ParallaxScatters:LAST[RSSOrigin2]
{
	@Body[Squannit]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 2.643607057288
				@minAltitude *= 2.42
				@altitudeFadeRangeAlternate *= 2.42
			}
		}
	}
}
@ParallaxTerrain:LAST[RSSOrigin2]
