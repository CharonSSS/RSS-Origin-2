@Kopernicus:LAST[RSSOrigin2]
{
	@Body[Apophis]
	{
		@Properties
		{
			@radius *= 3.4
			@mass *= 39.304
			@timewarpAltitudeLimits[*, ] *= 3.4
			@ScienceValues
			{
				@flyingAltitudeThreshold *= 3.4
				@spaceAltitudeThreshold *= 3.4
			}
		}
		@PQS
		{
			@fadeEnd = 2349
			@deactivateAltitude = 2349
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity *= 3.4
					@offset *= 3.4
				}
			}
		}
	}
}
@ParallaxScatters:LAST[RSSOrigin2]
{
	@Body[Apophis]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 3.842614425028
				@minAltitude *= 3.4
				@altitudeFadeRangeAlternate *= 3.4
			}
		}
	}
}
@ParallaxTerrain:LAST[RSSOrigin2]
{
	@Body[Apophis]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart *= 3.4
			@_LowMidBlendEnd *= 3.4
			@_MidHighBlendStart *= 3.4
			@_MidHighBlendEnd *= 3.4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude *= 3.4
			@maxTerrainAltitude *= 3.4
		}
	}
}
@principia_gravity_model:LAST[RSSOrigin2]
{
	@body[Apophis]
	{
		@gravitational_parameter = 1.60014078919064e-07 km^3/s^2
		@reference_radius        = 5.68644134792937e-01 km
	}
}