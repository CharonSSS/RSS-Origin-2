// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Apophis]
	{
		@Orbit
		{
			@inclination = 20.469895759779405
			@longitudeOfAscendingNode = 355.8330932753299
			@argumentOfPeriapsis = 333.8491838487886
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Apophis]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@sphereOfInfluence /= 4
		}
	}
}
