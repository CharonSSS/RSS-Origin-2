			@argumentOfPeriapsis = 267.8375525252634
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Salacia]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 22649
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 271763
			}
		}
		@ScaledVersion
		{
			@fadeStart = 17259
			@fadeEnd = 18472
		}
		@PQS
		{
			@fadeStart = 18472
			@fadeEnd = 22649
			@deactivateAltitude = 22649
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Salacia]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
