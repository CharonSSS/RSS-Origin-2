// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Varda]
	{
		@Orbit
		{
			@inclination = 2.4830021772677937
			@longitudeOfAscendingNode = 322.7539040261502
			@argumentOfPeriapsis = 44.26894736013862
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Varda]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 45975
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 232998
			}
		}
		@ScaledVersion
		{
			@fadeStart = 39034
			@fadeEnd = 40664
		}
		@PQS
		{
			@fadeStart = 40664
			@fadeEnd = 45975
			@deactivateAltitude = 45975
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Varda]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
