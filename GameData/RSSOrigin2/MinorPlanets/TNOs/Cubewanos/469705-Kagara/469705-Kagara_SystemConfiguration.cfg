// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Kagara]
	{
		@Orbit
		{
			@inclination = 22.22889164720035
			@longitudeOfAscendingNode = 6.701888828908114
			@argumentOfPeriapsis = 188.3027383555601
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Kagara]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 50341
			}
		}
		@ScaledVersion
		{
			@fadeStart = 9819
			@fadeEnd = 10191
		}
		@PQS
		{
			@fadeStart = 10191
			@fadeEnd = 11393
			@deactivateAltitude = 11393
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Kagara]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
