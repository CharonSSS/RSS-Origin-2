// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[!Haunu]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 11605
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 45588
			}
		}
		@ScaledVersion
		{
			@fadeStart = 10160
			@fadeEnd = 10503
		}
		@PQS
		{
			@fadeStart = 10503
			@fadeEnd = 11605
			@deactivateAltitude = 11605
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[!Haunu]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[!Haunu]
	{
		@Scatter,*
		{
			@Distribution
			{
				//@spawnChance /= 4
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[!Haunu]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[!Haunu]
	{
		@gravitational_parameter = 3.71245872437500e-03 km^3/s^2
		@angular_frequency       = 1.87090041292800e+03 deg / d
		@reference_radius        = 1.52500066904983e+01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[!Haunu]
	{
		@x    = +3.23054397773917e+08 km
		@y    = +1.55009316655528e+09 km
		@z    = +6.13755695871312e+08 km
		@vx   = -2.16170962304974e+00 km/s
		@vy   = +1.80165118411766e-01 km/s
		@vz   = +1.76698066824760e-01 km/s
	}
}

