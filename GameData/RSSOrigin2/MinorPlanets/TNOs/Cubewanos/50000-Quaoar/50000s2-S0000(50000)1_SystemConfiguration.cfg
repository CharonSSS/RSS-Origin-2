// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-0000_50000_1]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 3330
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 10746
			}
		}
		@ScaledVersion
		{
			@fadeStart = 2830
			@fadeEnd = 2947
		}
		@PQS
		{
			@fadeStart = 2947
			@fadeEnd = 3330
			@deactivateAltitude = 3330
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[S-0000_50000_1]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-0000_50000_1]
	{
		@Scatter,*
		{
			@Distribution
			{
				//@spawnChance /= 4
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-0000_50000_1]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[S-0000_50000_1]
	{
		@gravitational_parameter = 4.71774249131250e-05 km^3/s^2
		@angular_frequency       = 1.99832974344033e+02 deg / d
		@reference_radius        = 3.74999999633282e+00 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[S-0000_50000_1]
	{
		@x    = -1.66403077603450e+09 km
		@y    = -1.83551932127358e+08 km
		@z    = -8.82820487464335e+07 km
		@vx   = +2.98981527430703e-01 km/s
		@vy   = -2.04258336483157e+00 km/s
		@vz   = -5.41017360417715e-01 km/s
	}
}

