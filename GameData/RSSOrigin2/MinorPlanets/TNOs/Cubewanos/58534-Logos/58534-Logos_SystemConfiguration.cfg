// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Logos]
	{
		@Orbit
		{
			@inclination = 21.578920412661763
			@longitudeOfAscendingNode = 5.810404391613499
			@argumentOfPeriapsis = 103.4114346822738
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Logos]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 21588
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 41253
			}
		}
		@ScaledVersion
		{
			@fadeStart = 21490
			@fadeEnd = 21514
		}
		@PQS
		{
			@fadeStart = 21514
			@fadeEnd = 21588
			@deactivateAltitude = 21588
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Logos]
	{
		@PQS
		{
			@maxLevel -= 1
		}
	}
}
