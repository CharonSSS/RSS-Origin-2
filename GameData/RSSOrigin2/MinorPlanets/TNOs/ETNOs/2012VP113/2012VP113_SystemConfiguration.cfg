// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[2012VP113]
	{
		@Orbit
		{
			@inclination = 32.85017252255044
			@longitudeOfAscendingNode = 48.70159668264269
			@argumentOfPeriapsis = 341.054653900623
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[2012VP113]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 187372
			}
		}
		@ScaledVersion
		{
			@fadeStart = 18899
			@fadeEnd = 19975
		}
		@PQS
		{
			@fadeStart = 19975
			@fadeEnd = 23587
			@deactivateAltitude = 23587
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[2012VP113]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
