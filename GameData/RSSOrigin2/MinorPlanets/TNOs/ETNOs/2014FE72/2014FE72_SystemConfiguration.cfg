{
	@Body[2014FE72]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 95080
			}
		}
		@ScaledVersion
		{
			@fadeStart = 15621
			@fadeEnd = 16291
		}
		@PQS
		{
			@fadeStart = 16291
			@fadeEnd = 18478
			@deactivateAltitude = 18478
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[2014FE72]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
