// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Leleakuhonua]
	{
		@Orbit
		{
			@inclination = 31.00936257472059
			@longitudeOfAscendingNode = 340.3293783287893
			@argumentOfPeriapsis = 76.7899591286286
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Leleakuhonua]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 14059
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 75218
			}
		}
		@ScaledVersion
		{
			@fadeStart = 11821
			@fadeEnd = 12345
		}
		@PQS
		{
			@fadeStart = 12345
			@fadeEnd = 14059
			@deactivateAltitude = 14059
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Leleakuhonua]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
