// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Sedna]
	{
		@Orbit
		{
			@inclination = 15.307622754638563
			@longitudeOfAscendingNode = 27.11225089417162
			@argumentOfPeriapsis = 69.99464353705176
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Sedna]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 20500
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 303789
			}
		}
		@ScaledVersion
		{
			@fadeStart = 15219
			@fadeEnd = 16396
		}
		@PQS
		{
			@fadeStart = 16396
			@fadeEnd = 20500
			@deactivateAltitude = 20500
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Sedna]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
