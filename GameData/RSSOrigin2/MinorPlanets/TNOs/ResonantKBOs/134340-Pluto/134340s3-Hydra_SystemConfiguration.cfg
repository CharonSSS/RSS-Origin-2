// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Hydra]
	{
		@Orbit
		{
			@inclination = 96.2461719792817
			@longitudeOfAscendingNode = 222.7572796137852
			@argumentOfPeriapsis = 73.12613265975267
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Hydra]
	{
		@Properties
		{
			@inverseRotThresholdAltitude = 6823
			@ScienceValues
			{
				@spaceAltitudeThreshold = 16523
			}
		}
		@ScaledVersion
		{
			@fadeStart = 5863
			@fadeEnd = 6090
		}
		@PQS
		{
			@fadeStart = 6090
			@fadeEnd = 6823
			@deactivateAltitude = 6823
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Hydra]
	{
		@PQS
		{
			@maxLevel -= 1
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Hydra]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Hydra]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Hydra]
	{
		@gravitational_parameter = 1.25556188318750e-04 km^3/s^2
		@angular_frequency       = 1.67605597909000e+03 deg / d
		@reference_radius        = 4.52760046531887e+00 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Hydra]
	{
		@x    = -9.92316472934985e+08 km
		@y    = +7.57873252337317e+08 km
		@z    = +5.35412056421058e+08 km
		@vx   = -1.13768340943072e+00 km/s
		@vy   = -2.31211498615018e+00 km/s
		@vz   = -4.26020799724561e-01 km/s
	}
}

