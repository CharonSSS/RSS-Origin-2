// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Kerberos]
	{
		@Orbit
		{
			@inclination = 96.24606515812516
			@longitudeOfAscendingNode = 223.4166704164823
			@argumentOfPeriapsis = 98.29922252822188
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Kerberos]
	{
		@Properties
		{
			@ScienceValues
			{
				@spaceAltitudeThreshold = 7914
			}
		}
		@ScaledVersion
		{
			@fadeStart = 2265
			@fadeEnd = 2595
		}
		@PQS
		{
			@fadeStart = 2595
			@fadeEnd = 3904
			@deactivateAltitude = 3904
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Kerberos]
	{
		@PQS
		{
			@maxLevel -= 1
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Kerberos]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Kerberos]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Kerberos]
	{
		@gravitational_parameter = 4.58843213125000e-06 km^3/s^2
		@angular_frequency       = 1.35310109252000e+02 deg / d
		@reference_radius        = 1.39951933970642e+00 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Kerberos]
	{
		@x    = -9.92337449473725e+08 km
		@y    = +7.57855323127323e+08 km
		@z    = +5.35423064817610e+08 km
		@vx   = -1.11472461459321e+00 km/s
		@vy   = -2.27392942584761e+00 km/s
		@vz   = -3.11859297668754e-01 km/s
	}
}

