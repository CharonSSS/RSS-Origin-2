// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Achlys]
	{
		@Orbit
		{
			@inclination = 22.975414283888387
			@longitudeOfAscendingNode = 325.1399129684839
			@argumentOfPeriapsis = 299.3623944066713
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Achlys]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			!inverseRotThresholdAltitude = DELETE
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 267169
			}
		}
		@ScaledVersion
		{
			@fadeStart = 78056
			@fadeEnd = 79971
		}
		@PQS
		{
			@fadeStart = 79971
			@fadeEnd = 86003
			@deactivateAltitude = 86003
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Achlys]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
