// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[S-2012_38628_1]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 74877
			}
		}
		@ScaledVersion
		{
			@fadeStart = 16827
			@fadeEnd = 17389
		}
		@PQS
		{
			@fadeStart = 17389
			@fadeEnd = 19192
			@deactivateAltitude = 19192
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[S-2012_38628_1]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
