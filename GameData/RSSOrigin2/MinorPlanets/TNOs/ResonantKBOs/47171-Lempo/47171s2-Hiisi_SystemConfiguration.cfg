// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Hiisi]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 82555
			}
		}
		@ScaledVersion
		{
			@fadeStart = 7108
			@fadeEnd = 7550
		}
		@PQS
		{
			@fadeStart = 7550
			@fadeEnd = 9047
			@deactivateAltitude = 9047
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Hiisi]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Hiisi]
	{
		@Scatter,*
		{
			@Distribution
			{
				//@spawnChance /= 4
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Hiisi]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Hiisi]
	{
		@gravitational_parameter = 2.19952751162500e-02 km^3/s^2
		@angular_frequency       = 3.15408926625056e+02 deg / d
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Hiisi]
	{
		@x    = +7.53436620292995e+07 km
		@y    = -1.44868801339477e+09 km
		@z    = -6.08743738314625e+08 km
		@vx   = +2.12488607005419e+00 km/s
		@vy   = +6.52520504403915e-01 km/s
		@vz   = -6.80174446822715e-02 km/s
	}
}

