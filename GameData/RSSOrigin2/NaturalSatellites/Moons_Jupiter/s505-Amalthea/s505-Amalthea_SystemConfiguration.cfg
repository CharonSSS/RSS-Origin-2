// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Amalthea]
	{
		@Orbit
		{
			@inclination = 25.35733026078309393
			@longitudeOfAscendingNode = 358.86466510589997370
			@argumentOfPeriapsis = 108.58726904718403716
		}
		@Properties
		{
			@initialRotation = 110.38747168907162699
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Amalthea]
	{
		@Properties
		{
			@inverseRotThresholdAltitude = 30999
			@ScienceValues
			{
				@spaceAltitudeThreshold = 76815
			}
		}
		@ScaledVersion
		{
			@fadeStart = 29056
			@fadeEnd = 29530
		}
		@PQS
		{
			@fadeStart = 29530
			@fadeEnd = 30999
			@deactivateAltitude = 30999
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Amalthea]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Amalthea]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Amalthea]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Amalthea]
	{
		@gravitational_parameter = 8.67630803000000e-03 km^3/s^2
		@angular_frequency       = 1.44526319567757e+03 deg / d
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Amalthea]
	{
		@x    = +1.27408711509488e+08 km
		@y    = -1.28075253851507e+08 km
		@z    = -5.80148697979498e+07 km
		@vx   = +1.49083822686764e+01 km/s
		@vy   = -3.43287520320569e+00 km/s
		@vz   = -1.77592071736328e+00 km/s
	}
}

