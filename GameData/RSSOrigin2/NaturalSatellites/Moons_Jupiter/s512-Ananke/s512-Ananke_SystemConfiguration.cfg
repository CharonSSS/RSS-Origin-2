// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Ananke]
	{
		@Orbit
		{
			@inclination = 144.07845340094926
			@longitudeOfAscendingNode = 210.1794524104096
			@argumentOfPeriapsis = 312.8509640924173
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Ananke]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 4132
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 11712
			}
		}
		@ScaledVersion
		{
			@fadeStart = 3632
			@fadeEnd = 3751
		}
		@PQS
		{
			@fadeStart = 3751
			@fadeEnd = 4132
			@deactivateAltitude = 4132
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Ananke]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Ananke]
	{
		@Scatter,*
