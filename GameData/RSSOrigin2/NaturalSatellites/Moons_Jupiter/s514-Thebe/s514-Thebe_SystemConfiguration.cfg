// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Thebe]
	{
		@Orbit
		{
			@inclination = 24.61151104584360638
			@longitudeOfAscendingNode = 359.44315913051320877
			@argumentOfPeriapsis = 159.39535133195516892
		}
		@Properties
		{
			@initialRotation = 166.56727802956335084
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Thebe]
	{
		@Properties
		{
			@ScienceValues
			{
				@spaceAltitudeThreshold = 35117
			}
		}
		@ScaledVersion
		{
			@fadeStart = 8629
			@fadeEnd = 8895
		}
		@PQS
		{
			@fadeStart = 8895
			@fadeEnd = 9742
			@deactivateAltitude = 9742
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Thebe]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Thebe]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Thebe]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Thebe]
	{
		@gravitational_parameter = 2.91991135625000e-03 km^3/s^2
		@angular_frequency       = 1.06740054705400e+03 deg / d
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Thebe]
	{
		@x    = +1.27404192655989e+08 km
		@y    = -1.28004592291189e+08 km
		@z    = -5.79820036637460e+07 km
		@vx   = -4.87205511447987e+00 km/s
		@vy   = -2.09962880933891e+00 km/s
		@vz   = -1.56742563194211e+00 km/s
	}
}

