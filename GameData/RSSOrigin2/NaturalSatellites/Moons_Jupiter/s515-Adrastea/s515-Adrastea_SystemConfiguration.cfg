		{
			@inclination = 25.49812674677053437
			@longitudeOfAscendingNode = 358.04918105106708026
			@argumentOfPeriapsis = 211.69142518076941428
		}
		@Properties
		{
			@initialRotation = 110.04208889858173847
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Adrastea]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 7530
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1529
			@fadeEnd = 1828
		}
		@PQS
		{
			@fadeStart = 1828
			@fadeEnd = 3124
			@deactivateAltitude = 3124
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Adrastea]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
