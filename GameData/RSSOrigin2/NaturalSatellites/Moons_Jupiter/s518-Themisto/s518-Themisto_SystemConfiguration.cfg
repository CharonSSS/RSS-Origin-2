// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Themisto]
	{
		@Orbit
		{
			@inclination = 25.620173919351565
			@longitudeOfAscendingNode = 251.9719719228368
			@argumentOfPeriapsis = 177.0216117402052
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Themisto]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 7766
			}
		}
		@ScaledVersion
		{
			@fadeStart = 1887
			@fadeEnd = 2198
		}
		@PQS
		{
			@fadeStart = 2198
			@fadeEnd = 3471
			@deactivateAltitude = 3471
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Themisto]
	{
		@PQS
		{
			@maxLevel -= 1
		}
	}
}
