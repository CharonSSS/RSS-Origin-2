// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Nereid]
	{
		@Orbit
		{
			@inclination = 27.47845957197502
			@longitudeOfAscendingNode = 353.6118859739889
			@argumentOfPeriapsis = 261.1135451699502
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Nereid]
	{
		@Properties
		{
			!inverseRotThresholdAltitude = DELETE
			@ScienceValues
			{
				@spaceAltitudeThreshold = 125471
			}
		}
		@ScaledVersion
		{
			@fadeStart = 26882
			@fadeEnd = 27815
		}
		@PQS
		{
			@fadeStart = 27815
			@fadeEnd = 30814
			@deactivateAltitude = 30814
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Nereid]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Nereid]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Nereid]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Nereid]
	{
		@gravitational_parameter = 1.48915479168750e-01 km^3/s^2
		@angular_frequency       = 1.49042608245644e+03 deg / d
		@reference_radius        = 4.46249986247628e+01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Nereid]
	{
		@x    = -1.08868972105990e+09 km
		@y    = -3.00106035238688e+08 km
		@z    = -9.56989344721455e+07 km
		@vx   = +6.53002869365255e-01 km/s
		@vy   = -2.95027842748908e+00 km/s
		@vz   = -1.29182425198202e+00 km/s
	}
}

