// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Despina]
	{
		@Orbit
		{
			@inclination = 47.00268392002575979
			@longitudeOfAscendingNode = 29.33309386517319695
			@argumentOfPeriapsis = 234.57178101741325804
		}
		@Properties
		{
			@initialRotation = 19.10188533443589165
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Despina]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 12616
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 53519
			}
		}
		@ScaledVersion
		{
			@fadeStart = 10933
			@fadeEnd = 11331
		}
		@PQS
		{
			@fadeStart = 11331
			@fadeEnd = 12616
			@deactivateAltitude = 12616
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Despina]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
