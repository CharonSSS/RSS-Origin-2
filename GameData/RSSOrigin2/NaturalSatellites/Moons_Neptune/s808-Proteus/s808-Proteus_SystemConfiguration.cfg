// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Proteus]
	{
		@Orbit
		{
			@inclination = 47.38103374585287497
			@longitudeOfAscendingNode = 28.83229670637726016
			@argumentOfPeriapsis = 78.84576341618641493
		}
		@Properties
		{
			@initialRotation = 320.32738292361328191
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Proteus]
	{
		@Properties
		{
			@inverseRotThresholdAltitude = 29789
			@ScienceValues
			{
				@spaceAltitudeThreshold = 137167
			}
		}
		@ScaledVersion
		{
			@fadeStart = 25571
			@fadeEnd = 26566
		}
		@PQS
		{
			@fadeStart = 26566
			@fadeEnd = 29789
			@deactivateAltitude = 29789
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Proteus]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Proteus]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Proteus]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Proteus]
	{
		@gravitational_parameter = 9.69827700468750e-02 km^3/s^2
		@angular_frequency       = 6.41530953149658e+02 deg / d
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Proteus]
	{
		@x    = -1.08803274888773e+09 km
		@y    = -3.01023655386055e+08 km
		@z    = -9.61364187007142e+07 km
		@vx   = +3.56446269512516e+00 km/s
		@vy   = -3.33246355528735e+00 km/s
		@vz   = -3.37499362422791e+00 km/s
	}
}

