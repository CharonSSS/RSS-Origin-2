			@argumentOfPeriapsis = 121.5495000599324
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Psamathe]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 4990
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 15379
			}
		}
		@ScaledVersion
		{
			@fadeStart = 3976
			@fadeEnd = 4208
		}
		@PQS
		{
			@fadeStart = 4208
			@fadeEnd = 4990
			@deactivateAltitude = 4990
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Psamathe]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
