// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Laomedeia]
	{
		@Orbit
		{
			@inclination = 55.788679642857076
			@longitudeOfAscendingNode = 38.6057908818627
			@argumentOfPeriapsis = 155.2976973668275
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Laomedeia]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 5995
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 17534
			}
		}
		@ScaledVersion
		{
			@fadeStart = 5498
			@fadeEnd = 5618
		}
		@PQS
		{
			@fadeStart = 5618
			@fadeEnd = 5995
			@deactivateAltitude = 5995
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Laomedeia]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
