// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Neso]
	{
		@Orbit
		{
			@inclination = 150.56445404634175
			@longitudeOfAscendingNode = 11.88423301824537
			@argumentOfPeriapsis = 69.30464913817087
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Neso]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 20196
			}
		}
		@ScaledVersion
		{
			@fadeStart = 3091
			@fadeEnd = 3231
		}
		@PQS
		{
			@fadeStart = 3231
			@fadeEnd = 3691
			@deactivateAltitude = 3691
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Neso]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Neso]
	{
		@Scatter,*
		{
			@Distribution
			{
				//@spawnChance /= 4
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Neso]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Neso]
	{
		@gravitational_parameter = 4.25472797625000e-04 km^3/s^2
		@angular_frequency       = 4.98258458216000e+01 deg / d
		@reference_radius        = 7.50000022411237e+00 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Neso]
	{
		@x    = -1.09420569526568e+09 km
		@y    = -2.83881918156300e+08 km
		@z    = -1.03295870911291e+08 km
		@vx   = +8.25577408247050e-01 km/s
		@vy   = -2.41434092747938e+00 km/s
		@vz   = -9.83433636600755e-01 km/s
	}
