// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Hyperion]
	{
		@Orbit
		{
			@inclination = 6.243860708588398
			@longitudeOfAscendingNode = 129.8965814683214
			@argumentOfPeriapsis = 83.56850835151376
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Hyperion]
	{
		@Properties
		{
			!inverseRotThresholdAltitude = DELETE
			@ScienceValues
			{
				@spaceAltitudeThreshold = 101058
			}
		}
		@ScaledVersion
		{
			@fadeStart = 27716
			@fadeEnd = 28466
		}
		@PQS
		{
			@fadeStart = 28466
			@fadeEnd = 30839
			@deactivateAltitude = 30839
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Hyperion]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Hyperion]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Hyperion]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Hyperion]
	{
		@gravitational_parameter = 2.31548970550625e-02 km^3/s^2
		@angular_frequency       = 5.53846153846160e+01 deg / d
		@reference_radius        = 3.32668686782720e+01 km
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Hyperion]
	{
		@x    = -3.36655578545088e+08 km
		@y    = +8.09104779431870e+07 km
		@z    = +4.80127673235800e+07 km
		@vx   = +8.23697121810120e-01 km/s
		@vy   = -3.20220587986149e+00 km/s
		@vz   = -2.02647539802743e+00 km/s
	}
}

