// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Phoebe]
	{
		@Orbit
		{
			@inclination = 154.9499494435568
			@longitudeOfAscendingNode = 192.8090388522437
			@argumentOfPeriapsis = 275.348808684514
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Phoebe]
	{
		@Properties
		{
			@inverseRotThresholdAltitude = 12829
			@ScienceValues
			{
				@spaceAltitudeThreshold = 72812
			}
		}
		@ScaledVersion
		{
			@fadeStart = 10704
			@fadeEnd = 11200
		}
		@PQS
		{
			@fadeStart = 11200
			@fadeEnd = 12829
			@deactivateAltitude = 12829
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Phoebe]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Phoebe]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Phoebe]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
