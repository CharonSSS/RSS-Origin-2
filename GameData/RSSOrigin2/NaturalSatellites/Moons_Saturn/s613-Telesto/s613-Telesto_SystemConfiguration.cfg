// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Telesto]
	{
		@Orbit
		{
			@inclination = 6.51135473439783
			@longitudeOfAscendingNode = 132.813246340809
			@argumentOfPeriapsis = 31.74658167768295
		}
		@Properties
		{
			@initialRotation = 344.49434105673275
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Telesto]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 10604
			}
		}
		@ScaledVersion
		{
			@fadeStart = 2869
			@fadeEnd = 3162
		}
		@PQS
		{
			@fadeStart = 3162
			@fadeEnd = 4234
			@deactivateAltitude = 4234
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Telesto]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Telesto]
	{
		@Scatter,*
		{
			@Distribution
			{
				//@spawnChance /= 4
				@minAltitude /= 4
				@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Telesto]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Telesto]
	{
		@gravitational_parameter = 1.66852077500000e-05 km^3/s^2
		@angular_frequency       = 3.81395532157228e+02 deg / d
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Telesto]
	{
		@x    = -3.36782755468630e+08 km
