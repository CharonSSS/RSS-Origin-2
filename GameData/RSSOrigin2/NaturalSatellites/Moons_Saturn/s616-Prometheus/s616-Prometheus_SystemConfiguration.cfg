// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Prometheus]
	{
		@Orbit
		{
			@inclination = 6.45707882123018084
			@longitudeOfAscendingNode = 130.63611442083305292
			@argumentOfPeriapsis = 309.61643333283092261
		}
		@Properties
		{
			@initialRotation = 163.29506604443686513
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Prometheus]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 38146
			}
		}
		@ScaledVersion
		{
			@fadeStart = 14759
			@fadeEnd = 14988
		}
		@PQS
		{
			@fadeStart = 14988
			@fadeEnd = 15698
			@deactivateAltitude = 15698
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Prometheus]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
