// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Albiorix]
	{
		@Orbit
		{
			@inclination = 38.29350566654707
			@longitudeOfAscendingNode = 120.6191498242198
			@argumentOfPeriapsis = 22.39546694669967
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Albiorix]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 5181
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 12952
			}
		}
		@ScaledVersion
		{
			@fadeStart = 3985
			@fadeEnd = 4255
		}
		@PQS
		{
			@fadeStart = 4255
			@fadeEnd = 5181
			@deactivateAltitude = 5181
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Albiorix]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
