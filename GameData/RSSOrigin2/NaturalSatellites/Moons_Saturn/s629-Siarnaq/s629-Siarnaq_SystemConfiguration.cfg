// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Siarnaq]
	{
		@Orbit
		{
			@inclination = 60.40895419276464
			@longitudeOfAscendingNode = 79.32471693206595
			@argumentOfPeriapsis = 83.83022484288688
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Siarnaq]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 4416
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 14916
			}
		}
		@ScaledVersion
		{
			@fadeStart = 3333
			@fadeEnd = 3576
		}
		@PQS
		{
			@fadeStart = 3576
			@fadeEnd = 4416
			@deactivateAltitude = 4416
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Siarnaq]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
