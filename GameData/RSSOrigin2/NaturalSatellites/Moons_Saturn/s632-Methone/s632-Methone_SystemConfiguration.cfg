// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Methone]
	{
		@Orbit
		{
			@inclination = 6.462448311339934
			@longitudeOfAscendingNode = 130.6156007774013
			@argumentOfPeriapsis = 32.08763552288222
		}
		@Properties
		{
			@initialRotation = 260.749865840387543
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Methone]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 2.95
			@mass /= 8.7025
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2248
			@timewarpAltitudeLimits[*, ] /= 2.95
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 2.95
				@spaceAltitudeThreshold = 2528
			}
		}
		@ScaledVersion
		{
			@fadeStart = 343
			@fadeEnd = 549
		}
		@PQS
		{
			@fadeStart = 549
			@fadeEnd = 2248
			@deactivateAltitude = 2248
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 2.95
					@offset /= 2.95
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
