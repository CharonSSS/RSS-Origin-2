// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Polydeuces]
	{
		@Orbit
		{
			@inclination = 6.466121950831412
			@longitudeOfAscendingNode = 131.6999394700807
			@argumentOfPeriapsis = 293.4985064523538
		}
		@Properties
		{
			@initialRotation = 250.8765327555452
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Polydeuces]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 3.2
			@mass /= 10.240000000000002
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2138
			@timewarpAltitudeLimits[*, ] /= 3.2
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 3.2
				@spaceAltitudeThreshold = 2168
			}
		}
		@ScaledVersion
		{
			@fadeStart = 208
			@fadeEnd = 372
		}
		@PQS
		{
			@fadeStart = 372
			@fadeEnd = 2138
			@deactivateAltitude = 2138
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 3.2
					@offset /= 3.2
				}
			}
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Polydeuces]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance /= 3.594719240073
				@minAltitude /= 3.2
				@maxAltitude /= 3.2
				@altitudeFadeRangeAlternate /= 3.2
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Polydeuces]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 3.2
			@_LowMidBlendEnd /= 3.2
			@_MidHighBlendStart /= 3.2
			@_MidHighBlendEnd /= 3.2
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 3.2
			@maxTerrainAltitude /= 3.2
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Polydeuces]
	{
		@gravitational_parameter = 5.21412742187500e-08 km^3/s^2
		@angular_frequency       = 2.63068149422000e+02 deg / d
	}
}
