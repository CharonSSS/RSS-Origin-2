// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Anthe]
	{
		@Orbit
		{
			@inclination = 6.462294465575673
			@longitudeOfAscendingNode = 130.5282799014068
			@argumentOfPeriapsis = 203.5681298126631
		}
		@Properties
		{
			@initialRotation = 75.5590061042158
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Anthe]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 1.82
			@mass /= 3.3124000000000002
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 2222
			@timewarpAltitudeLimits[*, ] /= 1.82
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 1.82
				@spaceAltitudeThreshold = 2445
			}
		}
		@ScaledVersion
		{
			@fadeStart = 312
			@fadeEnd = 510
		}
		@PQS
		{
			@fadeStart = 510
			@fadeEnd = 2222
			@deactivateAltitude = 2222
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 1.82
					@offset /= 1.82
				}
			}
		}
	}
}
