@Kopernicus:LAST[RSSOrigin2]
{
	@Body[Aegaeon]
	{
		@Properties
		{
			@radius *= 2.05
			@mass *= 8.615125
			@sphereOfInfluence *= 2.05
			@timewarpAltitudeLimits[*, ] *= 2.05
			@ScienceValues
			{
				@flyingAltitudeThreshold *= 2.05
				@spaceAltitudeThreshold *= 2.05
			}
		}
		@PQS
		{
			@fadeEnd = 3025
			@deactivateAltitude = 3025
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity *= 2.05
					@offset *= 2.05
				}
			}
		}
	}
}
@ParallaxScatters:LAST[RSSOrigin2]
{
	@Body[Aegaeon]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 2.202567603773
				@minAltitude *= 2.05
				@altitudeFadeRangeAlternate *= 2.05
			}
		}
	}
}
@ParallaxTerrain:LAST[RSSOrigin2]
{
	@Body[Aegaeon]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart *= 2.05
			@_LowMidBlendEnd *= 2.05
			@_MidHighBlendStart *= 2.05
			@_MidHighBlendEnd *= 2.05
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude *= 2.05
			@maxTerrainAltitude *= 2.05
		}
	}
}
@principia_gravity_model:LAST[RSSOrigin2]
{
	@body[Aegaeon]
	{
		@gravitational_parameter = 4.49634830505060e-08 km^3/s^2
		@reference_radius        = 6.70568593588661e-01 km
	}
}