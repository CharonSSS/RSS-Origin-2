// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Aegaeon]
	{
		@Orbit
		{
			@inclination = 6.46212956855286347
			@longitudeOfAscendingNode = 130.59776552565259067
			@argumentOfPeriapsis = 349.38143308265574660
		}
		@Properties
		{
			@initialRotation = 320.47148744072677573
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Aegaeon]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@rotationPeriod /= 2
		}
	}
}
