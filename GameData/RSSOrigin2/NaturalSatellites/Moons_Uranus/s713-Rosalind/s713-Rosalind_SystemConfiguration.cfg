// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Rosalind]
	{
		@Orbit
		{
			@inclination = 74.84275815663674791
			@longitudeOfAscendingNode = 167.35763682571513300
			@argumentOfPeriapsis = 68.88026999248205584
		}
		@Properties
		{
			@initialRotation = 215.47509693837270106
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Rosalind]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 9072
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 32542
			}
		}
		@ScaledVersion
		{
			@fadeStart = 8041
			@fadeEnd = 8287
		}
		@PQS
		{
			@fadeStart = 8287
			@fadeEnd = 9072
			@deactivateAltitude = 9072
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Rosalind]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
