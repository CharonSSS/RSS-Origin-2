// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Puck]
	{
		@Orbit
		{
			@inclination = 74.57020262902835839
			@longitudeOfAscendingNode = 167.09269302452702277
			@argumentOfPeriapsis = 52.28461535399433302
		}
		@Properties
		{
			@initialRotation = 187.01149131187342078
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Puck]
	{
		@Properties
		{
			@ScienceValues
			{
				@spaceAltitudeThreshold = 54463
			}
		}
		@ScaledVersion
		{
			@fadeStart = 7831
			@fadeEnd = 8199
		}
		@PQS
		{
			@fadeStart = 8199
			@fadeEnd = 9412
			@deactivateAltitude = 9412
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Puck]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
@ParallaxScatters:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@Body[Puck]
	{
		@Scatter,*
		{
			@Distribution
			{
				@spawnChance *= 4
				//@minAltitude /= 4
				//@maxAltitude /= 4
				@altitudeFadeRangeAlternate /= 4
			}
		}
	}
}
@ParallaxTerrain:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Puck]
	{
		@ShaderProperties
		{
			@_LowMidBlendStart /= 4
			@_LowMidBlendEnd /= 4
			@_MidHighBlendStart /= 4
			@_MidHighBlendEnd /= 4
		}
		@ParallaxScaledProperties
		{
			@minTerrainAltitude /= 4
			@maxTerrainAltitude /= 4
		}
	}
}
@principia_gravity_model:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Puck]
	{
		@gravitational_parameter = 7.96718670062500e-03 km^3/s^2
		@angular_frequency       = -9.45089036133886e+02 deg / d
	}
}
@principia_initial_state:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:AFTER[zRSSOrigin2]
{
	@body[Puck]
	{
		@x    = -4.64160778007542e+07 km
		@y    = +6.47483759611815e+08 km
		@z    = +2.84231048534497e+08 km
		@vx   = -4.95047008467094e+00 km/s
		@vy   = -1.04714564916022e+00 km/s
		@vz   = +3.63748107645711e+00 km/s
	}
}

