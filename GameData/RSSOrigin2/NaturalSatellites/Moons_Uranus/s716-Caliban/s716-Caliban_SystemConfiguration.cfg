// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Caliban]
	{
		@Orbit
		{
			@inclination = 116.35996464668368
			@longitudeOfAscendingNode = 174.618113886872
			@argumentOfPeriapsis = 339.4920088856469
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Caliban]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 15349
			}
		}
		@ScaledVersion
		{
			@fadeStart = 3147
			@fadeEnd = 3389
		}
		@PQS
		{
			@fadeStart = 3389
			@fadeEnd = 4230
			@deactivateAltitude = 4230
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Caliban]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
