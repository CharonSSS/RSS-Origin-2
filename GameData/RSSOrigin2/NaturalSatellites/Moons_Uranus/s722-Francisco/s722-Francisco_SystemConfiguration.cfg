// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Francisco]
	{
		@Orbit
		{
			@inclination = 136.49310956681708
			@longitudeOfAscendingNode = 129.848389783069
			@argumentOfPeriapsis = 156.6401878269281
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Francisco]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 3786
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 9679
			}
		}
		@ScaledVersion
		{
			@fadeStart = 2354
			@fadeEnd = 2651
		}
		@PQS
		{
			@fadeStart = 2651
			@fadeEnd = 3786
			@deactivateAltitude = 3786
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Francisco]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
