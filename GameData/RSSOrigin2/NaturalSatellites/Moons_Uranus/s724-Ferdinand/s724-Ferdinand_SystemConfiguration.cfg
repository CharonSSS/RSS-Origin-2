// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Ferdinand]
	{
		@Orbit
		{
			@inclination = 146.69456254544048
			@longitudeOfAscendingNode = 189.7693126889713
			@argumentOfPeriapsis = 132.21483415071
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Ferdinand]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@inverseRotThresholdAltitude = 3791
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 9544
			}
		}
		@ScaledVersion
		{
			@fadeStart = 3291
			@fadeEnd = 3409
		}
		@PQS
		{
			@fadeStart = 3409
			@fadeEnd = 3791
			@deactivateAltitude = 3791
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Ferdinand]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
