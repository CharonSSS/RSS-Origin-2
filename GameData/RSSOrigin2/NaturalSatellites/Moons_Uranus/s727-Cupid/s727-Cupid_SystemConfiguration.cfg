// ICRF
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemReferenceFrame[ICRF]]]:FOR[zRSSOrigin2]
{
	@Body[Cupid]
	{
		@Orbit
		{
			@inclination = 74.96421248294248585
			@longitudeOfAscendingNode = 167.30463099373224622
			@argumentOfPeriapsis = 346.72242839364020028
		}
		@Properties
		{
			@initialRotation = 50.23975097810392753
		}
	}
}

// Quarter Scale
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:FOR[zRSSOrigin2]
{
	@Body[Cupid]
	{
		@Orbit
		{
			@semiMajorAxis /= 4
		}
		@Properties
		{
			@radius /= 4
			@mass /= 16
			@rotationPeriod /= 2
			@sphereOfInfluence /= 4
			@inverseRotThresholdAltitude = 3363
			@timewarpAltitudeLimits[*, ] /= 4
			@ScienceValues
			{
				@flyingAltitudeThreshold /= 4
				@spaceAltitudeThreshold = 7937
			}
		}
		@ScaledVersion
		{
			@fadeStart = 2863
			@fadeEnd = 2981
		}
		@PQS
		{
			@fadeStart = 2981
			@fadeEnd = 3363
			@deactivateAltitude = 3363
			@Mods
			{
				@VertexHeightMapBicubic
				{
					@deformity /= 4
					@offset /= 4
				}
			}
		}
	}
}
@Kopernicus:HAS[@Sol_Configuration:HAS[#SystemScale[Quarter]]]:LAST[zRSSOrigin2]
{
	@Body[Cupid]
	{
		@PQS
		{
			@maxLevel -= 2
		}
	}
}
