OrbitPlotterSettings
{
	UseHotkey = True
}































































































OrbitPlotter_IconDisplayOverride
{
	Enabled = True
	IconDisplayMode = OBJ
}
@Kopernicus:FOR[RSSOrigin2]
{
	OrbitPlotter_IconDisplayOverride
	{
		Enabled = #$@OrbitPlotter_IconDisplayOverride/Enabled$
		IconDisplayMode = #$@OrbitPlotter_IconDisplayOverride/IconDisplayMode$
	}
}
@Kopernicus:NEEDS[!Principia]:FINAL:HAS[@OrbitPlotter_IconDisplayOverride:HAS[#Enabled[True]]:HAS[#IconDisplayMode[NONE]]]
{
	@Body,*
	{
		@Orbit
		{
			%icon = NONE
		}
	}
}
@Kopernicus:NEEDS[!Principia]:FINAL:HAS[@OrbitPlotter_IconDisplayOverride:HAS[#Enabled[True]]:HAS[#IconDisplayMode[OBJ]]]
{
	@Body,*
	{
		@Orbit
		{
			%icon = OBJ
		}
	}
}
@Kopernicus:NEEDS[!Principia]:FINAL:HAS[@OrbitPlotter_IconDisplayOverride:HAS[#Enabled[True]]:HAS[#IconDisplayMode[OBJ_PE_AP]]]
{
	@Body,*
	{
		@Orbit
		{
			%icon = OBJ_PE_AP
		}
	}
}
@Kopernicus:NEEDS[!Principia]:FINAL:HAS[@OrbitPlotter_IconDisplayOverride:HAS[#Enabled[True]]:HAS[#IconDisplayMode[ALL]]]
{
	@Body,*
	{
		@Orbit
		{
			%icon = ALL
		}
	}
}
@Kopernicus:NEEDS[!Principia]:FINAL
{
	@Body,*
	{
		@Orbit
		{
			!icon = DELETE
		}
	}  
}