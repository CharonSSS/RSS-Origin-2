		#RSSOrigin2_Proteus_name = Proteus
		#RSSOrigin2_Proteus_desc = Proteus, also known as Neptune VIII, is the second-largest Neptunian moon, and Neptune's largest inner satellite. Discovered by Voyager 2 spacecraft in 1989, it is named after Proteus, the shape-changing sea god of Greek mythology. Proteus orbits Neptune in a nearly equatorial orbit at a distance of about 4.75 times the radius of Neptune's equator.
		#RSSOrigin2_Proteus_Biome1 = Pharos
		#RSSOrigin2_Proteus_Biome2 = Scarp
		#RSSOrigin2_Proteus_Biome3 = Groove
		#RSSOrigin2_Proteus_Biome4 = Highlands
		#RSSOrigin2_Proteus_Biome5 = Lowlands

		#RSSOrigin2_Halimede_name = Halimede
		#RSSOrigin2_Halimede_desc = Halimede, or Neptune IX, is a retrograde irregular satellite of Neptune. It was discovered by Matthew J. Holman, John J. Kavelaars, Tommy Grav, Wesley C. Fraser and Dan Milisavljevic on August 14, 2002. Halimede, like many of the outer satellites of Neptune, is named after one of the Nereids, the fifty daughters of Nereus and Doris. Before the announcement of its name on February 3, 2007 (IAUC 8802), Halimede was known by the provisional designation S/2002 N 1.
		#RSSOrigin2_Halimede_Biome1 = Highlands
		#RSSOrigin2_Halimede_Biome2 = Midlands
		#RSSOrigin2_Halimede_Biome3 = Lowlands

		#RSSOrigin2_Psamathe_name = Psamathe
		#RSSOrigin2_Psamathe_desc = Psamathe, also known as Neptune X, is a retrograde irregular satellite of Neptune. It is named after Psamathe, one of the Nereids. Psamathe was discovered by Scott S. Sheppard and David C. Jewitt in 2003 using the 8.2 meter Subaru Telescope. Before it was officially named on February 3, 2007 (IAUC 8802), it was known by the provisional designation S/2003 N 1. Psamathe is about 38 kilometers in diameter. It orbits Neptune at a distance of between 25.7 and 67.7 million km (for comparison, the Sun–Mercury distance varies between 46 million and 69.8 million km) and requires almost 25 Earth years to make one orbit. The orbit of this satellite is close to the theoretical stable separation from Neptune for a body in a retrograde orbit. Given the similarity of Psamathe's orbital parameters with Neso (S/2002 N 4), it was suggested that both irregular satellites could have a common origin in the breakup of a larger moon. Both are farther from their primary than most other known moons in the Solar System (although not as far as S/2021 N 1).
		#RSSOrigin2_Psamathe_Biome1 = Highlands
		#RSSOrigin2_Psamathe_Biome2 = Midlands
		#RSSOrigin2_Psamathe_Biome3 = Lowlands

		#RSSOrigin2_Sao_name = Sao
		#RSSOrigin2_Sao_desc = Sao is a prograde irregular satellite of Neptune. It was discovered by Matthew J. Holman et al. on August 14, 2002. Sao orbits Neptune at a distance of about 22.4 million km and is about 44 kilometers in diameter (assuming an albedo of 0.04). Sao follows an exceptionally inclined and moderately eccentric orbit illustrated on the diagram in relation to other irregular satellites of Neptune. The satellites above the horizontal axis are prograde, the satellites beneath it are retrograde. The yellow segments extend from the pericentre to the apocentre, showing the eccentricity. The satellite is in Kozai resonance, i.e. its inclination and eccentricity are coupled (the inclination of the orbit decreases while eccentricity increases and vice versa). Sao, or Neptune XI, like many of the outer satellites of Neptune, is named after one of the Nereids; Sao was associated with sailing and is referred to as "The rescuer" or "Safety". Before the announcement of its name on February 3, 2007 (IAUC 8802), Sao was known provisionally as S/2002 N 2.
		#RSSOrigin2_Sao_Biome1 = Highlands
		#RSSOrigin2_Sao_Biome2 = Midlands
		#RSSOrigin2_Sao_Biome3 = Lowlands

		#RSSOrigin2_Laomedeia_name = Laomedeia
		#RSSOrigin2_Laomedeia_desc = Laomedeia, also known as Neptune XII, is a prograde irregular satellite of Neptune. It was discovered by Matthew J. Holman, et al. on August 13, 2002. Before the announcement of its name on February 3, 2007 (IAUC 8802), it was known as S/2002 N 3. It orbits Neptune at a distance of about 23,571,000 km and is about 42 kilometers in diameter (assuming albedo of 0.04). It is named after Laomedeia, one of the 50 Nereids.
		#RSSOrigin2_Laomedeia_Biome1 = Highlands
		#RSSOrigin2_Laomedeia_Biome2 = Midlands
		#RSSOrigin2_Laomedeia_Biome3 = Lowlands

		#RSSOrigin2_Neso_name = Neso
		#RSSOrigin2_Neso_desc = Neso, also known as Neptune XIII, is the outermost known natural satellite of Neptune. It is a retrograde irregular moon discovered by Matthew J. Holman, Brett J. Gladman, et al. on August 14, 2002, though it went unnoticed until 2003. Neso orbits Neptune at a distance of more than 48 Gm (million km), making it (as of 2015) the most distant known moon of any planet. At apocenter, the satellite is more than 72 Gm from Neptune. This distance is great enough to exceed Mercury's aphelion, which is approximately 70 Gm from the Sun.
		#RSSOrigin2_Neso_Biome1 = Highlands
		#RSSOrigin2_Neso_Biome2 = Midlands
		#RSSOrigin2_Neso_Biome3 = Lowlands

		#RSSOrigin2_Hippocamp_name = Hippocamp
		#RSSOrigin2_Hippocamp_desc = Hippocamp, also designated Neptune XIV, is a small moon of Neptune discovered on 1 July 2013. It was found by astronomer Mark Showalter by analyzing archived Neptune photographs the Hubble Space Telescope captured between 2004 and 2009. The moon is so dim that it was not observed when the Voyager 2 space probe flew by Neptune and its moons in 1989. It is about 35 km (20 mi) in diameter, and orbits Neptune in about 23 hours, just under one Earth day. Due to its unusually close distance to Neptune's largest inner moon Proteus, it has been hypothesized that Hippocamp may have accreted from material ejected by an impact on Proteus several billion years ago. The moon was formerly known by its provisional designation S/2004 N 1 until February 2019, when it was formally named Hippocamp, after the mythological sea-horse symbolizing Poseidon in Greek mythology.
		#RSSOrigin2_Hippocamp_Biome1 = Highlands
		#RSSOrigin2_Hippocamp_Biome2 = Midlands
		#RSSOrigin2_Hippocamp_Biome3 = Lowlands

		#RSSOrigin2_Pallas_name = Pallas
		#RSSOrigin2_Pallas_desc = Pallas (minor-planet designation: 2 Pallas) is the second asteroid to have been discovered, after Ceres. It is believed to have a mineral composition similar to carbonaceous chondrite meteorites, like Ceres, though significantly less hydrated than Ceres. It is the third-largest asteroid in the Solar System by both volume and mass, and is a likely remnant protoplanet. It is 79% the mass of Vesta and 22% the mass of Ceres, constituting an estimated 7% of the mass of the asteroid belt. Its estimated volume is equivalent to a sphere 507 to 515 kilometers (315 to 320 mi) in diameter, 90–95% the volume of Vesta.
		#RSSOrigin2_Pallas_Biome1 = Craters
		#RSSOrigin2_Pallas_Biome2 = South Polar Flatlands
		#RSSOrigin2_Pallas_Biome3 = North Polar Region
		#RSSOrigin2_Pallas_Biome4 = Equatorial Bulge
		#RSSOrigin2_Pallas_Biome5 = Northern Hemisphere
		#RSSOrigin2_Pallas_Biome6 = Southern Hemisphere

		#RSSOrigin2_Juno_name = Juno
		#RSSOrigin2_Juno_desc = 3 Juno is a large asteroid in the asteroid belt. Juno was the third asteroid discovered, in 1804, by German astronomer Karl Harding. It is one of the twenty largest asteroids and one of the two largest stony (S-type) asteroids, along with 15 Eunomia. It is estimated to contain 1% of the total mass of the asteroid belt.
		#RSSOrigin2_Juno_Biome1 = Craters
		#RSSOrigin2_Juno_Biome2 = South Polar Crater Region
		#RSSOrigin2_Juno_Biome3 = North Polar Flatlands
		#RSSOrigin2_Juno_Biome4 = Equatorial Bulges
		#RSSOrigin2_Juno_Biome5 = Northern Hemisphere
		#RSSOrigin2_Juno_Biome6 = Southern Hemisphere

		#RSSOrigin2_Hygiea_name = Hygiea
		#RSSOrigin2_Hygiea_desc = Hygiea (minor-planet designation: 10 Hygiea) is a major asteroid located in the main asteroid belt. With a mean diameter of between 425 and 440 km and a mass estimated to be 3% of the total mass of the belt, it is the fourth-largest asteroid in the Solar System by both volume and mass, and is the largest of the C-type asteroids (dark asteroids with a carbonaceous surface) in classifications that use G type for 1 Ceres. It is very close to spherical, apparently because it had re-accreted after the disruptive impact that produced the large Hygiean family of asteroids.
		#RSSOrigin2_Hygiea_Biome1 = Craters
		#RSSOrigin2_Hygiea_Biome2 = Southern Lowlands
		#RSSOrigin2_Hygiea_Biome3 = Northern Lowlands
		#RSSOrigin2_Hygiea_Biome4 = Equatorial Highlands
		#RSSOrigin2_Hygiea_Biome5 = Northern Hemisphere
		#RSSOrigin2_Hygiea_Biome6 = Southern Hemisphere

		#RSSOrigin2_Psyche_name = Psyche
		#RSSOrigin2_Psyche_desc = 16 Psyche is a large M-type asteroid discovered by the Italian astronomer Annibale de Gasparis, working in Naples, on 17 March 1852 and named after the Greek mythological figure Psyche. The prefix "16" signifies that it was the sixteenth minor planet in order of discovery. It is the largest and most massive of the M-type asteroids, and one of the dozen most massive asteroids. It has a mean diameter of approximately 220 kilometres (140 mi) and contains about one percent of the mass of the asteroid belt. Historically, it was hypothesized to be the exposed core of a protoplanet, but numerous recent studies have all but ruled that out. Psyche was scheduled for space exploration, with a spacecraft launch planned in 2022, arrival in early 2026, and orbital exploration in 2026–2027.
		#RSSOrigin2_Psyche_Biome1 = Gigantic Craters
		#RSSOrigin2_Psyche_Biome2 = Craters
		#RSSOrigin2_Psyche_Biome3 = Cliffs
		#RSSOrigin2_Psyche_Biome4 = Equatorial Bulges
		#RSSOrigin2_Psyche_Biome5 = Northern Hemisphere
		#RSSOrigin2_Psyche_Biome6 = Southern Hemisphere

		#RSSOrigin2_Lutetia_name = Lutetia
		#RSSOrigin2_Lutetia_desc = Lutetia (minor planet designation: 21 Lutetia) is a large M-type asteroid in the main asteroid belt. It measures about 100 kilometers in diameter (120 km along its major axis). It was discovered in 1852 by Hermann Goldschmidt, and is named after Lutetia, the Latin name of Paris.
		#RSSOrigin2_Lutetia_Biome1 = Narbonensis Regio
		#RSSOrigin2_Lutetia_Biome2 = Baetica Regio
		#RSSOrigin2_Lutetia_Biome3 = Achaia Regio
		#RSSOrigin2_Lutetia_Biome4 = Equatorial Bulges
		#RSSOrigin2_Lutetia_Biome5 = Northern Hemisphere
		#RSSOrigin2_Lutetia_Biome6 = Southern Hemisphere

		#RSSOrigin2_Kalliope_name = Kalliope
		#RSSOrigin2_Kalliope_desc = 22 Kalliope is a large M-type asteroid from the asteroid belt discovered by J. R. Hind on 16 November 1852. It is named after Calliope, the Greek Muse of epic poetry. It is orbited by a small moon named Linus.
		#RSSOrigin2_Kalliope_Biome1 = Craters
		#RSSOrigin2_Kalliope_Biome2 = Southern Lowlands
		#RSSOrigin2_Kalliope_Biome3 = Northern Lowlands
		#RSSOrigin2_Kalliope_Biome4 = Equatorial Bulge
		#RSSOrigin2_Kalliope_Biome5 = Northern Hemisphere
		#RSSOrigin2_Kalliope_Biome6 = Southern Hemisphere

		#RSSOrigin2_Linus_name = Linus
		#RSSOrigin2_Linus_desc = Linus, formal designation (22) Kalliope I, is an asteroid moon that orbits the large M-type asteroid 22 Kalliope. It was discovered on August 29, 2001, by astronomers Jean-Luc Margot and Michael E. Brown with the Keck telescope, in Hawaii. Another team also detected the moon with the Canada-France-Hawaii Telescope on September 2, 2001. Both telescopes are on Mauna Kea. It received the provisional designation S/2001 (22) 1, until it was named. The naming proposal appeared in the discovery paper and was approved by the International Astronomical Union in July 2003. Although the naming proposal referred to the mythological Linus, son of the muse Calliope and the inventor of melody and rhythm, the name was also meant to honor Linus Torvalds, inventor of the Linux operating system kernel, and Linus van Pelt, a character in the Peanuts comic strip.
		#RSSOrigin2_Linus_Biome1 = Highlands
		#RSSOrigin2_Linus_Biome2 = Midlands
		#RSSOrigin2_Linus_Biome3 = Lowlands

		#RSSOrigin2_Eugenia_name = Eugenia
		#RSSOrigin2_Eugenia_desc = 45 Eugenia is a large asteroid of the asteroid belt. It is famed as one of the first asteroids to be found to have a moon orbiting it. It was also the second triple asteroid to be discovered, after 87 Sylvia.
		#RSSOrigin2_Eugenia_Biome1 = Craters
		#RSSOrigin2_Eugenia_Biome2 = Southern Lowlands
		#RSSOrigin2_Eugenia_Biome3 = Northern Lowlands
		#RSSOrigin2_Eugenia_Biome4 = Equatorial Bulge
		#RSSOrigin2_Eugenia_Biome5 = Northern Hemisphere
		#RSSOrigin2_Eugenia_Biome6 = Southern Hemisphere

		#RSSOrigin2_Petit-Prince_name = Petit-Prince
		#RSSOrigin2_Petit-Prince_desc = Petit-Prince, formal designation (45) Eugenia I, is the larger, outer moon of asteroid 45 Eugenia. It was discovered in 1998 by astronomers at the Canada-France-Hawaii Telescope on Mauna Kea, Hawaii. Initially, it received the provisional designation S/1998 (45) 1. Petit-Prince was the first asteroid moon to be discovered with a ground-based telescope. Previously, the only known moon of an asteroid was Dactyl, discovered by the Galileo space probe, around 243 Ida.
		#RSSOrigin2_Petit-Prince_Biome1 = Highlands
		#RSSOrigin2_Petit-Prince_Biome2 = Midlands
		#RSSOrigin2_Petit-Prince_Biome3 = Lowlands

		#RSSOrigin2_S-2004_45_1_name = S/2004 (45) 1
		#RSSOrigin2_S-2004_45_1_desc = A second, smaller (estimated diameter of 6 km) satellite that orbits closer to Eugenia than Petit-Prince has since been discovered and provisionally named S/2004 (45) 1. It was discovered by analyses of three images acquired in February 2004 from the 8.2 m VLT "Yepun" at the European Southern Observatory (ESO) Cerro Paranal, in Chile. The discovery was announced in IAUC 8817, on 7 March 2007 by Franck Marchis and his IMCCE collaborators. It orbits the asteroid at about ~700 km, with an orbital period of 4.7 days.
		#RSSOrigin2_S-2004_45_1_Biome1 = Highlands
		#RSSOrigin2_S-2004_45_1_Biome2 = Midlands
		#RSSOrigin2_S-2004_45_1_Biome3 = Lowlands

		#RSSOrigin2_Virginia_name = Virginia
		#RSSOrigin2_Virginia_desc = Virginia (minor planet designation: 50 Virginia) is a large, very dark main belt asteroid. It was discovered by American astronomer James Ferguson on October 4, 1857, from the United States Naval Observatory in Washington, D.C. German astronomer Robert Luther discovered it independently on October 19 from Düsseldorf, and his discovery was announced first.
		#RSSOrigin2_Virginia_Biome1 = Craters
		#RSSOrigin2_Virginia_Biome2 = Southern Polar Region
		#RSSOrigin2_Virginia_Biome3 = Northern Polar Region
		#RSSOrigin2_Virginia_Biome4 = Equatorial Bulge
		#RSSOrigin2_Virginia_Biome5 = Northern Hemisphere
		#RSSOrigin2_Virginia_Biome6 = Southern Hemisphere

		#RSSOrigin2_Cybele_name = Cybele
		#RSSOrigin2_Cybele_desc = Cybele, minor planet designation 65 Cybele, is one of the largest asteroids in the Solar System. It is located in the outer asteroid belt. It is thought to be a remnant primordial body. It gives its name to the Cybele group of asteroids that orbit outward from the Sun from the 2:1 orbital resonance with Jupiter. The X-type asteroid has a relatively short rotation period of 6.0814 hours. It was discovered by Wilhelm Tempel in 1861, and named after Cybele, the earth goddess.
		#RSSOrigin2_Cybele_Biome1 = Craters
		#RSSOrigin2_Cybele_Biome2 = Southern Lowlands
		#RSSOrigin2_Cybele_Biome3 = Northern Lowlands
		#RSSOrigin2_Cybele_Biome4 = Equatorial Bulge
		#RSSOrigin2_Cybele_Biome5 = Northern Hemisphere
		#RSSOrigin2_Cybele_Biome6 = Southern Hemisphere

		#RSSOrigin2_Sylvia_name = Sylvia
		#RSSOrigin2_Sylvia_desc = Sylvia (minor planet designation: 87 Sylvia) is one of the largest asteroids (approximately tied for 7th place, to within measurement uncertainties). It is the parent body of the Sylvia family and member of Cybele group located beyond the main asteroid belt (see minor-planet groups). Sylvia was the first asteroid known to possess more than one moon.
		#RSSOrigin2_Sylvia_Biome1 = Craters
		#RSSOrigin2_Sylvia_Biome2 = Southern Lowlands
		#RSSOrigin2_Sylvia_Biome3 = Northern Lowlands
		#RSSOrigin2_Sylvia_Biome4 = Equatorial Bulge
		#RSSOrigin2_Sylvia_Biome5 = Northern Hemisphere
		#RSSOrigin2_Sylvia_Biome6 = Southern Hemisphere

		#RSSOrigin2_Romulus_name = Romulus
		#RSSOrigin2_Romulus_desc = 87 Sylvia I Romulus
		#RSSOrigin2_Romulus_Biome1 = Lobe 1
		#RSSOrigin2_Romulus_Biome2 = Lobe 2
		#RSSOrigin2_Romulus_Biome3 = Neck

		#RSSOrigin2_Remus_name = Remus
		#RSSOrigin2_Remus_desc = 87 Sylvia II Remus
		#RSSOrigin2_Remus_Biome1 = Highlands
		#RSSOrigin2_Remus_Biome2 = Midlands
		#RSSOrigin2_Remus_Biome3 = Lowlands

		#RSSOrigin2_Antiope_name = Antiope
		#RSSOrigin2_Antiope_desc = Antiope (minor planet designation: 90 Antiope) is a double asteroid in the outer asteroid belt. It was discovered on October 1, 1866, by Robert Luther. In 2000, it was found to consist of two almost-equally-sized bodies orbiting each other. At average diameters of about 88 km and 84 km, both components are among the 500 largest asteroids. Antiope is a member of the Themis family of asteroids that share similar orbital elements.
		#RSSOrigin2_Antiope_Biome1 = South Polar Basin
		#RSSOrigin2_Antiope_Biome2 = North Polar Basin
		#RSSOrigin2_Antiope_Biome3 = Equatorial Basin
		#RSSOrigin2_Antiope_Biome4 = Northern Hemisphere
		#RSSOrigin2_Antiope_Biome5 = Southern Hemisphere

		#RSSOrigin2_S-2000_90_1_name = Antiope B
		#RSSOrigin2_S-2000_90_1_desc = The most remarkable feature of Antiope is that it consists of two components of almost equal size (the difference in mass is less than 2.5%), making it a truly "double" asteroid. Its binary nature was discovered on 10 August 2000 by a group of astronomers using adaptive optics at the Keck Telescope on Mauna Kea. Before this, IRAS observations had suggested that the asteroid was 120 km in diameter.
		#RSSOrigin2_S-2000_90_1_Biome1 = South Polar Basin
		#RSSOrigin2_S-2000_90_1_Biome2 = North Basin
		#RSSOrigin2_S-2000_90_1_Biome3 = Equatorial Mountain
		#RSSOrigin2_S-2000_90_1_Biome4 = Northern Hemisphere
		#RSSOrigin2_S-2000_90_1_Biome5 = Southern Hemisphere

		#RSSOrigin2_Minerva_name = Minerva
		#RSSOrigin2_Minerva_desc = 93 Minerva is a large triple main-belt asteroid. It is a C-type asteroid, meaning that it has a dark surface and possibly a primitive carbonaceous composition. It was discovered by J. C. Watson on 24 August 1867, and named after Minerva, the Roman equivalent of Athena, goddess of wisdom. An occultation of a star by Minerva was observed in France, Spain and the United States on 22 November 1982. An occultation diameter of ~170 km was measured from the observations. Since then two more occultations have been observed, which give an estimated mean diameter of ~150 km.
		#RSSOrigin2_Minerva_Biome1 = Craters
		#RSSOrigin2_Minerva_Biome2 = Southern Lowlands
		#RSSOrigin2_Minerva_Biome3 = Northern Lowlands
		#RSSOrigin2_Minerva_Biome4 = Equatorial Bulge
		#RSSOrigin2_Minerva_Biome5 = Northern Hemisphere
		#RSSOrigin2_Minerva_Biome6 = Southern Hemisphere

		#RSSOrigin2_Aegis_name = Aegis
		#RSSOrigin2_Aegis_desc = 93 Minerva I Aegis
		#RSSOrigin2_Aegis_Biome1 = Highlands
		#RSSOrigin2_Aegis_Biome2 = Midlands
		#RSSOrigin2_Aegis_Biome3 = Lowlands

		#RSSOrigin2_Gorgoneion_name = Gorgoneion
		#RSSOrigin2_Gorgoneion_desc = 93 Minerva II Gorgoneion
		#RSSOrigin2_Gorgoneion_Biome1 = Highlands
		#RSSOrigin2_Gorgoneion_Biome2 = Midlands
		#RSSOrigin2_Gorgoneion_Biome3 = Lowlands

		#RSSOrigin2_Camilla_name = Camilla
		#RSSOrigin2_Camilla_desc = 107 Camilla is one of the largest asteroids from the outermost edge of the asteroid belt, approximately 250 kilometers (160 miles) in diameter. It is a member of the Sylvia family and located within the Cybele group. It was discovered on 17 November 1868, by English astronomer Norman Pogson at Madras Observatory, India, and named after Camilla, Queen of the Volsci in Roman mythology. The X-type asteroid is a rare triple asteroid with two minor-planet moons discovered in 2001 and 2016, respectively. It is elongated in shape and has a short rotation period of 4.8 hours.
		#RSSOrigin2_Camilla_Biome1 = Craters
		#RSSOrigin2_Camilla_Biome2 = Southern Lowlands
		#RSSOrigin2_Camilla_Biome3 = Northern Lowlands
		#RSSOrigin2_Camilla_Biome4 = Equatorial Bulge
		#RSSOrigin2_Camilla_Biome5 = Northern Hemisphere
		#RSSOrigin2_Camilla_Biome6 = Southern Hemisphere

		#RSSOrigin2_S-2001_107_1_name = S/2001 (107) 1
		#RSSOrigin2_S-2001_107_1_desc = On 1 March 2001, a minor-planet moon of Camilla was found by A. Storrs, F. Vilas, R. Landis, E. Wells, C. Woods, B. Zellner, and M. Gaffey using the Hubble Space Telescope. It has the provisional designation S/2001 (107) 1 but has not yet received an official name. Later observations in September 2005 with the Very Large Telescope (VLT) allowed the determination of an orbit. In addition to the data in the infobox at right, the inclination was found to be 3 ± 1° with respect to an axis pointing towards (β, λ) = (+55°, 75°). Given the ~10° uncertainty in the actual rotational axis of Camilla, one can say that the orbit's inclination is less than 10°.
		#RSSOrigin2_S-2001_107_1_Biome1 = Highlands
		#RSSOrigin2_S-2001_107_1_Biome2 = Midlands
		#RSSOrigin2_S-2001_107_1_Biome3 = Lowlands

		#RSSOrigin2_S-2016_107_1_name = S/2016 (107) 1
		#RSSOrigin2_S-2016_107_1_desc = In 2016, the discovery of a second satellite of Camilla was reported by astronomers at Cerro Paranal's Very Large Telescope in Chile. It has the provisional designation S/2016 (107) 1. Observations were taken between 29 May 2015 and 30 July 2016, using the VLT-SPHERE, the principal instrument attached to the 8-meter "Melipal" (UT3) unit of the VLT. On 3 out of 5 observation sessions, the new satellite could be detected. The body's orbit has a semi-major axis of 340 kilometers.
		#RSSOrigin2_S-2016_107_1_Biome1 = Highlands
		#RSSOrigin2_S-2016_107_1_Biome2 = Midlands
		#RSSOrigin2_S-2016_107_1_Biome3 = Lowlands

		#RSSOrigin2_Hermione_name = Hermione
		#RSSOrigin2_Hermione_desc = 121 Hermione is a very large binary asteroid discovered in 1872. It orbits in the Cybele group in the far outer asteroid belt. As an asteroid of the dark C spectral type, it is probably composed of carbonaceous materials. In 2002, a small moon was found to be orbiting Hermione.
		#RSSOrigin2_Hermione_Biome1 = Craters
		#RSSOrigin2_Hermione_Biome2 = Southern Lowlands
		#RSSOrigin2_Hermione_Biome3 = Northern Lowlands
		#RSSOrigin2_Hermione_Biome4 = Equatorial Bulge
		#RSSOrigin2_Hermione_Biome5 = Northern Hemisphere
		#RSSOrigin2_Hermione_Biome6 = Southern Hemisphere

		#RSSOrigin2_S-2002_121_1_name = LaFayette
		#RSSOrigin2_S-2002_121_1_desc = A satellite of Hermione was discovered in 2002 with the Keck II telescope. The satellite is provisionally designated S/2002 (121) 1. It has not yet been officially named, but "LaFayette" has been proposed by a group of astronomers in reference to the frigate used in secret by the Marquis de Lafayette to reach America to help the insurgents.
		#RSSOrigin2_S-2002_121_1_Biome1 = Highlands
		#RSSOrigin2_S-2002_121_1_Biome2 = Midlands
		#RSSOrigin2_S-2002_121_1_Biome3 = Lowlands

		#RSSOrigin2_Elektra_name = Elektra
		#RSSOrigin2_Elektra_desc = Elektra (minor planet designation: 130 Elektra) is a large outer main-belt asteroid and quadruple system with three minor-planet moons. It was discovered on 17 February 1873, by astronomer Christian Peters at Litchfield Observatory, New York, and named after Electra, an avenger in Greek mythology.
		#RSSOrigin2_Elektra_Biome1 = Craters
		#RSSOrigin2_Elektra_Biome2 = Southern Lowlands
		#RSSOrigin2_Elektra_Biome3 = Northern Lowlands
		#RSSOrigin2_Elektra_Biome4 = Equatorial Bulge
		#RSSOrigin2_Elektra_Biome5 = Northern Hemisphere
		#RSSOrigin2_Elektra_Biome6 = Southern Hemisphere

		#RSSOrigin2_S-2003_130_1_name = S/2003 (130) 1
		#RSSOrigin2_S-2003_130_1_desc = S/2003 (130) 1 is the largest and outermost satellite of Elektra, around 6 km (3.7 mi) in diameter, assuming the same albedo as the primary. It was discovered on 15 August 2003, by a team of astronomers led by W. J. Merline using the Keck II telescope at the Mauna Kea Observatory in Hawaii. The discovery images showed that the satellite had an apparent magnitude difference of 8.5 in the near-infrared K-band. The team confirmed the existence of the satellite after reobserving it with the Keck II telescope on 17 August 2003. The discovery was announced on that same day and the satellite was given the provisional designation S/2003 (130) 1.
		#RSSOrigin2_S-2003_130_1_Biome1 = Highlands
		#RSSOrigin2_S-2003_130_1_Biome2 = Midlands
		#RSSOrigin2_S-2003_130_1_Biome3 = Lowlands

		#RSSOrigin2_S-2014_130_1_name = S/2014 (130) 1
		#RSSOrigin2_S-2014_130_1_desc = S/2014 (130) 1 is the second satellite of Elektra by distance and order of discovery. It was discovered on 6 December 2014, by a team of astronomers led by B. Yang using the SPHERE adaptive optics system on the Very Large Telescope's Melipal (UT3) telescope at Cerro Paranal, Chile. Discovery observations showed that the satellite had a near-infrared magnitude difference of 10, corresponding to a diameter of about 2 km (1.2 mi) if it has the same albedo as the primary. The discovery was announced on 16 December 2014, but the satellite was mistakenly designated S/2014 (130) 2 before being immediately corrected to S/2014 (130) 1.
		#RSSOrigin2_S-2014_130_1_Biome1 = Highlands
		#RSSOrigin2_S-2014_130_1_Biome2 = Midlands
		#RSSOrigin2_S-2014_130_1_Biome3 = Lowlands

		#RSSOrigin2_S-2014_130_2_name = S/2014 (130) 2
		#RSSOrigin2_S-2014_130_2_desc = On 6 November 2021, astronomers A. Berdeu, M. Langlois, and F. Vachier reported the discovery of a third, closer-in satellite in archival VLT-SPHERE images taken between 9 and 31 December 2014, making Elektra the first quadruple system discovered and imaged in the main asteroid belt. This third satellite—which was provisionally designated S/2014 (130) 2—had eluded discovery when the images were taken, due to its faintness and close proximity to Elektra's bright glare. For these reasons, S/2014 (130) 2 had to be measured through image subtraction of Elektra's bright glare. The satellite measures roughly 1.6 km (0.99 mi) in diameter, based on a near-infrared magnitude difference of 10.5. The satellite has been identified in later VLT images from February 2016 and July–August 2019.
		#RSSOrigin2_S-2014_130_2_Biome1 = Highlands
		#RSSOrigin2_S-2014_130_2_Biome2 = Midlands
		#RSSOrigin2_S-2014_130_2_Biome3 = Lowlands

		#RSSOrigin2_Kleopatra_name = Kleopatra
		#RSSOrigin2_Kleopatra_desc = 216 Kleopatra is a large M-type asteroid with a mean diameter of 120 kilometers (75 miles) and is noted for its elongate bone or dumbbell shape. It was discovered on 10 April 1880 by Austrian astronomer Johann Palisa at the Austrian Naval Pola Observatory, in what is now Pula, Croatia, and was named after Cleopatra, the famous Egyptian queen. It has two small minor-planet moons which were discovered in 2008 and later named Alexhelios and Cleoselene.
		#RSSOrigin2_Kleopatra_Biome1 = Lobe 1 Northern Hemisphere
		#RSSOrigin2_Kleopatra_Biome2 = Lobe 1 Southern Hemisphere
		#RSSOrigin2_Kleopatra_Biome3 = Lobe 2 Northern Hemisphere
		#RSSOrigin2_Kleopatra_Biome4 = Lobe 2 Southern Hemisphere
		#RSSOrigin2_Kleopatra_Biome5 = Neck Northern Hemisphere
		#RSSOrigin2_Kleopatra_Biome6 = Neck Southern Hemisphere

		#RSSOrigin2_Alexhelios_name = Alexhelios
		#RSSOrigin2_Alexhelios_desc = 216 Kleopatra I Alexhelios
		#RSSOrigin2_Alexhelios_Biome1 = Highlands
		#RSSOrigin2_Alexhelios_Biome2 = Midlands
		#RSSOrigin2_Alexhelios_Biome3 = Lowlands

		#RSSOrigin2_Cleoselene_name = Cleoselene
		#RSSOrigin2_Cleoselene_desc = 216 Kleopatra II Cleoselene
		#RSSOrigin2_Cleoselene_Biome1 = Highlands
		#RSSOrigin2_Cleoselene_Biome2 = Midlands
		#RSSOrigin2_Cleoselene_Biome3 = Lowlands

		#RSSOrigin2_Rosa_name = Rosa
		#RSSOrigin2_Rosa_desc = Rosa (minor planet designation: 223 Rosa) is a large Themistian asteroid. It is classified as a combination of C-type and P-type asteroids, so it is probably composed of carbonaceous material rich in water ice. It was discovered by Johann Palisa on 9 March 1882, in Vienna. The origin of the name is not known.
		#RSSOrigin2_Rosa_Biome1 = Craters
		#RSSOrigin2_Rosa_Biome2 = Southern Polar Region
		#RSSOrigin2_Rosa_Biome3 = Northern Polar Region
		#RSSOrigin2_Rosa_Biome4 = Equatorial Bulge
		#RSSOrigin2_Rosa_Biome5 = Northern Hemisphere
		#RSSOrigin2_Rosa_Biome6 = Southern Hemisphere

		#RSSOrigin2_Ida_name = Ida
		#RSSOrigin2_Ida_desc = Ida, minor planet designation 243 Ida, is an asteroid in the Koronis family of the asteroid belt. It was discovered on 29 September 1884 by Austrian astronomer Johann Palisa at Vienna Observatory and named after a nymph from Greek mythology. Later telescopic observations categorized Ida as an S-type asteroid, the most numerous type in the inner asteroid belt. On 28 August 1993, Ida was visited by the uncrewed Galileo spacecraft while en route to Jupiter. It was the second asteroid visited by a spacecraft and the first found to have a natural satellite.
		#RSSOrigin2_Ida_Biome1 = Lobe 1
		#RSSOrigin2_Ida_Biome2 = Lobe 2
		#RSSOrigin2_Ida_Biome3 = Undara
		#RSSOrigin2_Ida_Biome4 = Lascaux
		#RSSOrigin2_Ida_Biome5 = Waist

		#RSSOrigin2_Dactyl_name = Dactyl
		#RSSOrigin2_Dactyl_desc = (243) Ida I Dactyl is a tiny asteroid moon (1.6 km in diameter) that orbits asteroid 243 Ida. It was imaged by the Galileo spacecraft on August 28, 1993; Dactyl was discovered while examining the delayed image downloads from Galileo on February 17, 1994. It was provisionally designated S/1993 (243) 1. Dactyl orbits Ida with a period of 1.54 days at an average distance of 108 km, with an inclination of 9° to Ida's equator. The origins of Dactyl are unclear, but two main hypotheses exist. The first is that Dactyl and Ida formed at the same time, and the second is that Dactyl was knocked loose by a later impact. Dactyl was the first asteroid moon discovered. Its discovery settled the long debate over the existence of asteroid moons.
		#RSSOrigin2_Dactyl_Biome1 = Highlands
		#RSSOrigin2_Dactyl_Biome2 = Lowlands

		#RSSOrigin2_Mathilde_name = Mathilde
		#RSSOrigin2_Mathilde_desc = Mathilde (minor planet designation: 253 Mathilde) is an asteroid in the intermediate asteroid belt, approximately 50 kilometers in diameter, that was discovered by Austrian astronomer Johann Palisa at Vienna Observatory on 12 November 1885. It has a relatively elliptical orbit that requires more than four years to circle the Sun. This tumbling asteroid has an unusually slow rate of rotation, requiring 17.4 days to complete a 360° revolution about its axis. It is a primitive C-type asteroid, which means the surface has a high proportion of carbon; giving it a dark surface that reflects only 4% of the light that falls on it.
		#RSSOrigin2_Mathilde_Biome1 = Ishikari
		#RSSOrigin2_Mathilde_Biome2 = Kuznetsk
		#RSSOrigin2_Mathilde_Biome3 = Karoo
		#RSSOrigin2_Mathilde_Biome4 = Damodar
		#RSSOrigin2_Mathilde_Biome5 = Surface

		#RSSOrigin2_Nike_name = Nike
		#RSSOrigin2_Nike_desc = Nike (minor planet designation: 307 Nike) is a sizeable asteroid of the asteroid belt. It was discovered by Auguste Charlois on 5 March 1891 while working at the Nice Observatory. Charlois named it after the Greek goddess of victory, as well as the Greek name for the city where it was discovered. Measurement of the light curve of this asteroid in 2000 indicates a rotation period of 7.902 ± 0.005 hours.
		#RSSOrigin2_Nike_Biome1 = Craters
		#RSSOrigin2_Nike_Biome2 = Southern Polar Region
		#RSSOrigin2_Nike_Biome3 = Northern Polar Region
		#RSSOrigin2_Nike_Biome4 = Equatorial Bulge
		#RSSOrigin2_Nike_Biome5 = Northern Hemisphere
		#RSSOrigin2_Nike_Biome6 = Southern Hemisphere

		#RSSOrigin2_Eros_name = Eros
		#RSSOrigin2_Eros_desc = Eros (minor planet designation: (433) Eros), provisional designation 1898 DQ, is a stony asteroid of the Amor group and the first discovered and second-largest near-Earth object with an elongated shape and a mean diameter of approximately 16.8 kilometers (10.4 miles). Visited by the NEAR Shoemaker space probe in 1998, it became the first asteroid ever studied from orbit around the asteroid.
		#RSSOrigin2_Eros_Biome1 = Charlois Regio
		#RSSOrigin2_Eros_Biome2 = Himeros
		#RSSOrigin2_Eros_Biome3 = Psyche
		#RSSOrigin2_Eros_Biome4 = Highlands
		#RSSOrigin2_Eros_Biome5 = Lowlands

		#RSSOrigin2_Patroclus_name = Patroclus
		#RSSOrigin2_Patroclus_desc = 617 Patroclus is a large binary Jupiter trojan asteroid. It is a dark D-type asteroid and a slow rotator, due to the 103-hour orbital period of its two components. It is one of five Jovian asteroids targeted by the Lucy space probe, and is scheduled for a flyby in 2033.
		#RSSOrigin2_Patroclus_Biome1 = Craters
		#RSSOrigin2_Patroclus_Biome2 = Southern Polar Region
		#RSSOrigin2_Patroclus_Biome3 = Northern Polar Region
		#RSSOrigin2_Patroclus_Biome4 = Equatorial Bulge
		#RSSOrigin2_Patroclus_Biome5 = Northern Hemisphere
		#RSSOrigin2_Patroclus_Biome6 = Southern Hemisphere

		#RSSOrigin2_Menoetius_name = Menoetius
		#RSSOrigin2_Menoetius_desc = In 2001 Patroclus was discovered to be a binary asteroid of two similarly sized objects. The name Patroclus is now assigned to the larger component, some 110–115 km in diameter, while the secondary, slightly smaller at 100–105 km in diameter, has been named Menoetius. This was the first discovery of a binary trojan asteroid.
		#RSSOrigin2_Menoetius_Biome1 = Craters
		#RSSOrigin2_Menoetius_Biome2 = Southern Polar Basin
		#RSSOrigin2_Menoetius_Biome3 = Northern Polar Region
		#RSSOrigin2_Menoetius_Biome4 = Equatorial Bulge
		#RSSOrigin2_Menoetius_Biome5 = Northern Hemisphere
		#RSSOrigin2_Menoetius_Biome6 = Southern Hemisphere

		#RSSOrigin2_Hektor_name = Hektor
		#RSSOrigin2_Hektor_desc = 624 Hektor is the largest Jupiter trojan and the namesake of the Hektor family, with a highly elongated shape equivalent in volume to a sphere of approximately 225 to 250 kilometers diameter. It was discovered on 10 February 1907, by astronomer August Kopff at Heidelberg Observatory in southwest Germany, and named after the Trojan prince Hector, from Greek mythology. It has one small 12-kilometer sized satellite, Skamandrios, discovered in 2006.
		#RSSOrigin2_Hektor_Biome1 = Big Lobe Northern Hemisphere
		#RSSOrigin2_Hektor_Biome2 = Small Lobe Northern Hemisphere
		#RSSOrigin2_Hektor_Biome3 = Neck
		#RSSOrigin2_Hektor_Biome4 = Big Lobe Southern Hemisphere
		#RSSOrigin2_Hektor_Biome5 = Small Lobe Southern Hemisphere
		#RSSOrigin2_Hektor_Biome6 = Craters

		#RSSOrigin2_Skamandrios_name = Skamandrios
		#RSSOrigin2_Skamandrios_desc = A 10–15-km-diameter moon, named Skamandrios, was detected orbiting 624 Hektor in 2006 with a semi-major axis of 623.5 km and an orbital period of 2.9651 days (71.162 hours). It was confirmed with Keck observations in November 2011, and was then named on 12 March 2017. No mass estimate was provided, but the equivalent volume suggests an approximate mass of 8.74×1014 kg if the two bodies are of the same density. Its orbit is highly inclined and eccentric, and it is likely that its rotation is chaotic. Marchis et al. (2014) speculate that it was ejected after a low-velocity collision produced the bilobed primary. The newly merged primary could have spun fast enough to be unstable and shed some mass. The dynamics of Skamandrios can be modeled by the restricted four-body problem.
		#RSSOrigin2_Skamandrios_Biome1 = Highlands
		#RSSOrigin2_Skamandrios_Biome2 = Midlands
		#RSSOrigin2_Skamandrios_Biome3 = Lowlands

		#RSSOrigin2_Interamnia_name = Interamnia
		#RSSOrigin2_Interamnia_desc = 704 Interamnia is a large F-type asteroid. With a mean diameter of around 330 kilometres, it is the fifth-largest asteroid, after Ceres, Vesta, Pallas and Hygiea. Its mean distance from the Sun is 3.067 AU. It was discovered on 2 October 1910 by Vincenzo Cerulli, and named after the Latin name for Teramo, Italy, where Cerulli worked. Its mass is probably between fifth and tenth highest in the asteroid belt, with a mass estimated to be 1.2% of the mass of the entire asteroid belt. Observations by the Very Large Telescope's SPHERE imager in 2017–2019, combined with occultation results, indicate that the shape of Interamnia may be consistent with hydrostatic equilibrium for a body of its density with a rotational period of 7.6 hours. (Its current period is 8.7 hours.) This suggests that Interamnia may have formed as an equilibrium body, and that impacts changed its rotational period after it fully solidified.
		#RSSOrigin2_Interamnia_Biome1 = Craters
		#RSSOrigin2_Interamnia_Biome2 = Southern Lowlands
		#RSSOrigin2_Interamnia_Biome3 = Northern Lowlands
		#RSSOrigin2_Interamnia_Biome4 = Equatorial Bulge
		#RSSOrigin2_Interamnia_Biome5 = Northern Hemisphere
		#RSSOrigin2_Interamnia_Biome6 = Southern Hemisphere

		#RSSOrigin2_Hidalgo_name = Hidalgo
		#RSSOrigin2_Hidalgo_desc = 944 Hidalgo is a centaur and unusual object on an eccentric, cometary-like orbit between the asteroid belt and the outer Solar System, approximately 52 kilometers (32 miles) in diameter. Discovered by German astronomer Walter Baade in 1920, it is the first member of the dynamical class of centaurs ever to be discovered. The dark D-type object has a rotation period of 10.1 hours and likely an elongated shape. It was named after Mexican revolutionary Miguel Hidalgo y Costilla.
		#RSSOrigin2_Hidalgo_Biome1 = Craters
		#RSSOrigin2_Hidalgo_Biome2 = Southern Polar Region
		#RSSOrigin2_Hidalgo_Biome3 = Northern Polar Region
		#RSSOrigin2_Hidalgo_Biome4 = Equatorial Bulge
		#RSSOrigin2_Hidalgo_Biome5 = Northern Hemisphere
		#RSSOrigin2_Hidalgo_Biome6 = Southern Hemisphere

		#RSSOrigin2_Gaspra_name = Gaspra
		#RSSOrigin2_Gaspra_desc = 951 Gaspra is an S-type asteroid that orbits very close to the inner edge of the asteroid belt. Gaspra was discovered by Russian astronomer G. N. Neujmin in 1916. Neujmin named it after Gaspra, a Black Sea retreat that was visited by his contemporaries, such as Gorky and Tolstoy. Gaspra was the first asteroid ever to be closely approached when it was visited by the Galileo spacecraft, which flew by on its way to Jupiter on 29 October 1991.
		#RSSOrigin2_Gaspra_Biome1 = Bulges
		#RSSOrigin2_Gaspra_Biome2 = Northern Hemisphere
		#RSSOrigin2_Gaspra_Biome3 = Southern Hemisphere

		#RSSOrigin2_Ganymed_name = Ganymed
		#RSSOrigin2_Ganymed_desc = 1036 Ganymed, provisional designation 1924 TD, is a stony asteroid on a highly eccentric orbit, classified as a near-Earth object of the Amor group. It was discovered by German astronomer Walter Baade at the Bergedorf Observatory in Hamburg on 23 October 1924, and named after Ganymede from Greek mythology. With a diameter of approximately 35 kilometers (22 miles), Ganymed is the largest of all near-Earth objects but does not cross Earth's orbit. The S-type asteroid has a rotation period of 10.3 hours. In October 2024, it is predicted to approach Earth at a distance of 56,000,000 km; 35,000,000 mi (0.374097 AU).
		#RSSOrigin2_Ganymed_Biome1 = Highlands
		#RSSOrigin2_Ganymed_Biome2 = Midlands
		#RSSOrigin2_Ganymed_Biome3 = Lowlands

		#RSSOrigin2_Atami_name = Atami
		#RSSOrigin2_Atami_desc = 1139 Atami, provisional designation 1929 XE, is a stony asteroid and sizable Mars-crosser, as well as a synchronous binary system near the innermost region of the asteroid belt, approximately 9 kilometers in diameter. It was discovered on 1 December 1929, by Japanese astronomers Okuro Oikawa and Kazuo Kubokawa at the Tokyo Astronomical Observatory (389) near Tokyo. It was named after the Japanese city of Atami. It has the lowest Minimum orbit intersection distance (MOID) to Mars of any asteroid as large as it, its orbit intersecting only 0.03 astronomical units from the planet.
		#RSSOrigin2_Atami_Biome1 = Highlands
		#RSSOrigin2_Atami_Biome2 = Midlands
		#RSSOrigin2_Atami_Biome3 = Lowlands

		#RSSOrigin2_S-2005_1139_1_name = S/2005 (1139) 1
		#RSSOrigin2_S-2005_1139_1_desc = Photometric and Arecibo echo spectra observations in 2005 confirmed a 5 kilometer satellite orbiting at least 15 kilometers from its primary. Due to the similar size of the primary and secondary the Minor Planet Center lists this as a binary companion.
		#RSSOrigin2_S-2005_1139_1_Biome1 = Highlands
		#RSSOrigin2_S-2005_1139_1_Biome2 = Midlands
		#RSSOrigin2_S-2005_1139_1_Biome3 = Lowlands

		#RSSOrigin2_Amor_name = Amor
		#RSSOrigin2_Amor_desc = 1221 Amor is an asteroid and near-Earth object on an eccentric orbit, approximately 1 kilometer (0.6 miles) in diameter. It is the namesake of the Amor asteroids, the second-largest subgroup of near-Earth objects. It was discovered by Eugène Delporte at the Uccle Observatory in 1932, the first time that an asteroid was seen to approach Earth so closely. The assumed S-type asteroid is one of few low-numbered asteroids for which no rotation period has been determined. It was assigned the provisional designation 1932 EA1 and named for Cupid, also known as "Amor" in Latin, the Roman equivalent of the Greek god Eros.
		#RSSOrigin2_Amor_Biome1 = Highlands
		#RSSOrigin2_Amor_Biome2 = Midlands
		#RSSOrigin2_Amor_Biome3 = Lowlands

		#RSSOrigin2_Icarus_name = Icarus
		#RSSOrigin2_Icarus_desc = 1566 Icarus (provisional designation: 1949 MA) is a large near-Earth object of the Apollo group and the lowest numbered potentially hazardous asteroid. It has is an extremely eccentric orbit (0.83) and measures approximately 1.4 km (0.87 mi) in diameter. In 1968, it became the first asteroid ever observed by radar. Its orbit brings it closer to the Sun than Mercury and further out than the orbit of Mars, which also makes it a Mercury-, Venus-, and Mars-crossing asteroid. This stony asteroid and relatively fast rotator with a period of 2.27 hours was discovered on 27 June 1949, by German astronomer Walter Baade at the Palomar Observatory in California. It was named after the mythological Icarus.
		#RSSOrigin2_Icarus_Biome1 = Highlands
		#RSSOrigin2_Icarus_Biome2 = Midlands
		#RSSOrigin2_Icarus_Biome3 = Lowlands

		#RSSOrigin2_Geographos_name = Geographos
		#RSSOrigin2_Geographos_desc = 1620 Geographos, provisional designation 1951 RA, is a highly elongated, stony asteroid, near-Earth object and potentially hazardous asteroid of the Apollo group, with a mean-diameter of approximately 2.5 km (1.6 mi). It was discovered on 14 September 1951, by astronomers Albert George Wilson and Rudolph Minkowski at the Palomar Observatory in California, United States. The asteroid was named in honor of the National Geographic Society.
		#RSSOrigin2_Geographos_Biome1 = Highlands
		#RSSOrigin2_Geographos_Biome2 = Midlands
		#RSSOrigin2_Geographos_Biome3 = Lowlands

		#RSSOrigin2_Suomi_name = Suomi
		#RSSOrigin2_Suomi_desc = 1656 Suomi is a binary Hungaria asteroid and sizable Mars-crosser from the innermost regions of the asteroid belt. It was discovered on 11 March 1942, by Finnish astronomer Yrjö Väisälä at Turku Observatory in Southwest Finland, who named it "Suomi", the native name of Finland. The stony asteroid has a short rotation period of 2.6 hours and measures approximately 7.9 kilometers in diameter. 
		#RSSOrigin2_Suomi_Biome1 = Highlands
		#RSSOrigin2_Suomi_Biome2 = Midlands
		#RSSOrigin2_Suomi_Biome3 = Lowlands

		#RSSOrigin2_S-2020_1656_1_name = S/2020 (1656) 1
		#RSSOrigin2_S-2020_1656_1_desc = In June 2020, a companion was discovered by Brian Warner, Robert Stephens and Alan Harris. The satellite measures more than 1.98 kilometers in diameter, about 26% of the primary, which it orbits once every 57.9 hours at an average distance of 30 kilometers.
		#RSSOrigin2_S-2020_1656_1_Biome1 = Highlands
		#RSSOrigin2_S-2020_1656_1_Biome2 = Midlands
		#RSSOrigin2_S-2020_1656_1_Biome3 = Lowlands

		#RSSOrigin2_Apollo_name = Apollo
		#RSSOrigin2_Apollo_desc = 1862 Apollo is a stony asteroid, approximately 1.5 kilometers in diameter, classified as a near-Earth object (NEO). It was discovered by German astronomer Karl Reinmuth at Heidelberg Observatory on 24 April 1932, but lost and not recovered until 1973.
		#RSSOrigin2_Apollo_Biome1 = Equatorial Ridge
		#RSSOrigin2_Apollo_Biome2 = Northern Hemisphere
		#RSSOrigin2_Apollo_Biome3 = Southern Hemisphere

		#RSSOrigin2_S-2005_1862_1_name = S/2005 (1862) 1
		#RSSOrigin2_S-2005_1862_1_desc = On November 4, 2005, it was announced that an asteroid moon, or satellite of Apollo, had been detected by radar observations from Arecibo Observatory, Puerto Rico, October 29 – November 2, 2005. The announcement is contained in the International Astronomical Union Circular (IAUC) 8627. The satellite is only 80 m (260 ft) across and orbits Apollo just 3 km (1.9 mi) away from the asteroid itself. From the surface of Apollo, S/2005 (1862) 1 would have an angular diameter of about 2.0835 degrees.
		#RSSOrigin2_S-2005_1862_1_Biome1 = Highlands
		#RSSOrigin2_S-2005_1862_1_Biome2 = Lowlands

		#RSSOrigin2_Daedalus_name = Daedalus
		#RSSOrigin2_Daedalus_desc = 1864 Daedalus, provisional designation 1971 FA, is a stony asteroid and near-Earth object of the Apollo group, approximately 3 kilometers in diameter. It was discovered on 24 March 1971, by Dutch–American astronomer Tom Gehrels at Palomar Observatory, California, and named after Daedalus from Greek mythology.
		#RSSOrigin2_Daedalus_Biome1 = Highlands
		#RSSOrigin2_Daedalus_Biome2 = Midlands
		#RSSOrigin2_Daedalus_Biome3 = Lowlands

		#RSSOrigin2_Chiron_name = Chiron
		#RSSOrigin2_Chiron_desc = 2060 Chiron is a small Solar System body in the outer Solar System, orbiting the Sun between Saturn and Uranus. Discovered in 1977 by Charles Kowal, it was the first-identified member of a new class of objects now known as centaurs—bodies orbiting between the asteroid belt and the Kuiper belt. Although it was initially called an asteroid and classified only as a minor planet with the designation "2060 Chiron", in 1989 it was found to exhibit behavior typical of a comet. Today it is classified as both a minor planet and a comet, and is accordingly also known by the cometary designation 95P/Chiron. Chiron is named after the centaur Chiron in Greek mythology.
		#RSSOrigin2_Chiron_Biome1 = Craters
		#RSSOrigin2_Chiron_Biome2 = Southern Polar Region
		#RSSOrigin2_Chiron_Biome3 = Northern Polar Region
		#RSSOrigin2_Chiron_Biome4 = Equatorial Bulge
		#RSSOrigin2_Chiron_Biome5 = Northern Hemisphere
		#RSSOrigin2_Chiron_Biome6 = Southern Hemisphere

		#RSSOrigin2_Aten_name = Aten
		#RSSOrigin2_Aten_desc = 2062 Aten, provisional designation 1976 AA, is a stony sub-kilometer asteroid and namesake of the Aten asteroids, a subgroup of near-Earth objects. The asteroid was named after Aten from Egyptian mythology.
		#RSSOrigin2_Aten_Biome1 = Highlands
		#RSSOrigin2_Aten_Biome2 = Midlands
		#RSSOrigin2_Aten_Biome3 = Lowlands

		#RSSOrigin2_Ra-Shalom_name = Ra-Shalom
		#RSSOrigin2_Ra-Shalom_desc = 2100 Ra-Shalom (prov. designation: 1978 RA) is an asteroid and near-Earth object of the Aten group on an eccentric orbit in the inner Solar System. It was discovered on 10 September 1978, by American astronomer Eleanor Helin at the Palomar Observatory, California, who named it in commemoration of the Camp David Peace Accords. The C-type asteroid (Xc, K) has a rotation period of 19.8 hours and measures approximately 2.7 kilometers (1.7 miles) in diameter.
		#RSSOrigin2_Ra-Shalom_Biome1 = Highlands
		#RSSOrigin2_Ra-Shalom_Biome2 = Midlands
		#RSSOrigin2_Ra-Shalom_Biome3 = Lowlands

		#RSSOrigin2_Litva_name = Litva
		#RSSOrigin2_Litva_desc = 2577 Litva, provisional designation 1975 EE3, is a Hungarian-type Mars-crosser and rare trinary asteroid from the inner regions of the asteroid belt, approximately 4 kilometers in diameter. It was discovered on 12 March 1975, by Soviet–Ukrainian astronomer Nikolai Chernykh at the Crimean Astrophysical Observatory in Nauchnyj, on the Crimean peninsula. It was named for the former Lithuanian Soviet Socialist Republic, which is now the nation of Lithuania.
		#RSSOrigin2_Litva_Biome1 = Highlands
		#RSSOrigin2_Litva_Biome2 = Midlands
		#RSSOrigin2_Litva_Biome3 = Lowlands

		#RSSOrigin2_S-2009_2577_1_name = S/2009 (2577) 1
		#RSSOrigin2_S-2009_2577_1_desc = In March 2009 the Central Bureau for Astronomical Telegrams announced the discovery of a moon orbiting the asteroid. The satellite measures about 1.4 kilometer in diameter and orbits Litva at distance of 21 kilometers, with an orbital period of 1 day, 11 hours, and 53 minutes.
		#RSSOrigin2_S-2009_2577_1_Biome1 = Highlands
		#RSSOrigin2_S-2009_2577_1_Biome2 = Midlands
		#RSSOrigin2_S-2009_2577_1_Biome3 = Lowlands

		#RSSOrigin2_S-2012_2577_1_name = S/2012 (2577) 1
		#RSSOrigin2_S-2012_2577_1_desc = In 2012, a second satellite orbiting at a distance of 378 kilometers, with a diameter of 1.2 kilometers, was discovered, with a orbitial period of 214 days. The discovery was announced in late 2013. This made 2577 Litva the 11th asteroid discovered to be in a trinary system.
		#RSSOrigin2_S-2012_2577_1_Biome1 = Highlands
		#RSSOrigin2_S-2012_2577_1_Biome2 = Midlands
		#RSSOrigin2_S-2012_2577_1_Biome3 = Lowlands

		#RSSOrigin2_Masursky_name = Masursky
		#RSSOrigin2_Masursky_desc = 2685 Masursky, provisional designation 1981 JN, is a stony Eunomian asteroid from the central regions of the asteroid belt, approximately 11 kilometers (6.8 miles) in diameter. It was discovered on 3 May 1981, by American astronomer Edward Bowell at the Anderson Mesa Station near Flagstaff, Arizona, and named after American planetary geologist Harold Masursky. In January 2000, the Cassini space probe observed the S-type asteroid from afar during its coast to Saturn.
		#RSSOrigin2_Masursky_Biome1 = Highlands
		#RSSOrigin2_Masursky_Biome2 = Midlands
		#RSSOrigin2_Masursky_Biome3 = Lowlands

		#RSSOrigin2_Steins_name = Šteins
		#RSSOrigin2_Steins_desc = 2867 Šteins (provisional designation 1969 VC) is an irregular, diamond-shaped background asteroid from the inner regions of the asteroid belt, approximately 5 kilometers (3.1 miles) in diameter. It was discovered on 4 November 1969 by Soviet astronomer Nikolai Chernykh at the Crimean Astrophysical Observatory in Nauchnij on the Crimean peninsula. In September 2008, ESA's spacecraft Rosetta flew by Šteins, making it one of few minor planets ever visited by a spacecraft. The bright e-type asteroid features 23 named craters and has a rotation period of 6.05 hours. It was named for Soviet Latvian astronomer Kārlis Šteins.
		#RSSOrigin2_Steins_Biome1 = Equatorial Bulges
		#RSSOrigin2_Steins_Biome2 = Northern Hemisphere
		#RSSOrigin2_Steins_Biome3 = Southern Hemisphere

		#RSSOrigin2_Florence_name = Florence
		#RSSOrigin2_Florence_desc = 3122 Florence is a stony triple asteroid of the Amor group. It is classified as a near-Earth object and potentially hazardous asteroid. It measures approximately 5 kilometers in diameter. It orbits the Sun at a distance of 1.0–2.5 AU once every 2 years and 4 months (859 days); the orbit has an eccentricity of 0.42 and an inclination of 22° with respect to the ecliptic. Florence has two moons. Florence was discovered on 2 March 1981 by American astronomer Schelte J. "Bobby" Bus at Siding Spring Observatory. Its provisional designation was 1981 ET3. It was named in honor of Florence Nightingale, the founder of modern nursing; the naming citation was published on 6 April 1993 (M.P.C. 21955). Florence is classified as a potentially hazardous object because its minimum orbit intersection distance (MOID ≤ 0.05 AU) indicates that it has the potential to make close approaches to the Earth, and because measurements of its absolute magnitude (H ≤ 22) suggest that it is large enough to create serious damage were it to impact.
		#RSSOrigin2_Florence_Biome1 = Highlands
		#RSSOrigin2_Florence_Biome2 = Midlands
		#RSSOrigin2_Florence_Biome3 = Lowlands

		#RSSOrigin2_S-2017_3122_1_name = S/2017 (3122) 1
		#RSSOrigin2_S-2017_3122_1_desc = Outer, larger moon of 3122 Florence
		#RSSOrigin2_S-2017_3122_1_Biome1 = Highlands
		#RSSOrigin2_S-2017_3122_1_Biome2 = Lowlands

		#RSSOrigin2_S-2017_3122_2_name = S/2017 (3122) 2
		#RSSOrigin2_S-2017_3122_2_desc = Inner, smaller moon of 3122 Florence.
		#RSSOrigin2_S-2017_3122_2_Biome1 = Highlands
		#RSSOrigin2_S-2017_3122_2_Biome2 = Lowlands

		#RSSOrigin2_Phaethon_name = Phaethon
		#RSSOrigin2_Phaethon_desc = 3200 Phaethon (previously sometimes spelled Phaeton), provisional designation 1983 TB, is an active Apollo asteroid with an orbit that brings it closer to the Sun than any other named asteroid (though there are numerous unnamed asteroids with smaller perihelia, such as (137924) 2000 BD19). For this reason, it was named after the Greek myth of Phaëthon, son of the sun god Helios. It is 5.8 km (3.6 mi) in diameter and is the parent body of the Geminids meteor shower of mid-December. With an observation arc of 35+ years, it has a very well determined orbit. The 2017 Earth approach distance of about 10 million km was known with an accuracy of ±700 m.
		#RSSOrigin2_Phaethon_Biome1 = Equatorial Ridge
		#RSSOrigin2_Phaethon_Biome2 = Northern Hemisphere
		#RSSOrigin2_Phaethon_Biome3 = Southern Hemisphere

		#RSSOrigin2_Eurybates_name = Eurybates
		#RSSOrigin2_Eurybates_desc = 3548 Eurybates is a carbonaceous Jupiter trojan from the Greek camp and the parent body of the Eurybates family, approximately 68 kilometers (42 miles) in diameter. It is a target to be visited by the Lucy mission in August 2027. Discovered during the second Palomar–Leiden Trojan survey in 1973, it was later named after Eurybates from Greek mythology. The C/P-type asteroid belongs to the 60 largest Jupiter trojans and has a rotation period of 8.7 hours. Eurybates has one known satellite, named Queta, that was discovered in images taken by the Hubble Space Telescope in September 2018.
		#RSSOrigin2_Eurybates_Biome1 = Craters
		#RSSOrigin2_Eurybates_Biome2 = Southern Polar Region
		#RSSOrigin2_Eurybates_Biome3 = Northern Polar Region
		#RSSOrigin2_Eurybates_Biome4 = Equatorial Bulge
		#RSSOrigin2_Eurybates_Biome5 = Northern Hemisphere
		#RSSOrigin2_Eurybates_Biome6 = Southern Hemisphere

		#RSSOrigin2_Queta_name = Queta
		#RSSOrigin2_Queta_desc = Eurybates has one known satellite, named Queta after Mexican Olympic athlete Enriqueta Basilio. Provisionally designated S/2018 (3548) 1, the satellite was discovered by Keith S. Noll and colleagues in images taken with the Hubble Space Telescope in September 2018. Subsequent follow-up observations later confirmed the satellite's existence, and the discovery was announced on 9 January 2020. The satellite was given the name Queta on 15 October 2020, in accordance with the International Astronomical Union's Olympic athlete naming convention for small Jupiter trojans (H > 12). In the naming citation, Enriqueta Basilio was recognized as the first woman torchbearer at the 1968 Summer Olympics, analogous to the role of heralds like Eurybates.
		#RSSOrigin2_Queta_Biome1 = Highlands
		#RSSOrigin2_Queta_Biome2 = Midlands
		#RSSOrigin2_Queta_Biome3 = Lowlands

		#RSSOrigin2_DonQuixote_name = Don Quixote
		#RSSOrigin2_DonQuixote_desc = 3552 Don Quixote, provisionally designated 1983 SA, is an exceptionally eccentric asteroid, classified as a near-Earth object of the Amor group, Mars-crosser and Jupiter-crosser, as well as a weakly active comet. Don Quixote is characterized as a dark D-type asteroid in the Tholen and SMASS taxonomy. It has a highly inclined comet-like orbit of 31 degrees that leads to frequent perturbations by Jupiter. Don Quixote measures 18.4 kilometres in diameter and has a rotation period of 7.7 hours. Due to its comet-like orbit and albedo, Don Quixote has been suspected to be an extinct comet. However, infrared observations with the Spitzer Space Telescope at 4.5 μm revealed a faint coma and tail around the object. The cometary activity is inferred by carbon dioxide (CO2) molecular band emission. In March 2018 a tail was observed at visible wavelengths for the first time. The observation of cometary features during two apparitions suggests that cometary activity is recurrent and Don Quixote is most likely a weakly active comet.
		#RSSOrigin2_DonQuixote_Biome1 = Highlands
		#RSSOrigin2_DonQuixote_Biome2 = Midlands
		#RSSOrigin2_DonQuixote_Biome3 = Lowlands

		#RSSOrigin2_Balam_name = Balam
		#RSSOrigin2_Balam_desc = 3749 Balam is a stony Flora asteroid and rare trinary system orbiting in the inner regions of asteroid belt. It also forms a secured asteroid pair with sub-kilometer sized asteroid (312497) 2009 BR60. Balam was discovered on 24 January 1982, by American astronomer Edward Bowell at Lowell's Anderson Mesa Station near Flagstaff, Arizona, and received the prov. designation 1982 BG1. It was named after Canadian astronomer David Balam. Balam measures approximately 4.1 kilometers (2.5 miles) in diameter.
		#RSSOrigin2_Balam_Biome1 = Highlands
		#RSSOrigin2_Balam_Biome2 = Midlands
		#RSSOrigin2_Balam_Biome3 = Lowlands

		#RSSOrigin2_S-2002_3749_1_name = S/2002 (3749) 1
		#RSSOrigin2_S-2002_3749_1_desc = On 13 February 2002, the discovery of a minor-planet moon, provisionally designated S/2002 (3749) 1, was announced by a team of researchers from SwRI, UA, JPL and OSUG, using the Gemini North Telescope on Mauna Kea in Hawaii. It has an estimated diameter of 1.84 kilometers. It orbits 289±13 km away in 61±10 days, with a high orbital eccentricity of ~ 0.9. The distant and highly eccentric orbit of S/2002 (3749) 1 suggests that it was likely captured by Balam.
		#RSSOrigin2_S-2002_3749_1_Biome1 = Highlands
		#RSSOrigin2_S-2002_3749_1_Biome2 = Midlands
		#RSSOrigin2_S-2002_3749_1_Biome3 = Lowlands

		#RSSOrigin2_S-2007_3749_1_name = S/2007 (3749) 1
		#RSSOrigin2_S-2007_3749_1_desc = In March 2008, Franck Marchis discovered another satellite from eclipses seen in Balam's light curve, making Balam a trinary asteroid. The inner satellite, which does not have a provisional designation, has a derived diameter of 1.66 kilometers, based on diameter-ratio of 0.42±0.03 with its primary.
		#RSSOrigin2_S-2007_3749_1_Biome1 = Highlands
		#RSSOrigin2_S-2007_3749_1_Biome2 = Midlands
		#RSSOrigin2_S-2007_3749_1_Biome3 = Lowlands

		#RSSOrigin2_Cruithne_name = Cruithne
		#RSSOrigin2_Cruithne_desc = 3753 Cruithne is a Q-type, Aten asteroid in orbit around the Sun in 1:1 orbital resonance with Earth, making it a co-orbital object. It is an asteroid that, relative to Earth, orbits the Sun in a bean-shaped orbit that effectively describes a horseshoe, and that can change into a quasi-satellite orbit. Cruithne does not orbit Earth and at times it is on the other side of the Sun, placing Cruithne well outside of Earth's Hill sphere. Its orbit takes it near the orbit of Mercury and outside the orbit of Mars. Cruithne orbits the Sun in about one Earth year, but it takes 770 years for the series to complete a horseshoe-shaped movement around Earth.
		#RSSOrigin2_Cruithne_Biome1 = Highlands
		#RSSOrigin2_Cruithne_Biome2 = Midlands
		#RSSOrigin2_Cruithne_Biome3 = Lowlands

		#RSSOrigin2_Toutatis_name = Toutatis
		#RSSOrigin2_Toutatis_desc = 4179 Toutatis, provisional designation 1989 AC, is an elongated, stony asteroid and slow rotator, classified as a near-Earth object and potentially hazardous asteroid of the Apollo asteroid and Alinda asteroid groups, approximately 2.5 kilometers in diameter. Discovered by French astronomer Christian Pollas at Caussols in 1989, the asteroid was named after Toutatis from Celtic mythology.
		#RSSOrigin2_Toutatis_Biome1 = Small Lobe
		#RSSOrigin2_Toutatis_Biome2 = Large Lobe
		#RSSOrigin2_Toutatis_Biome3 = Neck

		#RSSOrigin2_Heracles_name = Heracles
		#RSSOrigin2_Heracles_desc = 5143 Heracles(provisional designation 1991 VL) is a highly eccentric, rare-type asteroid and synchronous binary system, classified as near-Earth object of the Apollo group, approximately 4.8 kilometers in diameter. The asteroid was discovered on 7 November 1991, by American astronomer Carolyn Shoemaker at Palomar Observatory in California, United States. It is named for the Greek divine hero Heracles. It has an Earth minimum orbit intersection distance of 0.058 AU (8.7 million km) and is associated with the Beta Taurids daytime meteor shower.
		#RSSOrigin2_Heracles_Biome1 = Highlands
		#RSSOrigin2_Heracles_Biome2 = Midlands
		#RSSOrigin2_Heracles_Biome3 = Lowlands

		#RSSOrigin2_S-2011_5143_1_name = S/2011 (5143) 1
		#RSSOrigin2_S-2011_5143_1_desc = On 12 July 2012, it was announced that Heracles is an assumed synchronous binary asteroid with a minor-planet moon orbiting its primary in a retrograde motion approximately every 16 hours. The companion was discovered in December 2011, by a team of astronomers using radar observations from Arecibo Observatory in Puerto Rico, following months of intensive photometric lightcurve observations.
		#RSSOrigin2_S-2011_5143_1_Biome1 = Highlands
		#RSSOrigin2_S-2011_5143_1_Biome2 = Midlands
		#RSSOrigin2_S-2011_5143_1_Biome3 = Lowlands

		#RSSOrigin2_Pholus_name = Pholus
		#RSSOrigin2_Pholus_desc = 5145 Pholus is an eccentric centaur in the outer Solar System, approximately 180 kilometers (110 miles) in diameter, that crosses the orbit of both Saturn and Neptune. It was discovered on 9 January 1992 by American astronomer David Rabinowitz (uncredited) of UA's Spacewatch survey at the Kitt Peak National Observatory in Arizona, United States. The very reddish object has an elongated shape and a rotation period of 9.98 hours. It was named after the centaur Pholus from Greek mythology.
		#RSSOrigin2_Pholus_Biome1 = Craters
		#RSSOrigin2_Pholus_Biome2 = Southern Polar Region
		#RSSOrigin2_Pholus_Biome3 = Northern Polar Region
		#RSSOrigin2_Pholus_Biome4 = Equatorial Bulge
		#RSSOrigin2_Pholus_Biome5 = Northern Hemisphere
		#RSSOrigin2_Pholus_Biome6 = Southern Hemisphere

		#RSSOrigin2_Annefrank_name = Annefrank
		#RSSOrigin2_Annefrank_desc = 5535 Annefrank, provisional designation 1942 EM, is a stony Florian asteroid and suspected contact binary from the inner asteroid belt, approximately 4.5 kilometers in diameter. It was used as a target to practice the flyby technique that the Stardust space probe would later use on the comet Wild 2.
		#RSSOrigin2_Annefrank_Biome1 = Big Crater
		#RSSOrigin2_Annefrank_Biome2 = Highlands
		#RSSOrigin2_Annefrank_Biome3 = Lowlands

		#RSSOrigin2_Talos_name = Talos
		#RSSOrigin2_Talos_desc = 5786 Talos is an Apollo asteroid discovered on 3 September 1991 by R. H. McNaught at Siding Spring It has a very small perihelion distance; only two other named asteroids have one less than 0.2 AU, 1566 Icarus and 3200 Phaethon.
		#RSSOrigin2_Talos_Biome1 = Highlands
		#RSSOrigin2_Talos_Biome2 = Midlands
		#RSSOrigin2_Talos_Biome3 = Lowlands

		#RSSOrigin2_Braille_name = Braille
		#RSSOrigin2_Braille_desc = 9969 Braille, provisional designation 1992 KD, is an eccentric, rare-type and elongated asteroid from the innermost regions of the asteroid belt, classified as Mars-crosser and slow rotator, approximately 1–2 kilometers in diameter. It was discovered in 1992, by astronomers at Palomar observatory and later named after Louis Braille, the inventor of the writing system for the blind. It was photographed in closeup by the spacecraft Deep Space 1 in 1999, but a malfunction resulted in indistinct images.
		#RSSOrigin2_Braille_Biome1 = Long Ends
		#RSSOrigin2_Braille_Biome2 = Body

		#RSSOrigin2_Bro_name = Bro
		#RSSOrigin2_Bro_desc = bro
		#RSSOrigin2_Bro_Biome1 = Highlands
		#RSSOrigin2_Bro_Biome2 = Midlands
		#RSSOrigin2_Bro_Biome3 = Lowlands

		#RSSOrigin2_Chariklo_name = Chariklo
		#RSSOrigin2_Chariklo_desc = 10199 Chariklo is the largest confirmed centaur (small body of the outer Solar System). It orbits the Sun between Saturn and Uranus, grazing the orbit of Uranus. On 26 March 2014, astronomers announced the discovery of two rings (nicknamed as the rivers Oiapoque and Chuí) around Chariklo by observing a stellar occultation, making it the first minor planet known to have rings.
		#RSSOrigin2_Chariklo_Biome1 = Craters
		#RSSOrigin2_Chariklo_Biome2 = Southern Polar Region
		#RSSOrigin2_Chariklo_Biome3 = Northern Polar Region
		#RSSOrigin2_Chariklo_Biome4 = Equatorial Bulge
		#RSSOrigin2_Chariklo_Biome5 = Northern Hemisphere
		#RSSOrigin2_Chariklo_Biome6 = Southern Hemisphere

		#RSSOrigin2_Leucus_name = Leucus
		#RSSOrigin2_Leucus_desc = 11351 Leucus is a mid-sized Jupiter trojan from the Greek camp, approximately 40 kilometers (25 miles) in diameter. It is a target of the Lucy mission, scheduled for a fly by in April 2028. The assumed D-type asteroid is an exceptionally slow rotator with a rotation period of 466 hours. It was discovered on 12 October 1997 by the Beijing Schmidt CCD Asteroid Program (SCAP) at Xinglong Station in the Chinese province of Hebei, and later named after the Achaean warrior Leucus from Greek mythology.
		#RSSOrigin2_Leucus_Biome1 = Craters
		#RSSOrigin2_Leucus_Biome2 = Southern Polar Region
		#RSSOrigin2_Leucus_Biome3 = Northern Polar Region
		#RSSOrigin2_Leucus_Biome4 = Equatorial Bulge
		#RSSOrigin2_Leucus_Biome5 = Northern Hemisphere
		#RSSOrigin2_Leucus_Biome6 = Southern Hemisphere

		#RSSOrigin2_Polymele_name = Polymele
		#RSSOrigin2_Polymele_desc = 15094 Polymele is a primitive Jupiter trojan from the Greek camp, approximately 21 kilometers (13 miles) in diameter. It is a target of the Lucy mission with a close fly by planned to occur in September 2027. It was discovered on 17 November 1999, by astronomers with the Catalina Sky Survey at Mount Lemmon Observatory, Arizona, in the United States. The P-type asteroid has a rotation period of 5.9 hours and possibly a spherical shape. It was named after Polymele from Greek mythology, the wife of Menoetius and the mother of Patroclus. In 2022 it was reported to have a companion asteroid approximately 5 kilometers (3.1 miles) in diameter.
		#RSSOrigin2_Polymele_Biome1 = Craters
		#RSSOrigin2_Polymele_Biome2 = Southern Polar Region
		#RSSOrigin2_Polymele_Biome3 = Northern Polar Region
		#RSSOrigin2_Polymele_Biome4 = Equatorial Bulge
		#RSSOrigin2_Polymele_Biome5 = Northern Hemisphere
		#RSSOrigin2_Polymele_Biome6 = Southern Hemisphere

		#RSSOrigin2_S-2022_15094_1_name = Shaun
		#RSSOrigin2_S-2022_15094_1_desc = Following observations of an occultation on 26 March 2022, the Lucy mission team reported the discovery of a natural satellite around Polymele. The satellite is a smaller asteroid about 5–6 kilometers (3.1–3.7 miles) in diameter, orbiting nearly in the equatorial plane of Polymele at a distance of 204.4 ± 2.6 km (127.0 ± 1.6 mi). Assuming Polymele has a density of 0.7–1 g/cm3, the satellite should have an orbital period between 14.4 and 16.6 days. It will not be assigned a formal name until further observations determine its orbit. The Lucy team refers to the companion by the temporary informal name "Shaun," after Aardman Animations' animated sheep. The satellite was detected again in an occultation on 4 February 2023, in the largest organized occultation expedition in history. Nearly 200 astronomers across two continents participated in the campaign.
		#RSSOrigin2_S-2022_15094_1_Biome1 = Highlands
		#RSSOrigin2_S-2022_15094_1_Biome2 = Midlands
		#RSSOrigin2_S-2022_15094_1_Biome3 = Lowlands

		#RSSOrigin2_Arawn_name = Arawn
		#RSSOrigin2_Arawn_desc = 15810 Arawn (provisional designation 1994 JR1) is a trans-Neptunian object (TNO) from the inner regions of the Kuiper belt, approximately 133 kilometres (83 mi) in diameter. It belongs to the plutinos, the most populous class of resonant TNOs. It was named after Arawn, the ruler of the Otherworld in Welsh mythology, and was discovered on 12 May 1994, by astronomers Michael Irwin and Anna Żytkow with the 2.5-metre Isaac Newton Telescope at Roque de los Muchachos Observatory in the Canary Islands, Spain. Arawn is unusual in that it has been observed at a much closer distance than most Kuiper belt objects, by the New Horizons spacecraft, which imaged it from a distance of 111 million km (69 million mi; 0.74 AU) in April 2016; this and its other observations have allowed its rotation period to be determined.
		#RSSOrigin2_Arawn_Biome1 = Craters
		#RSSOrigin2_Arawn_Biome2 = Southern Hemisphere of Big Lobe
		#RSSOrigin2_Arawn_Biome3 = Northern Hemisphere of Big Lobe
		#RSSOrigin2_Arawn_Biome4 = Neck
		#RSSOrigin2_Arawn_Biome5 = Northern Hemisphere of Small Lobe
		#RSSOrigin2_Arawn_Biome6 = Southern Hemisphere of Small Lobe

		#RSSOrigin2_Chaos_name = Chaos
		#RSSOrigin2_Chaos_desc = 19521 Chaos (provisional designation 1998 WH24) is a cubewano, a Kuiper belt object not in resonance with any planet. Chaos was discovered in 1998 by the Deep Ecliptic Survey with Kitt Peak's 4 m telescope. Occultations suggest it is a compact or contact binary equivalent to a sphere 400 to 500 km in diameter. On 20 November 2020, Chaos occulted a magnitude 16.8 star. Three observers detected the occultation, finding that the object is likely smaller than 600 km in diameter. Another occultation was recorded on 14 January 2022; full results on size, shape, geometric albedo, and the spin-axis orientation have not been released. A further occultation occurred on 28 September 2023, with a shadow crossing most of North America. This occultation was observed by over 30 observers; preliminary analysis suggests that Chaos is a binary (possibly a contact binary).
		#RSSOrigin2_Chaos_Biome1 = Craters
		#RSSOrigin2_Chaos_Biome2 = Southern Hemisphere of Big Lobe
		#RSSOrigin2_Chaos_Biome3 = Northern Hemisphere of Big Lobe
		#RSSOrigin2_Chaos_Biome4 = Neck
		#RSSOrigin2_Chaos_Biome5 = Northern Hemisphere of Small Lobe
		#RSSOrigin2_Chaos_Biome6 = Southern Hemisphere of Small Lobe

		#RSSOrigin2_Varuna_name = Varuna
		#RSSOrigin2_Varuna_desc = 20000 Varuna (provisional designation 2000 WR106) is a large trans-Neptunian object in the Kuiper belt. It was discovered in November 2000 by American astronomer Robert McMillan during a Spacewatch survey at the Kitt Peak National Observatory. It is named after the Hindu deity Varuna, one of the oldest deities mentioned in the Vedic texts. Varuna's light curve is compatible with the body being a Jacobi ellipsoid, suggesting that it has an elongated shape due to its rapid rotation. Varuna's surface is moderately red in color due to the presence of complex organic compounds on its surface. Water ice is also present on its surface, and is thought to have been exposed by past collisions which may have also caused Varuna's rapid rotation. Although no natural satellites have been found or directly imaged around Varuna, analysis of variations in its light curve in 2019 suggests the presence of a possible satellite orbiting closely around Varuna.
		#RSSOrigin2_Varuna_Biome1 = Craters
		#RSSOrigin2_Varuna_Biome2 = Southern Polar Region
		#RSSOrigin2_Varuna_Biome3 = Northern Polar Region
		#RSSOrigin2_Varuna_Biome4 = Equatorial Bulge
		#RSSOrigin2_Varuna_Biome5 = Northern Hemisphere
		#RSSOrigin2_Varuna_Biome6 = Southern Hemisphere

		#RSSOrigin2_S-0000_20000_1_name = Varuna II
		#RSSOrigin2_S-0000_20000_1_desc = Photometric observations of Varuna's light curve, led by Valenzuela and colleagues in 2019, indicate that a possible satellite might be orbiting Varuna at a close distance. By using the Fourier analysis method of combining four separate light curves obtained in 2019, they derived a lower quality light curve amplitude with a greater amount of residuals. Their result indicated that Varuna's light curve experiences subtle changes over time. They plotted the residuals of the combined light curve in a Lomb periodogram and derived an orbital period of 11.9819 hours for the possible satellite. The satellite varies in brightness by 0.04 magnitudes as it orbits Varuna. Under the assumption that Varuna's density is 1.1 g/cm3 and the satellite is tidally locked, the team estimates that it orbits Varuna at a distance of 1,300–2,000 km (810–1,240 mi), just beyond the estimated Roche limit of Varuna (~1000 km). Due to the satellite's close proximity to Varuna, it is not yet possible to resolve it with space-based telescopes such as the Hubble Space Telescope as the angular distance between Varuna and the satellite is smaller than the resolution of current space-based telescopes. Although direct observations of Varuna's satellite are unfeasible with current telescopes, Varuna's equator is being directly viewed at an edge-on configuration, implying that mutual events between the satellite and Varuna could possibly occur in the future.
		#RSSOrigin2_S-0000_20000_1_Biome1 = Craters
		#RSSOrigin2_S-0000_20000_1_Biome2 = Southern Lowlands
		#RSSOrigin2_S-0000_20000_1_Biome3 = Northern Lowlands
		#RSSOrigin2_S-0000_20000_1_Biome4 = Equatorial Bulge
		#RSSOrigin2_S-0000_20000_1_Biome5 = Northern Hemisphere
		#RSSOrigin2_S-0000_20000_1_Biome6 = Southern Hemisphere

		#RSSOrigin2_Orus_name = Orus
		#RSSOrigin2_Orus_desc = 21900 Orus is a Jupiter trojan from the Greek camp, approximately 53 kilometers (33 miles) in diameter, and a target of the Lucy mission to be visited in November 2028. The dark Jovian asteroid belongs to the 100 largest Jupiter trojans and has a rotation period of 13.5 hours. It was discovered on 9 November 1999, by Japanese amateur astronomer Takao Kobayashi at his private Ōizumi Observatory in Gunma Prefecture, Japan, and later named Orus after a slain Achaean warrior from the Iliad.
		#RSSOrigin2_Orus_Biome1 = Craters
		#RSSOrigin2_Orus_Biome2 = Southern Polar Region
		#RSSOrigin2_Orus_Biome3 = Northern Polar Region
		#RSSOrigin2_Orus_Biome4 = Equatorial Bulge
		#RSSOrigin2_Orus_Biome5 = Northern Hemisphere
		#RSSOrigin2_Orus_Biome6 = Southern Hemisphere

		#RSSOrigin2_Itokawa_name = Itokawa
		#RSSOrigin2_Itokawa_desc = 25143 Itokawa (provisional designation 1998 SF36) is a sub-kilometer near-Earth object of the Apollo group and a potentially hazardous asteroid. It was discovered by the LINEAR program in 1998 and later named after Japanese rocket engineer Hideo Itokawa. The peanut-shaped S-type asteroid has a rotation period of 12.1 hours and measures approximately 330 meters (1,100 feet) in diameter. Due to its low density and high porosity, Itokawa is considered to be a rubble pile, consisting of numerous boulders of different sizes rather than of a single solid body.
		#RSSOrigin2_Itokawa_Biome1 = Large Lobe
		#RSSOrigin2_Itokawa_Biome2 = Small Lobe
		#RSSOrigin2_Itokawa_Biome3 = Neck

		#RSSOrigin2_Ixion_name = Ixion
		#RSSOrigin2_Ixion_desc = 28978 Ixion, provisional designation 2001 KX76) is a large trans-Neptunian object and a possible dwarf planet. It is located in the Kuiper belt, a region of icy objects orbiting beyond Neptune in the outer Solar System. Ixion is classified as a plutino, a dynamical class of objects in a 2:3 orbital resonance with Neptune. It was discovered in May 2001 by astronomers of the Deep Ecliptic Survey at the Cerro Tololo Inter-American Observatory, and was announced in July 2001. The object is named after the Greek mythological figure Ixion, who was a king of the Lapiths.
		#RSSOrigin2_Ixion_Biome1 = Craters
		#RSSOrigin2_Ixion_Biome2 = Southern Polar Region
		#RSSOrigin2_Ixion_Biome3 = Northern Polar Region
		#RSSOrigin2_Ixion_Biome4 = Equatorial Bulge
		#RSSOrigin2_Ixion_Biome5 = Northern Hemisphere
		#RSSOrigin2_Ixion_Biome6 = Southern Hemisphere

		#RSSOrigin2_Scottmanley_name = Scottmanley
		#RSSOrigin2_Scottmanley_desc = In recognition for his work as a popular science communicator, asteroid 33434 Scottmanley was named after him. The official naming citation was published by the Minor Planet Center on 18 May 2019 (M.P.C. 114954). The outer main-belt asteroid was discovered by astronomers with the OCA–DLR Asteroid Survey in 1999. It is a member of the stony Koronis family and measures approximately 4.6 kilometers in diameter.
		#RSSOrigin2_Scottmanley_Biome1 = Highlands
		#RSSOrigin2_Scottmanley_Biome2 = Midlands
		#RSSOrigin2_Scottmanley_Biome3 = Lowlands

		#RSSOrigin2_Huya_name = Huya
		#RSSOrigin2_Huya_desc = 38628 Huya; provisional designation 2000 EB173) is a binary trans-Neptunian object located in the Kuiper belt, a region of icy objects orbiting beyond Neptune in the outer Solar System. Huya is classified as a plutino, a dynamical class of trans-Neptunian objects with orbits in a 3:2 orbital resonance with Neptune. It was discovered by the Quasar Equatorial Survey Team and was identified by Venezuelan astronomer Ignacio Ferrín in March 2000. It is named after Juyá, the mythological rain god of the Wayuu people native to South America.
		#RSSOrigin2_Huya_Biome1 = Craters
		#RSSOrigin2_Huya_Biome2 = Southern Polar Region
		#RSSOrigin2_Huya_Biome3 = Northern Polar Region
		#RSSOrigin2_Huya_Biome4 = Equatorial Bulge
		#RSSOrigin2_Huya_Biome5 = Northern Hemisphere
		#RSSOrigin2_Huya_Biome6 = Southern Hemisphere

		#RSSOrigin2_S-2012_38628_1_name = S/2012 (38628) 1
		#RSSOrigin2_S-2012_38628_1_desc = S/2012 (38628) 1 is the provisional designation for the only known satellite of Huya. It was discovered by a team led by Keith Noll in Hubble Space Telescope observations obtained on 6 May 2012, and confirmed in reexamination of archival Hubble Space Telescope imagery from 30 June and 1 July 2002. The discovery was reported to the International Astronomical Union and was announced on 12 July 2012. Assuming the same albedo as Huya, the satellite is estimated to be about 213 km (132 mi) in diameter. From Hubble images of Huya, the satellite's separation distance from the primary is estimated to be at least 1,740 km (1,080 mi).
		#RSSOrigin2_S-2012_38628_1_Biome1 = Craters
		#RSSOrigin2_S-2012_38628_1_Biome2 = Southern Polar Region
		#RSSOrigin2_S-2012_38628_1_Biome3 = Northern Polar Region
		#RSSOrigin2_S-2012_38628_1_Biome4 = Equatorial Bulge
		#RSSOrigin2_S-2012_38628_1_Biome5 = Northern Hemisphere
		#RSSOrigin2_S-2012_38628_1_Biome6 = Southern Hemisphere

		#RSSOrigin2_Typhon_name = Typhon
		#RSSOrigin2_Typhon_desc = 42355 Typhon (provisional designation 2002 CR46) is a scattered disc object that was discovered on February 5, 2002, by the NEAT program. It measures 162±7 km in diameter, and is named after Typhon, a monster in Greek mythology. Typhon is the first known binary centaur, using an extended definition of a centaur as an object on a non-resonant (unstable) orbit with the perihelion inside the orbit of Neptune.
		#RSSOrigin2_Typhon_Biome1 = Craters
		#RSSOrigin2_Typhon_Biome2 = Southern Polar Region
		#RSSOrigin2_Typhon_Biome3 = Northern Polar Region
		#RSSOrigin2_Typhon_Biome4 = Equatorial Bulge
		#RSSOrigin2_Typhon_Biome5 = Northern Hemisphere
		#RSSOrigin2_Typhon_Biome6 = Southern Hemisphere

		#RSSOrigin2_Echidna_name = Echidna
		#RSSOrigin2_Echidna_desc = A large moon was identified in 2006. It is named Echidna (formal designation (42355) Typhon I), after the monstrous mate of Typhon. It orbits Typhon at the distance of 1628±29 km, completing one orbit in 18.9709±0.0064 days. Its diameter is estimated at 89±6 km. Echidna has the same color as Typhon.
		#RSSOrigin2_Echidna_Biome1 = Craters
		#RSSOrigin2_Echidna_Biome2 = Southern Polar Region
		#RSSOrigin2_Echidna_Biome3 = Northern Polar Region
		#RSSOrigin2_Echidna_Biome4 = Equatorial Bulge
		#RSSOrigin2_Echidna_Biome5 = Northern Hemisphere
		#RSSOrigin2_Echidna_Biome6 = Southern Hemisphere

		#RSSOrigin2_Lempo_name = Lempo
		#RSSOrigin2_Lempo_desc = 47171 Lempo, or as a binary (47171) Lempo–Hiisi (also known as 1999 TC36), is a trans-Neptunian object and trinary system from the Kuiper belt, located in the outermost regions of the Solar System. It was discovered on 1 October 1999, by American astronomers Eric Rubenstein and Louis-Gregory Strolger during an observing run at Kitt Peak National Observatory in Arizona, United States. Rubenstein was searching images taken by Strolger as part of their Nearby Galaxies Supernova Search project. It is classified as a plutino with a 2:3 mean-motion resonance with Neptune and is among the brighter TNOs. It reached perihelion in July 2015. This minor planet was named after Lempo from Finnish mythology.
		#RSSOrigin2_Lempo_Biome1 = Craters
		#RSSOrigin2_Lempo_Biome2 = Southern Lowlands
		#RSSOrigin2_Lempo_Biome3 = Northern Lowlands
		#RSSOrigin2_Lempo_Biome4 = Highlands
		#RSSOrigin2_Lempo_Biome5 = Northern Hemisphere
		#RSSOrigin2_Lempo_Biome6 = Southern Hemisphere

		#RSSOrigin2_Paha_name = Paha
		#RSSOrigin2_Paha_desc = Paha, officially designated (47171) Lempo I Paha, is the smaller, outer component of the Lempo triple system. It was discovered on 8 December 2001 by astronomers Chadwick Trujillo and Michael Brown using the Hubble Space Telescope's Space Telescope Imaging Spectrograph to survey for binary trans-Neptunian objects. The discovery was reported in an IAU Circular notice published by the International Astronomical Union 10 January 2002. The confirmation of Paha in archival 4 October 2001 observations from the Lick Observatory's Shane telescope adaptive optics system was reported in a follow-up IAU Circular published on 24 January 2002.
		#RSSOrigin2_Paha_Biome1 = Craters
		#RSSOrigin2_Paha_Biome2 = Southern Polar Region
		#RSSOrigin2_Paha_Biome3 = Northern Polar Region
		#RSSOrigin2_Paha_Biome4 = Equatorial Bulge
		#RSSOrigin2_Paha_Biome5 = Northern Hemisphere
		#RSSOrigin2_Paha_Biome6 = Southern Hemisphere

		#RSSOrigin2_Hiisi_name = Hiisi
		#RSSOrigin2_Hiisi_desc = Hiisi, officially designated (47171) Lempo II Hiisi, is the inner, second-largest component of the Lempo triple system, discovered last among the three. Together with the primary component Lempo, it forms the central binary Lempo–Hiisi which the outer component Paha revolves around. The existence of a third, inner component (or second companion) in the Lempo system was first hypothesized in 2006 by John Stansberry and collaborators, who noted that the primary seemed to have an unusually low density. Further evidence to the existence of an inner component was posited by Seth Jacobson and Jean-Luc Margot in October 2007, who noticed a distinct elongation of the primary in Hubble images. The binarity of the Lempo primary was eventually confirmed in a more extensive analysis of Hubble images by Susan Benecchi, Keith Noll, Will Grundy and Hal Levison in 2009.
		#RSSOrigin2_Hiisi_Biome1 = Craters
		#RSSOrigin2_Hiisi_Biome2 = Southern Lowlands
		#RSSOrigin2_Hiisi_Biome3 = Northern Lowlands
		#RSSOrigin2_Hiisi_Biome4 = Highlands
		#RSSOrigin2_Hiisi_Biome5 = Northern Hemisphere
		#RSSOrigin2_Hiisi_Biome6 = Southern Hemisphere

		#RSSOrigin2_Quaoar_name = Quaoar
		#RSSOrigin2_Quaoar_desc = Quaoar (50000 Quaoar), provisional designation 2002 LM60, is a dwarf planet in the Kuiper belt, a region of icy planetesimals beyond Neptune. A non-resonant object (cubewano), it measures approximately 1,121 km (697 mi) in diameter, about half the diameter of Pluto. The object was discovered by American astronomers Chad Trujillo and Michael Brown at the Palomar Observatory on 4 June 2002. Signs of water ice on the surface of Quaoar have been found, which suggests that cryovolcanism may be occurring on Quaoar. A small amount of methane is present on its surface, which can only be retained by the largest Kuiper belt objects. In February 2007, Weywot, a synchronous moon in orbit around Quaoar, was discovered by Brown. Weywot is measured to be 170 km (110 mi) across.
		#RSSOrigin2_Quaoar_Biome1 = Craters
		#RSSOrigin2_Quaoar_Biome2 = Ravines
		#RSSOrigin2_Quaoar_Biome3 = Northern Plateau
		#RSSOrigin2_Quaoar_Biome4 = Southern Plateau
		#RSSOrigin2_Quaoar_Biome5 = Northern Lowlands
		#RSSOrigin2_Quaoar_Biome6 = Southern Lowlands
		#RSSOrigin2_Quaoar_Biome7 = Equatorial Bulge

		#RSSOrigin2_Weywot_name = Weywot
		#RSSOrigin2_Weywot_desc = Weywot, officially (50000) Quaoar I Weywot, is the only known moon of the trans-Neptunian planetoid 50000 Quaoar. Discovered by Michael Brown and T.A. Suer using images acquired by the Hubble Space Telescope on 14 February 2006, its existence was announced in an IAU Circular notice published on 22 February 2007. Weywot has an estimated diameter of 170 km (110 mi) (approximately 15% of its primary). The satellite was found at 0.35 arcseconds from Quaoar with an apparent magnitude difference of 5.6.
		#RSSOrigin2_Weywot_Biome1 = Craters
		#RSSOrigin2_Weywot_Biome2 = Southern Polar Region
		#RSSOrigin2_Weywot_Biome3 = Northern Polar Region
		#RSSOrigin2_Weywot_Biome4 = Equatorial Bulge
		#RSSOrigin2_Weywot_Biome5 = Northern Hemisphere
		#RSSOrigin2_Weywot_Biome6 = Southern Hemisphere

		#RSSOrigin2_S-0000_50000_1_name = Quaoar II
		#RSSOrigin2_S-0000_50000_1_desc = A potential second moon of Quaoar was reported in 2025, when astronomers Richard Nolthenius and Kirk Bender each separately observed, from different telescopes at the same observatory, an unexpected 1.23-second-long occultation of a background star (UCAC4 376-136839) near Quaoar on 25 June 2025. This occultation did not match the times and locations predicted for Weywot and Quaoar's known rings, which suggests that it was either caused by a small, unknown moon or a dense ring arc around Quaoar. They argue that competing local causes for the occultation can be ruled out. Of the two possible options, an unknown moon is the most likely one. The putative second moon of Quaoar is estimated to be at least 30 km (19 mi) in diameter and 100 times less massive than Weywot. This would mean that this moon would appear extremely faint at an apparent magnitude of 28—practically impossible to detect with any available telescope including the James Webb Space Telescope. Only observations with stellar occultations and upcoming extremely large telescopes will be able to detect the second moon of Quaoar.
		#RSSOrigin2_S-0000_50000_1_Biome1 = Craters
		#RSSOrigin2_S-0000_50000_1_Biome2 = Southern Polar Region
		#RSSOrigin2_S-0000_50000_1_Biome3 = Northern Polar Region
		#RSSOrigin2_S-0000_50000_1_Biome4 = Equatorial Bulge
		#RSSOrigin2_S-0000_50000_1_Biome5 = Northern Hemisphere
		#RSSOrigin2_S-0000_50000_1_Biome6 = Southern Hemisphere

		#RSSOrigin2_Donaldjohanson_name = Donaldjohanson
		#RSSOrigin2_Donaldjohanson_desc = 52246 Donaldjohanson, provisional designation 1981 EQ5, is a carbonaceous Erigonian asteroid from the inner regions of the asteroid belt, approximately 4 kilometers (2.5 miles) in diameter. It was discovered on 2 March 1981, by American astronomer Schelte Bus at the Siding Spring Observatory in Australia. The C-type asteroid is a target of the Lucy mission and was aptly named after American paleoanthropologist Donald Johanson.
		#RSSOrigin2_Donaldjohanson_Biome1 = Lobe 1
		#RSSOrigin2_Donaldjohanson_Biome2 = Lobe 2
		#RSSOrigin2_Donaldjohanson_Biome3 = Neck

		#RSSOrigin2_YORP_name = YORP
		#RSSOrigin2_YORP_desc = 54509 YORP (provisional designation 2000 PH5) is an Earth co-orbital asteroid discovered on 3 August 2000 by the Lincoln Laboratory Near-Earth Asteroid Research (LINEAR) Team at Lincoln Laboratory Experimental Test Site in Socorro, New Mexico. Measurements of the rotation rate of this object provided the first observational evidence of the YORP effect, hence the name of the asteroid. The asteroid's rate of rotation is increasing at the rate of (2.0 ± 0.2) × 10−4 deg/day2 which between 2001 and 2005 caused the asteroid to rotate about 250° further than its spin rate in 2001 would have predicted. Simulations of the asteroid suggest that it may reach a rotation period of ~20 seconds near the end of its expected lifetime, which has a 75% probability of happening within the next 35 million years. The simulations also ruled out the possibility that close encounters with the Earth have been the cause of the increased spin rate.
		#RSSOrigin2_YORP_Biome1 = Highlands
		#RSSOrigin2_YORP_Biome2 = Midlands
		#RSSOrigin2_YORP_Biome3 = Lowlands

		#RSSOrigin2_Aya_name = Aya
		#RSSOrigin2_Aya_desc = 55565 Aya (provisional designation 2002 AW197) is a large trans-Neptunian object in the classical Kuiper belt. It was discovered on 10 January 2002 by astronomers at Palomar Observatory. Aya is a large object, most likely at least 700 km in diameter. It has a rotation period of 8.8 hours and has a moderately red color. The object's brightness does not significantly vary as it rotates, which indicates it is likely spheroidal.
		#RSSOrigin2_Aya_Biome1 = Craters
		#RSSOrigin2_Aya_Biome2 = Southern Polar Region
		#RSSOrigin2_Aya_Biome3 = Northern Polar Region
		#RSSOrigin2_Aya_Biome4 = Equatorial Bulge
		#RSSOrigin2_Aya_Biome5 = Northern Hemisphere
		#RSSOrigin2_Aya_Biome6 = Southern Hemisphere

		#RSSOrigin2_Uni_name = Uni
		#RSSOrigin2_Uni_desc = 55637 Uni (provisional designation 2002 UX25) is a large trans-Neptunian object that orbits the Sun in the Kuiper belt beyond Neptune. It briefly garnered scientific attention when it was found to have an unexpectedly low density of about 0.82 g/cm3. It was discovered on 30 October 2002, by the Spacewatch program. Uni has an absolute magnitude of about 4.0, and Spitzer Space Telescope results estimate it to be about 660 km in diameter. The low density of this and many other mid-sized TNOs implies that they have never compressed into fully solid bodies, let alone differentiated or collapsed into hydrostatic equilibrium, and so are not likely to be dwarf planets. Uni has one known moon, Tinia, discovered in 2005.
		#RSSOrigin2_Uni_Biome1 = Craters
		#RSSOrigin2_Uni_Biome2 = Southern Polar Region
		#RSSOrigin2_Uni_Biome3 = Northern Polar Region
		#RSSOrigin2_Uni_Biome4 = Equatorial Highlands
		#RSSOrigin2_Uni_Biome5 = Northern Hemisphere
		#RSSOrigin2_Uni_Biome6 = Southern Hemisphere

		#RSSOrigin2_Tinia_name = Tinia
		#RSSOrigin2_Tinia_desc = Tinia is the only known moon of the trans-Neptunian object 55637 Uni. Tinia was discovered in August 2005, by observations with the Hubble Space Telescope, and announced on 22 February 2007. It was named together with Uni on 1 September 2025 after Tinia, the Etruscan sky god and husband of the Etruscan goddess of love and fertility Uni. Tinia was discovered at 0.16 arcseconds from Uni with a difference in absolute magnitude of 2.5 Its diameter is estimated at 210±30 km. Assuming an albedo similar to its primary, Tinia should have a diameter of approximately 190 km; assuming an albedo of 0.05, typical of cool classical KBOs of similar size, it should have a diameter of approximately 260 km.
		#RSSOrigin2_Tinia_Biome1 = Craters
		#RSSOrigin2_Tinia_Biome2 = Southern Lowlands
		#RSSOrigin2_Tinia_Biome3 = Northern Lowlands
		#RSSOrigin2_Tinia_Biome4 = Equatorial Highlands
		#RSSOrigin2_Tinia_Biome5 = Northern Hemisphere
		#RSSOrigin2_Tinia_Biome6 = Southern Hemisphere

		#RSSOrigin2_Logos_name = Logos
		#RSSOrigin2_Logos_desc = 58534 Logos, or as a binary system (58534) Logos-Zoe, is a trans-Neptunian object and binary system from the classical Kuiper belt, approximately 77 kilometers (48 miles) in diameter. The bright cubewano belongs to the cold population and has a 66-kilometer sized companion named Zoe. The system mass is (4.58±0.07)×1017 kg. In the Gnostic tradition, Logos and Zoe are a paired emanation of the deity, and part of its creation myth.
		#RSSOrigin2_Logos_Biome1 = Craters
		#RSSOrigin2_Logos_Biome2 = Southern Hemisphere of Big Lobe
		#RSSOrigin2_Logos_Biome3 = Northern Hemisphere of Big Lobe
		#RSSOrigin2_Logos_Biome4 = Neck
		#RSSOrigin2_Logos_Biome5 = Northern Hemisphere of Small Lobe
		#RSSOrigin2_Logos_Biome6 = Southern Hemisphere of Small Lobe

		#RSSOrigin2_Zoe_name = Zoe
		#RSSOrigin2_Zoe_desc = Logos is a binary with the components of comparable size orbiting the barycentre on a moderately elliptical orbit. Logos was discovered on 4 February 1997, and its, companion, Zoe, was discovered on 17 November 2001 from Hubble Space Telescope observations by K. S. Noll, D. C. Stephens, W. M. Grundy, J. Spencer, Robert Millis, Marc Buie, Dale Cruikshank, S. C. Tegler, and W. Romanishin and announced on 11 February 2002. After the discovery, it received the provisional designation S/2001 (58534) 1. Once confirmed it was officially named (58534) Logos I Zoe. It orbits Logos with a semi-major axis of 8217 km in 309.9 days with an eccentricity of 0.546. Its estimated diameter is 66 km, and mass (0.15 ± 0.02)×1018 kg.
		#RSSOrigin2_Zoe_Biome1 = Craters
		#RSSOrigin2_Zoe_Biome2 = Southern Lowlands
		#RSSOrigin2_Zoe_Biome3 = Northern Lowlands
		#RSSOrigin2_Zoe_Biome4 = Equatorial Bulge
		#RSSOrigin2_Zoe_Biome5 = Northern Hemisphere
		#RSSOrigin2_Zoe_Biome6 = Southern Hemisphere

		#RSSOrigin2_Ceto_name = Ceto
		#RSSOrigin2_Ceto_desc = 65489 Ceto, as a binary also (65489) Ceto/Phorcys, is a binary trans-Neptunian object (TNO) discovered on March 22, 2003 by Chad A. Trujillo and Michael Brown at Palomar. It is named after the sea goddess Ceto from Greek mythology. It came to perihelion in 1989.
		#RSSOrigin2_Ceto_Biome1 = Craters
		#RSSOrigin2_Ceto_Biome2 = Southern Polar Region
		#RSSOrigin2_Ceto_Biome3 = Northern Polar Region
		#RSSOrigin2_Ceto_Biome4 = Equatorial Bulge
		#RSSOrigin2_Ceto_Biome5 = Northern Hemisphere
		#RSSOrigin2_Ceto_Biome6 = Southern Hemisphere

		#RSSOrigin2_Phorcys_name = Phorcys
		#RSSOrigin2_Phorcys_desc = Ceto's satellite was identified as a binary on April 11, 2006 by K. Noll, H. Levison, W. Grundy and D. Stephens using the Hubble Space Telescope; the object was named Phorcys, formally (65849) Ceto I Phorcys, after the Greek sea god. Using an extended definition of a centaur as an object on a non-resonant (unstable) orbit with its perihelion inside the orbit of Neptune, the Ceto system can be considered the second known binary centaur.
		#RSSOrigin2_Phorcys_Biome1 = Craters
		#RSSOrigin2_Phorcys_Biome2 = Southern Polar Region
		#RSSOrigin2_Phorcys_Biome3 = Northern Polar Region
		#RSSOrigin2_Phorcys_Biome4 = Equatorial Bulge
		#RSSOrigin2_Phorcys_Biome5 = Northern Hemisphere
		#RSSOrigin2_Phorcys_Biome6 = Southern Hemisphere

		#RSSOrigin2_Didymos_name = Didymos
		#RSSOrigin2_Didymos_desc = 65803 Didymos (provisional designation 1996 GT) is a sub-kilometer asteroid and binary system that is classified as a potentially hazardous asteroid and near-Earth object of the Apollo group. The asteroid was discovered in 1996 by the Spacewatch survey at Kitt Peak, and its small 160-meter minor-planet moon, named Dimorphos, was discovered in 2003. Due to its binary nature, the asteroid was then named Didymos, the Greek word for 'twin'.
		#RSSOrigin2_Didymos_Biome1 = Highlands
		#RSSOrigin2_Didymos_Biome2 = Midlands
		#RSSOrigin2_Didymos_Biome3 = Lowlands

		#RSSOrigin2_Dimorphos_name = Dimorphos
		#RSSOrigin2_Dimorphos_desc = Dimorphos (formal designation (65803) Didymos I; provisional designation S/2003 (65803) 1) is a natural satellite or moon of the near-Earth asteroid 65803 Didymos, with which it forms a binary system. The moon was discovered on 20 November 2003 by Petr Pravec in collaboration with other astronomers worldwide. Dimorphos has a diameter of 177 meters (581 ft) across its longest extent and it was the target of the Double Asteroid Redirection Test (DART), a NASA space mission that deliberately collided a spacecraft with the moon on 26 September 2022 to alter its orbit around Didymos. Before the impact by DART, Dimorphos had a shape of an oblate spheroid with a surface covered in boulders but virtually no craters. The moon is thought to have formed when Didymos shed its mass due to its rapid rotation, which formed an orbiting ring of debris that conglomerated into a low-density rubble pile that became Dimorphos today.
		#RSSOrigin2_Dimorphos_Biome1 = Highlands
		#RSSOrigin2_Dimorphos_Biome2 = Midlands
		#RSSOrigin2_Dimorphos_Biome3 = Lowlands

		#RSSOrigin2_Moshup_name = Moshup
		#RSSOrigin2_Moshup_desc = 66391 Moshup, provisional designation 1999 KW4, is a binary asteroid, classified as a near-Earth object and potentially hazardous asteroid of the Aten group, approximately 1.3 kilometers in diameter. It was discovered on 20 May 1999, by Lincoln Near-Earth Asteroid Research (LINEAR) at the Lincoln Laboratory's Experimental Test Site in Socorro, New Mexico, United States. It is a Mercury-crosser that comes extremely close to the Sun at a perihelion of 0.2 AU.
		#RSSOrigin2_Moshup_Biome1 = Highlands
		#RSSOrigin2_Moshup_Biome2 = Midlands
		#RSSOrigin2_Moshup_Biome3 = Lowlands

		#RSSOrigin2_Squannit_name = Squannit
		#RSSOrigin2_Squannit_desc = Moshup has a minor-planet moon orbiting it. The moon, named Squannit and designated S/2001 (66391) 1, is approximately 360 metres in diameter, and orbits its primary every 16 hours at a mean distance of 2.6 kilometers. The presence of a companion was suggested by photometric observations made by Pravec and Šarounová and was confirmed by radar observations from Arecibo, announced on 23 May 2001 (also see below). Based on radar imaging, Squannit's dimensions are estimated to be 595 × 450 × 343 meters.
		#RSSOrigin2_Squannit_Biome1 = Highlands
		#RSSOrigin2_Squannit_Biome2 = Midlands
		#RSSOrigin2_Squannit_Biome3 = Lowlands

		#RSSOrigin2_Sedna_name = Sedna
		#RSSOrigin2_Sedna_desc = Sedna (minor-planet designation 90377 Sedna) is a dwarf planet in the outer reaches of the Solar System that is in the innermost part of its orbit; as of 2022 it is 84 astronomical units (1.26×1010 km; 0.00041 pc) from the Sun, almost three times farther than Neptune. Spectroscopy has revealed that Sedna's surface composition is similar to those of some other trans-Neptunian objects, being largely a mixture of water, methane, and nitrogen ices with tholins. Its surface is one of the reddest among Solar System objects. To within estimated uncertainties, Sedna is tied with Ceres as the largest planetoid not known to have a moon.
		#RSSOrigin2_Sedna_Biome1 = Gigantic Crater
		#RSSOrigin2_Sedna_Biome2 = Craters
		#RSSOrigin2_Sedna_Biome3 = Cracks
		#RSSOrigin2_Sedna_Biome4 = Scattered Lowlands
		#RSSOrigin2_Sedna_Biome5 = Northern Hemisphere
		#RSSOrigin2_Sedna_Biome6 = Southern Hemisphere
		#RSSOrigin2_Sedna_Biome7 = Equatorial Bulge

		#RSSOrigin2_Orcus_name = Orcus
		#RSSOrigin2_Orcus_desc = Orcus (90482 Orcus, provisional designation 2004 DW) is a trans-Neptunian dwarf planet with a large moon, Vanth. It has a diameter of 910 km (570 mi). The surface of Orcus is relatively bright with albedo reaching 23 percent, neutral in color and rich in water ice. The ice is predominantly in crystalline form, which may be related to past cryovolcanic activity. Other compounds like methane or ammonia may also be present on its surface. Orcus was discovered by American astronomers Michael Brown, Chad Trujillo, and David Rabinowitz on 17 February 2004.
		#RSSOrigin2_Orcus_Biome1 = Craters
		#RSSOrigin2_Orcus_Biome2 = Mountains
		#RSSOrigin2_Orcus_Biome3 = Northern Midlands
		#RSSOrigin2_Orcus_Biome4 = Southern Midlands
		#RSSOrigin2_Orcus_Biome5 = Northern Lowlands
		#RSSOrigin2_Orcus_Biome6 = Southern Lowlands
		#RSSOrigin2_Orcus_Biome7 = Equatorial Bulge

		#RSSOrigin2_Vanth_name = Vanth
		#RSSOrigin2_Vanth_desc = Vanth, full designation (90482) Orcus I Vanth, is the single known natural satellite of the plutino and likely dwarf planet 90482 Orcus. With a diameter of about 440 km, it is half the size of Orcus and probably the third-largest known moon of a known trans-Neptunian object, after Pluto I Charon and Eris I Dysnomia, though it is possible that the poorly resolved Varda I Ilmarë or Haumea I Hiʻiaka might be comparable in size. Vanth was discovered by Michael Brown and T.-A. Suer using discovery images taken by the Hubble Space Telescope on 13 November 2005. The discovery was announced in an IAU Circular notice published on 22 February 2007.
		#RSSOrigin2_Vanth_Biome1 = Craters
		#RSSOrigin2_Vanth_Biome2 = Southern Lowlands
		#RSSOrigin2_Vanth_Biome3 = Northern Lowlands
		#RSSOrigin2_Vanth_Biome4 = Highlands
		#RSSOrigin2_Vanth_Biome5 = Northern Hemisphere
		#RSSOrigin2_Vanth_Biome6 = Southern Hemisphere

		#RSSOrigin2_2002GZ32_name = 2002 GZ32
		#RSSOrigin2_2002GZ32_desc = (95626) 2002 GZ32 (provisional designation 2002 GZ32) is a centaur orbiting the Sun between Saturn and Neptune in the outer Solar System. It is one of the largest known centaurs, having a highly elongated shape that spans 366 km (227 mi) across its longest width to 120 km (75 mi) across its shortest. The object was discovered on 13 April 2002 by astronomers at Mauna Kea Observatory in Hawaiʻi. Due to 2002 GZ32's highly elongated shape, its apparent brightness oscillates as it rotates every 5.8 hours. 2002 GZ32 has a dark gray surface that potentially contains water ice. It was the third centaur whose stellar occultation has been simultaneously observed by multiple people, after 10199 Chariklo and 2060 Chiron.
		#RSSOrigin2_2002GZ32_Biome1 = Craters
		#RSSOrigin2_2002GZ32_Biome2 = Southern Polar Region
		#RSSOrigin2_2002GZ32_Biome3 = Northern Polar Region
		#RSSOrigin2_2002GZ32_Biome4 = Equatorial Bulge
		#RSSOrigin2_2002GZ32_Biome5 = Northern Hemisphere
		#RSSOrigin2_2002GZ32_Biome6 = Southern Hemisphere

		#RSSOrigin2_Apophis_name = Apophis
		#RSSOrigin2_Apophis_desc = 99942 Apophis is a near-Earth asteroid and potentially hazardous asteroid with a diameter of 370 metres (1,210 feet) that caused a brief period of concern in December 2004 when initial observations indicated a probability up to 2.7% that it would hit Earth on April 13, 2029. Additional observations provided improved predictions that eliminated the possibility of an impact on Earth in 2029. Until 2006, a small probability nevertheless remained that, during its 2029 close encounter with Earth, Apophis would pass through a gravitational keyhole of no more than about 800 metres (1⁄2 mi) in diameter, which would have set up a future impact exactly seven years later on April 13, 2036. This possibility kept it at Level 1 on the Torino impact hazard scale until August 2006, when the probability that Apophis would pass through the keyhole was determined to be very small and Apophis' rating on the Torino scale was lowered to zero.
		#RSSOrigin2_Apophis_Biome1 = Highlands
		#RSSOrigin2_Apophis_Biome2 = Midlands
		#RSSOrigin2_Apophis_Biome3 = Lowlands

		#RSSOrigin2_Bennu_name = Bennu
		#RSSOrigin2_Bennu_desc = 101955 Bennu (provisional designation 1999 RQ36) is a carbonaceous asteroid in the Apollo group discovered by the LINEAR Project on 11 September 1999. It is a potentially hazardous object that is listed on the Sentry Risk Table and tied for the highest cumulative rating on the Palermo Technical Impact Hazard Scale. It has a cumulative 1-in-1,800 chance of impacting Earth between 2178 and 2290 with the greatest risk being on 24 September 2182. It is named after the Bennu, the ancient Egyptian mythological bird associated with the Sun, creation, and rebirth.
		#RSSOrigin2_Bennu_Biome1 = Equatorial Ridge
		#RSSOrigin2_Bennu_Biome2 = Northern Hemisphere
		#RSSOrigin2_Bennu_Biome3 = Southern Hemisphere

		#RSSOrigin2_Salacia_name = Salacia
		#RSSOrigin2_Salacia_desc = Salacia (minor-planet designation: 120347 Salacia) is a large trans-Neptunian object in the Kuiper belt, approximately 850 km (530 mi) in diameter. It was discovered on 22 September 2004, by American astronomers Henry Roe, Michael Brown and Kristina Barkume at the Palomar Observatory in California, United States. Salacia orbits the Sun at an average distance that is slightly greater than that of Pluto. It was named after the Roman goddess Salacia and has a single known moon, Actaea.
		#RSSOrigin2_Salacia_Biome1 = Craters
		#RSSOrigin2_Salacia_Biome2 = Southern Polar Region
		#RSSOrigin2_Salacia_Biome3 = Northern Polar Region
		#RSSOrigin2_Salacia_Biome4 = Equatorial Bulge
		#RSSOrigin2_Salacia_Biome5 = Northern Hemisphere
		#RSSOrigin2_Salacia_Biome6 = Southern Hemisphere

		#RSSOrigin2_Actaea_name = Actaea
		#RSSOrigin2_Actaea_desc = Actaea, officially (120347) Salacia I Actaea, is a natural satellite of the classical Kuiper belt planetoid 120347 Salacia. Its diameter is estimated 300 km (190 mi), which is approximately one-third the diameter of Salacia; thus, Salacia and Actaea are viewed by William Grundy et al. to be a binary system. Assuming that the following size estimates are correct, Actaea is about the sixth-biggest known moon of a trans-Neptunian object, after Charon (1212 km), Dysnomia (700 km), Vanth (443 km), Ilmarë (326 km) and Hiʻiaka (320 km), but possibly also Hiisi (250 km).
		#RSSOrigin2_Actaea_Biome1 = Craters
		#RSSOrigin2_Actaea_Biome2 = Southern Polar Region
		#RSSOrigin2_Actaea_Biome3 = Northern Polar Region
		#RSSOrigin2_Actaea_Biome4 = Equatorial Bulge
		#RSSOrigin2_Actaea_Biome5 = Northern Hemisphere
		#RSSOrigin2_Actaea_Biome6 = Southern Hemisphere

		#RSSOrigin2_APL_name = APL
		#RSSOrigin2_APL_desc = 132524 APL, provisional designation 2002 JF56, is a small background asteroid in the intermediate asteroid belt. It was discovered by LINEAR in May 2002, and imaged by the New Horizons space probe on its flyby in June 2006, when it was passing through the asteroid belt. The stony S-type asteroid measures approximately 2.5 kilometers (1.6 miles) in diameter.
		#RSSOrigin2_APL_Biome1 = Highlands
		#RSSOrigin2_APL_Biome2 = Midlands
		#RSSOrigin2_APL_Biome3 = Lowlands

		#RSSOrigin2_Nix_name = Nix
		#RSSOrigin2_Nix_desc = Nix is a natural satellite of Pluto, with a diameter of 49.8 km (30.9 mi) across its longest dimension. It was discovered along with Pluto's outermost moon Hydra on 15 May 2005 by astronomers using the Hubble Space Telescope, and was named after Nyx, the Greek goddess of the night. Nix is the third moon of Pluto by distance, orbiting between the moons Styx and Kerberos.
		#RSSOrigin2_Nix_Biome1 = High Lands
		#RSSOrigin2_Nix_Biome2 = Mid Lands
		#RSSOrigin2_Nix_Biome3 = Low Lands

		#RSSOrigin2_Hydra_name = Hydra
		#RSSOrigin2_Hydra_desc = Hydra is a natural satellite of Pluto, with a diameter of approximately 51 km (32 mi) across its longest dimension. It is the second-largest moon of Pluto, being slightly larger than Nix. Hydra was discovered along with Nix by astronomers using the Hubble Space Telescope on 15 May 2005, and was named after the Hydra, the nine-headed underworld serpent in Greek mythology. By distance, Hydra is the fifth and outermost moon of Pluto, orbiting beyond Pluto's fourth moon Kerberos.
		#RSSOrigin2_Hydra_Biome1 = High Lands
		#RSSOrigin2_Hydra_Biome2 = Mid Lands
		#RSSOrigin2_Hydra_Biome3 = Low Lands

		#RSSOrigin2_Kerberos_name = Kerberos
		#RSSOrigin2_Kerberos_desc = Kerberos is a small natural satellite of Pluto, about 19 km (12 mi) in its longest dimension. It was the fourth moon of Pluto to be discovered and its existence was announced on 20 July 2011. It was imaged, along with Pluto and its four other moons, by the New Horizons spacecraft in July 2015. The first image of Kerberos from the flyby was released to the public on 22 October 2015.
		#RSSOrigin2_Kerberos_Biome1 = Lobes
		#RSSOrigin2_Kerberos_Biome2 = Neck

		#RSSOrigin2_Styx_name = Styx
		#RSSOrigin2_Styx_desc = Styx is a small natural satellite of Pluto whose discovery was announced on 11 July 2012. It was discovered by use of the Hubble Space Telescope. As of 2022, it is the smallest known moon of Pluto. It was imaged along with Pluto and Pluto's other moons by the New Horizons spacecraft in July 2015, albeit poorly with only a single image of Styx obtained. Styx is the second-closest known satellite to Pluto, and the fifth discovered. It was discovered one year after Kerberos. Styx is approximately 16 km (9.9 mi) across its longest dimension, and its orbital period is 20.1 days.
		#RSSOrigin2_Styx_Biome1 = High Regions
		#RSSOrigin2_Styx_Biome2 = Low Regions

		#RSSOrigin2_Haumea_name = Haumea
		#RSSOrigin2_Haumea_desc = Haumea (minor-planet designation 136108 Haumea) is a dwarf planet located beyond Neptune's orbit. It was discovered in 2004 by a team headed by Mike Brown of Caltech at the Palomar Observatory in the United States and disputably also in 2005 by a team headed by José Luis Ortiz Moreno at the Sierra Nevada Observatory in Spain, though the latter claim has been contested. On September 17, 2008, it was named after Haumea, the Hawaiian goddess of childbirth, under the expectation by the International Astronomical Union (IAU) that it would prove to be a dwarf planet. Nominal estimates make it the third-largest known trans-Neptunian object, after Eris and Pluto, though the uncertainty in best-fit modeling slightly overlaps with the larger size estimates for Makemake.
		#RSSOrigin2_Haumea_Biome1 = Red Spot Regions
		#RSSOrigin2_Haumea_Biome2 = Chasmata
		#RSSOrigin2_Haumea_Biome3 = Craters
		#RSSOrigin2_Haumea_Biome4 = Equatorial High
		#RSSOrigin2_Haumea_Biome5 = Northern Hemisphere
		#RSSOrigin2_Haumea_Biome6 = Southern Hemisphere
		#RSSOrigin2_Haumea_Biome7 = North Polar Region
		#RSSOrigin2_Haumea_Biome7 = South Polar Region

		#RSSOrigin2_Hi'iaka_name = Hiʻiaka
		#RSSOrigin2_Hi'iaka_desc = Hiʻiaka is the larger, outer moon of the trans-Neptunian dwarf planet Haumea. It is named after one of the daughters of Haumea, Hiʻiaka, the patron goddess of the Big Island of Hawaii. It orbits once every 49.12±0.03 d at a distance of 49880±198 km, with an eccentricity of 0.0513±0.0078 and an inclination of 126.356±0.064°. Assuming its estimated diameter of over 300 km is accurate, it may be the fourth- or fifth-largest known moon of a Trans-Neptunian object, after Pluto I Charon, Eris I Dysnomia, Orcus I Vanth, and possibly Varda I Ilmarë and Salacia I Actaea.
		#RSSOrigin2_Hi'iaka_Biome1 = Craters
		#RSSOrigin2_Hi'iaka_Biome2 = Southern Polar Region
		#RSSOrigin2_Hi'iaka_Biome3 = Northern Polar Region
		#RSSOrigin2_Hi'iaka_Biome4 = Equatorial Bulge
		#RSSOrigin2_Hi'iaka_Biome5 = Northern Hemisphere
		#RSSOrigin2_Hi'iaka_Biome6 = Southern Hemisphere

		#RSSOrigin2_Namaka_name = Namaka
		#RSSOrigin2_Namaka_desc = Namaka is the smaller, inner moon of the trans-Neptunian dwarf planet Haumea. It is named after Nāmaka, the goddess of the sea in Hawaiian mythology and one of the daughters of Haumea.
		#RSSOrigin2_Namaka_Biome1 = Craters
		#RSSOrigin2_Namaka_Biome2 = Southern Polar Region
		#RSSOrigin2_Namaka_Biome3 = Northern Polar Region
		#RSSOrigin2_Namaka_Biome4 = Equatorial Bulge
		#RSSOrigin2_Namaka_Biome5 = Northern Hemisphere
		#RSSOrigin2_Namaka_Biome6 = Southern Hemisphere

		#RSSOrigin2_Eris_name = Eris
		#RSSOrigin2_Eris_desc = Eris (minor-planet designation 136199 Eris) is the most massive and second-largest known dwarf planet in the Solar System. It is a trans-Neptunian object (TNO) in the scattered disk and has a high-eccentricity orbit. Eris was discovered in January 2005 by a Palomar Observatory–based team led by Mike Brown and verified later that year. In September 2006, it was named after the Greco–Roman goddess of strife and discord. Eris is the ninth-most massive known object orbiting the Sun and the sixteenth-most massive overall in the Solar System (counting moons). It is also the largest object that has not been visited by a spacecraft. Eris has been measured at 2,326 ± 12 kilometers (1,445 ± 7 mi) in diameter; its mass is 0.28% that of the Earth and 27% greater than that of Pluto, although Pluto is slightly larger by volume.
		#RSSOrigin2_Eris_Biome1 = Craters
		#RSSOrigin2_Eris_Biome2 = Glacier Planitia
		#RSSOrigin2_Eris_Biome3 = Dunes
		#RSSOrigin2_Eris_Biome4 = Mountains
		#RSSOrigin2_Eris_Biome5 = Badlands
		#RSSOrigin2_Eris_Biome6 = Chasmata
		#RSSOrigin2_Eris_Biome7 = Shield Cryovolcano
		#RSSOrigin2_Eris_Biome8 = Polygon Mountains
		#RSSOrigin2_Eris_Biome9 = Flatlands

		#RSSOrigin2_Dysnomia_name = Dysnomia
		#RSSOrigin2_Dysnomia_desc = Dysnomia (formally (136199) Eris I Dysnomia) is the only known moon of the dwarf planet Eris and likely the second-largest known moon of a dwarf planet, after Pluto I Charon. It was discovered in 2005 by Mike Brown and the laser guide star adaptive optics team at the W. M. Keck Observatory, and carried the provisional designation of S/2005 (2003 UB313) 1 until officially named Dysnomia (from the Ancient Greek word Δυσνομία meaning anarchy/lawlessness) after the daughter of the Greek goddess Eris.
		#RSSOrigin2_Dysnomia_Biome1 = Craters
		#RSSOrigin2_Dysnomia_Biome2 = Southern Lowlands
		#RSSOrigin2_Dysnomia_Biome3 = Northern Lowlands
		#RSSOrigin2_Dysnomia_Biome4 = Highlands
		#RSSOrigin2_Dysnomia_Biome5 = Northern Hemisphere
		#RSSOrigin2_Dysnomia_Biome6 = Southern Hemisphere

		#RSSOrigin2_Makemake_name = Makemake
		#RSSOrigin2_Makemake_desc = Makemake (minor-planet designation 136472 Makemake) is a dwarf planet and – depending on how they are defined – the second-largest Kuiper belt object in the classical population, with a diameter approximately 60% that of Pluto. It has one known satellite. Its extremely low average temperature, about 40 K (−230 °C), means its surface is covered with methane, ethane, and possibly nitrogen ices.
		#RSSOrigin2_Makemake_Biome1 = Craters
		#RSSOrigin2_Makemake_Biome2 = Giant Shield Cryovolcano
		#RSSOrigin2_Makemake_Biome3 = Valleys
		#RSSOrigin2_Makemake_Biome4 = Mountains
		#RSSOrigin2_Makemake_Biome5 = Northern Hemisphere Plateau
		#RSSOrigin2_Makemake_Biome6 = Southern Hemisphere Lowlands
		#RSSOrigin2_Makemake_Biome7 = Parallel Equatorial Toothed Ridges

		#RSSOrigin2_S-2015_136472_1_name = MK2
		#RSSOrigin2_S-2015_136472_1_desc = S/2015 (136472) 1, nicknamed MK2 by the discovery team, is the only known moon of the trans-Neptunian dwarf planet Makemake. It is estimated to be 175 km (110 mi) in diameter (for an assumed albedo of 4%) and has a semi-major axis at least 21,000 km (13,000 mi) from Makemake. Its orbital period is ≥ 12 days (the minimum values are those for a circular orbit; the actual orbital eccentricity is unknown). Observations leading to its discovery occurred in April 2015, using the Hubble Space Telescope's Wide Field Camera 3, and its discovery was announced on 26 April 2016.
		#RSSOrigin2_S-2015_136472_1_Biome1 = Craters
		#RSSOrigin2_S-2015_136472_1_Biome2 = Southern Polar Region
		#RSSOrigin2_S-2015_136472_1_Biome3 = Northern Polar Region
		#RSSOrigin2_S-2015_136472_1_Biome4 = Equatorial Bulge
		#RSSOrigin2_S-2015_136472_1_Biome5 = Northern Hemisphere
		#RSSOrigin2_S-2015_136472_1_Biome6 = Southern Hemisphere

		#RSSOrigin2_1994CC_name = 1994 CC
		#RSSOrigin2_1994CC_desc = (136617) 1994 CC is a sub-kilometer triple asteroid, classified as a near-Earth object and potentially hazardous asteroid of the Apollo group. 1994 CC consists of a central object about 700 meters in diameter that has two moons revolving around it. Scientists' preliminary analysis of the system suggests that the moons are at least 50 meters in diameter. In a similar study, the radar observations at Arecibo Observatory in Puerto Rico, led by the Mike Nolan, also confirmed the detection of all three objects. The scientists plan to use the combined observations from the Goldstone and Arecibo observatories to study 1994 CC's orbital and physical properties further.
		#RSSOrigin2_1994CC_Biome1 = Highlands
		#RSSOrigin2_1994CC_Biome2 = Midlands
		#RSSOrigin2_1994CC_Biome3 = Lowlands

		#RSSOrigin2_S-2009_136617_1_name = Beta (1994 CC)
		#RSSOrigin2_S-2009_136617_1_desc = Nickname Beta, inner, larger moon of (136617) 1994 CC
		#RSSOrigin2_S-2009_136617_1_Biome1 = Highlands
		#RSSOrigin2_S-2009_136617_1_Biome2 = Lowlands

		#RSSOrigin2_S-2009_136617_2_name = Gamma (1994 CC)
		#RSSOrigin2_S-2009_136617_2_desc = Nickname Gamma, outer, smaller moon of (136617) 1994 CC
		#RSSOrigin2_S-2009_136617_2_Biome1 = Highlands
		#RSSOrigin2_S-2009_136617_2_Biome2 = Lowlands

		#RSSOrigin2_Dinkinesh_name = Dinkinesh
		#RSSOrigin2_Dinkinesh_desc = 152830 Dinkinesh (provisional designation 1999 VD57) is a binary main-belt asteroid about 790 meters (2,600 feet) in diameter. It was discovered by the Lincoln Near-Earth Asteroid Research (LINEAR) survey at Socorro, New Mexico on 4 November 1999. Dinkinesh, the name borrowed from an Ethiopian word for the Lucy fossil, was the first flyby target of NASA's Lucy mission, which approached 425 km (264 mi) from the asteroid on 1 November 2023. During the flyby, the Lucy spacecraft discovered that Dinkinesh has a contact-binary natural satellite, named Selam, which is 220 meters (720 ft) in diameter. Dinkinesh is the smallest main-belt asteroid explored by spacecraft yet, though some smaller near-Earth asteroids have also been explored.
		#RSSOrigin2_Dinkinesh_Biome1 = Equatorial Ridge
		#RSSOrigin2_Dinkinesh_Biome2 = Northern Hemisphere
		#RSSOrigin2_Dinkinesh_Biome3 = Southern Hemisphere

		#RSSOrigin2_Selam_name = Selam
		#RSSOrigin2_Selam_desc = Together, Dinkinesh and Selam form a binary asteroid system. Dinkinesh is the second binary main-belt asteroid explored by spacecraft, after 243 Ida by Galileo in 1993. The Dinkinesh binary system resembles the 65803 Didymos near-Earth asteroid binary system in size and composition, but differs in location from the Sun, which allows scientists to compare the nature of binary asteroids in different environments. In the weeks prior to the flyby, the Lucy spacecraft found that Dinkinesh's brightness did not vary as predicted, which provided the first hints of Dinkinesh's binary nature. Images of Selam taken after Lucy's approach revealed that it is a contact binary with two lobes attached to each other. While contact binary asteroids are common in the Solar System, Selam is the first known example of a contact binary satellite of an asteroid.
		#RSSOrigin2_Selam_Biome1 = Lobe 1
		#RSSOrigin2_Selam_Biome2 = Lobe 2
		#RSSOrigin2_Selam_Biome3 = Neck

		#RSSOrigin2_2001SN263_name = 2001 SN263
		#RSSOrigin2_2001SN263_desc = (153591) 2001 SN263 is a carbonaceous triple asteroid, classified as near-Earth object and former potentially hazardous asteroid of the Amor group, approximately 2.6 kilometers (1.6 miles) in diameter. It was discovered by the Lincoln Near-Earth Asteroid Research project at Lincoln Lab's Experimental Test Site in Socorro, New Mexico, on 20 September 2001. The two synchronous minor-planet moons measure approximately 770 and 430 meters and have an orbital period of 16.46 and 150 hours, respectively.
		#RSSOrigin2_2001SN263_Biome1 = Highlands
		#RSSOrigin2_2001SN263_Biome2 = Midlands
		#RSSOrigin2_2001SN263_Biome3 = Lowlands

		#RSSOrigin2_S-2008_153591_1_name = Beta (2001 SN263)
		#RSSOrigin2_S-2008_153591_1_desc = Nickname Beta, outer, larger moon of (153591) 2001 SN263
		#RSSOrigin2_S-2008_153591_1_Biome1 = Highlands
		#RSSOrigin2_S-2008_153591_1_Biome2 = Lowlands

		#RSSOrigin2_S-2008_153591_2_name = Gamma (2001 SN263)
		#RSSOrigin2_S-2008_153591_2_desc = Nickname Gamma, inner, smaller moon of (153591) 2001 SN263
		#RSSOrigin2_S-2008_153591_2_Biome1 = Highlands
		#RSSOrigin2_S-2008_153591_2_Biome2 = Lowlands

		#RSSOrigin2_2001WN5_name = 2001 WN5
		#RSSOrigin2_2001WN5_desc = (153814) 2001 WN5 is a sub-kilometer asteroid, classified as near-Earth object and potentially hazardous asteroid of the Apollo group.
		#RSSOrigin2_2001WN5_Biome1 = Highlands
		#RSSOrigin2_2001WN5_Biome2 = Midlands
		#RSSOrigin2_2001WN5_Biome3 = Lowlands

		#RSSOrigin2_Ryugu_name = Ryugu
		#RSSOrigin2_Ryugu_desc = 162173 Ryugu, provisional designation 1999 JU3, is a near-Earth object and a potentially hazardous asteroid of the Apollo group. It measures approximately 1 kilometre (0.62 mi) in diameter and is a dark object of the rare spectral type Cb, with qualities of both a C-type asteroid and a B-type asteroid. In June 2018, the Japanese spacecraft Hayabusa2 arrived at the asteroid. After making measurements and taking samples, Hayabusa2 left Ryugu for Earth in November 2019 and returned the sample capsule to Earth on 5 December 2020.
		#RSSOrigin2_Ryugu_Biome1 = Ryujin Dorsum
		#RSSOrigin2_Ryugu_Biome2 = Northern Hemisphere
		#RSSOrigin2_Ryugu_Biome3 = Southern Hemisphere

		#RSSOrigin2_Atira_name = Atira
		#RSSOrigin2_Atira_desc = 163693 Atira, provisional designation 2003 CP20, is a stony asteroid, dwelling in the interior of Earth's orbit. It is classified as a near-Earth object. Atira is a binary asteroid, a system of two asteroids orbiting their common barycenter. The primary component with a diameter of approximately 4.8 kilometers (3 miles) is orbited by a minor-planet moon that measures about 1 km (0.6 mi). Atira was discovered on 11 February 2003, by astronomers with the Lincoln Near-Earth Asteroid Research at Lincoln Laboratory's Experimental Test Site near Socorro, New Mexico, in the United States.
		#RSSOrigin2_Atira_Biome1 = Highlands
		#RSSOrigin2_Atira_Biome2 = Midlands
		#RSSOrigin2_Atira_Biome3 = Lowlands

		#RSSOrigin2_S-2017_163693_1_name = S/2017 (163693) 1
		#RSSOrigin2_S-2017_163693_1_desc = Atira came within 0.207 AU (31,000,000 km) from Earth in January 2017, the closest since its discovery in 2003. This provided an opportunity to study the asteroid by radar. Images taken at Arecibo Observatory on 20 January 2017 revealed that Atira is a synchronous binary asteroid with a minor-planet moon in orbit. The primary with a diameter of 4.8±0.5 km is possibly elongated and very angular in shape. The secondary is tidally locked and has a diameter of 1.0±0.3 km. Additional images taken on 23 January 2017 showed that the two components are orbiting each other at a distance of about 6 km with an orbital period of 15.5 hours.
		#RSSOrigin2_S-2017_163693_1_Biome1 = Highlands
		#RSSOrigin2_S-2017_163693_1_Biome2 = Midlands
		#RSSOrigin2_S-2017_163693_1_Biome3 = Lowlands

		#RSSOrigin2_Varda_name = Varda
		#RSSOrigin2_Varda_desc = 174567 Varda (provisional designation 2003 MW12) is a binary trans-Neptunian planetoid of the resonant hot classical population of the Kuiper belt, located in the outermost region of the Solar System. Its moon, Ilmarë, was discovered in 2009. Astronomer Michael Brown estimates that, with an absolute magnitude of 3.5 and a calculated diameter of approximately 700–800 kilometers (430–500 miles), it is likely a dwarf planet. However, William M. Grundy et al. argue that objects in the size range of 400–1000 km, with albedos less than ≈0.2 and densities of ≈1.2 g/cm3 or less, have likely never compressed into fully solid bodies, let alone differentiated, and so are highly unlikely to be dwarf planets. It is not clear if Varda has a low or a high density.
		#RSSOrigin2_Varda_Biome1 = Craters
		#RSSOrigin2_Varda_Biome2 = Southern Polar Region
		#RSSOrigin2_Varda_Biome3 = Northern Polar Region
		#RSSOrigin2_Varda_Biome4 = Equatorial Bulge
		#RSSOrigin2_Varda_Biome5 = Northern Hemisphere
		#RSSOrigin2_Varda_Biome6 = Southern Hemisphere

		#RSSOrigin2_Ilmare_name = Ilmarë
		#RSSOrigin2_Ilmare_desc = Ilmarë, or Varda I, full designation 174567 Varda I Ilmarë, is the single known natural satellite of the Kuiper belt object 174567 Varda. It was discovered by Keith Noll et al. in 2009, at a separation of about 0.12 arcsec, using discovery images taken by the Hubble Space Telescope on 26 April 2009, and reported in 2011. At approximately 326 km in diameter (about 45% that of its primary), it is the fourth or fifth-largest known moon of a trans-Neptunian object, after Pluto I Charon, Eris I Dysnomia, Orcus I Vanth and very possibly Haumea I Hiʻiaka. Assuming that Ilmarë has the same albedo and density as Varda, Ilmarë would constitute approximately 8.4% of the system's mass, approximately 2.2×1019 kg.
		#RSSOrigin2_Ilmare_Biome1 = Craters
		#RSSOrigin2_Ilmare_Biome2 = Southern Polar Region
		#RSSOrigin2_Ilmare_Biome3 = Northern Polar Region
		#RSSOrigin2_Ilmare_Biome4 = Equatorial Bulge
		#RSSOrigin2_Ilmare_Biome5 = Northern Hemisphere
		#RSSOrigin2_Ilmare_Biome6 = Southern Hemisphere

		#RSSOrigin2_Achlys_name = Achlys
		#RSSOrigin2_Achlys_desc = 208996 Achlys (provisional designation 2003 AZ84) is a large trans-Neptunian object orbiting the Sun in the Kuiper belt, a region of icy bodies beyond Neptune. It was discovered on 13 January 2003 by Chad Trujillo and Michael E. Brown at Palomar Observatory. Achlys has an elongated shape that is believed to be distorted by its rapid 6.8-hour rotation. Its diameter is estimated to be roughly 940 km (580 mi) across its equator to 490 km (300 mi) across its poles. After Pluto and Orcus, Achlys is the third largest member of the plutinos—a population of Kuiper belt objects following a 2:3 orbital resonance with Neptune, in which they complete two orbits for every three orbits completed by Neptune. The surface of Achlys is dark gray and mostly composed of water ice. Observations of stellar occultations show that Achlys's surface bears a chasm or depression between 8 and 13 km (5.0 and 8.1 mi) deep, similar to those seen on Pluto and its moon Charon. Achlys has one known moon that is about 80 km (50 mi) in diameter. The mass and density of Achlys has not been measured, though predictions based on its shape and rotation suggest that it has a density lower than that of water ice.
		#RSSOrigin2_Achlys_Biome1 = Craters
		#RSSOrigin2_Achlys_Biome2 = Southern Polar Region
		#RSSOrigin2_Achlys_Biome3 = Northern Polar Region
		#RSSOrigin2_Achlys_Biome4 = Equatorial Bulge
		#RSSOrigin2_Achlys_Biome5 = Northern Hemisphere
		#RSSOrigin2_Achlys_Biome6 = Southern Hemisphere

		#RSSOrigin2_S-2005_208996_1_name = S/2005 (208996) 1
		#RSSOrigin2_S-2005_208996_1_desc = Achlys has one known natural satellite or moon, which has no official name or designation. It was discovered by Michael E. Brown and Terry-Ann Suer in images taken by the Hubble Space Telescope on 2 December 2005. The discovery of Achlys's moon was announced on 22 February 2007 via an International Astronomical Union Circular published by the Central Bureau for Astronomical Telegrams. The moon of Achlys has not been seen since its discovery. The lack of redetections means that the orbit of Achlys's moon could not be determined, which prevents an accurate determination of Achlys's mass. Nevertheless, some properties of the moon's orbit have been predicted based on its observed separation distance from Achlys at discovery.
		#RSSOrigin2_S-2005_208996_1_Biome1 = Craters
		#RSSOrigin2_S-2005_208996_1_Biome2 = Southern Lowlands
		#RSSOrigin2_S-2005_208996_1_Biome3 = Northern Lowlands
		#RSSOrigin2_S-2005_208996_1_Biome4 = Highlands
		#RSSOrigin2_S-2005_208996_1_Biome5 = Northern Hemisphere
		#RSSOrigin2_S-2005_208996_1_Biome6 = Southern Hemisphere

		#RSSOrigin2_Gonggong_name = Gonggong
		#RSSOrigin2_Gonggong_desc = Gonggong (formally 225088 Gonggong; provisional designation 2007 OR10) is a dwarf planet, a member of the scattered disc beyond Neptune. It has a highly eccentric and inclined orbit during which it ranges from 34–101 astronomical units (5.1–15.1 billion kilometers; 3.2–9.4 billion miles) from the Sun. As of 2019, its distance from the Sun is 88 AU (13.2×109 km; 8.2×109 mi), and it is the sixth-farthest known Solar System object. Gonggong is in a 3:10 orbital resonance with Neptune, in which it completes three orbits around the Sun for every ten orbits completed by Neptune. Gonggong was discovered in July 2007 by American astronomers Megan Schwamb, Michael Brown, and David Rabinowitz at the Palomar Observatory, and the discovery was announced in January 2009.
		#RSSOrigin2_Gonggong_Biome1 = Craters
		#RSSOrigin2_Gonggong_Biome2 = Chasma
		#RSSOrigin2_Gonggong_Biome3 = Sinkholes
		#RSSOrigin2_Gonggong_Biome4 = Highlands
		#RSSOrigin2_Gonggong_Biome5 = Northern Hemisphere
		#RSSOrigin2_Gonggong_Biome6 = Southern Hemisphere
		#RSSOrigin2_Gonggong_Biome7 = Equatorial Bulge

		#RSSOrigin2_Xiangliu_name = Xiangliu
		#RSSOrigin2_Xiangliu_desc = Xiangliu, full designation 225088 Gonggong I Xiangliu, is the only known moon of the scattered-disc likely dwarf planet 225088 Gonggong. It was discovered by a team of astronomers led by Csaba Kiss during an analysis of archival Hubble Space Telescope images of Gonggong. The discovery team had suspected that the slow rotation of Gonggong was caused by tidal forces exerted by an orbiting satellite. Xiangliu was first identified in archival Hubble images taken with Hubble's Wide Field Camera 3 on 18 September 2010. Its discovery was reported and announced by Gábor Marton, Csaba Kiss, and Thomas Müller at the 48th Meeting of the Division for Planetary Sciences on 17 October 2016. The satellite is named after Xiangliu, a nine-headed poisonous snake monster in Chinese mythology that attended the water god Gonggong as his chief minister.
		#RSSOrigin2_Xiangliu_Biome1 = Craters
		#RSSOrigin2_Xiangliu_Biome2 = Southern Lowlands
		#RSSOrigin2_Xiangliu_Biome3 = Northern Lowlands
		#RSSOrigin2_Xiangliu_Biome4 = Equatorial Bulge
		#RSSOrigin2_Xiangliu_Biome5 = Northern Hemisphere
		#RSSOrigin2_Xiangliu_Biome6 = Southern Hemisphere

		#RSSOrigin2_G!kun'homdima_name = Gǃkúnǁʼhòmdímà
		#RSSOrigin2_G!kun'homdima_desc = 229762 Gǃkúnǁʼhòmdímà (provisional designation 2007 UK126) is a trans-Neptunian object and binary system from the extended scattered disc, located in the outermost region of the Solar System. It was discovered on 19 October 2007 by American astronomers Megan Schwamb, Michael Brown, and David Rabinowitz at the Palomar Observatory in California and measures approximately 600 kilometers (400 miles) in diameter. This medium-sized TNO appears to be representative of a class of mid-sized objects under approximately 1000 km that have not collapsed into fully solid bodies. Its 100-kilometer moon was discovered by Keith Noll, Will Grundy, and colleagues with the Hubble Space Telescope in 2008, and named Gǃòʼé ǃHú.
		#RSSOrigin2_G!kun'homdima_Biome1 = Craters
		#RSSOrigin2_G!kun'homdima_Biome2 = Southern Polar Region
		#RSSOrigin2_G!kun'homdima_Biome3 = Northern Polar Region
		#RSSOrigin2_G!kun'homdima_Biome4 = Equatorial Bulge
		#RSSOrigin2_G!kun'homdima_Biome5 = Northern Hemisphere
		#RSSOrigin2_G!kun'homdima_Biome6 = Southern Hemisphere

		#RSSOrigin2_G!o'e!Hu_name = Gǃòʼé ǃHú
		#RSSOrigin2_G!o'e!Hu_desc = Gǃkúnǁʼhòmdímà has one known satellite, Gǃòʼé ǃHú, which is one of the reddest known TNOs. Size and mass can only be inferred. The magnitude difference between the two is 3.24±0.04 mag. This would correspond to a difference in diameter by a factor of 4.45±0.08, assuming the same albedo. Red satellites often have lower albedos than their primaries, though it is not known if that is the case with this moon. Such uncertainties do not affect density calculations of Gǃkúnǁʼhòmdímà, as Gǃòʼé ǃHú has only about 1% the total volume, and therefore is less important than the uncertainties in Gǃkúnǁʼhòmdímà's diameter.
		#RSSOrigin2_G!o'e!Hu_Biome1 = Craters
		#RSSOrigin2_G!o'e!Hu_Biome2 = Southern Lowlands
		#RSSOrigin2_G!o'e!Hu_Biome3 = Northern Lowlands
		#RSSOrigin2_G!o'e!Hu_Biome4 = Equatorial Bulge
		#RSSOrigin2_G!o'e!Hu_Biome5 = Northern Hemisphere
		#RSSOrigin2_G!o'e!Hu_Biome6 = Southern Hemisphere

		#RSSOrigin2_2006VW139_name = 2006 VW139
		#RSSOrigin2_2006VW139_desc = (300163) 2006 VW139 (provisional designation 2006 VW139, periodic comet designation 288P/2006 VW139) is a binary active asteroid and main-belt comet from the outer regions of the asteroid belt. The object was discovered by Spacewatch in 2006. Its binary nature was confirmed by the Hubble Space Telescope in September 2016. Both primary and its minor-planet moon are similar in mass and size, making it a true binary system. The components are estimated to measure 1.8 kilometers in diameter, orbiting each other at a wide separation of 104 kilometers every 135 days.
		#RSSOrigin2_2006VW139_Biome1 = Long Ends
		#RSSOrigin2_2006VW139_Biome2 = Northern Hemisphere
		#RSSOrigin2_2006VW139_Biome3 = Southern Hemisphere

		#RSSOrigin2_S-2011_300163_1_name = S/2011 (300163) 1
		#RSSOrigin2_S-2011_300163_1_desc = 2006 VW139 was first observed by the Hubble Space Telescope (HST) in December 2011. It was imaged by HST in September 2016, just before it made its closest approach to the Sun and confirmed its binary nature with two asteroids orbiting each other, and revealed ongoing cometary activity. This makes the object the first known binary asteroid that is also classified as a main-belt comet. The binary is thought to be the result of fission of the precursor caused by YORP-driven spinup.
		#RSSOrigin2_S-2011_300163_1_Biome1 = Long Ends
		#RSSOrigin2_S-2011_300163_1_Biome2 = Northern Hemisphere
		#RSSOrigin2_S-2011_300163_1_Biome3 = Southern Hemisphere

		#RSSOrigin2_Mani_name = Máni
		#RSSOrigin2_Mani_desc = 307261 Máni (provisional designation 2002 MS4) is a large trans-Neptunian object in the Kuiper belt, a region of icy planetesimals beyond Neptune. It was discovered on 18 June 2002 by Chad Trujillo and Michael Brown during their search for Pluto-sized Kuiper belt objects at Palomar Observatory. With a diameter of about 800 km (500 mi), Máni is large enough that some astronomers believe that it might be a dwarf planet.
		#RSSOrigin2_Mani_Biome1 = Craters
		#RSSOrigin2_Mani_Biome2 = Southern Lowlands
		#RSSOrigin2_Mani_Biome3 = Northern Lowlands
		#RSSOrigin2_Mani_Biome4 = Equatorial Bulge
		#RSSOrigin2_Mani_Biome5 = Northern Hemisphere
		#RSSOrigin2_Mani_Biome6 = Southern Hemisphere
		#RSSOrigin2_Mani_Biome7 = Massive Topographic Feature

		#RSSOrigin2_Duende_name = Duende
		#RSSOrigin2_Duende_desc = 367943 Duende (provisional designation 2012 DA14) is a micro-asteroid and a near-Earth object of the Aten and Atira group, approximately 30 meters (98 ft) in diameter. It was discovered by astronomers of the Astronomical Observatory of Mallorca at its robotic La Sagra Observatory in 2012, and named for the duende, a goblin-like creature from Iberian and Filipino mythology and folklore. Duende is likely an uncommon L-type asteroid and significantly elongated. For an asteroid of its size, it has a relatively long rotation period of 9.485 hours.
		#RSSOrigin2_Duende_Biome1 = Highlands
		#RSSOrigin2_Duende_Biome2 = Lowlands

		#RSSOrigin2_Manwe_name = Manwë
		#RSSOrigin2_Manwe_desc = 385446 Manwë, or (385446) Manwë–Thorondor, is a binary resonant Kuiper belt object in a 4:7 mean-motion resonance with Neptune. It was discovered on 25 August 2003, by American astronomer Marc Buie at Cerro Tololo Observatory in northern Chile. A study of Manwë's light curve in 2019 suggests that it may be a contact binary object.
		#RSSOrigin2_Manwe_Biome1 = Craters
		#RSSOrigin2_Manwe_Biome2 = Northern Hemisphere of Lobe 1
		#RSSOrigin2_Manwe_Biome3 = Northern Hemisphere of Lobe 2
		#RSSOrigin2_Manwe_Biome4 = Southern Hemisphere of Lobe 1
		#RSSOrigin2_Manwe_Biome5 = Southern Hemisphere of Lobe 2
		#RSSOrigin2_Manwe_Biome6 = Neck

		#RSSOrigin2_Thorondor_name = Thorondor
		#RSSOrigin2_Thorondor_desc = Being part of a binary system, Manwë has one known companion named Thorondor, formally designated (385446) Manwë I Thorondor. It is estimated to be about two-thirds the size of the primary, approximately 108 km (67 mi) for a volume equivalent diameter. The rotation period of Thorondor is uncertain, though a best-fit model suggests a very slow rotation period of 309.3 days. Thorondor's rotation is expected to be chaotic like Pluto's smaller moons, as a result of gravitational torquing by Manwë over the course of their eccentric mutual orbit.
		#RSSOrigin2_Thorondor_Biome1 = Craters
		#RSSOrigin2_Thorondor_Biome2 = Northern Hemisphere
		#RSSOrigin2_Thorondor_Biome3 = Southern Hemisphere
		#RSSOrigin2_Thorondor_Biome4 = Equatorial Bulge

		#RSSOrigin2_Kamo`oalewa_name = Kamoʻoalewa
		#RSSOrigin2_Kamo`oalewa_desc = 469219 Kamoʻoalewa, provisionally designated 2016 HO3, is a very small asteroid, fast rotator and near-Earth object of the Apollo group, approximately 40–100 meters (130–330 feet) in diameter. At present it is a quasi-satellite of Earth, and currently the smallest, closest, and most stable known such quasi-satellite. The asteroid was discovered by Pan-STARRS at Haleakala Observatory on 27 April 2016. It was named Kamoʻoalewa, a Hawaiian word that refers to an oscillating celestial object. The Earth-like orbit and lunar-like silicates may be a result of it being lunar ejecta.
		#RSSOrigin2_Kamo`oalewa_Biome1 = Highlands
		#RSSOrigin2_Kamo`oalewa_Biome2 = Lowlands

		#RSSOrigin2_Kagara_name = ǂKá,gára
		#RSSOrigin2_Kagara_desc = 469705 ǂKá,gára (provisional designation 2005 EF298) is a trans-Neptunian object and binary system of the core Kuiper belt, located in the outermost region of the Solar System. It was discovered on 11 March 2005 by American astronomer Marc Buie at the Kitt Peak Observatory in Arizona. The primary body measures around 140 kilometers (90 miles) in diameter. Its 120-kilometer (75-mile) companion ǃHãunu was discovered with the Hubble Space Telescope in 2009. The ǂKá,gára–ǃHãunu system is currently undergoing mutual occultation and eclipsing events in which one body casts a shadow on or obstructs the view of the other as seen from Earth.
		#RSSOrigin2_Kagara_Biome1 = Craters
		#RSSOrigin2_Kagara_Biome2 = Southern Lowlands
		#RSSOrigin2_Kagara_Biome3 = Northern Lowlands
		#RSSOrigin2_Kagara_Biome4 = Equatorial Bulge
		#RSSOrigin2_Kagara_Biome5 = Northern Hemisphere
		#RSSOrigin2_Kagara_Biome6 = Southern Hemisphere

		#RSSOrigin2_!Haunu_name = ǃHãunu
		#RSSOrigin2_!Haunu_desc = 469705 ǂKá,gára has one known satellite, ǃHãunu. The magnitude difference between ǂKá,gára and ǃHãunu is 0.59 mag. This corresponds to a difference in diameter of 13%, if the two bodies have the same albedo. The system mass is (2.18±0.12)×1018 kg, and, given the albedo, the bodies are equivalent to a single sphere of diameter 174+27−32 km. This corresponds to a density of 1.1+0.9−0.4 g/cm3. This does not particularly constrain the composition of the bodies, as the error bars cover the densities of both small, porous bodies and larger, collapsed bodies. Assuming the two bodies have the same albedo and density, their masses are (1.29±0.07)×1018 kg and (0.89±0.05)×1018 kg, and their diameters are 138+21−25 km and 122+16−19 km.
		#RSSOrigin2_!Haunu_Biome1 = Craters
		#RSSOrigin2_!Haunu_Biome2 = Southern Lowlands
		#RSSOrigin2_!Haunu_Biome3 = Northern Lowlands
		#RSSOrigin2_!Haunu_Biome4 = Equatorial Bulge
		#RSSOrigin2_!Haunu_Biome5 = Northern Hemisphere
		#RSSOrigin2_!Haunu_Biome6 = Southern Hemisphere

		#RSSOrigin2_Dziewanna_name = Dziewanna
		#RSSOrigin2_Dziewanna_desc = 471143 Dziewanna (provisional designation 2010 EK139) is a trans-Neptunian object in the scattered disc, orbiting the Sun in the outermost region of the Solar System. Dziewanna was discovered on 13 March 2010 by astronomers Andrzej Udalski, Scott Sheppard, Marcin Kubiak and Chad Trujillo at the Las Campanas Observatory in Chile. Based on its absolute magnitude and assumed albedo, it is estimated to have a diameter of approximately 470 kilometers. It was named after Devana (Polish form: Dziewanna), a Slavic goddess of the wilderness, forests and the hunt, in honor of the fact that it was discovered during the Polish OGLE project of Warsaw University, which was led by Udalski.
		#RSSOrigin2_Dziewanna_Biome1 = Craters
		#RSSOrigin2_Dziewanna_Biome2 = Southern Polar Region
		#RSSOrigin2_Dziewanna_Biome3 = Northern Polar Region
		#RSSOrigin2_Dziewanna_Biome4 = Equatorial Bulge
		#RSSOrigin2_Dziewanna_Biome5 = Northern Hemisphere
		#RSSOrigin2_Dziewanna_Biome6 = Southern Hemisphere

		#RSSOrigin2_Arrokoth_name = Arrokoth
		#RSSOrigin2_Arrokoth_desc = 486958 Arrokoth (provisional designation 2014 MU69) is a trans-Neptunian object located in the Kuiper belt. Arrokoth became the farthest and most primitive object in the Solar System visited by a spacecraft when the NASA space probe New Horizons conducted a flyby on 1 January 2019. Arrokoth is a contact binary 36 km (22 mi) long, composed of two planetesimals 21 km (13 mi) and 15 km (9 mi) across, that are joined along their major axes. With an orbital period of about 298 years and a low orbital inclination and eccentricity, Arrokoth is classified as a cold classical Kuiper belt object.
		#RSSOrigin2_Arrokoth_Biome1 = Weeyo Lobus
		#RSSOrigin2_Arrokoth_Biome2 = Wenu Lobus
		#RSSOrigin2_Arrokoth_Biome3 = Akasa Neck

		#RSSOrigin2_Ka`epaoka`awela_name = Kaʻepaokaʻāwela
		#RSSOrigin2_Ka`epaoka`awela_desc = 514107 Kaʻepaokaʻāwela, provisionally designated 2015 BZ509 and nicknamed Bee-Zed, is a small asteroid, approximately 3 km (2 mi) in diameter, in a resonant, co-orbital motion with Jupiter. It is an unusual minor planet in that its orbit is retrograde, which is opposite to the direction of most other bodies in the Solar System. It was discovered on 26 November 2014, by astronomers of the Pan-STARRS survey at Haleakala Observatory on the island of Maui, United States. Kaʻepaokaʻāwela is the first example of an asteroid in a 1:–1 resonance with any of the planets. This type of resonance had only been studied a few years before the object's discovery. One study suggests that it was an interstellar asteroid captured 4.5 billion years ago into an orbit around the Sun.
		#RSSOrigin2_Ka`epaoka`awela_Biome1 = Equatorial Bulge
		#RSSOrigin2_Ka`epaoka`awela_Biome2 = Northern Hemisphere
		#RSSOrigin2_Ka`epaoka`awela_Biome3 = Southern Hemisphere

		#RSSOrigin2_Zoozve_name = Zoozve
		#RSSOrigin2_Zoozve_desc = 524522 Zoozve (provisional designation 2002 VE68) is a sub-kilometer sized asteroid and temporary quasi-satellite of Venus. Discovered in 2002, it was the first such object to be discovered around a major planet in the Solar System. It has nearly the same orbital period around the Sun that Venus does. In a frame of reference rotating with Venus, it appears to travel around it during one Venerean year, but it orbits the Sun, not Venus.
		#RSSOrigin2_Zoozve_Biome1 = Lobe 1
		#RSSOrigin2_Zoozve_Biome2 = Lobe 2
		#RSSOrigin2_Zoozve_Biome3 = Neck

		#RSSOrigin2_Chiminigagua_name = Chiminigagua
		#RSSOrigin2_Chiminigagua_desc = 532037 Chiminigagua (provisional designation 2013 FY27) is a large trans-Neptunian object in the scattered disc. It was discovered on 17 March 2013 by Scott Sheppard and Chad Trujillo at Cerro Tololo Observatory in Chile. Chiminigagua has a nominal diameter of about 740 km (460 mi), which is large enough that some astronomers consider it a possible dwarf planet. Chiminigagua has a moderately red color, which suggests it has an old, ice-poor surface that has been dulled by cosmic rays and micrometeoroid bombardment. It has one unnamed moon about 190 km (120 mi) in diameter, which is believed to have formed from a giant impact on Chiminigagua.
		#RSSOrigin2_Chiminigagua_Biome1 = Craters
		#RSSOrigin2_Chiminigagua_Biome2 = Southern Lowlands
		#RSSOrigin2_Chiminigagua_Biome3 = Northern Lowlands
		#RSSOrigin2_Chiminigagua_Biome4 = Equatorial Highlands
		#RSSOrigin2_Chiminigagua_Biome5 = Northern Hemisphere
		#RSSOrigin2_Chiminigagua_Biome6 = Southern Hemisphere

		#RSSOrigin2_S-2018_532037_1_name = S/2018 (532037) 1
		#RSSOrigin2_S-2018_532037_1_desc = Chiminigagua is a binary system with one known natural satellite, which as of 2025 has no official designation or name. The moon was discovered by Scott Sheppard using the Hubble Space Telescope's Wide Field Camera 3 on 15 January 2018, whose high-resolution images revealed it as a faint dot next to Chiminigagua. Sheppard reported the moon to the International Astronomical Union, which announced the discovery on 10 August 2018 via the Central Bureau for Astronomical Telegrams.
		#RSSOrigin2_S-2018_532037_1_Biome1 = Craters
		#RSSOrigin2_S-2018_532037_1_Biome2 = Southern Lowlands
		#RSSOrigin2_S-2018_532037_1_Biome3 = Northern Lowlands
		#RSSOrigin2_S-2018_532037_1_Biome4 = Equatorial Highlands
		#RSSOrigin2_S-2018_532037_1_Biome5 = Northern Hemisphere
		#RSSOrigin2_S-2018_532037_1_Biome6 = Southern Hemisphere

		#RSSOrigin2_Leleakuhonua_name = Leleākūhonua
		#RSSOrigin2_Leleakuhonua_desc = 541132 Leleākūhonua, provisionally designated 2015 TG387, is an extreme trans-Neptunian object and sednoid in the outermost part of the Solar System. It was first observed on 13 October 2015, by astronomers at the Mauna Kea Observatories, Hawaii. Based on its discovery date near Halloween and the letters in its provisional designation 2015 TG387, the object was informally nicknamed "The Goblin" by its discoverers and later named Leleakuhonua, comparing its orbit to the flight of the Pacific golden plover. It was the third sednoid discovered, after Sedna and 2012 VP113, and measures around 220 kilometers (140 miles) in diameter.
		#RSSOrigin2_Leleakuhonua_Biome1 = Craters
		#RSSOrigin2_Leleakuhonua_Biome2 = Southern Lowlands
		#RSSOrigin2_Leleakuhonua_Biome3 = Northern Lowlands
		#RSSOrigin2_Leleakuhonua_Biome4 = Equatorial Bulge
		#RSSOrigin2_Leleakuhonua_Biome5 = Northern Hemisphere
		#RSSOrigin2_Leleakuhonua_Biome6 = Southern Hemisphere

		#RSSOrigin2_'Aylo'chaxnim_name = 'Ayló'chaxnim
		#RSSOrigin2_'Aylo'chaxnim_desc = 594913 'Ayló'chaxnim (provisional designation 2020 AV2) is a large near-Earth asteroid discovered by the Zwicky Transient Facility on 4 January 2020. It is the first asteroid discovered to have an orbit completely within Venus's orbit, and is thus the first and only known member of the eponymous 'Ayló'chaxnim (informally named Vatira before its discovery) population of Atira-class asteroids. 'Ayló'chaxnim has the smallest known aphelion and third-smallest known semi-major axis among all asteroids. With an absolute magnitude of approximately 16.2, the asteroid is expected to be larger than 1 km in diameter.
		#RSSOrigin2_'Aylo'chaxnim_Biome1 = Highlands
		#RSSOrigin2_'Aylo'chaxnim_Biome2 = Midlands
		#RSSOrigin2_'Aylo'chaxnim_Biome3 = Lowlands

		#RSSOrigin2_2005HC4_name = 2005 HC4
		#RSSOrigin2_2005HC4_desc = 2005 HC4 is the asteroid with the smallest known perihelion of any known object orbiting the Sun (except sungrazing comets). Its extreme orbital eccentricity brings it to within 0.071 AU of the Sun (23% of Mercury's perihelion) and takes it as far as 3.562 AU from the Sun (well beyond the orbit of Mars). Due to its very small perihelion and comparably large aphelion, 2005 HC4 achieves the fastest speed of any known asteroid bound to the Solar System with a velocity of 157 km/s (565,000 km/h; 351,000 mi/h) at perihelion (there are comets, however, which obtain much higher speeds).
		#RSSOrigin2_2005HC4_Biome1 = Highlands
		#RSSOrigin2_2005HC4_Biome2 = Midlands
		#RSSOrigin2_2005HC4_Biome3 = Lowlands

		#RSSOrigin2_2012VP113_name = 2012 VP113
		#RSSOrigin2_2012VP113_desc = 2012 VP113, also known by its nickname "Biden", is a trans-Neptunian object of the sednoid population, located in the outermost reaches of the Solar System. It was first observed on 5 November 2012 by American astronomers Scott Sheppard and Chad Trujillo at the Cerro Tololo Inter-American Observatory in Chile. The discovery was announced on 26 March 2014. The object probably measures somewhere between 300 and 1000 km in diameter, possibly large enough to be a dwarf planet.
		#RSSOrigin2_2012VP113_Biome1 = Craters
		#RSSOrigin2_2012VP113_Biome2 = Southern Lowlands
		#RSSOrigin2_2012VP113_Biome3 = Northern Lowlands
		#RSSOrigin2_2012VP113_Biome4 = Equatorial Bulge
		#RSSOrigin2_2012VP113_Biome5 = Northern Hemisphere
		#RSSOrigin2_2012VP113_Biome6 = Southern Hemisphere

		#RSSOrigin2_2014FE72_name = 2014 FE72
		#RSSOrigin2_2014FE72_desc = 2014 FE72 is a trans-Neptunian object first observed on 26 March 2014, at Cerro Tololo Inter-American Observatory in La Serena, Chile. It is a possible dwarf planet, a member of the scattered disc, whose orbit extends into the inner Oort cloud. Discovered by Scott Sheppard and Chad Trujillo, the object's existence was revealed on 29 August 2016. Both the orbital period and aphelion distance of this object are well constrained. 2014 FE72 had the largest barycentric aphelion until 2018. However, the heliocentric aphelion of 2014 FE72 is second among trans-Neptunian objects (after the damocloid 2017 MB7).
		#RSSOrigin2_2014FE72_Biome1 = Craters
		#RSSOrigin2_2014FE72_Biome2 = Southern Lowlands
		#RSSOrigin2_2014FE72_Biome3 = Northern Lowlands
		#RSSOrigin2_2014FE72_Biome4 = Equatorial Bulge
		#RSSOrigin2_2014FE72_Biome5 = Northern Hemisphere
		#RSSOrigin2_2014FE72_Biome6 = Southern Hemisphere

		#RSSOrigin2_2017OF201_name = 2017 OF201
		#RSSOrigin2_2017OF201_desc = 2017 OF201 is an extreme trans-Neptunian object and dwarf planet candidate, estimated to be around 500 to 900 kilometres (300 to 600 miles) in diameter. It was announced in 2025 by Sihao Cheng, Jiaxuan Li, and Eritas Yang, who discovered the object in archived telescope images from 2011 to 2018. With an absolute magnitude between 3~4, 2017 OF201 is one of the brightest known objects in the Solar System that does not have a directly measured size. The orbit of 2017 OF201 is extremely large and elongated, bringing it from 45 to 1,610 astronomical units (0.00071 to 0.02546 ly) away from the Sun. 2017 OF201 is not considered a sednoid because its perihelion or closest point to the Sun is below 60 AU, which means that the object comes close enough to Neptune that the planet's gravitational influence affects the orbit of 2017 OF201.
		#RSSOrigin2_2017OF201_Biome1 = Craters
		#RSSOrigin2_2017OF201_Biome2 = Southern Lowlands
		#RSSOrigin2_2017OF201_Biome3 = Northern Lowlands
		#RSSOrigin2_2017OF201_Biome4 = Equatorial Highlands
		#RSSOrigin2_2017OF201_Biome5 = Northern Hemisphere
		#RSSOrigin2_2017OF201_Biome6 = Southern Hemisphere

		#RSSOrigin2_1P-Halley_name = 1P/Halley
		#RSSOrigin2_1P-Halley_desc = Halley's Comet or Comet Halley, officially designated 1P/Halley, is a short-period comet visible from Earth every 75–79 years. Halley is the only known short-period comet that is regularly visible to the naked eye from Earth, and thus the only naked-eye comet that can appear twice in a human lifetime. Halley last appeared in the inner parts of the Solar System in 1986 and will next appear in mid-2061.
		#RSSOrigin2_1P-Halley_Biome1 = Long End
		#RSSOrigin2_1P-Halley_Biome2 = Short End
		#RSSOrigin2_1P-Halley_Biome3 = Body

		#RSSOrigin2_2P-Encke_name = 2P/Encke
		#RSSOrigin2_2P-Encke_desc = Comet Encke, or Encke's Comet (official designation: 2P/Encke), is a periodic comet that completes an orbit of the Sun once every 3.3 years. (This is the shortest period of a reasonably bright comet; the faint main-belt comet 311P/PanSTARRS has a period of 3.2 years.) Encke was first recorded by Pierre Méchain on 17 January 1786, but it was not recognized as a periodic comet until 1819 when its orbit was computed by Johann Franz Encke. Like Halley's Comet, it is unusual in its being named after the calculator of its orbit rather than its discoverer. Like most comets, it has a very low albedo, reflecting only 4.6% of the light its nucleus receives, although comets generate a large coma and tail that can make them much more visible during their perihelion (closest approach to the Sun).
		#RSSOrigin2_2P-Encke_Biome1 = Highlands
		#RSSOrigin2_2P-Encke_Biome2 = Midlands
		#RSSOrigin2_2P-Encke_Biome3 = Lowlands

		#RSSOrigin2_6P-d'Arrest_name = 6P/d'Arrest
		#RSSOrigin2_6P-d'Arrest_desc = 6P/d'Arrest (also known as d'Arrest's Comet or Comet d'Arrest) is a periodic comet orbiting between Mars and Jupiter once every 6.54 years. It is the second of three comets discovered by German astronomer, Heinrich Ludwig d'Arrest. It next comes to perihelion 1.35 AU from the Sun on March 31, 2028, when it is expected to brighten to around apparent magnitude 11.
		#RSSOrigin2_6P-d'Arrest_Biome1 = Highlands
		#RSSOrigin2_6P-d'Arrest_Biome2 = Midlands
		#RSSOrigin2_6P-d'Arrest_Biome3 = Lowlands

		#RSSOrigin2_8P-Tuttle_name = 8P/Tuttle
		#RSSOrigin2_8P-Tuttle_desc = 8P/Tuttle (also known as Tuttle's Comet or Comet Tuttle) is a periodic comet with a 13.6-year orbit. It fits the classical definition of a Jupiter-family comet with an orbital period of less than 20 years, but does not fit the modern definition of (2 < TJupiter< 3). Its last perihelion passage was 27 August 2021 when it had a solar elongation of 26 degrees at approximately apparent magnitude 9. Two weeks later, on September 12, 2021, it was about 1.8 AU (270 million km) from Earth which is about as far from Earth as the comet can get when the comet is near perihelion. Comet 8P/Tuttle is responsible for the Ursid meteor shower in late December.
		#RSSOrigin2_8P-Tuttle_Biome1 = Big Lobe
		#RSSOrigin2_8P-Tuttle_Biome2 = Small Lobe
		#RSSOrigin2_8P-Tuttle_Biome3 = Neck

		#RSSOrigin2_9P-Tempel1_name = 9P/Tempel 1
		#RSSOrigin2_9P-Tempel1_desc = Tempel 1 (official designation: 9P/Tempel) is a periodic Jupiter-family comet discovered by Wilhelm Tempel in 1867. It completes an orbit of the Sun every 5.5 years. Tempel 1 was the target of the Deep Impact space mission, which photographed a deliberate high-speed impact upon the comet in 2005. It was re-visited by the Stardust spacecraft on February 14, 2011 and came back to perihelion in August 2016.
		#RSSOrigin2_9P-Tempel1_Biome1 = Highlands
		#RSSOrigin2_9P-Tempel1_Biome2 = Midlands
		#RSSOrigin2_9P-Tempel1_Biome3 = Lowlands

		#RSSOrigin2_10P-Tempel2_name = 10P/Tempel 2
		#RSSOrigin2_10P-Tempel2_desc = 10P/Tempel, also known as Tempel 2, is a periodic Jupiter-family comet with a 5 year orbital period. It was discovered on July 4, 1873 by Wilhelm Tempel. The next perihelion passage is 24 March 2021 when the comet will have a solar elongation of 30 degrees at approximately apparent magnitude 11. Closest approach to Earth during the 2021 passage did not occur until many months later on 3 November 2021 at a distance of 1.6 AU (240 million km).
		#RSSOrigin2_10P-Tempel2_Biome1 = Highlands
		#RSSOrigin2_10P-Tempel2_Biome2 = Midlands
		#RSSOrigin2_10P-Tempel2_Biome3 = Lowlands

		#RSSOrigin2_19P-Borrelly_name = 19P/Borrelly
		#RSSOrigin2_19P-Borrelly_desc = Comet Borrelly or Borrelly's Comet (official designation: 19P/Borrelly) is a periodic comet, which was visited by the spacecraft Deep Space 1 in 2001. The comet last came to perihelion (closest approach to the Sun) on February 1, 2022 and will next come to perihelion on December 11, 2028.
		#RSSOrigin2_19P-Borrelly_Biome1 = Long End
		#RSSOrigin2_19P-Borrelly_Biome2 = Short End
		#RSSOrigin2_19P-Borrelly_Biome3 = Body

		#RSSOrigin2_21P-Giacobini-Zinner_name = 21P/Giacobini–Zinner
		#RSSOrigin2_21P-Giacobini-Zinner_desc = Comet Giacobini–Zinner (officially designated 21P/Giacobini–Zinner) is a periodic comet in the Solar System. It was discovered by Michel Giacobini, who observed it in the constellation of Aquarius on December 20, 1900. It was recovered two orbits later by Ernst Zinner, while he was observing variable stars near Beta Scuti on October 23, 1913.
		#RSSOrigin2_21P-Giacobini-Zinner_Biome1 = Highlands
		#RSSOrigin2_21P-Giacobini-Zinner_Biome2 = Midlands
		#RSSOrigin2_21P-Giacobini-Zinner_Biome3 = Lowlands

		#RSSOrigin2_26P-Grigg-Skjellerup_name = 26P/Grigg–Skjellerup
		#RSSOrigin2_26P-Grigg-Skjellerup_desc = Comet Grigg–Skjellerup (formally designated 26P/Grigg–Skjellerup) is a periodic comet. It was visited by the Giotto probe in July 1992. The spacecraft came as close as 200 km, but could not take pictures because some instruments were damaged from its encounter with Halley's Comet.
		#RSSOrigin2_26P-Grigg-Skjellerup_Biome1 = Highlands
		#RSSOrigin2_26P-Grigg-Skjellerup_Biome2 = Midlands
		#RSSOrigin2_26P-Grigg-Skjellerup_Biome3 = Lowlands

		#RSSOrigin2_29P-Schwassmann-Wachmann1_name = 29P/Schwassmann–Wachmann 1
		#RSSOrigin2_29P-Schwassmann-Wachmann1_desc = Comet 29P/Schwassmann–Wachmann, also known as Schwassmann–Wachmann 1, was discovered on November 15, 1927, by Arnold Schwassmann and Arno Arthur Wachmann at the Hamburg Observatory in Bergedorf, Germany. It was discovered photographically, when the comet was in outburst and the magnitude was about 13. Precovery images of the comet from March 4, 1902, were found in 1931 and showed the comet at 12th magnitude.
		#RSSOrigin2_29P-Schwassmann-Wachmann1_Biome1 = Highlands
		#RSSOrigin2_29P-Schwassmann-Wachmann1_Biome2 = Midlands
		#RSSOrigin2_29P-Schwassmann-Wachmann1_Biome3 = Lowlands

		#RSSOrigin2_46P-Wirtanen_name = 46P/Wirtanen
		#RSSOrigin2_46P-Wirtanen_desc = 46P/Wirtanen is a small short-period comet with a current orbital period of 5.4 years. It was the original target for close investigation by the Rosetta spacecraft, planned by the European Space Agency, but an inability to meet the launch window caused Rosetta to be sent to 67P/Churyumov–Gerasimenko instead. It belongs to the Jupiter family of comets, all of which have aphelia between 5 and 6 AU. Its diameter is estimated at 1.2 kilometres (0.75 mi). In December 2019, astronomers reported capturing an outburst of the comet in substantial detail by the TESS space telescope.
		#RSSOrigin2_46P-Wirtanen_Biome1 = Highlands
		#RSSOrigin2_46P-Wirtanen_Biome2 = Midlands
		#RSSOrigin2_46P-Wirtanen_Biome3 = Lowlands

		#RSSOrigin2_67P-Churyumov-Gerasimenko_name = 67P/Churyumov–Gerasimenko
		#RSSOrigin2_67P-Churyumov-Gerasimenko_desc = 67P/Churyumov–Gerasimenko (abbreviated as 67P or 67P/C–G) is a Jupiter-family comet, originally from the Kuiper belt, with a current orbital period of 6.45 years, a rotation period of approximately 12.4 hours and a maximum velocity of 135,000 km/h (38 km/s; 84,000 mph). Churyumov–Gerasimenko is approximately 4.3 by 4.1 km (2.7 by 2.5 mi) at its longest and widest dimensions. It was first observed on photographic plates in 1969 by Soviet astronomers Klim Ivanovych Churyumov and Svetlana Ivanovna Gerasimenko, after whom it is named. It most recently came to perihelion (closest approach to the Sun) on 2 November 2021, and will next come to perihelion on 9 April 2028.
		#RSSOrigin2_67P-Churyumov-Gerasimenko_Biome1 = Small Lobe
		#RSSOrigin2_67P-Churyumov-Gerasimenko_Biome2 = Large Lobe
		#RSSOrigin2_67P-Churyumov-Gerasimenko_Biome3 = Neck

		#RSSOrigin2_81P-Wild2_name = 81P/Wild 2
		#RSSOrigin2_81P-Wild2_desc = Comet 81P/Wild, also known as Wild 2, is a comet named after Swiss astronomer Paul Wild, who discovered it on January 6, 1978, using a 40-cm Schmidt telescope at Zimmerwald, Switzerland. For most of its 4.5 billion-year lifetime, Wild 2 probably had a more distant and circular orbit. In September 1974, it passed within one million kilometers of the planet Jupiter, the strong gravitational pull of which perturbed the comet's orbit and brought it into the inner Solar System. Its orbital period changed from 43 years to about 6 years, and its perihelion is now about 1.59 astronomical unit (AU).
		#RSSOrigin2_81P-Wild2_Biome1 = Craters
		#RSSOrigin2_81P-Wild2_Biome2 = Northern Hemisphere
		#RSSOrigin2_81P-Wild2_Biome3 = Southern Hemisphere

		#RSSOrigin2_103P-Hartley2_name = 103P/Hartley 2
		#RSSOrigin2_103P-Hartley2_desc = Comet Hartley 2, designated as 103P/Hartley by the Minor Planet Center, is a small periodic comet with an orbital period of 6.46 years. It was discovered by Malcolm Hartley in 1986 at the Schmidt Telescope Unit, Siding Spring Observatory, Australia. Its diameter is estimated to be 1.2 to 1.6 kilometres (0.75 to 0.99 mi).
		#RSSOrigin2_103P-Hartley2_Biome1 = Small Lobe
		#RSSOrigin2_103P-Hartley2_Biome2 = Big Lobe

		#RSSOrigin2_153P-Ikeya-Zhang_name = 153P/Ikeya–Zhang
		#RSSOrigin2_153P-Ikeya-Zhang_desc = Comet Ikeya–Zhang (Japanese, Chinese: 池谷-张彗星, officially designated 153P/Ikeya–Zhang) is a comet discovered independently by two astronomers from Japan and China in 2002. It has by far the longest orbital period of the numbered periodic comets. It was last observed in October 2002 when it was about 3.3 AU (490 million km) from the Sun.
		#RSSOrigin2_153P-Ikeya-Zhang_Biome1 = Highlands
		#RSSOrigin2_153P-Ikeya-Zhang_Biome2 = Midlands
		#RSSOrigin2_153P-Ikeya-Zhang_Biome3 = Lowlands

		#RSSOrigin2_311P-PanSTARRS_name = 311P/PanSTARRS
		#RSSOrigin2_311P-PanSTARRS_desc = 311P/PanSTARRS, also known as P/2013 P5 (PanSTARRS), is an active asteroid and Encke-type comet discovered by Bryce T. Bolin using the Pan-STARRS telescope on 27 August 2013. Observations made by the Hubble Space Telescope revealed that it had six comet-like tails. The tails are suspected to be streams of material ejected by the asteroid as a result of a rubble pile asteroid spinning fast enough to remove material from it. This is similar to 331P/Gibbs, which was found to be a quickly-spinning rubble pile as well.
		#RSSOrigin2_311P-PanSTARRS_Biome1 = Highlands
		#RSSOrigin2_311P-PanSTARRS_Biome2 = Midlands
		#RSSOrigin2_311P-PanSTARRS_Biome3 = Lowlands

		#RSSOrigin2_S-0000_311P_1_name = Companion of 311P
		#RSSOrigin2_S-0000_311P_1_desc = On 19 April 2018, observations based on light curvature suggested a possible satellite around 311P/PANSTARRS approaching 200 meters. If true this would be one of the few minor planets designated as a comet known to harbor a satellite.
		#RSSOrigin2_S-0000_311P_1_Biome1 = Highlands
		#RSSOrigin2_S-0000_311P_1_Biome2 = Lowlands

		#RSSOrigin2_Hale-Bopp_name = Hale–Bopp
		#RSSOrigin2_Hale-Bopp_desc = Comet Hale–Bopp (formally designated C/1995 O1) is a comet that was one of the most widely observed of the 20th century and one of the brightest seen for many decades. Alan Hale and Thomas Bopp discovered Comet Hale–Bopp separately on July 23, 1995, before it became visible to the naked eye. It is difficult to predict the maximum brightness of new comets with any degree of certainty, but Hale–Bopp met and exceeded most predictions when it passed perihelion on April 1, 1997, reaching about magnitude −1.8. It was visible to the naked eye for a record 18 months, due to its massive nucleus size. This is twice as long as the Great Comet of 1811, the previous record holder. Accordingly, Hale–Bopp was dubbed the great comet of 1997.
		#RSSOrigin2_Hale-Bopp_Biome1 = Highlands
		#RSSOrigin2_Hale-Bopp_Biome2 = Midlands
		#RSSOrigin2_Hale-Bopp_Biome3 = Lowlands

		#RSSOrigin2_C-1992J1_name = C/1992 J1
		#RSSOrigin2_C-1992J1_desc = C/1992 J1 (Spacewatch) is a comet that was discovered 1 May 1992 by David Rabinowitz of the Spacewatch Project. This was the first comet to be discovered using an automated system.
		#RSSOrigin2_C-1992J1_Biome1 = Highlands
		#RSSOrigin2_C-1992J1_Biome2 = Midlands
		#RSSOrigin2_C-1992J1_Biome3 = Lowlands

		#RSSOrigin2_C-2012C1_name = C/2012 C1
		#RSSOrigin2_C-2012C1_desc = C/2012 C1 (McNaught). Discovery Date February 5, 2012. Discoverer Robert H. McNaught (Siding Spring)
		#RSSOrigin2_C-2012C1_Biome1 = Highlands
		#RSSOrigin2_C-2012C1_Biome2 = Midlands
		#RSSOrigin2_C-2012C1_Biome3 = Lowlands

		#RSSOrigin2_Bernardinelli-Bernstein_name = Bernardinelli–Bernstein
		#RSSOrigin2_Bernardinelli-Bernstein_desc = C/2014 UN271 (Bernardinelli-Bernstein), simply known as C/2014 UN271 or Comet Bernardinelli-Bernstein (nicknamed BB), is a large Oort cloud comet discovered by astronomers Pedro Bernardinelli and Gary Bernstein in archival images from the Dark Energy Survey. When first imaged in October 2014, the object was 29 AU (4.3 billion km; 2.7 billion mi) from the Sun, almost as far as Neptune's orbit and the greatest distance at which a comet has been discovered. With a nucleus diameter of at least 120 km (75 mi), it is the largest Oort cloud comet known. It is approaching the Sun and will reach its perihelion of 10.9 AU (just outside of Saturn's orbit) in January 2031. It will not be visible to the naked eye because it will not enter the inner Solar System.
		#RSSOrigin2_Bernardinelli-Bernstein_Biome1 = Highlands
		#RSSOrigin2_Bernardinelli-Bernstein_Biome2 = Midlands
		#RSSOrigin2_Bernardinelli-Bernstein_Biome3 = Lowlands

		#RSSOrigin2_1I-'Oumuamua_name = 1I/ʻOumuamua
		#RSSOrigin2_1I-'Oumuamua_desc = ʻOumuamua is the first interstellar object detected passing through the Solar System. Formally designated 1I/2017 U1, ʻOumuamua was discovered by Robert Weryk using the Pan-STARRS telescope at Haleakalā Observatory, Hawaii, on 19 October 2017, approximately 40 days after it passed its closest point to the Sun on 9 September. When it was first observed, it was about 33 million km (21 million mi; 0.22 AU) from Earth (about 85 times as far away as the Moon), and already heading away from the Sun.
		#RSSOrigin2_1I-'Oumuamua_Biome1 = Equatorial Ridge
		#RSSOrigin2_1I-'Oumuamua_Biome2 = Polar Regions

		#RSSOrigin2_2I-Borisov_name = 2I/Borisov
		#RSSOrigin2_2I-Borisov_desc = 2I/Borisov, originally designated C/2019 Q4 (Borisov), is the first observed rogue comet and the second observed interstellar interloper after ʻOumuamua. It was discovered by the Crimean amateur astronomer and telescope maker Gennadiy Borisov on 29 August 2019 UTC (30 August local time). 2I/Borisov has a heliocentric orbital eccentricity of 3.36 and is not bound to the Sun. The comet passed through the ecliptic of the Solar System at the end of October 2019, and made its closest approach to the Sun at just over 2 AU on 8 December 2019. The comet passed closest to Earth on 28 December 2019. In November 2019, astronomers from Yale University said that the comet's tail was 14 times the size of Earth, and stated, "It's humbling to realize how small Earth is next to this visitor from another solar system." In the middle of March, 2020, the comet was observed to fragment; and later, in April, even more evidence of fragmentation was reported.
		#RSSOrigin2_2I-Borisov_Biome1 = Highlands
		#RSSOrigin2_2I-Borisov_Biome2 = Lowlands

		#RSSOrigin2_3I-ATLAS_name = 3I/ATLAS
		#RSSOrigin2_3I-ATLAS_desc = 3I/ATLAS, also known as C/2025 N1 (ATLAS) and previously as A11pl3Z, is an interstellar comet discovered on 1 July 2025 by the Asteroid Terrestrial-impact Last Alert System (ATLAS) station. The comet follows an unbound, hyperbolic trajectory past the Sun, and passed by Earth at 1.8 AU, posing no threat. The prefix "3I" designates it as the third confirmed interstellar object passing through the Solar System, after 1I/ʻOumuamua and 2I/Borisov. 3I/ATLAS is an active comet consisting of a solid icy nucleus and a coma, which is a cloud of gas and icy dust escaping from the nucleus. The Sun is responsible for the comet's activity because it heats up the comet's nucleus to sublimate its ice into gas, which outgasses and lifts up dust from the comet's surface to form its coma. Images taken by the Hubble Space Telescope and various interplanetary spacecraft suggest that the diameter of 3I/ATLAS's nucleus is less than 1 km (0.62 mi). Observations by the James Webb Space Telescope (JWST) have shown that 3I/ATLAS is unusually rich in carbon dioxide, and contains a small amount of water ice, water vapor, carbon monoxide, and carbonyl sulfide. Observations by the Very Large Telescope have also shown that 3I/ATLAS is emitting cyanide gas and atomic nickel vapor, at concentrations similar to those seen in Solar System comets. The comet came to solar conjunction on 21 October 2025, and it came closest to the Sun on 29 October 2025, at a distance of 1.36 AU (203 million km; 126 million mi) from the Sun, which is between the orbits of Earth and Mars. The comet appears to have originated from either the Milky Way's thin disk, or thick disk; if 3I/ATLAS originated from the thick disk, the comet could be at least 7 billion years old—older than the Solar System.
		#RSSOrigin2_3I-ATLAS_Biome1 = Highlands
		#RSSOrigin2_3I-ATLAS_Biome2 = Lowlands
	}
