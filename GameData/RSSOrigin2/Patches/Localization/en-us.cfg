		#RSSOrigin2_Nereid_name = Nereid
		#RSSOrigin2_Nereid_desc = Nereid, or Neptune II, is the third-largest moon of Neptune. It has the most eccentric orbit of all known moons in the Solar System. It was the second moon of Neptune to be discovered, by Gerard Kuiper in 1949.
		#RSSOrigin2_Nereid_Biome1 = Craters
		#RSSOrigin2_Nereid_Biome2 = Highlands
		#RSSOrigin2_Nereid_Biome3 = Southern Hemisphere
		#RSSOrigin2_Nereid_Biome4 = Northern Hemisphere

		#RSSOrigin2_Naiad_name = Naiad
		#RSSOrigin2_Naiad_desc = Naiad, (also known as Neptune III and previously designated as S/1989 N 6) named after the naiads of Greek legend, is the innermost satellite of Neptune and the nearest to the center of any gas giant with moons with a distance of 48,224 km from the planet's center. Its orbital period is less than a Neptunian day, resulting in tidal dissipation that will cause its orbit to decay. Eventually it will either crash into Neptune's atmosphere or break up to become a new ring.
		#RSSOrigin2_Naiad_Biome1 = Equatorial High
		#RSSOrigin2_Naiad_Biome2 = Equatorial Low
		#RSSOrigin2_Naiad_Biome3 = Polar Regions

