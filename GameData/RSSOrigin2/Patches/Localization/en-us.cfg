		#RSSOrigin2_Caliban_Biome2 = Midlands
		#RSSOrigin2_Caliban_Biome3 = Lowlands

		#RSSOrigin2_Sycorax_name = Sycorax
		#RSSOrigin2_Sycorax_desc = Sycorax is the largest retrograde irregular satellite of Uranus. Sycorax was discovered on 6 September 1997 by Brett J. Gladman, Philip D. Nicholson, Joseph A. Burns, and John J. Kavelaars using the 200-inch Hale telescope, together with Caliban, and given the temporary designation S/1997 U 2. Officially confirmed as Uranus XVII, it was named after Sycorax, Caliban's mother in William Shakespeare's play The Tempest.
		#RSSOrigin2_Sycorax_Biome1 = Craters
		#RSSOrigin2_Sycorax_Biome2 = Equatorial High
		#RSSOrigin2_Sycorax_Biome3 = Equatorial Low
		#RSSOrigin2_Sycorax_Biome4 = Polar Low

		#RSSOrigin2_Francisco_name = Francisco
		#RSSOrigin2_Francisco_desc = Francisco, also known as Uranus XXII and previously as S/2001 U 3, is the innermost known irregular satellite of Uranus, orbiting in a retrograde direction. It was discovered on 13 August 2001 by John J. Kavelaars, Matthew J. Holman, Dan Milisavljevic, and Tommy Grav using the 4.0-meter Víctor M. Blanco Telescope at Cerro Tololo Observatory, Chile. It was named after Francisco, a lord in William Shakespeare's play The Tempest. Francisco orbits Uranus at an average distance of 4.3 million km (2.7 million mi) and takes about 267 Earth days (0.73 Earth years) to complete one orbit. Francisco is estimated to be up to 22 km (14 mi) in diameter, though many of its physical properties are unknown.
		#RSSOrigin2_Francisco_Biome1 = Highlands
		#RSSOrigin2_Francisco_Biome2 = Midlands
		#RSSOrigin2_Francisco_Biome3 = Lowlands

		#RSSOrigin2_Margaret_name = Margaret
		#RSSOrigin2_Margaret_desc = Margaret is the only known prograde irregular satellite of the moons of Uranus. It was discovered by Scott S. Sheppard, et al. in 2003 and given the provisional designation S/2003 U 3. Confirmed as Uranus XXIII, it was named after the servant of Hero in William Shakespeare's play Much Ado About Nothing. The name was also chosen to match the name of Sheppard's mother.
		#RSSOrigin2_Margaret_Biome1 = Highlands
		#RSSOrigin2_Margaret_Biome2 = Midlands
		#RSSOrigin2_Margaret_Biome3 = Lowlands

		#RSSOrigin2_Ferdinand_name = Ferdinand
		#RSSOrigin2_Ferdinand_desc = Ferdinand is the outermost retrograde irregular satellite of Uranus. It was first seen near Uranus by Matthew J. Holman, John J. Kavelaars, Dan Milisavljevic, and Brett J. Gladman on August 13, 2001 and reobserved on September 21, 2001. The object was then lost with no confirmation it was actually orbiting around Uranus. On August 29 and 30, 2003 a team led by Scott S. Sheppard surveyed the sky around Uranus with the Subaru Telescope and detected two unknown objects near Uranus. These two new objects were reobserved by Sheppard et al. with the Gemini telescope on September 20, 2003 and reported to the Minor Planet Center as possible new moons of Uranus. On September 24, 2003, Brian G. Marsden, at the Minor Planet Center, linked one of the unknown objects reported by Sheppard et al. to the lost object observed by Holman et al. in 2001. Holman was then able to confirm the linkage between the 2001 and 2003 objects on September 30, 2003 by observing its location with the Magellan-Baade telescope. The linked 2001 and 2003 object was then given the provisional designation S/2001 U 2 on October 1, 2003, officially identifying it as a new moon of Uranus. Now designated Uranus XXIV, Ferdinand is named after the son of the King of Naples in William Shakespeare's play The Tempest. The second new object observed by Sheppard et al. in 2003 was also a new moon of Uranus, now named Margaret.
		#RSSOrigin2_Ferdinand_Biome1 = Highlands
		#RSSOrigin2_Ferdinand_Biome2 = Midlands
		#RSSOrigin2_Ferdinand_Biome3 = Lowlands

		#RSSOrigin2_Perdita_name = Perdita
		#RSSOrigin2_Perdita_desc = Perdita is an inner satellite of Uranus. Perdita's discovery was complicated. The first photographs of Perdita were taken by the Voyager 2 spacecraft in 1986, but it was not recognized from the photographs for more than a decade. In 1999, the moon was noticed by Erich Karkoschka and reported. But because no further pictures could be taken to confirm its existence, it was officially demoted in 2001. However, in 2003, pictures taken by the Hubble Space Telescope managed to pick up an object where Perdita was supposed to be, finally confirming its existence.
		#RSSOrigin2_Perdita_Biome1 = Highlands
		#RSSOrigin2_Perdita_Biome2 = Midlands
		#RSSOrigin2_Perdita_Biome3 = Lowlands

		#RSSOrigin2_Mab_name = Mab
		#RSSOrigin2_Mab_desc = Mab, or Uranus XXVI, is an inner satellite of Uranus. It was discovered by Mark R. Showalter and Jack J. Lissauer in 2003 using the Hubble Space Telescope.
		#RSSOrigin2_Mab_Biome1 = Highlands
		#RSSOrigin2_Mab_Biome2 = Midlands
		#RSSOrigin2_Mab_Biome3 = Lowlands

		#RSSOrigin2_Cupid_name = Cupid
		#RSSOrigin2_Cupid_desc = Cupid is an inner satellite of Uranus. It was discovered by Mark R. Showalter and Jack J. Lissauer in 2003 using the Hubble Space Telescope.
