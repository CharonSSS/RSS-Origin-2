		#RSSOrigin2_Amalthea_name = Amalthea
		#RSSOrigin2_Amalthea_desc = Amalthea is a moon of Jupiter. It has the third closest orbit around Jupiter among known moons and was the fifth moon of Jupiter to be discovered, so it is also known as Jupiter V. It is also the fifth largest moon of Jupiter, after the four Galilean Moons. Edward Emerson Barnard discovered the moon on 9 September 1892 and named it after Amalthea of Greek mythology. It was the last natural satellite to be discovered by direct visual observation; all later moons were discovered by photographic or digital imaging. Amalthea is in a close orbit around Jupiter and is within the outer edge of the Amalthea Gossamer Ring which is formed from dust ejected from its surface. Jupiter would appear 46.5 degrees in diameter from its surface. Amalthea is the largest of the inner satellites of Jupiter and is irregularly shaped and reddish in color. It is thought to consist of porous water ice with unknown amounts of other materials. Its surface features include large craters and ridges.
		#RSSOrigin2_Amalthea_Biome1 = Gaea
		#RSSOrigin2_Amalthea_Biome2 = Pan
		#RSSOrigin2_Amalthea_Biome3 = Lyctos Facula
		#RSSOrigin2_Amalthea_Biome4 = Ida Facula
		#RSSOrigin2_Amalthea_Biome5 = High Regions
		#RSSOrigin2_Amalthea_Biome6 = Low Regions

		#RSSOrigin2_Himalia_name = Himalia
		#RSSOrigin2_Himalia_desc = Himalia, or Jupiter VI, is the largest irregular satellite of Jupiter, with a diameter of at least 140 km (90 mi). It is the sixth largest Jovian satellite, after the four Galilean moons and Amalthea. It was discovered by Charles Dillon Perrine at the Lick Observatory on 3 December 1904 and is named after the nymph Himalia, who bore three sons of Zeus (the Greek equivalent of Jupiter). It is one of the largest planetary moons in the Solar System not imaged in detail, and the third largest not imaged in detail within the orbit of Neptune.
		#RSSOrigin2_Himalia_Biome1 = Craters
		#RSSOrigin2_Himalia_Biome2 = Equatorial High
		#RSSOrigin2_Himalia_Biome3 = Equatorial Low
		#RSSOrigin2_Himalia_Biome4 = Polar Low

		#RSSOrigin2_Elara_name = Elara
		#RSSOrigin2_Elara_desc = Elara was discovered by Charles Dillon Perrine of the Lick Observatory on January 6, 1905, the day after the discovery of Himalia, also by Perrine, was announced. Confirmation of the discovery was delayed until the 21st of February due to poor weather conditions. Its named after Elara, one of Zeus's lovers and the mother of the giant Tityos. Elara did not receive its present name until 1975; before then, it was simply known as Jupiter VII. It was sometimes called "Hera" between 1955 and 1975.
		#RSSOrigin2_Elara_Biome1 = Highlands
		#RSSOrigin2_Elara_Biome2 = Midlands
		#RSSOrigin2_Elara_Biome3 = Lowlands

		#RSSOrigin2_Pasiphae_name = Pasiphae
		#RSSOrigin2_Pasiphae_desc = Pasiphae, formerly spelled Pasiphaë, also known as Jupiter VIII is one of the outermost and the biggest of retrograde irregular satellite of Jupiter. As an irregular moon with an eccentric orbit, it gets as far as 35.9 million km from Jupiter.
		#RSSOrigin2_Pasiphae_Biome1 = Highlands
		#RSSOrigin2_Pasiphae_Biome2 = Midlands
		#RSSOrigin2_Pasiphae_Biome3 = Lowlands

		#RSSOrigin2_Carme_name = Carme
		#RSSOrigin2_Carme_desc = It was discovered by Seth Barnes Nicholson at Mount Wilson Observatory in California in July 1938. It is named after the mythological Carme, mother by Zeus of Britomartis, a Cretan goddess. Carme did not receive its present name until 1975; before then, it was simply known as Jupiter XI. It was sometimes called "Pan" between 1955 and 1975 (Pan is now the name of a satellite of Saturn).
		#RSSOrigin2_Carme_Biome1 = Highlands
		#RSSOrigin2_Carme_Biome2 = Midlands
		#RSSOrigin2_Carme_Biome3 = Lowlands

		#RSSOrigin2_Ananke_name = Ananke
		#RSSOrigin2_Ananke_desc = Ananke, also known as Jupiter XII, is a one of larger retrograde irregular moon of Jupiter. It was discovered by Seth Barnes Nicholson at Mount Wilson Observatory in 1951. It is named after the Greek mythological Ananke, the personification of necessity, and the mother of the Moirai (Fates) by Zeus. Ananke did not receive its present name until 1975; before then, it was simply known as Jupiter XII. It was sometimes called "Adrastea" between 1955 and 1975 (Adrastea is now the name of another satellite of Jupiter).
		#RSSOrigin2_Ananke_Biome1 = Highlands
		#RSSOrigin2_Ananke_Biome2 = Midlands
		#RSSOrigin2_Ananke_Biome3 = Lowlands

		#RSSOrigin2_Thebe_name = Thebe
		#RSSOrigin2_Thebe_desc = Thebe, also known as Jupiter XIV, is the fourth of Jupiter's moons by distance from the planet. It was discovered by Stephen P. Synnott in images from the Voyager 1 space probe taken on March 5, 1979, while making its flyby of Jupiter. In 1983, it was officially named after the mythological nymph Thebe. The second largest of the inner satellites of Jupiter, Thebe orbits within the outer edge of the Thebe gossamer ring that is formed from dust ejected from its surface. It is irregularly shaped and reddish in colour, and is thought like Amalthea to consist of porous water ice with unknown amounts of other materials. Its surface features include large craters and high mountains—some of them are comparable to the size of the moon itself.
		#RSSOrigin2_Thebe_Biome1 = Zethus
		#RSSOrigin2_Thebe_Biome2 = Big Impact Crater
		#RSSOrigin2_Thebe_Biome3 = South Polar Rigion
		#RSSOrigin2_Thebe_Biome4 = High Regions
		#RSSOrigin2_Thebe_Biome5 = Low Regions

		#RSSOrigin2_Adrastea_name = Adrastea
		#RSSOrigin2_Adrastea_desc = Adrastea, also known as Jupiter XV, is the second by distance, and the smallest of the four inner moons of Jupiter. It was discovered in photographs taken by Voyager 2 in 1979, making it the first natural satellite to be discovered from images taken by an interplanetary spacecraft, rather than through a telescope. It was officially named after the mythological Adrasteia, foster mother of the Greek god Zeus—the equivalent of the Roman god Jupiter. Adrastea is one of the few moons in the Solar System known to orbit its planet in less than the length of that planet's day. It orbits at the edge of Jupiter's main ring and is thought to be the main contributor of material to the rings of Jupiter. Despite observations made in the 1990s by the Galileo spacecraft, very little is known about the moon's physical characteristics other than its size and the fact that it is tidally locked to Jupiter.
		#RSSOrigin2_Adrastea_Biome1 = Equatorial High
		#RSSOrigin2_Adrastea_Biome2 = Equatorial Low
		#RSSOrigin2_Adrastea_Biome3 = Polar Low

		#RSSOrigin2_Metis_name = Metis
		#RSSOrigin2_Metis_desc = Metis, also known as Jupiter XVI, is the innermost known moon of Jupiter. It was discovered in 1979 in images taken by Voyager 1, and was named in 1983 after the first wife of Zeus, Metis. Additional observations made between early 1996 and September 2003 by the Galileo spacecraft allowed its surface to be imaged. Metis is tidally locked to Jupiter, and its shape is strongly asymmetrical, with one of the diameters being almost twice as large as the smallest one. It is also one of the two moons known to orbit Jupiter in less than the length of Jupiter's day, the other being Adrastea. It orbits within the main ring of Jupiter, and is thought to be a major contributor of material to the rings.
		#RSSOrigin2_Metis_Biome1 = Equatorial High
		#RSSOrigin2_Metis_Biome2 = Equatorial Low
		#RSSOrigin2_Metis_Biome3 = Polar Low

		#RSSOrigin2_Themisto_name = Themisto
		#RSSOrigin2_Themisto_desc = Themisto, also known as Jupiter XVIII, is the innermost and one of the medium-sized irregular satellite of Jupiter. Themisto was first discovered by Charles T. Kowal and Elizabeth Roemer on 30 September 1975, reported on 3 October 1975, and designated S/1975 J 1. However, not enough observations were made to establish an orbit and it was subsequently lost. Then, on 21 November 2000, a seemingly new satellite was discovered by Scott S. Sheppard, David C. Jewitt, Yanga R. Fernández and Eugene A. Magnier and was designated S/2000 J 1. It was soon confirmed from computing the past trajectory of the satellite that this was the same as the one observed in 1975. This observation was immediately correlated with an earlier observation on 6 August 2000 by the team of Brett J. Gladman, John J. Kavelaars, Jean-Marc Petit, Hans Scholl, Matthew J. Holman, Brian G. Marsden, Philip D. Nicholson and Joseph A. Burns, which was reported to the Minor Planet Center but not published as an IAU Circular (IAUC). In October 2002, it was officially named after Themisto, daughter of the river god Inachus and lover of Zeus (Jupiter) in Greek mythology.
		#RSSOrigin2_Themisto_Biome1 = Highlands
		#RSSOrigin2_Themisto_Biome2 = Midlands
		#RSSOrigin2_Themisto_Biome3 = Lowlands

		#RSSOrigin2_Hyperion_name = Hyperion
		#RSSOrigin2_Hyperion_desc = Hyperion, also known as Saturn VII, is a moon of Saturn discovered by William Cranch Bond, his son George Phillips Bond and William Lassell in 1848. It is distinguished by its irregular shape, its chaotic rotation, and its unexplained sponge-like appearance. It was the first non-round moon to be discovered.
		#RSSOrigin2_Hyperion_Biome1 = Meri
		#RSSOrigin2_Hyperion_Biome2 = Bahloo
		#RSSOrigin2_Hyperion_Biome3 = Jarilo
		#RSSOrigin2_Hyperion_Biome4 = Bond-Lassell Dorsum
		#RSSOrigin2_Hyperion_Biome5 = Helios
		#RSSOrigin2_Hyperion_Biome6 = Surface

		#RSSOrigin2_Phoebe_name = Phoebe
		#RSSOrigin2_Phoebe_desc = Phoebe is the most massive irregular satellite of Saturn with a mean diameter of 213 km (132 mi). It was discovered by William Henry Pickering on 18 March 1899 from photographic plates that had been taken starting on 16 August 1898 at the Boyden Station of the Carmen Alto Observatory near Arequipa, Peru, by DeLisle Stewart. It was the first satellite to be discovered photographically. Phoebe was the first target encountered upon the arrival of the Cassini spacecraft in the Saturn system in 2004, and is thus unusually well-studied for an irregular satellite of its size. Cassini's trajectory to Saturn and time of arrival were specifically chosen to permit this flyby. After the encounter and its insertion into orbit, Cassini did not go much beyond the orbit of Iapetus. Phoebe is roughly spherical and has a differentiated interior. It was spherical and hot early in its history and was battered out of roundness by repeated impacts. It is believed to be a captured centaur that originated in the Kuiper belt. Phoebe is the second largest retrograde satellite in the Solar System after Triton.
		#RSSOrigin2_Phoebe_Biome1 = Jason
		#RSSOrigin2_Phoebe_Biome2 = Eurytus
		#RSSOrigin2_Phoebe_Biome3 = Admetus
		#RSSOrigin2_Phoebe_Biome4 = Clytius
		#RSSOrigin2_Phoebe_Biome5 = Peleus
		#RSSOrigin2_Phoebe_Biome6 = Surface

		#RSSOrigin2_Janus_name = Janus
		#RSSOrigin2_Janus_desc = Janus is an inner satellite of Saturn. It is also known as Saturn X. It is named after the mythological Janus. Janus looks similar to its co-orbiter, Epimetheus.
		#RSSOrigin2_Janus_Biome1 = Idas
		#RSSOrigin2_Janus_Biome2 = Lynceus
		#RSSOrigin2_Janus_Biome3 = Castor
		#RSSOrigin2_Janus_Biome4 = Phoibe
		#RSSOrigin2_Janus_Biome5 = Trailing Hemisphere
		#RSSOrigin2_Janus_Biome6 = Leading Hemisphere

		#RSSOrigin2_Epimetheus_name = Epimetheus
		#RSSOrigin2_Epimetheus_desc = Epimetheus is an inner satellite of Saturn. It is also known as Saturn XI. It is named after the mythological Epimetheus, brother of Prometheus. Epimetheus is in the same orbit as, and was originally mistaken for, Janus.
		#RSSOrigin2_Epimetheus_Biome1 = Hilairea
		#RSSOrigin2_Epimetheus_Biome2 = Pollux
		#RSSOrigin2_Epimetheus_Biome3 = Northern Hemisphere
		#RSSOrigin2_Epimetheus_Biome4 = Southern Hemisphere

		#RSSOrigin2_Helene_name = Helene
		#RSSOrigin2_Helene_desc = Helene is a moon of Saturn. It was discovered by Pierre Laques and Jean Lecacheux in 1980 from ground-based observations at Pic du Midi Observatory, and was designated S/1980 S 6. In 1988 it was officially named after Helen of Troy, who was the granddaughter of Cronus (Saturn) in Greek mythology. Helene is also designated Saturn XII (12), which it was given in 1982, and Dione B, because it is co-orbital with Dione and located in its leading Lagrangian point (L4). It is one of four known trojan moons.
		#RSSOrigin2_Helene_Biome1 = Highlands
		#RSSOrigin2_Helene_Biome2 = Northern Hemisphere
		#RSSOrigin2_Helene_Biome3 = Southern Hemisphere

		#RSSOrigin2_Telesto_name = Telesto
		#RSSOrigin2_Telesto_desc = Telesto is a moon of Saturn. It was discovered by Smith, Reitsema, Larson and Fountain in 1980 from ground-based observations, and was provisionally designated S/1980 S 13. In the following months, several other apparitions were observed: S/1980 S 24, S/1980 S 33, and S/1981 S 1. In 1983 it was officially named after Telesto of Greek mythology. It is also designated as Saturn XIII or Tethys B. Telesto is co-orbital with Tethys, residing in Tethys' leading Lagrangian point (L4). This relationship was first identified by Seidelmann et al. in 1981. Another moon, Calypso, resides in the other (trailing) Lagrangian point of Tethys, 60 degrees in the other direction from Tethys. The Saturnian system has two additional trojan moons.
		#RSSOrigin2_Telesto_Biome1 = Equatorial High
		#RSSOrigin2_Telesto_Biome2 = Equatorial Low
		#RSSOrigin2_Telesto_Biome3 = Northern Hemisphere
		#RSSOrigin2_Telesto_Biome4 = Southern Hemisphere

		#RSSOrigin2_Calypso_name = Calypso
		#RSSOrigin2_Calypso_desc = Calypso is a moon of Saturn. It was discovered in 1980, from ground-based observations, by Dan Pascu, P. Kenneth Seidelmann, William A. Baum, and Douglas G. Currie, and was provisionally designated S/1980 S 25 (the 25th satellite of Saturn discovered in 1980). Several other apparitions of it were recorded in the following months: S/1980 S 29, S/1980 S 30, S/1980 S 32, and S/1981 S 2. In 1983 it was officially named after Calypso of Greek mythology. It is also designated Saturn XIV or Tethys C. Calypso is co-orbital with the moon Tethys, and resides in Tethys' trailing Lagrangian point (L5), 60 degrees behind Tethys. This relationship was first identified by Seidelmann et al. in 1981. The moon Telesto resides in the other (leading) Lagrangian point of Tethys, 60 degrees in the other direction from Tethys. Calypso and Telesto have been termed "Tethys trojans", by analogy to the trojan asteroids, and are half of the four presently known trojan moons.
		#RSSOrigin2_Calypso_Biome1 = Equatorial High
		#RSSOrigin2_Calypso_Biome2 = Equatorial Low
		#RSSOrigin2_Calypso_Biome3 = Northern Hemisphere
		#RSSOrigin2_Calypso_Biome4 = Southern Hemisphere

		#RSSOrigin2_Atlas_name = Atlas
		#RSSOrigin2_Atlas_desc = Atlas is an inner satellite of Saturn which was discovered by Richard Terrile in 1980 from Voyager photos and was designated S/1980 S 28. In 1983 it was officially named after Atlas of Greek mythology, because it "holds the rings on its shoulders" like the Titan Atlas held the sky up above the Earth. It is also designated Saturn XV. Atlas is the closest satellite to the sharp outer edge of the A ring, and was long thought to be a shepherd satellite for this ring. However, now it is known that the outer edge of the ring is instead maintained by a 7:6 orbital resonance with the larger but more distant moons Janus and Epimetheus. In 2004 a faint, thin ring, temporarily designated R/2004 S 1, was discovered in the Atlantean orbit.
		#RSSOrigin2_Atlas_Biome1 = Equatorial Ridge
		#RSSOrigin2_Atlas_Biome2 = Northern Hemisphere
		#RSSOrigin2_Atlas_Biome3 = Southern Hemisphere

		#RSSOrigin2_Prometheus_name = Prometheus
		#RSSOrigin2_Prometheus_desc = Prometheus is an inner satellite of Saturn. It was discovered in 1980 (on October 24) from photos taken by the Voyager 1 probe, and was provisionally designated S/1980 S 27. In late 1985 it was officially named after Prometheus, a Titan in Greek mythology. It is also designated Saturn XVI. Prometheus is extremely elongated, measuring approximately 137 km × 81 km × 56 km (85 mi × 50 mi × 35 mi). It has several ridges and valleys and a number of impact craters of about 20 km (12 mi) diameter are visible, but it is less cratered than nearby Pandora, Epimetheus, and Janus. From its very low density and relatively high albedo, it is likely that Prometheus is a very porous icy body. There is much uncertainty in these values, however, and so this remains to be confirmed.
		#RSSOrigin2_Prometheus_Biome1 = Equatorial High
		#RSSOrigin2_Prometheus_Biome2 = Equatorial Low
		#RSSOrigin2_Prometheus_Biome3 = Northern Hemisphere
		#RSSOrigin2_Prometheus_Biome4 = Southern Hemisphere

		#RSSOrigin2_Pandora_name = Pandora
		#RSSOrigin2_Pandora_desc = Pandora is an inner satellite of Saturn. It was discovered in 1980 from photos taken by the Voyager 1 probe, and was provisionally designated S/1980 S 26. In late 1985 it was officially named after Pandora from Greek mythology. It is also designated Saturn XVII. Pandora was thought to be an outer shepherd satellite of the F Ring. However, recent studies indicate that it does not play such a role, and that only Prometheus, the inner shepherd, contributes to the confinement of the narrow ring. It is more heavily cratered than nearby Prometheus, and has at least two large craters 30 kilometres (19 mi) in diameter. The majority of craters on Pandora are shallow as a result of being filled with debris. Ridges and grooves are also present on moon's surface.
		#RSSOrigin2_Pandora_Biome1 = Equatorial High
		#RSSOrigin2_Pandora_Biome2 = Equatorial Low
		#RSSOrigin2_Pandora_Biome3 = Northern Hemisphere
		#RSSOrigin2_Pandora_Biome4 = Southern Hemisphere

		#RSSOrigin2_Pan_name = Pan
		#RSSOrigin2_Pan_desc = Pan is the innermost named moon of Saturn. It is a small, walnut-shaped moon approximately 35 kilometres across and 23 km wide that orbits within the Encke Gap in Saturn's A Ring. Pan is a ring shepherd and is responsible for keeping the Encke Gap free of ring particles. It is sometimes described as having the appearance of a ravioli. It was discovered by Mark R. Showalter in 1990 from analysis of old Voyager 2 probe photos and received the provisional designation S/1981 S 13 because the discovery images dated back to 1981.
		#RSSOrigin2_Pan_Biome1 = Equatorial Ridge
		#RSSOrigin2_Pan_Biome2 = Northern Hemisphere
		#RSSOrigin2_Pan_Biome3 = Southern Hemisphere

		#RSSOrigin2_Ymir_name = Ymir
		#RSSOrigin2_Ymir_desc = Ymir, or Saturn XIX, is the second-largest retrograde irregular moon of Saturn. It was discovered by Brett J. Gladman, et al. in 2000, and given the temporary designation S/2000 S 1. Joint with Paaliaq, its discovery in 2000 was the first detection of an irregular moon of Saturn after the Phoebe discovery a century earlier. It was named in August 2003 after Ymir, who in Norse mythology is the ancestor of all the Jotuns or frost giants.
		#RSSOrigin2_Ymir_Biome1 = Highlands
		#RSSOrigin2_Ymir_Biome2 = Midlands
		#RSSOrigin2_Ymir_Biome3 = Lowlands

		#RSSOrigin2_Paaliaq_name = Paaliaq
		#RSSOrigin2_Paaliaq_desc = Paaliaq is a prograde irregular satellite of Saturn. It was discovered by J. J. Kavelaars, Brett J. Gladman, Jean-Marc Petit, Hans Scholl, Matthew J. Holman, Brian G. Marsden, Philip D. Nicholson and Joseph A. Burns in early October 2000, and given the temporary designation S/2000 S 2. It was named in August 2003 after a fictional shaman in the book The Curse of the Shaman, written by Michael Kusugak, who supplied Kavelaars with the names of giants from Inuit mythology that were used for other Saturnian moons. Paaliaq is thought to be about 29 kilometres in diameter, and orbits Saturn at an average distance of 15.0 million km in 687 days. It is a member of the Inuit group of irregular satellites. It is light red in color, and in the infrared the Paaliapian (Paaliaqan) spectrum is very similar to the Inuit-group satellites Kiviuq and Siarnaq, supporting the thesis of a possible common origin of the Inuit group in the break-up of a larger body. Its light curve has an unusual pattern of four minima, suggesting that it has a very peculiar shape.
		#RSSOrigin2_Paaliaq_Biome1 = Highlands
		#RSSOrigin2_Paaliaq_Biome2 = Midlands
		#RSSOrigin2_Paaliaq_Biome3 = Lowlands

		#RSSOrigin2_Kiviuq_name = Kiviuq
		#RSSOrigin2_Kiviuq_desc = Kiviuq is a prograde irregular satellite of Saturn. It was discovered by J. J. Kavelaars et al. in 2000, and given the temporary designation S/2000 S 5. It was named after Kiviuq, a hero of Inuit mythology. Kiviuq is about 17 km in diameter, and orbits Saturn at an average distance of 11.3 million kilometers in 449 days. It is a member of the Inuit group of irregular satellites. It is light red, and the Kiviupian (Kiviuqan) infrared spectrum is very similar to the Inuit-group satellites Siarnaq and Paaliaq, supporting the thesis of a possible common origin of the Inuit group in the break-up of a larger body. Kiviuq is believed to be in Kozai resonance, cyclically reducing its orbital inclination while increasing the eccentricity and vice versa. Its current orbital elements overlap strongly with Phoebe's orbit, and the moons will likely eventually collide with each other. The light curve amplitude of Kiviuq is large, varying in brightness by over 2 magnitudes. The large amplitude of Kiviuq suggests that it has an elongated shape, and may be a possible contact binary.
		#RSSOrigin2_Kiviuq_Biome1 = Lobe 1
		#RSSOrigin2_Kiviuq_Biome2 = Lobe 2
		#RSSOrigin2_Kiviuq_Biome3 = Neck

		#RSSOrigin2_Albiorix_name = Albiorix
		#RSSOrigin2_Albiorix_desc = Albiorix, also known as Saturn XXVI, is the largest member of the Gallic group and Saturn's third-largest irregular moon. Albiorix was discovered by Holman and colleagues in 2000, and given the temporary designation S/2000 S 11. It was named in August 2003 for Albiorix, "a Gallic giant who was considered to be the king of the world." The name is known from an inscription found near the French town of Sablet which connects him with the Roman god Mars. It is still unclear if Albiorix was just an honorific suffix (lit. "Mars, king of the world") or a Celtic deity interpretatio with Mars.
		#RSSOrigin2_Albiorix_Biome1 = Highlands
		#RSSOrigin2_Albiorix_Biome2 = Midlands
		#RSSOrigin2_Albiorix_Biome3 = Lowlands

		#RSSOrigin2_Siarnaq_name = Siarnaq
		#RSSOrigin2_Siarnaq_desc = Siarnaq is the second-largest irregular moon of Saturn. It was discovered on 23 September 2000 by a team of astronomers led by Brett J. Gladman. It was named after the Inuit goddess of the sea, Siarnaq, who is more commonly known as Sedna. Siarnaq is the largest member of Saturn's Inuit group of prograde irregular moons, which orbit far from Saturn in the same direction as the planet's rotation. The moons of the Inuit group are believed to have originated as fragments from the collisional breakup of a larger progenitor moon after it was gravitationally captured into orbit around Saturn several billion years ago. Several other small Inuit group moons share similar orbits to Siarnaq, indicating that the moon had experienced another collision after forming from its progenitor.
		#RSSOrigin2_Siarnaq_Biome1 = Highlands
		#RSSOrigin2_Siarnaq_Biome2 = Midlands
		#RSSOrigin2_Siarnaq_Biome3 = Lowlands

		#RSSOrigin2_Methone_name = Methone
		#RSSOrigin2_Methone_desc = Methone is a small, egg-shaped moon of Saturn that orbits out past Saturn's ring system, between the orbits of Mimas and Enceladus. It was discovered in 2004, though it wasn't until 2012 that it was imaged in detail by the Cassini spacecraft.
		#RSSOrigin2_Methone_Biome1 = Equatorial High
		#RSSOrigin2_Methone_Biome2 = Equatorial Low
		#RSSOrigin2_Methone_Biome3 = Polar Regions

		#RSSOrigin2_Pallene_name = Pallene
		#RSSOrigin2_Pallene_desc = Pallene is a very small natural satellite of Saturn. It is one of three small moons known as the Alkyonides that lie between the orbits of the larger Mimas and Enceladus.
		#RSSOrigin2_Pallene_Biome1 = Equatorial High
		#RSSOrigin2_Pallene_Biome2 = Equatorial Low
		#RSSOrigin2_Pallene_Biome3 = Polar Regions

		#RSSOrigin2_Polydeuces_name = Polydeuces
		#RSSOrigin2_Polydeuces_desc = Polydeuces, or Saturn XXXIV, is a small natural satellite of Saturn that is co-orbital with the moon Dione and librates around its trailing Lagrangian point (L5). Its diameter is estimated to be 2–3 km. Dione's other co-orbital moon is Helene, which is bigger and located at the leading L4 point.
		#RSSOrigin2_Polydeuces_Biome1 = Equatorial High
		#RSSOrigin2_Polydeuces_Biome2 = Equatorial Low
		#RSSOrigin2_Polydeuces_Biome3 = Polar Regions

		#RSSOrigin2_Daphnis_name = Daphnis
		#RSSOrigin2_Daphnis_desc = Daphnis is an inner satellite of Saturn. It is also known as Saturn XXXV; its provisional designation was S/2005 S 1. Daphnis is about 8 kilometers in diameter, and orbits the planet in the Keeler Gap within the A ring.
		#RSSOrigin2_Daphnis_Biome1 = Equatorial Ridge
		#RSSOrigin2_Daphnis_Biome2 = Northern Hemisphere
		#RSSOrigin2_Daphnis_Biome3 = Southern Hemisphere

		#RSSOrigin2_Anthe_name = Anthe
		#RSSOrigin2_Anthe_desc = Anthe is a very small natural satellite of Saturn lying between the orbits of Mimas and Enceladus.
		#RSSOrigin2_Anthe_Biome1 = Equatorial High
		#RSSOrigin2_Anthe_Biome2 = Equatorial Low
		#RSSOrigin2_Anthe_Biome3 = Polar Regions

		#RSSOrigin2_Aegaeon_name = Aegaeon
		#RSSOrigin2_Aegaeon_desc = Aegaeon, or Saturn LIII (provisional designation S/2008 S 1), is a natural satellite of Saturn. It is thought to be similarly smooth as Methone. It orbits between Janus and Mimas within Saturn's G Ring.
		#RSSOrigin2_Aegaeon_Biome1 = Equatorial High
		#RSSOrigin2_Aegaeon_Biome2 = Equatorial Low
		#RSSOrigin2_Aegaeon_Biome3 = Polar Regions

		#RSSOrigin2_Cordelia_name = Cordelia
