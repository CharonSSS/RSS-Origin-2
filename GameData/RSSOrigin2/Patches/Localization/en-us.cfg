		#RSSOrigin2_Caliban_name = Caliban
		#RSSOrigin2_Caliban_desc = Caliban is the second-largest irregular satellite of Uranus. It was discovered on 6 September 1997 by Brett J. Gladman, Philip D. Nicholson, Joseph A. Burns, and John J. Kavelaars using the 200-inch Hale Telescope together with Sycorax and given the temporary designation S/1997 U 1. Designated Uranus XVI, it was named after the monster character in William Shakespeare's play The Tempest.
