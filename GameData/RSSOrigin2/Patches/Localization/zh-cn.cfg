		#RSSOrigin2_Braille_name = 布莱叶（Braille）
		#RSSOrigin2_Braille_desc = 布莱叶（Braille）（小行星编号：9969 Braille，临时编号：1992 KD），是一颗来自小行星带最内区域的偏心、罕见类型且拉长的小行星，被归类为火星穿越者和慢自转天体，直径约 1-2 公里。它于 1992 年由帕洛马天文台的天文学家发现，后以盲文发明者路易·布莱叶命名。1999 年深空 1 号探测器对其进行了近距拍摄，但故障导致图像模糊不清。
