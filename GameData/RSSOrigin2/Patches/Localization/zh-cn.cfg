		#RSSOrigin2_Hektor_Biome4 = 大叶瓣南半球
		#RSSOrigin2_Hektor_Biome5 = 小叶瓣南半球
		#RSSOrigin2_Hektor_Biome6 = 撞击坑

		#RSSOrigin2_Skamandrios_name = 斯卡曼德里俄斯（Skamandrios）
		#RSSOrigin2_Skamandrios_desc = 斯卡曼德里俄斯（小行星编号：S/2006 （624） 1）,2006 年探测到一颗直径 10-15 公里的卫星绕 624 赫克托运行，命名为斯卡曼德里俄斯，半长轴 623.5 公里，轨道周期 2.9651 天（71.162 小时）。2011 年 11 月通过凯克观测确认，2017 年 3 月 12 日命名。未提供质量估计，但如果两个天体密度相同，等效体积表明约 8.74×10¹⁴ 公斤的近似质量。其轨道高度倾斜且偏心，自转很可能是混沌的。马尔基斯等人（2014）推测它是在一次低速碰撞产生双叶主星后被弹射出来的。新合并的主星可能自转足够快以至于不稳定并脱落了一些质量。斯卡曼德里俄斯的动力学可用限制性四体问题来建模。
		#RSSOrigin2_Skamandrios_Biome1 = 高地
		#RSSOrigin2_Skamandrios_Biome2 = 中地
