		#RSSOrigin2_Siarnaq_name = 土卫二十九（Siarnaq）
		#RSSOrigin2_Siarnaq_desc = 土卫二十九（Siarnaq）是土星第二大不规则卫星。2000 年 9 月 23 日由布雷特·J·格拉德曼领导的天文学家团队发现。以因纽特海洋女神西亚尔纳克命名，她更为人知的名字是赛德娜。土卫二十九是土星顺行不规则卫星因纽特群的最大成员，这些卫星远离土星，沿与行星自转相同的方向运行。因纽特群卫星被认为是数十亿年前被引力捕获到绕土星轨道后，从一个更大的母卫星碰撞分裂的碎片。其他几颗小型因纽特群卫星与土卫二十九共享类似的轨道，表明该卫星在从其母体形成后又经历了另一次碰撞。
