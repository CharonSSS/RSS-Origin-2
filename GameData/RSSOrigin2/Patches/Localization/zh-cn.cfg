		#RSSOrigin2_Eugenia_name = 香女星（Eugenia）
		#RSSOrigin2_Eugenia_desc = 香女星（Eugenia）（45 Eugenia）是小行星带的一颗大小行星。它因是最早被发现拥有卫星的小行星之一而闻名。它也是继 87 茜尔维亚之后第二个被发现的三重小行星。
