		#RSSOrigin2_Leleakuhonua_name = 哥布林（Leleākūhonua）
		#RSSOrigin2_Leleakuhonua_desc = 哥布林（Leleākūhonua）（小行星编号：541132 Leleākūhonua，临时编号 2015 TG387）是一颗极端海外天体和赛德娜族天体，位于太阳系最外区域。它于 2015 年 10 月 13 日由夏威夷莫纳克亚天文台的天文学家首次观测。基于其接近万圣节的发现日期及其临时编号 2015 TG387 的字母，该天体被其发现者非正式地昵称为"地精"，后命名为勒莱阿库霍努阿，将其轨道比作太平洋金鸻的飞翔。它是继赛德娜和 2012 VP113 之后发现的第三颗赛德娜族天体，直径约 220 公里。
