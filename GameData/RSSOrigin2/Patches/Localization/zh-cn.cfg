		#RSSOrigin2_C-1992J1_name = C/1992 J1（Spacewatch）
		#RSSOrigin2_C-1992J1_desc = C/1992 J1（Spacewatch）是一颗由空间监测计划的大卫·拉比诺维茨于 1992 年 5 月 1 日发现的彗星。这是首颗使用自动化系统发现的彗星。
