		#RSSOrigin2_Thebe_name = 木卫十四（Thebe）
		#RSSOrigin2_Thebe_desc = 木卫十四（Thebe），又称 Jupiter XIV，按距离木星由近到远排列是木星的第四颗卫星。1979 年 3 月 5 日，旅行者 1 号探测器在飞掠木星时拍摄的图像中，由斯蒂芬·P·辛诺特发现。1983 年，它被正式以神话中的仙女忒柏命名。作为木星内卫星中第二大者，木卫十四在忒柏薄纱环的外缘内运行，该环由其表面喷出的尘埃形成。它形状不规则，呈红色，人们认为它像木卫五一样由多孔水冰和未知数量的其他物质组成。其表面特征包括大型陨石坑和高山——其中一些与卫星本身的大小相当。
