		#RSSOrigin2_Nereid_name = 海卫二（Nereid）
		#RSSOrigin2_Nereid_desc = 海卫二（Nereid），即 Neptune II，是海王星第三大卫星。它是太阳系所有已知卫星中轨道偏心率最大的。1949 年由杰拉德·柯伊伯发现，是海王星第二颗被发现的卫星。
