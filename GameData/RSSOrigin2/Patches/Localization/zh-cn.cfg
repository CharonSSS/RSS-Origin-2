		#RSSOrigin2_Perdita_name = 天卫二十五（Perdita）
		#RSSOrigin2_Perdita_desc = 天卫二十五（Perdita）是天王星的一颗内卫星。天卫二十五的发现过程曲折。天卫二十五的第一批照片由旅行者 2 号航天器于 1986 年拍摄，但十多年来一直未从照片中识别出来。1999 年，埃里希·卡尔科施卡注意到并报告了这颗卫星。但由于无法拍摄更多照片来确认其存在，2001 年它被正式降级。然而，2003 年哈勃太空望远镜拍摄的照片成功在预计天卫二十五应处的位置捕捉到一个天体，最终确认了它的存在。
