		#RSSOrigin2_C-2012C1_Biome3 = 低地

		#RSSOrigin2_Bernardinelli-Bernstein_name = C/2014 UN271（伯纳迪内利–伯恩斯坦）
		#RSSOrigin2_Bernardinelli-Bernstein_desc = C/2014 UN271（伯纳迪内利-伯恩斯坦），简称 C/2014 UN271 或伯纳迪内利-伯恩斯坦彗星（昵称 BB），是一颗大型奥尔特云彗星，由天文学家佩德罗·伯纳迪内利和加里·伯恩斯坦在暗能量巡天的档案图像中发现。2014 年 10 月首次成像时，该天体距太阳 29 AU（43 亿公里），几乎与海王星轨道一样远，是迄今发现彗星的最大距离。彗核直径至少 120 公里，是已知最大的奥尔特云彗星。它正接近太阳，将于 2031 年 1 月到达近日点 10.9 AU（土星轨道外不远处）。由于不会进入内太阳系，肉眼不可见。
		#RSSOrigin2_Bernardinelli-Bernstein_Biome1 = 高地
		#RSSOrigin2_Bernardinelli-Bernstein_Biome2 = 中地
		#RSSOrigin2_Bernardinelli-Bernstein_Biome3 = 低地

		#RSSOrigin2_1I-'Oumuamua_name = 奥陌陌（1I/2017 U1）
		#RSSOrigin2_1I-'Oumuamua_desc = 奥陌陌是首个被探测到穿越太阳系的星际天体。正式编号 1I/2017 U1，由罗伯特·维里克使用泛星计划望远镜于 2017 年 10 月 19 日在夏威夷哈莱阿卡拉天文台发现，距其 9 月 9 日最接近太阳约 40 天后。首次观测时距地球约 3300 万公里（0.22 AU，约地月距离的 85 倍），且已在远离太阳。
		#RSSOrigin2_1I-'Oumuamua_Biome1 = 赤道脊
		#RSSOrigin2_1I-'Oumuamua_Biome2 = 极区

		#RSSOrigin2_2I-Borisov_name = 鲍里索夫彗星（2I/Borisov）
		#RSSOrigin2_2I-Borisov_desc = 鲍里索夫彗星（正式编号：2I/Borisov，原编号 C/2019 Q4（Borisov）），是首颗被观测的流浪彗星，也是继奥陌陌之后第二颗被观测的星际闯入者。它由克里米亚业余天文学家、望远镜制造商根纳季·鲍里索夫于 2019 年 8 月 29 日 UTC（当地时间 8 月 30 日）发现。2I/鲍里索夫的日心轨道偏心率为 3.36，不绑定于太阳。该彗星于 2019 年 10 月底穿过太阳系黄道面，并于 2019 年 12 月 8 日在略高于 2 AU 处最接近太阳。2019 年 12 月 28 日最接近地球。2019 年 11 月，耶鲁大学天文学家称该彗星尾巴是地球大小的 14 倍，并表示："意识到地球相对于这位来自另一太阳系的访客有多小，令人谦卑。"2020 年 3 月中旬观测到彗星碎裂；4 月又报告了更多碎裂证据。
		#RSSOrigin2_2I-Borisov_Biome1 = 高地
		#RSSOrigin2_2I-Borisov_Biome2 = 低地

		#RSSOrigin2_3I-ATLAS_name = 亚特拉斯彗星（3I/ATLAS）
		#RSSOrigin2_3I-ATLAS_desc = 亚特拉斯彗星（正式编号：3I/ATLAS）亦称 C/2025 N1（ATLAS），原名 A11pl3Z，是一颗星际彗星，由小行星陆地撞击最后警报系统（ATLAS）站于 2025 年 7 月 1 日发现。该彗星沿不受约束的双曲轨道绕过太阳，并以 1.8 AU 距离飞掠地球，不构成威胁。前缀"3I"表明它是继 1I/奥陌陌和 2I/鲍里索夫之后第三颗确认穿越太阳系的星际天体。3I/ATLAS 是一颗活跃彗星，由固体冰冷彗核和彗发（从彗核逸出的气体和冰尘云）组成。太阳加热彗核使冰升华成气体，气体喷出并从彗星表面带起尘埃形成彗发，从而造成彗星的活动。哈勃空间望远镜和各行星际航天器拍摄的图像表明 3I/ATLAS 彗核直径小于 1 公里。詹姆斯·韦伯空间望远镜（JWST）观测显示 3I/ATLAS 异常富含二氧化碳，并含少量水冰、水蒸气、一氧化碳和氧硫化碳。甚大望远镜观测还显示 3I/ATLAS 正在排放氰化气体和原子镍蒸气，浓度与太阳系彗星中所见相似。该彗星于 2025 年 10 月 21 日到达太阳合，并于 2025 年 10 月 29 日最接近太阳，距太阳 1.36 AU（2.03 亿公里），位于地球和火星轨道之间。该彗星似乎来自银河系薄盘或厚盘；如果 3I/ATLAS 起源于厚盘，该彗星可能至少有 70 亿年历史——比太阳系还古老。
		#RSSOrigin2_3I-ATLAS_Biome1 = 高地
		#RSSOrigin2_3I-ATLAS_Biome2 = 低地
