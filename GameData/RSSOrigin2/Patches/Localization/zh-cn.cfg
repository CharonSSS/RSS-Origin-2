		#RSSOrigin2_Patroclus_name = 帕特罗克洛斯（Patroclus）
		#RSSOrigin2_Patroclus_desc = 帕特罗克洛斯（Patroclus）（小行星编号：617 Patroclus）是一颗大型双星木星特洛伊小行星。它是一颗暗 D 型小行星和慢自转天体，因为两个组成部分的轨道周期为 103 小时。它是露西号航天器目标的五颗木星小行星之一，计划于 2033 年飞掠。
