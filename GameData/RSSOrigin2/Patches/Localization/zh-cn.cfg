		#RSSOrigin2_Orus_name = 俄鲁斯（Orus）
		#RSSOrigin2_Orus_desc = 俄鲁斯（Orus）（小行星编号：21900 Orus）是一颗来自希腊营的木星特洛伊小行星，直径约 53 公里，是露西号任务将于 2028 年 11 月拜访的目标。这颗暗黑的木星小行星属于最大 100 颗木星特洛伊之一，自转周期 13.5 小时。它于 1999 年 11 月 9 日由日本业余天文学家小林隆男在其私人的群马县大泉天文台发现，后以《伊利亚特》中被杀的阿开奥斯战士俄鲁斯命名。
