		#RSSOrigin2_'Aylo'chaxnim_Biome3 = 低地

		#RSSOrigin2_2005HC4_name = 2005 HC4
		#RSSOrigin2_2005HC4_desc = 2005 HC4 是已知绕太阳运行的天体中（掠日彗星除外）近日点最小的小行星。其极端轨道偏心率使其距太阳仅 0.071 AU（水星近日点的 23%），远至 3.562 AU（远超火星轨道）。由于其极小的近日点和相对较大的远日点，2005 HC4 在近日点达到 157 公里/秒（565000 公里/小时）的速度，是已知绑定于太阳系的小行星中最快的（然而有些彗星获得更高速度）。
		#RSSOrigin2_2005HC4_Biome1 = 高地
