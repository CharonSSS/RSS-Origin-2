		#RSSOrigin2_Atlas_name = 土卫十五（Atlas）
		#RSSOrigin2_Atlas_desc = 土卫十五（Atlas）是土星的一颗内卫星，1980 年由理查德·特里尔从旅行者号照片中发现，编号为 S/1980 S 28。1983 年正式以希腊神话中的阿特拉斯命名，因为它"用肩膀托着环"，就像泰坦阿特拉斯托起天空一样。它也被编号为 Saturn XV。土卫十五是距离 A 环锐利外缘最近的卫星，长期以来被认为是该环的牧羊卫星。然而，现在已知环的外缘实际上由与更大但更远的卫星土卫十和土卫十一的 7:6 轨道共振来维持。2004 年，在土卫十五的轨道上发现了一个暗淡的薄环，临时编号为 R/2004 S 1。
