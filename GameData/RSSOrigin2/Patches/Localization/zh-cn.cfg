		#RSSOrigin2_Logos_desc = 罗各斯（Logos）（小行星编号：58534 Logos），或作为联星系统 （58534） Logos-Zoe，是来自经典柯伊伯带的海外天体和联星系统，直径约 77 公里。这颗明亮经典柯伊伯带天体属于冷族群，有一颗 66 公里大小的伴星佐伊。系统质量为 （4.58±0.07）×10¹⁷ 公斤。在诺斯替传统中，罗各斯和佐伊是神祇的成对流溢，是其创世神话的一部分。
