		#RSSOrigin2_Carme_name = 木卫十一（Carme）
		#RSSOrigin2_Carme_desc = 木卫十一（Carme）于 1938 年 7 月由塞思·巴恩斯·尼科尔森在加利福尼亚州威尔逊山天文台发现。它以神话中的卡耳墨命名，她是宙斯与克里特女神布里托玛耳提斯的母亲。木卫十一直到 1975 年才获得现在的名字；此前它仅被称为 Jupiter XI。在 1955 年至 1975 年间，它有时被称为"潘"（潘现在是土星一颗卫星的名字）。
