		#RSSOrigin2_G!kun'homdima_name = 雹神星（Gǃkúnǁʼhòmdímà）
		#RSSOrigin2_G!kun'homdima_desc = 雹神星（Gǃkúnǁʼhòmdímà）（小行星编号：229762 Gǃkúnǁʼhòmdímà，临时编号 2007 UK126）是一颗海外天体和联星系统，来自扩展散射盘，位于太阳系最外区域。它于 2007 年 10 月 19 日由美国天文学家梅根·施万布、迈克尔·布朗和戴维·拉比诺维茨在加利福尼亚州帕洛马天文台发现，直径约 600 公里。这颗中等大小的海外天体似乎代表了直径约 1000 公里以下、未塌缩为完全固态天体的一类中等大小天体。其 100 公里卫星由基思·诺尔、威尔·格伦迪及其同事于 2008 年用哈勃空间望远镜发现，命名为 Gǃòʼé ǃHú。
		#RSSOrigin2_G!kun'homdima_Biome1 = 撞击坑
		#RSSOrigin2_G!kun'homdima_Biome2 = 南极区
		#RSSOrigin2_G!kun'homdima_Biome3 = 北极区
		#RSSOrigin2_G!kun'homdima_Biome4 = 赤道隆起
