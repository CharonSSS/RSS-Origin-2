		#RSSOrigin2_G!o'e!Hu_name = 雹卫一（Gǃòʼé ǃHú）
		#RSSOrigin2_G!o'e!Hu_desc = 雹神星（Gǃkúnǁʼhòmdímà）有一颗已知卫星雹卫一（Gǃòʼé ǃHú），是已知最红的海外天体之一。大小和质量只能推断。两者星等差为 3.24±0.04 等。假设反照率相同，这对应直径差为 4.45±0.08 倍。红色卫星通常反照率低于主星，尽管这颗卫星是否如此尚不清楚。这种不确定性不影响 雹神星（Gǃkúnǁʼhòmdímà） 的密度计算，因为 Gǃòʼé ǃHú 仅占总容积约 1%，因此不如 雹神星（Gǃkúnǁʼhòmdímà） 直径的不确定性重要。
		#RSSOrigin2_G!o'e!Hu_Biome1 = 撞击坑
