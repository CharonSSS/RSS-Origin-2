		#RSSOrigin2_Echidna_name = 台卫一（Echidna）
		#RSSOrigin2_Echidna_desc = 2006 年确认了一颗大型卫星。它以提丰的怪物配偶厄喀德娜命名（正式编号 （42355） Typhon I）。它在距提丰 1628±29 公里处绕行，完成一圈轨道需 18.9709±0.0064 天。其直径估计为 89±6 公里。厄喀德娜与提丰颜色相同。
