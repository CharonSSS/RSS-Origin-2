		#RSSOrigin2_Hidalgo_Biome5 = 北半球
		#RSSOrigin2_Hidalgo_Biome6 = 南半球

		#RSSOrigin2_Gaspra_name = 加斯普拉（Gaspra）
		#RSSOrigin2_Gaspra_desc = 加斯普拉（Gaspra）（小行星编号：951 Gaspra）是一颗 S 型小行星，其轨道非常接近小行星带的内边缘。1916 年由俄罗斯天文学家 G·N·涅乌伊明发现。涅乌伊明以加斯普拉命名，这是一个黑海度假胜地，他的同时代人如高尔基和托尔斯泰都曾到访。1991 年 10 月 29 日，伽利略号航天器在前往木星途中飞掠加斯普拉，使其成为第一颗被近距离接近的小行星。
		#RSSOrigin2_Gaspra_Biome1 = 隆起
		#RSSOrigin2_Gaspra_Biome2 = 北半球
		#RSSOrigin2_Gaspra_Biome3 = 南半球

		#RSSOrigin2_Ganymed_name = 伽倪墨得斯（Ganymed）
		#RSSOrigin2_Ganymed_desc = 伽倪墨得斯（Ganymed）（小行星编号：1036 Ganymed，临时编号：1924 TD），是一颗轨道高度偏心的石质小行星，被归类为阿莫尔群的近地天体。1924 年 10 月 23 日由德国天文学家沃尔特·巴德在汉堡贝格多夫天文台发现，以希腊神话中的伽倪墨得斯命名。直径约 35 公里（22 英里），伽倪墨得斯是所有近地天体中最大的，但不穿越地球轨道。这颗 S 型小行星的自转周期为 10.3 小时。预计 2024 年 10 月将以 56000000 公里（35000000 英里；0.374097 AU）的距离接近地球。
		#RSSOrigin2_Ganymed_Biome1 = 高地
		#RSSOrigin2_Ganymed_Biome2 = 中地
		#RSSOrigin2_Ganymed_Biome3 = 低地

		#RSSOrigin2_Atami_name = 热海（Atami）
		#RSSOrigin2_Atami_desc = 热海（Atami）（小行星编号：1139 Atami，临时编号：1929 XE），是一颗石质小行星和较大的火星穿越者，也是一个同步双星系统，位于小行星带最内区域，直径约 9 公里。1929 年 12 月 1 日由日本天文学家及川奥郎和久保川一夫在东京附近的东京天文台发现。以日本城市热海命名。它在与它同样大的小行星中与火星的最小轨道交叉距离（MOID）最低，其轨道仅距该行星 0.03 天文单位。
		#RSSOrigin2_Atami_Biome1 = 高地
