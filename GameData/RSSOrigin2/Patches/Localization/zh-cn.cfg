		#RSSOrigin2_Interamnia_Biome6 = 南半球

		#RSSOrigin2_Hidalgo_name = 希达尔戈（Hidalgo）
		#RSSOrigin2_Hidalgo_desc = 希达尔戈（Hidalgo）（小行星编号：944 Hidalgo）是一颗半人马族天体，在小行星带和外太阳系之间的偏心、类彗星轨道上运行的不寻常天体，直径约 52 公里（32 英里）。1920 年由德国天文学家沃尔特·巴德发现，是迄今发现的第一颗半人马族动力学类别天体。这颗暗 D 型天体的自转周期为 10.1 小时，形状可能拉长。以墨西哥革命家米格尔·伊达尔戈·伊·科斯蒂利亚命名。
		#RSSOrigin2_Hidalgo_Biome1 = 撞击坑
