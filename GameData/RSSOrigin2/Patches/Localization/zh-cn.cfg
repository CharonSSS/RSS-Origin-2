		#RSSOrigin2_Huya_name = 雨神星（Huya）
		#RSSOrigin2_Huya_desc = 雨神星（Huya）（小行星编号：38628 Huya，临时编号 2000 EB173）是一颗位于柯伊伯带的联星海外天体。雨神被归类为冥族小天体，即与海王星 3:2 轨道共振的一类海外天体。它由类星体赤道巡天团队发现，并由委内瑞拉天文学家伊格纳西奥·费林于 2000 年 3 月确认。它以南美洲原住民瓦尤人神话中的雨神胡亚命名。
