		#RSSOrigin2_Gonggong_name = 共工星（Gonggong）
		#RSSOrigin2_Gonggong_desc = 共工星（Gonggong）（小行星编号：225088 Gonggong，临时编号 2007 OR10）是一颗矮行星，海王星之外黄道离散盘的成员。它的轨道高度偏心且倾斜，距太阳 34-101 天文单位（51-151 亿公里）。截至 2019 年，其距太阳 88 AU（132 亿公里），是已知第六远的太阳系天体。共工星与海王星 3:10 轨道共振，即每完成十圈海王星轨道，它完成三圈。共工星于 2007 年 7 月由美国天文学家梅根·施万布、迈克尔·布朗和戴维·拉比诺维茨在帕洛马天文台发现，发现于 2009 年 1 月公布。
