		#RSSOrigin2_S-0000_20000_1_name = 伐卫二（Varuna II）
		#RSSOrigin2_S-0000_20000_1_desc = 2019 年由巴伦苏埃拉等人主导的伐楼拿光变曲线测光观测表明，可能有一颗卫星在近距离绕伐楼拿运行。通过将 2019 年获得的四条独立光变曲线进行傅里叶分析合并，他们得到了一条质量较低、残差较大的光变曲线。结果表明伐楼拿的光变曲线随时间发生微妙变化。他们将合并光变曲线的残差绘制到伦博周期图中，得出可能卫星的轨道周期为 11.9819 小时。卫星在绕伐楼拿运行时亮度变化 0.04 等。假设伐楼拿密度为 1.1 g/cm³ 且卫星被潮汐锁定，团队估计它在 1300-2000 公里处绕伐楼拿运行，恰在伐楼拿估计的洛希极限（约 1000 公里）之外。由于卫星距伐楼拿极近，哈勃空间望远镜等空间望远镜尚无法分辨它，因为伐楼拿与卫星之间的角距离小于现有空间望远镜的分辨率。尽管当前望远镜无法直接观测伐楼拿的卫星，伐楼拿的赤道正以侧向配置被直接观测，暗示未来卫星与伐楼拿之间可能发生相互掩食事件。
