		#RSSOrigin2_Petit-Prince_name = 小王子（Petit-Prince）
		#RSSOrigin2_Petit-Prince_desc = 小王子（Petit-Prince），正式编号 （45） Eugenia I，是小行星 45 香女星较大、较外侧的卫星。1998 年由天文学家在夏威夷莫纳克亚的加法夏望远镜上发现。最初获得临时编号 S/1998 （45） 1。小王子是第一颗用地面望远镜发现的小行星卫星。此前，唯一已知的小行星卫星是达克堤利，由伽利略号探测器在 243 艾达附近发现。
