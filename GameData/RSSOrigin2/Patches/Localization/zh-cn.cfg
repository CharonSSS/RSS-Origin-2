		#RSSOrigin2_G!o'e!Hu_Biome4 = 赤道隆起
		#RSSOrigin2_G!o'e!Hu_Biome5 = 北半球
		#RSSOrigin2_G!o'e!Hu_Biome6 = 南半球

		#RSSOrigin2_2006VW139_name = 2006 VW139
		#RSSOrigin2_2006VW139_desc = （小行星编号：（300163） 2006 VW139，临时编号 2006 VW139，周期彗星编号 288P/2006 VW139）是一颗活跃联星小行星和主带彗星，来自小行星带外区域。该天体于 2006 年由空间监测计划发现。其联星性质于 2016 年 9 月由哈勃空间望远镜确认。主星及其小行星卫星在质量和大小上相近，使其成为真正的联星系统。组件估计直径 1.8 公里，以 104 公里的宽分离距离相互绕行，周期 135 天。
		#RSSOrigin2_2006VW139_Biome1 = 长端
		#RSSOrigin2_2006VW139_Biome2 = 北半球
		#RSSOrigin2_2006VW139_Biome3 = 南半球

		#RSSOrigin2_S-2011_300163_1_name = S/2011 （300163） 1
		#RSSOrigin2_S-2011_300163_1_desc = 2006 VW139 于 2011 年 12 月首次被哈勃空间望远镜（HST）观测。2016 年 9 月在它最接近太阳之前 HST 对其成像，确认了其两颗小行星相互绕行的联星性质，并揭示了持续的彗星活动。这使该天体成为已知第一颗也被归类为主带彗星的联星小行星。该联星被认为是 YORP 驱动自转加速导致的前身天体分裂的结果。
		#RSSOrigin2_S-2011_300163_1_Biome1 = 长端
		#RSSOrigin2_S-2011_300163_1_Biome2 = 北半球
		#RSSOrigin2_S-2011_300163_1_Biome3 = 南半球

		#RSSOrigin2_Mani_name = 玛尼（Máni）
		#RSSOrigin2_Mani_desc = 玛尼（Máni）（小行星编号：307261 Máni，临时编号 2002 MS4）是柯伊伯带中的一颗大型海外天体——海王星之外的冰冷微行星区域。它于 2002 年 6 月 18 日由查德·特鲁希略和迈克尔·布朗在帕洛马天文台搜寻冥王星大小的柯伊伯带天体时发现。玛尼直径约 800 公里，足够大，一些天文学家认为它可能是矮行星。
