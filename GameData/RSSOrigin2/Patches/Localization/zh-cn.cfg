		#RSSOrigin2_Selam_Biome3 = 颈部

		#RSSOrigin2_2001SN263_name = 2001 SN263
		#RSSOrigin2_2001SN263_desc = （153591） 2001 SN263 是一颗碳质三联小行星，被归类为近地天体和 Amor 群前潜在危险小行星，直径约 2.6 公里。它于 2001 年 9 月 20 日由林肯近地小行星研究项目在新墨西哥州索科罗的林肯实验室实验测试场发现。两颗同步小行星卫星分别约 770 米和 430 米，轨道周期分别为 16.46 和 150 小时。
