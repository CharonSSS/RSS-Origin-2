		#RSSOrigin2_Leucus_name = 琉刻斯星（Leucus）
		#RSSOrigin2_Leucus_desc = 琉刻斯星（Leucus）（小行星编号：11351 Leucus）是一颗来自希腊营的木星特洛伊中型小行星，直径约 40 公里。它是露西号任务的目标，计划于 2028 年 4 月飞掠。这颗假定的 D 型小行星自转极慢，自转周期达 466 小时。它于 1997 年 10 月 12 日由北京施密特 CCD 小行星巡天计划（SCAP）在河北省兴隆站发现，后以希腊神话中的阿开奥斯战士勒乌库斯命名。
