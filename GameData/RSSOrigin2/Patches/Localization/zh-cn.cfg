		#RSSOrigin2_Pan_name = 土卫十八（Pan）
		#RSSOrigin2_Pan_desc = 土卫十八（Pan）是土星最内侧的已命名卫星。它是一颗小型的、核桃状的卫星，直径约 35 公里，宽 23 公里，在土星 A 环的恩克环缝内运行。土卫十八是一颗环牧羊卫星，负责保持恩克环缝中没有环颗粒。它有时被描述为具有意大利饺子的外观。1990 年由马克·R·肖沃尔特通过分析旧的旅行者 2 号探测器照片发现，因发现图像可追溯到 1981 年，故获得临时编号 S/1981 S 13。
