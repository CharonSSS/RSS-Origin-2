		#RSSOrigin2_S-2004_45_1_name = S/2004 （45） 1
		#RSSOrigin2_S-2004_45_1_desc = 一颗比小王子更小（估计直径 6 公里）、更靠近香女星运行的第二颗卫星此后被发现，临时编号为 S/2004 （45） 1。它由弗兰克·马尔基斯及其 IMCCE 合作者通过分析 2004 年 2 月在智利欧洲南方天文台（ESO）塞罗帕拉纳尔 8.2 米 VLT"叶潘"望远镜拍摄的三张图像而发现。该发现于 2007 年 3 月 7 日在 IAUC 8817 中公布。它以约 700 公里的距离绕小行星运行，轨道周期 4.7 天。
