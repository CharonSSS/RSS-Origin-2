		#RSSOrigin2_Thebe_Biome5 = 低地

		#RSSOrigin2_Adrastea_name = 木卫十五（Adrastea）
		#RSSOrigin2_Adrastea_desc = 木卫十五（Adrastea），又称 Jupiter XV，按距离排列是木星四颗内卫星中第二近的，也是最小的一颗。它于 1979 年在旅行者 2 号拍摄的照片中被发现，使其成为第一颗从行星际航天器拍摄的图像中发现的天然卫星，而非通过望远镜发现。它的正式名称来自神话中的阿德剌斯忒亚，她是希腊神宙斯（即罗马神朱庇特）的养母。木卫十五是太阳系中少数已知轨道周期短于其母行星自转周期的卫星之一。它在木星主环的边缘运行，被认为是木星环物质的主要贡献者。尽管伽利略号航天器在 1990 年代进行了观测，但除了其大小和与木星潮汐锁定的事实外，人们对该卫星的物理特性知之甚少。
