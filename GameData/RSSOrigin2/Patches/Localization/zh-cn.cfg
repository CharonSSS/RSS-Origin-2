		#RSSOrigin2_YORP_name = YORP
		#RSSOrigin2_YORP_desc = YORP（小行星编号：54509 YORP，临时编号 2000 PH5）是一颗地球共轨小行星，于 2000 年 8 月 3 日由林肯实验室近地小行星研究（LINEAR）团队在新墨西哥州索科罗的林肯实验室实验测试场发现。对该天体自转速率的测量提供了 YORP 效应的首个观测证据，小行星由此得名。该小行星的自转速率以 （2.0 ± 0.2） × 10⁻⁴ 度/天² 的速率增加，2001 至 2005 年间导致小行星比 2001 年自转速率预测多转了约 250°。对该小行星的模拟表明，它可能在预期寿命接近终结时达到约 20 秒的自转周期，这有 75% 的概率在未来 3500 万年内发生。模拟还排除了与地球近距离相遇导致自转加速的可能性。
