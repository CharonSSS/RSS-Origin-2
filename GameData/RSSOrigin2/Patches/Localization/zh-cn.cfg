		#RSSOrigin2_Lutetia_desc = 司琴星（Lutetia）（小行星编号：21 Lutetia）是主小行星带的一颗大型 M 型小行星。直径约 100 公里（长轴 120 公里）。1852 年由赫尔曼·戈尔德施密特发现，以巴黎的拉丁名卢泰西亚命名。
