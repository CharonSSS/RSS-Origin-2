		#RSSOrigin2_Pallas_Biome6 = 南半球

		#RSSOrigin2_Juno_name = 婚神星（Juno）
		#RSSOrigin2_Juno_desc = 婚神星（Juno）（3 Juno）是主小行星带的一颗大小行星。婚神星是 1804 年由德国天文学家卡尔·哈丁发现的第三颗小行星。它是二十大大小行星之一，也是与 15 尤诺米亚并列的两颗最大的石质（S 型）小行星之一。估计含有小行星带总质量的 1%。
