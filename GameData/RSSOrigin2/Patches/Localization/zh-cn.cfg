		#RSSOrigin2_Themisto_name = 木卫十八（Themisto）
		#RSSOrigin2_Themisto_desc = 木卫十八（Themisto），又称 Jupiter XVIII，是木星最内侧的中型不规则卫星之一。木卫十八最初由查尔斯·T·科瓦尔和伊丽莎白·罗默于 1975 年 9 月 30 日发现，10 月 3 日报告，编号为 S/1975 J 1。然而，由于观测数据不足以确定其轨道，随后便失联了。2000 年 11 月 21 日，斯科特·S·谢泼德、大卫·C·朱维特、扬加·R·费尔南德斯和尤金·A·马格尼尔发现了一颗看似新的卫星，编号为 S/2000 J 1。通过计算该卫星过去的轨迹，很快确认它就是 1975 年观测到的那颗。这一观测立即与布雷特·J·格拉德曼、约翰·J·卡韦拉尔斯、让-马克·佩蒂特、汉斯·肖尔、马修·J·霍尔曼、布莱恩·G·马斯登、菲利普·D·尼科尔森和约瑟夫·A·伯恩斯团队于 2000 年 8 月 6 日的早期观测相关联，该观测已报告给小行星中心但未作为 IAU 快报（IAUC）发表。2002 年 10 月，它被正式以希腊神话中的忒弥斯托命名，她是河神伊那科斯的女儿，宙斯（朱庇特）的情人。
		#RSSOrigin2_Themisto_Biome1 = 高地
		#RSSOrigin2_Themisto_Biome2 = 中地
		#RSSOrigin2_Themisto_Biome3 = 低地

		#RSSOrigin2_Hyperion_name = 土卫七（Hyperion）
		#RSSOrigin2_Hyperion_desc = 土卫七（Hyperion），又称 Saturn VII，是土星的一颗卫星，1848 年由威廉·克兰奇·邦德及其子乔治·菲利普斯·邦德和威廉·拉塞尔发现。它的显著特征是不规则的形状、混沌的旋转以及难以解释的海绵状外观。它是第一颗被发现的非球状卫星。
