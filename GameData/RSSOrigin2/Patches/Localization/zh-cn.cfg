		#RSSOrigin2_Amalthea_name = 木卫五（Amalthea）
		#RSSOrigin2_Amalthea_desc = 木卫五（Amalthea）是木星的卫星。在已知的木星卫星中，其轨道距离木星第三近，也是木星第五颗被发现的卫星，因此也被称为 Jupiter V。它也是木星第五大卫星，仅次于四颗伽利略卫星。爱德华·埃默森·巴纳德于 1892 年 9 月 9 日发现了这颗卫星，并以希腊神话中的阿玛尔忒亚命名。这是最后一颗通过直接目视观测发现的天然卫星；此后所有卫星均通过摄影或数字成像技术发现。木卫五在靠近木星的轨道上运行，位于阿玛尔忒亚薄纱环的外缘内，该环由其表面喷出的尘埃形成。从其表面看，木星的视直径为 46.5 度。木卫五是木星内卫星中最大的一颗，形状不规则，呈红色。人们认为它由多孔水冰和未知数量的其他物质组成。其表面特征包括大型陨石坑和山脊。
