		#RSSOrigin2_Paha_name = 伦卫一（Paha）
		#RSSOrigin2_Paha_desc = 伦卫一（Paha）（小行星编号：（47171） Lempo I Paha），是伦波三星系统中较小、较外的组件。它于 2001 年 12 月 8 日由天文学家查德维克·特鲁希略和迈克尔·布朗使用哈勃空间望远镜的空间望远镜成像光谱仪搜寻联星海外天体时发现。该发现于 2002 年 1 月 10 日由国际天文联合会在 IAU 快报中公布。2002 年 1 月 24 日发表的后续 IAU 快报报道了在利克天文台沙恩望远镜自适应光学系统 2001 年 10 月 4 日档案观测中对帕哈的确认。
