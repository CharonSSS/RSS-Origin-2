		#RSSOrigin2_Tinia_name = 尤卫一（Tinia）
		#RSSOrigin2_Tinia_desc = 尤卫一（Tinia）是海外天体 55637 尤尼唯一已知的卫星。蒂尼亚于 2005 年 8 月由哈勃空间望远镜观测发现，并于 2007 年 2 月 22 日公布。它与尤尼一同于 2025 年 9 月 1 日命名，以伊特鲁里亚天空之神、伊特鲁里亚爱与生育女神尤尼之夫蒂尼亚命名。蒂尼亚在距尤尼 0.16 角秒处被发现，绝对星等差为 2.5。其直径估计为 210±30 公里。假设反照率与主星相似，蒂尼亚直径应约 190 公里；假设反照率为 0.05（类似大小的冷经典柯伊伯带天体典型值），其直径应约 260 公里。
