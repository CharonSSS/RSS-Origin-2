		#RSSOrigin2_Ananke_name = 木卫十二（Ananke）
		#RSSOrigin2_Ananke_desc = 木卫十二（Ananke），又称 Jupiter XII，是木星较大的逆行不规则卫星之一。1951 年由塞思·巴恩斯·尼科尔森在威尔逊山天文台发现。它以希腊神话中的阿南刻命名，她是必然性的化身，也是宙斯所生的命运三女神（摩伊赖）之母。木卫十二直到 1975 年才获得现在的名字；此前它仅被称为 Jupiter XII。在 1955 年至 1975 年间，它有时被称为"阿德剌斯忒亚"（阿德剌斯忒亚现在是木星另一颗卫星的名字）。
