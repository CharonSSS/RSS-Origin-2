		#RSSOrigin2_Halimede_name = 海卫九（Halimede）
		#RSSOrigin2_Halimede_desc = 海卫九（Halimede），即 Neptune IX，是海王星的一颗逆行不规则卫星。2002 年 8 月 14 日由马修·J·霍尔曼、约翰·J·卡韦拉尔斯、汤米·格拉夫、韦斯利·C·弗雷泽和丹·米利萨夫列维奇发现。与海王星的许多外侧卫星一样，它以涅瑞伊得斯（涅柔斯和多里斯的五十个女儿）之一命名。在 2007 年 2 月 3 日宣布其名字（IAUC 8802）之前，海卫九的临时编号为 S/2002 N 1。
