		#RSSOrigin2_S-2012_38628_1_desc = S/2012 （38628） 1 是雨神星唯一已知卫星的临时编号。它由基思·诺尔领导的团队在 2012 年 5 月 6 日获取的哈勃空间望远镜观测中发现，并在对 2002 年 6 月 30 日和 7 月 1 日的哈勃档案图像重新审查中获得确认。该发现报告给了国际天文联合会并于 2012 年 7 月 12 日公布。假设与雨神星反照率相同，该卫星估计直径约 213 公里。从哈勃图像估计，卫星与主星的距离至少为 1740 公里。
