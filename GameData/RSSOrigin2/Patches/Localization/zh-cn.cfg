		#RSSOrigin2_Hiisi_name = 伦卫二（Hiisi）
		#RSSOrigin2_Hiisi_desc = 伦卫二（Hiisi）（小行星编号：（47171） Lempo II Hiisi），是伦波三星系统的内侧、第二大组件，三个组件中最后被发现。它与主组件伦波一起构成中央联星 Lempo-Hiisi，外组件帕哈围绕其运行。伦波系统中第三（内侧）组件（或第二伴星）的存在最早由约翰·斯坦斯伯里及其合作者于 2006 年假设，他们注意到主星密度异常低。塞斯·雅各布森和让-吕克·马戈于 2007 年 10 月提出内侧组件存在的进一步证据，他们在哈勃图像中注意到主星的明显拉长。伦波主星的联星性质最终由苏珊·贝内基、基思·诺尔、威尔·格伦迪和哈尔·莱维森在 2009 年对哈勃图像的更广泛分析中确认。
