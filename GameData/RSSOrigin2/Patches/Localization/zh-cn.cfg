		#RSSOrigin2_Ilmare_name = 瓦卫一（Ilmarë）
		#RSSOrigin2_Ilmare_desc = 伊尔玛雷（Ilmarë），或称 Varda I，全称 174567 Varda I Ilmarë，是柯伊伯带天体 174567 瓦尔妲唯一已知的天然卫星。它由基思·诺尔等人于 2009 年发现，分离约 0.12 角秒，使用哈勃空间望远镜于 2009 年 4 月 26 日拍摄的发现图像，并于 2011 年报告。直径约 326 公里（约为主星的 45%），是海外天体已知第四或第五大卫星，仅次于冥卫一卡戎、阋卫一狄斯诺米亚、亡卫一以及很可能的妊卫一希伊阿卡。假设伊尔玛雷与瓦尔妲反照率和密度相同，伊尔玛雷将约占系统质量的 8.4%，约 2.2×10¹⁹ 公斤。
