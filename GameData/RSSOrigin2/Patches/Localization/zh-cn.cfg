		#RSSOrigin2_Zoe_name = 罗卫一（Zoe）
		#RSSOrigin2_Zoe_desc = 又称为佐伊，罗各斯是一个联星系统，两个大小相近的组件在中等偏心率的轨道上绕质心运行。罗各斯于 1997 年 2 月 4 日发现，其伴星佐伊于 2001 年 11 月 17 日由 K·S·诺尔、D·C·斯蒂芬斯、W·M·格伦迪、J·斯宾塞、罗伯特·米利斯、马克·布伊、戴尔·克鲁克香克、S·C·泰格勒和 W·罗曼尼欣从哈勃空间望远镜观测中发现，并于 2002 年 2 月 11 日公布。发现后获得临时编号 S/2001 （58534） 1。确认后正式命名为 （58534） Logos I Zoe。它以 8217 公里半长轴、309.9 天周期、0.546 偏心率绕罗各斯运行。估计直径 66 公里，质量 （0.15 ± 0.02）×10¹⁸ 公斤。
