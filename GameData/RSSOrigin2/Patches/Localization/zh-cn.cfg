		#RSSOrigin2_Chariklo_name = 女凯龙星（Chariklo）
		#RSSOrigin2_Chariklo_desc = 女凯龙星（Chariklo）（小行星编号：10199 Chariklo）是已确认的最大半人马族天体（外太阳系小天体）。它在土星与天王星之间绕太阳运行，掠过天王星轨道。2014 年 3 月 26 日，天文学家通过观测恒星掩食宣布在女凯龙星周围发现两条环（被昵称为奥亚波克河和楚伊溪），使其成为已知第一颗拥有环的小行星。
