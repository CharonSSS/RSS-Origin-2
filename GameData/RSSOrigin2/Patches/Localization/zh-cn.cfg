		#RSSOrigin2_S-2015_136472_1_name = 鸟卫一（MK2）
		#RSSOrigin2_S-2015_136472_1_desc = S/2015 （136472） 1，被发现团队昵称为 MK2，是海外矮行星鸟神星唯一已知的卫星。估计直径 175 公里（假设反照率 4%），半长轴距鸟神星至少 21000 公里。轨道周期 ≥ 12 天（最小值为圆形轨道情形；实际轨道偏心率未知）。导致其发现的观测于 2015 年 4 月使用哈勃空间望远镜第三代广域照相机进行，发现于 2016 年 4 月 26 日公布。
