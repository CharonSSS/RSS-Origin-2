		#RSSOrigin2_Annefrank_name = 安妮·弗兰克（Annefrank）
		#RSSOrigin2_Annefrank_desc = 安妮·弗兰克（Annefrank）（小行星编号：5535 Annefrank，临时编号：1942 EM），是一颗石质花神星族小行星和疑似接触双星，来自内小行星带，直径约 4.5 公里。它被用作星尘号航天器后来在维尔德 2 号彗星上使用的飞掠技术的练习目标。
