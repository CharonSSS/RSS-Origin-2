		#RSSOrigin2_Phorcys_desc = 𣲾神星的卫星于 2006 年 4 月 11 日由 K·诺尔、H·莱维森、W·格伦迪和 D·斯蒂芬斯使用哈勃空间望远镜确认为联星；该天体以希腊海神福耳库斯命名，正式编号 （65849） Ceto I Phorcys。采用半人马的扩展定义（即在非共振（不稳定）轨道上、近日点在海王星轨道内的天体），刻托系统可被视为已知第二颗联星半人马。
