		#RSSOrigin2_S-2022_15094_1_name = 肖恩（Shaun）
		#RSSOrigin2_S-2022_15094_1_desc = 肖恩（Shaun）2022 年 3 月 26 日掩星观测后，露西号任务团队宣布发现波吕墨勒的天然卫星。该卫星是一颗约 5-6 公里直径的较小小行星，几乎在波吕墨勒赤道平面上以 204.4 ± 2.6 公里的距离绕行。假设波吕墨勒密度为 0.7-1 g/cm³，卫星轨道周期应在 14.4 至 16.6 天之间。在进一步观测确定其轨道前，它不会获得正式名称。露西团队以阿德曼动画公司的动画绵羊"肖恩"作为该伴星的临时非正式名称。该卫星在 2023 年 2 月 4 日的掩星中再次被探测到，这是历史上规模最大的掩星观测行动，近 200 名天文学家跨两大洲参与了此次行动。
