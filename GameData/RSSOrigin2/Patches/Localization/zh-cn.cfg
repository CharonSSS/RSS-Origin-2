		#RSSOrigin2_Talos_desc = 塔罗斯（Talos）（小行星编号：5786 Talos）是一颗阿波罗群小行星，1991 年 9 月 3 日由 R·H·麦克诺特在赛丁泉发现。它的近日距非常小；仅有另外两颗已命名小行星的近日距小于 0.2 AU——1566 伊卡洛斯和 3200 法厄同。
