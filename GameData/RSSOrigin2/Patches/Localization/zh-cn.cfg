		#RSSOrigin2_Hygiea_Biome6 = 南半球

		#RSSOrigin2_Psyche_name = 灵神星（Psyche）
		#RSSOrigin2_Psyche_desc = 灵神星（Psyche）（16 Psyche）是一颗大型 M 型小行星，由意大利天文学家安尼巴莱·德·加斯帕里斯于 1852 年 3 月 17 日在那不勒斯发现，以希腊神话人物普赛克命名。前缀"16"表示它是按发现顺序排列的第 16 颗小行星。它是 M 型小行星中最大和质量最大的，也是十几个质量最大的小行星之一。平均直径约 220 公里（140 英里），含有约小行星带质量的百分之一。历史上曾被假设为原行星暴露的核心，但最近的众多研究几乎排除了这一可能。灵神星计划进行太空探索，航天器计划于 2022 年发射，2026 年初抵达，2026-2027 年进行轨道探索。
