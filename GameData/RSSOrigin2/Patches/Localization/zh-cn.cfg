		#RSSOrigin2_Amor_name = 阿莫尔（Amor）
		#RSSOrigin2_Amor_desc = 阿莫尔（Amor）（小行星编号：1221 Amor）是一颗在偏心轨道上运行的小行星和近地天体，直径约 1 公里（0.6 英里）。它是阿莫尔型小行星的同名天体，阿莫尔型是近地天体的第二大子群。1932 年由欧仁·德尔波特于于克勒天文台发现，这是首次观测到小行星如此接近地球。这颗假定的 S 型小行星是少数尚未确定自转周期的低编号小行星之一。它被给予临时编号 1932 EA1，并以丘比特命名——在拉丁语中又称"Amor"，即希腊神厄洛斯的罗马对应神。
		#RSSOrigin2_Amor_Biome1 = 高地
		#RSSOrigin2_Amor_Biome2 = 中地
		#RSSOrigin2_Amor_Biome3 = 低地

		#RSSOrigin2_Icarus_name = 伊卡洛斯（Icarus）
		#RSSOrigin2_Icarus_desc = 伊卡洛斯（Icarus）（小行星编号：1566 Icarus，临时编号：1949 MA）是一颗大型阿波罗群近地天体，也是编号最低的潜在危险小行星。它的轨道极为偏心（0.83），直径约 1.4 公里（0.87 英里）。1968 年成为第一颗被雷达观测到的小行星。其轨道使其比水星更接近太阳，也比火星轨道更远，这也使它成为水星、金星和火星穿越小行星。这颗石质小行星自转相对较快，周期 2.27 小时，1949 年 6 月 27 日由德国天文学家沃尔特·巴德在加利福尼亚州帕洛玛天文台发现。以神话中的伊卡洛斯命名。
		#RSSOrigin2_Icarus_Biome1 = 高地
		#RSSOrigin2_Icarus_Biome2 = 中地
		#RSSOrigin2_Icarus_Biome3 = 低地

		#RSSOrigin2_Geographos_name = 地理星（Geographos）
		#RSSOrigin2_Geographos_desc = 地理星（Geographos）（小行星编号：1620 Geographos，临时编号：1951 RA），是一颗高度拉长的石质小行星、近地天体和阿波罗群的潜在危险小行星，平均直径约 2.5 公里（1.6 英里）。1951 年 9 月 14 日由天文学家阿尔伯特·乔治·威尔逊和鲁道夫·明科夫斯基在美国加利福尼亚州帕洛玛天文台发现。该小行星以美国国家地理学会命名。
		#RSSOrigin2_Geographos_Biome1 = 高地
		#RSSOrigin2_Geographos_Biome2 = 中地
		#RSSOrigin2_Geographos_Biome3 = 低地

		#RSSOrigin2_Suomi_name = 苏奥米（Suomi）
		#RSSOrigin2_Suomi_desc = 苏奥米（Suomi）（小行星编号：1656 Suomi）是一颗双星匈牙利型小行星和较大的火星穿越者，来自小行星带最内区域。1942 年 3 月 11 日由芬兰天文学家于尔约·韦伊斯莱在芬兰西南部的图尔库天文台发现，他以芬兰的母语名称"Suomi"命名。这颗石质小行星自转周期短，为 2.6 小时，直径约 7.9 公里。
		#RSSOrigin2_Suomi_Biome1 = 高地
		#RSSOrigin2_Suomi_Biome2 = 中地
		#RSSOrigin2_Suomi_Biome3 = 低地

		#RSSOrigin2_S-2020_1656_1_name = S/2020 （1656） 1
		#RSSOrigin2_S-2020_1656_1_desc = 2020 年 6 月，布莱恩·沃纳、罗伯特·斯蒂芬斯和艾伦·哈里斯发现了一颗伴星。该卫星直径超过 1.98 公里，约为母星的 26%，以 30 公里的平均距离每 57.9 小时绕行一周。
		#RSSOrigin2_S-2020_1656_1_Biome1 = 高地
