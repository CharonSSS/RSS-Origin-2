		#RSSOrigin2_Varda_name = 瓦尔妲（Varda）
		#RSSOrigin2_Varda_desc = 瓦尔妲（Varda）（小行星编号：174567 Varda，临时编号 2003 MW12）是柯伊伯带共振热经典族群的联星海外小天体，位于太阳系最外区域。其卫星伊尔玛雷于 2009 年发现。天文学家迈克尔·布朗估计，以其 3.5 的绝对星等和约 700-800 公里的计算直径，它很可能是矮行星。然而威廉·M·格伦迪等人认为，400-1000 公里大小范围、反照率低于约 0.2、密度约 1.2 g/cm³ 或更低的天体，可能从未被压缩成完全固态天体，更未分化，因此极不可能是矮行星。瓦尔达的密度是高是低尚不清楚。
