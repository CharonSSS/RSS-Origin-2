		#RSSOrigin2_Rosa_name = 小行星 223（Rosa）
		#RSSOrigin2_Rosa_desc = 小行星 223（Rosa）（小行星编号：223 Rosa）是一颗大型的忒弥斯族小行星。它被归类为 C 型和 P 型小行星的组合，因此可能由富含水冰的碳质物质组成。1882 年 3 月 9 日由约翰·帕利萨在维也纳发现。名字的来源尚不清楚。
