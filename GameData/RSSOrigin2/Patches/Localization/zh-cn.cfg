		#RSSOrigin2_Itokawa_name = 丝川（Itokawa）
		#RSSOrigin2_Itokawa_desc = 丝川（Itokawa）（小行星编号：25143 Itokawa，临时编号 1998 SF36）是一颗亚公里级的阿波罗群近地天体，也是一颗潜在危险小行星。它由 LINEAR 计划于 1998 年发现，后以日本火箭工程师丝川英夫命名。这颗花生形状的 S 型小行星自转周期 12.1 小时，直径约 330 米。由于其低密度和高孔隙率，丝川被认为是碎石堆型小行星，由不同大小的众多巨石组成，而非单一固态天体。
