		#RSSOrigin2_29P-Schwassmann-Wachmann1_name = 施瓦斯曼-瓦赫曼1号彗星（29P/Schwassmann–Wachmann）
		#RSSOrigin2_29P-Schwassmann-Wachmann1_desc = 施瓦斯曼-瓦赫曼1号彗星（正式编号：29P/Schwassmann–Wachmann），于 1927 年 11 月 15 日由阿诺德·施瓦斯曼和阿诺·阿图尔·瓦赫曼在德国贝格多夫的汉堡天文台发现。它是通过摄影发现的，当时彗星处于爆发状态，星等约 13。1931 年发现了 1902 年 3 月 4 日的彗星前置图像，显示彗星为 12 等。
		#RSSOrigin2_29P-Schwassmann-Wachmann1_Biome1 = 高地
		#RSSOrigin2_29P-Schwassmann-Wachmann1_Biome2 = 中地
		#RSSOrigin2_29P-Schwassmann-Wachmann1_Biome3 = 低地

		#RSSOrigin2_46P-Wirtanen_name = 维尔塔宁彗星（46P/Wirtanen）
		#RSSOrigin2_46P-Wirtanen_desc = 维尔塔宁彗星（正式编号：46P/Wirtanen）是一颗小型短周期彗星，当前轨道周期 5.4 年。它最初是欧洲空间局罗塞塔航天器计划近距离调查的目标，但无法满足发射窗口导致罗塞塔被改派到 67P/丘留莫夫-格拉西缅科彗星。它属于木星族彗星，其远日点都在 5-6 AU 之间。直径估计 1.2 公里。2019 年 12 月，天文学家报告 TESS 空间望远镜捕获了该彗星的爆发的详尽细节。
		#RSSOrigin2_46P-Wirtanen_Biome1 = 高地
		#RSSOrigin2_46P-Wirtanen_Biome2 = 中地
		#RSSOrigin2_46P-Wirtanen_Biome3 = 低地

		#RSSOrigin2_67P-Churyumov-Gerasimenko_name = 丘留莫夫-格拉西缅科彗星（67P/Churyumov–Gerasimenko）
		#RSSOrigin2_67P-Churyumov-Gerasimenko_desc = 丘留莫夫-格拉西缅科彗星（正式编号：67P/Churyumov–Gerasimenko）是一颗木星族彗星，最初来自柯伊伯带，当前轨道周期 6.45 年，自转周期约 12.4 小时，最大速度 135000 公里/小时（38 公里/秒）。丘留莫夫-格拉西缅科最长最宽处约 4.3 × 4.1 公里。1969 年由苏联天文学家克利姆·伊万诺维奇·丘留莫夫和斯维特兰娜·伊万诺芙娜·格拉西缅科在照相底片上首次观测到，并以他们命名。最近一次于 2021 年 11 月 2 日到达近日点，下次将于 2028 年 4 月 9 日到达近日点。
		#RSSOrigin2_67P-Churyumov-Gerasimenko_Biome1 = 小瓣
		#RSSOrigin2_67P-Churyumov-Gerasimenko_Biome2 = 大瓣
		#RSSOrigin2_67P-Churyumov-Gerasimenko_Biome3 = 颈部

		#RSSOrigin2_81P-Wild2_name = 维尔特二号彗星（81P/Wild）
		#RSSOrigin2_81P-Wild2_desc = 维尔特二号彗星（正式编号：81P/Wild），以瑞士天文学家保罗·维尔特命名，他于 1978 年 1 月 6 日使用瑞士齐默尔瓦尔德的 40 厘米施密特望远镜发现它。在其 45 亿年寿命的大部分时间里，怀尔德2号可能拥有更远更圆的轨道。1974 年 9 月，它在距木星 100 万公里以内经过，木星的强大引力扰动使彗星轨道改变，将其带入内太阳系。其轨道周期从 43 年变为约 6 年，近日点现在约 1.59 天文单位（AU）。
