		#RSSOrigin2_Didymos_name = 孪大星（Didymos）
		#RSSOrigin2_Didymos_desc = 孪大星（Didymos）（小行星编号：65803 Didymos，临时编号 1996 GT）是一颗亚公里级小行星和联星系统，被归类为潜在危险小行星和阿波罗群近地天体。该小行星于 1996 年由基特峰的空间监测巡天发现，其 160 米的小行星卫星孪卫一于 2003 年发现。由于其联星性质，该小行星后被命名为迪迪莫斯——希腊语中"双胞胎"之意。
		#RSSOrigin2_Didymos_Biome1 = 高地
		#RSSOrigin2_Didymos_Biome2 = 中地
		#RSSOrigin2_Didymos_Biome3 = 低地

		#RSSOrigin2_Dimorphos_name = 孪卫一（Dimorphos）
		#RSSOrigin2_Dimorphos_desc = 孪卫一（Dimorphos）（小行星编号：（65803） Didymos I，临时编号 S/2003 （65803） 1）是近地小行星 65803 孪大星的天然卫星，二者构成联星系统。该卫星于 2003 年 11 月 20 日由彼得·普拉韦克与全球其他天文学家合作发现。孪卫一最长方向直径 177 米，它是双小行星改向测试（DART）任务的目标——这是 NASA 的一项空间任务，于 2022 年 9 月 26 日故意将航天器撞向该卫星以改变其绕孪大星的轨道。在 DART 撞击前，孪卫一呈扁球体形状，表面布满巨石但几乎没有陨石坑。该卫星被认为是在孪大星因快速自转抛射物质时形成的，抛出的物质形成绕行的碎屑环，聚结成低密度碎石堆，即今天的孪卫一。
		#RSSOrigin2_Dimorphos_Biome1 = 高地
		#RSSOrigin2_Dimorphos_Biome2 = 中地
		#RSSOrigin2_Dimorphos_Biome3 = 低地

		#RSSOrigin2_Moshup_name = 莫舒普（Moshup）
		#RSSOrigin2_Moshup_desc = 莫舒普（Moshup）（小行星编号：66391 Moshup，临时编号 1999 KW4）是一颗联星小行星，被归类为近地天体和 Aten 群潜在危险小行星，直径约 1.3 公里。它于 1999 年 5 月 20 日由林肯近地小行星研究（LINEAR）在美国新墨西哥州索科罗的林肯实验室实验测试场发现。它是水星穿越者，近日距仅 0.2 AU，极为接近太阳。
		#RSSOrigin2_Moshup_Biome1 = 高地
		#RSSOrigin2_Moshup_Biome2 = 中地
		#RSSOrigin2_Moshup_Biome3 = 低地

		#RSSOrigin2_Squannit_name = 斯夸尼特（Squannit）
		#RSSOrigin2_Squannit_desc = 莫舒普有一颗小行星卫星绕其运行。该卫星名为斯夸尼特，编号 S/2001 （66391） 1，直径约 360 米，每 16 小时在平均距离 2.6 公里处绕主星运行一圈。普拉韦克和莎罗乌诺娃的测光观测暗示了伴星的存在，阿雷西博雷达观测于 2001 年 5 月 23 日予以确认。基于雷达成像，斯夸尼特尺寸估计为 595 × 450 × 343 米。
		#RSSOrigin2_Squannit_Biome1 = 高地
		#RSSOrigin2_Squannit_Biome2 = 中地
		#RSSOrigin2_Squannit_Biome3 = 低地

		#RSSOrigin2_Sedna_name = 赛德娜（Sedna）
		#RSSOrigin2_Sedna_desc = 赛德娜（Sedna）（小行星编号：90377 Sedna）是太阳系外层的一颗矮行星，目前处于其轨道最内端；截至 2022 年距太阳 84 天文单位（1.26×10¹⁰ 公里），几乎是海王星距离的三倍。光谱观测显示赛德娜表面成分与其他一些海外天体相似，主要是水、甲烷和氮冰与索林斯的混合物。其表面是太阳系天体中最红的之一。在估计的不确定范围内，赛德娜与谷神星并列为未发现卫星的最大小行星。
		#RSSOrigin2_Sedna_Biome1 = 巨型撞击坑
		#RSSOrigin2_Sedna_Biome2 = 撞击坑
		#RSSOrigin2_Sedna_Biome3 = 裂缝
		#RSSOrigin2_Sedna_Biome4 = 散布低地
		#RSSOrigin2_Sedna_Biome5 = 北半球
		#RSSOrigin2_Sedna_Biome6 = 南半球
		#RSSOrigin2_Sedna_Biome7 = 赤道隆起

		#RSSOrigin2_Orcus_name = 亡神星（Orcus）
		#RSSOrigin2_Orcus_desc = 亡神星（Orcus）（小行星编号：90482 Orcus，临时编号 2004 DW）是一颗海外矮行星，拥有大卫星亡卫一。直径 910 公里。亡神星表面相对明亮，反照率达 23%，颜色中性，富含水冰。冰以晶质形式为主，可能与过去的冰火山活动有关。表面也可能存在甲烷或氨等其他化合物。亡神星由美国天文学家迈克尔·布朗、查德·特鲁希略和戴维·拉比诺维茨于 2004 年 2 月 17 日发现。
		#RSSOrigin2_Orcus_Biome1 = 撞击坑
		#RSSOrigin2_Orcus_Biome2 = 山脉
		#RSSOrigin2_Orcus_Biome3 = 北部中地
		#RSSOrigin2_Orcus_Biome4 = 南部中地
		#RSSOrigin2_Orcus_Biome5 = 北部低地
		#RSSOrigin2_Orcus_Biome6 = 南部低地
		#RSSOrigin2_Orcus_Biome7 = 赤道隆起

		#RSSOrigin2_Vanth_name = 亡卫一（Vanth）
		#RSSOrigin2_Vanth_desc = 亡卫一（Vanth），全称 （90482） Orcus I Vanth，是冥族小天体、可能的矮行星 90482 亡神星唯一已知的天然卫星。直径约 440 公里，是亡神星的一半大小，可能是已知海外天体卫星中第三大的，仅次于冥卫一卡戎和阋卫一狄斯诺米亚，尽管分辨率不佳的伐卫一伊尔玛雷或妊卫一希伊阿卡可能与之大小相当。亡卫一由迈克尔·布朗和 T·A·苏尔使用哈勃空间望远镜于 2005 年 11 月 13 日拍摄的发现图像发现。该发现于 2007 年 2 月 22 日在 IAU 快报中公布。
		#RSSOrigin2_Vanth_Biome1 = 撞击坑
		#RSSOrigin2_Vanth_Biome2 = 南部低地
		#RSSOrigin2_Vanth_Biome3 = 北部低地
		#RSSOrigin2_Vanth_Biome4 = 高地
		#RSSOrigin2_Vanth_Biome5 = 北半球
		#RSSOrigin2_Vanth_Biome6 = 南半球

		#RSSOrigin2_2002GZ32_name = 2002 GZ32
		#RSSOrigin2_2002GZ32_desc = （95626） 2002 GZ32（临时编号 2002 GZ32）是一颗半人马族天体，在外太阳系土星与海王星之间绕太阳运行。它是已知最大的半人马族天体之一，形状高度拉长，最长方向 366 公里，最短方向 120 公里。该天体于 2002 年 4 月 13 日由夏威夷莫纳克亚天文台的天文学家发现。由于 2002 GZ32 高度拉长的形状，其视亮度每 5.8 小时自转周期内振荡。2002 GZ32 表面呈暗灰色，可能含水冰。它是继 10199 女凯龙和 2060 喀戎之后，第三颗被多人同时观测到掩星的半人马族天体。
		#RSSOrigin2_2002GZ32_Biome1 = 撞击坑
		#RSSOrigin2_2002GZ32_Biome2 = 南极区
		#RSSOrigin2_2002GZ32_Biome3 = 北极区
		#RSSOrigin2_2002GZ32_Biome4 = 赤道隆起
		#RSSOrigin2_2002GZ32_Biome5 = 北半球
		#RSSOrigin2_2002GZ32_Biome6 = 南半球

		#RSSOrigin2_Apophis_name = 毁神星（Apophis）
		#RSSOrigin2_Apophis_desc = 毁神星（Apophis）（小行星编号：99942 Apophis）是一颗近地小行星和潜在危险小行星，直径 370 米，2004 年 12 月曾引起短暂关注，因为初期观测表明它在 2029 年 4 月 13 日撞击地球的概率高达 2.7%。后续观测提供了改进的预测，排除了 2029 年撞击地球的可能性。直到 2006 年，仍存在小概率：在 2029 年与地球近距离相遇时，毁神星可能穿过一个直径不超过约 800 米的引力锁眼，从而在整整七年后即 2036 年 4 月 13 日引发撞击。这一可能性使其在都灵撞击危险等级上保持 1 级，直到 2006 年 8 月确定毁神星穿过锁眼的概率极小，都灵等级降为 0。
		#RSSOrigin2_Apophis_Biome1 = 高地
		#RSSOrigin2_Apophis_Biome2 = 中地
		#RSSOrigin2_Apophis_Biome3 = 低地

		#RSSOrigin2_Bennu_name = 贝努（Bennu）
		#RSSOrigin2_Bennu_desc = 贝努（Bennu）（小行星编号：101955 Bennu，临时编号 1999 RQ36）是一颗阿波罗群碳质小行星，由 LINEAR 项目于 1999 年 9 月 11 日发现。它是潜在危险天体，被列入哨兵风险表，并在巴勒莫技术撞击危险等级上并列最高累计评级。它在 2178 至 2290 年间撞击地球的累计概率为 1/1800，最大风险在 2182 年 9 月 24 日。它以古埃及神话中与太阳、创世和重生相关的不死鸟贝努命名。
		#RSSOrigin2_Bennu_Biome1 = 赤道脊
		#RSSOrigin2_Bennu_Biome2 = 北半球
		#RSSOrigin2_Bennu_Biome3 = 南半球

		#RSSOrigin2_Salacia_name = 萨拉西亚（Salacia）
		#RSSOrigin2_Salacia_desc = 萨拉西亚（Salacia）（小行星编号：120347 Salacia）是柯伊伯带中的一颗大型海外天体，直径约 850 公里。它于 2004 年 9 月 22 日由美国天文学家亨利·罗、迈克尔·布朗和克里斯蒂娜·巴库姆在加利福尼亚州帕洛马天文台发现。萨拉西亚绕太阳的平均距离略大于冥王星。它以罗马女神萨拉西亚命名，有一颗已知卫星阿克泰亚。
		#RSSOrigin2_Salacia_Biome1 = 撞击坑
		#RSSOrigin2_Salacia_Biome2 = 南极区
		#RSSOrigin2_Salacia_Biome3 = 北极区
		#RSSOrigin2_Salacia_Biome4 = 赤道隆起
		#RSSOrigin2_Salacia_Biome5 = 北半球
		#RSSOrigin2_Salacia_Biome6 = 南半球

		#RSSOrigin2_Actaea_name = 萨卫一（Actaea）
		#RSSOrigin2_Actaea_desc = 萨卫一（Actaea），（小行星编号：（120347） Salacia I Actaea），是经典柯伊伯带小天体 120347 萨拉西亚的天然卫星。直径估计 300 公里，约为萨拉西亚的三分之一；因此威廉·格伦迪等人将萨拉喀亚和阿克泰亚视为联星系统。假设以下尺寸估计正确，阿克泰亚是海外天体已知第六大卫星，仅次于卡戎（1212 公里）、狄斯诺米亚（700 公里）、亡卫一（443 公里）、伊尔玛雷（326 公里）和希伊阿卡（320 公里），但希西（250 公里）可能与之相当。
		#RSSOrigin2_Actaea_Biome1 = 撞击坑
		#RSSOrigin2_Actaea_Biome2 = 南极区
		#RSSOrigin2_Actaea_Biome3 = 北极区
		#RSSOrigin2_Actaea_Biome4 = 赤道隆起
		#RSSOrigin2_Actaea_Biome5 = 北半球
		#RSSOrigin2_Actaea_Biome6 = 南半球

		#RSSOrigin2_APL_name = APL
		#RSSOrigin2_APL_desc = APL（小行星编号：132524 APL，临时编号 2002 JF56）是中间小行星带中的一颗小型背景小行星。它由 LINEAR 于 2002 年 5 月发现，2006 年 6 月新视野号探测器穿越小行星带时对其进行了飞掠成像。这颗石质 S 型小行星直径约 2.5 公里。
