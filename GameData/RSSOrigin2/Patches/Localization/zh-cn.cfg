		#RSSOrigin2_Polymele_name = 波吕墨勒（Polymele）
		#RSSOrigin2_Polymele_desc = 波吕墨勒（Polymele）（小行星编号：15094 Polymele）是一颗原始的希腊营木星特洛伊小行星，直径约 21 公里。它是露西号任务的目标，计划于 2027 年 9 月进行近距离飞掠。它于 1999 年 11 月 17 日由美国亚利桑那州莱蒙山天文台的卡特琳娜巡天系统天文学家发现。这颗 P 型小行星自转周期 5.9 小时，可能呈球形。它以希腊神话中墨诺提俄斯之妻、帕特罗克洛斯之母波吕墨勒命名。2022 年报道称它拥有一颗直径约 5 公里的伴星。
