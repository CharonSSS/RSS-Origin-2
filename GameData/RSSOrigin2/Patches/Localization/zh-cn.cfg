		#RSSOrigin2_Gorgoneion_name = 慧卫二（Gorgoneion）
		#RSSOrigin2_Gorgoneion_desc = 慧卫二（Gorgoneion），学术正式编号为 （93） Minerva II Gorgoneion，是智慧与战争女神密涅瓦（慧神星）神盾中心的魔性护符。它是大型三重主带小行星——慧神星（93 Minerva）的第二颗、也是较小的一颗内侧卫星。
