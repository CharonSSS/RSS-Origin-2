		#RSSOrigin2_Masursky_name = 马苏尔斯基（Masursky）
		#RSSOrigin2_Masursky_desc = 马苏尔斯基（Masursky）（小行星编号：2685 Masursky，临时编号：1981 JN），是一颗来自小行星带中央区域的石质尤诺米亚族小行星，直径约 11 公里（6.8 英里）。1981 年 5 月 3 日由美国天文学家爱德华·鲍威尔在亚利桑那州弗拉格斯塔夫附近的安德森梅萨站发现，以美国行星地质学家哈罗德·马苏尔斯基命名。2000 年 1 月，卡西尼号航天器在飞往土星的途中从远处观测了这颗 S 型小行星。
		#RSSOrigin2_Masursky_Biome1 = 高地
		#RSSOrigin2_Masursky_Biome2 = 中地
		#RSSOrigin2_Masursky_Biome3 = 低地

		#RSSOrigin2_Steins_name = 斯坦因斯（Šteins）
		#RSSOrigin2_Steins_desc = 斯坦因斯（Šteins）（小行星编号：2867 Šteins，临时编号：1969 VC）是来自小行星带内区域的一颗不规则、菱形的背景小行星，直径约 5 公里（3.1 英里）。1969 年 11 月 4 日由苏维埃天文学家尼古拉·切尔尼赫在克里米亚半岛瑙奇尼的克里米亚天体物理天文台发现。2008 年 9 月，欧空局的罗塞塔号航天器飞掠了斯坦因斯，使其成为少数被航天器到访的小行星之一。这颗明亮的 e 型小行星有 23 个已命名陨石坑，自转周期 6.05 小时。以苏维埃拉脱维亚天文学家卡利斯·斯坦因斯命名。
		#RSSOrigin2_Steins_Biome1 = 赤道隆起带
		#RSSOrigin2_Steins_Biome2 = 北半球
		#RSSOrigin2_Steins_Biome3 = 南半球

		#RSSOrigin2_Florence_name = 佛罗伦斯（Florence）
		#RSSOrigin2_Florence_desc = 佛罗伦斯（Florence）（小行星编号：3122 Florence）是阿莫尔群的一颗石质三重小行星。被归类为近地天体和潜在危险小行星。直径约 5 公里。绕太阳运行距离 1.0-2.5 AU，周期 2 年 4 个月（859 天）；轨道偏心率 0.42，相对于黄道的倾角 22°。佛罗伦斯有两颗卫星。1981 年 3 月 2 日由美国天文学家谢尔特·J·"鲍比"·巴斯在赛丁泉天文台发现。临时编号 1981 ET3。以现代护理学创始人佛罗伦斯·南丁格尔命名；命名公告于 1993 年 4 月 6 日发表（M.P.C. 21955）。佛罗伦斯被归类为潜在危险天体，因为其最小轨道交叉距离（MOID ≤ 0.05 AU）表明它有可能近距离接近地球，且其绝对星等测量值（H ≤ 22）表明它足够大，如果撞击将造成严重损害。
		#RSSOrigin2_Florence_Biome1 = 高地
		#RSSOrigin2_Florence_Biome2 = 中地
		#RSSOrigin2_Florence_Biome3 = 低地

		#RSSOrigin2_S-2017_3122_1_name = S/2017 （3122） 1
		#RSSOrigin2_S-2017_3122_1_desc = S/2017 （3122） 1，学术正式编号为 （3122） Florence I，是大型近地小行星——佛罗伦萨（3122 Florence）的第一颗被发现、也是距离母体更近的内侧卫星。它与外侧的 S/2017 （3122） 2 一同构成了近地空间中极为罕见的三合星系统。
		#RSSOrigin2_S-2017_3122_1_Biome1 = 高地
		#RSSOrigin2_S-2017_3122_1_Biome2 = 低地

		#RSSOrigin2_S-2017_3122_2_name = S/2017 （3122） 2
		#RSSOrigin2_S-2017_3122_2_desc = S/2017 （3122） 2，学术正式编号为 （3122） Florence II，是环绕近地小行星佛罗伦萨（3122 Florence）运行的第二颗被发现、也是位于较远轨道的外侧卫星。它的确认彻底坐实了佛罗伦萨作为罕见“三合星近地小行星”的尊贵身份。
		#RSSOrigin2_S-2017_3122_2_Biome1 = 高地
		#RSSOrigin2_S-2017_3122_2_Biome2 = 低地

		#RSSOrigin2_Phaethon_name = 法厄同（Phaethon）
		#RSSOrigin2_Phaethon_desc = 法厄同（Phaethon）（小行星编号：3200 Phaethon，旧时有时拼作 Phaeton，临时编号：1983 TB），是一颗活跃的阿波罗群小行星，其轨道比任何其他已命名小行星都更接近太阳（尽管有许多未命名小行星有更小的近日距，如 （137924） 2000 BD19）。因此，它以希腊神话中太阳神赫利俄斯之子法厄同的故事命名。直径 5.8 公里（3.6 英里），是 12 月中旬双子座流星雨的母体。凭借 35 年以上的观测弧，其轨道非常精确。2017 年约 1000 万公里的近地距离已知精度为 ±700 米。
		#RSSOrigin2_Phaethon_Biome1 = 赤道脊
		#RSSOrigin2_Phaethon_Biome2 = 北半球
		#RSSOrigin2_Phaethon_Biome3 = 南半球

		#RSSOrigin2_Eurybates_name = 欧律巴忒斯（Eurybates）
		#RSSOrigin2_Eurybates_desc = 欧律巴忒斯（Eurybates）（小行星编号：3548 Eurybates）是来自希腊营的碳质木星特洛伊小行星，也是欧律巴忒斯族的母体，直径约 68 公里（42 英里）。它是露西号任务计划于 2027 年 8 月到访的目标。在 1973 年第二次帕洛玛-莱顿特洛伊巡天中发现，后来以希腊神话中的欧律巴忒斯命名。这颗 C/P 型小行星属于 60 颗最大木星特洛伊之列，自转周期 8.7 小时。欧律巴忒斯有一颗已知卫星，名为奎塔，于 2018 年 9 月在哈勃太空望远镜拍摄的图像中发现。
		#RSSOrigin2_Eurybates_Biome1 = 撞击坑
		#RSSOrigin2_Eurybates_Biome2 = 南极地区
		#RSSOrigin2_Eurybates_Biome3 = 北极地区
		#RSSOrigin2_Eurybates_Biome4 = 赤道隆起
		#RSSOrigin2_Eurybates_Biome5 = 北半球
		#RSSOrigin2_Eurybates_Biome6 = 南半球

		#RSSOrigin2_Queta_name = 欧卫一（Queta）
		#RSSOrigin2_Queta_desc = 欧律巴忒斯有一颗已知卫星，以墨西哥奥林匹克运动员恩里奎塔·巴西利奥命名为奎塔。（临时编号：S/2018 （3548） 1），该卫星由基思·S·诺尔及其同事于 2018 年 9 月在哈勃太空望远镜拍摄的图像中发现。后续跟踪观测确认了卫星的存在，发现于 2020 年 1 月 9 日公布。2020 年 10 月 15 日该卫星被命名为奎塔，符合国际天文联合会对小型木星特洛伊（H > 12）的奥林匹克运动员命名惯例。在命名公告中，恩里奎塔·巴西利奥被认定为 1968 年夏季奥运会的首位女性火炬手，类似于欧律巴忒斯等传令官的角色。
		#RSSOrigin2_Queta_Biome1 = 高地
		#RSSOrigin2_Queta_Biome2 = 中地
		#RSSOrigin2_Queta_Biome3 = 低地

		#RSSOrigin2_DonQuixote_name = 堂吉诃德星（Don Quixote）
		#RSSOrigin2_DonQuixote_desc = 堂吉诃德星（Don Quixote）（小行星编号：3552 Don Quixote，临时编号：1983 SA），是一颗偏心率极高的小行星，被归类为阿莫尔群的近地天体、火星穿越者和木星穿越者，也是一颗弱活动彗星。堂吉诃德在 Tholen 和 SMASS 分类中被归类为暗 D 型小行星。它有 31 度的高度倾斜类彗星轨道，导致经常受木星摄动。堂吉诃德直径 18.4 公里，自转周期 7.7 小时。由于其类彗星轨道和反照率，堂吉诃德曾被怀疑是一颗熄火彗星。然而，斯皮策太空望远镜在 4.5 μm 波段的红外观测揭示了该天体周围有暗淡的彗发和彗尾。彗星活动由二氧化碳（CO2）分子带发射推断。2018 年 3 月首次在可见光波段观测到彗尾。在两次出现中观测到的彗星特征表明彗星活动是反复的，堂吉诃德最有可能是一颗弱活动彗星。
		#RSSOrigin2_DonQuixote_Biome1 = 高地
		#RSSOrigin2_DonQuixote_Biome2 = 中地
		#RSSOrigin2_DonQuixote_Biome3 = 低地

		#RSSOrigin2_Balam_name = 巴兰（Balam）
		#RSSOrigin2_Balam_desc = 巴兰（Balam）（小行星编号：3749 Balam）是一颗石质花神星族小行星和罕见的绕小行星带内区域运行的三重系统。它还与亚公里级小行星 （312497） 2009 BR60 形成一个确认的小行星对。巴兰于 1982 年 1 月 24 日由美国天文学家爱德华·鲍威尔在亚利桑那州弗拉格斯塔夫附近洛威尔的安德森梅萨站发现，获得临时编号 1982 BG1。以加拿大天文学家大卫·巴兰命名。巴兰直径约 4.1 公里（2.5 英里）。
		#RSSOrigin2_Balam_Biome1 = 高地
		#RSSOrigin2_Balam_Biome2 = 中地
		#RSSOrigin2_Balam_Biome3 = 低地

		#RSSOrigin2_S-2002_3749_1_name = S/2002 （3749） 1
		#RSSOrigin2_S-2002_3749_1_desc = 2002 年 2 月 13 日，来自 SwRI、UA、JPL 和 OSUG 的研究团队宣布在夏威夷莫纳克亚的双子星北座望远镜上发现了一颗小行星卫星，临时编号 S/2002 （3749） 1。估计直径 1.84 公里。以 61±10 天的周期在 289±13 公里外运行，轨道偏心率高，约 0.9。S/2002 （3749） 1 的遥远且高度偏心轨道表明它很可能被巴兰俘获。
		#RSSOrigin2_S-2002_3749_1_Biome1 = 高地
		#RSSOrigin2_S-2002_3749_1_Biome2 = 中地
		#RSSOrigin2_S-2002_3749_1_Biome3 = 低地

		#RSSOrigin2_S-2007_3749_1_name = S/2007 （3749） 1
		#RSSOrigin2_S-2007_3749_1_desc = 2008 年 3 月，弗兰克·马尔基斯从巴兰光变曲线中观测到的掩食发现了另一颗卫星，使巴兰成为三重小行星。这颗内侧卫星没有临时编号，基于与主星 0.42±0.03 的直径比，推算直径为 1.66 公里。
		#RSSOrigin2_S-2007_3749_1_Biome1 = 高地
		#RSSOrigin2_S-2007_3749_1_Biome2 = 中地
		#RSSOrigin2_S-2007_3749_1_Biome3 = 低地

		#RSSOrigin2_Cruithne_name = 克鲁特尼（Cruithne）
		#RSSOrigin2_Cruithne_desc = 克鲁特尼（Cruithne）（小行星编号：3753 Cruithne）是一颗 Q 型、阿顿型小行星，以 1:1 轨道共振绕太阳运行，使其成为地球的共轨天体。相对于地球，这颗小行星沿豆形轨道绕太阳运行，实际上描绘出马蹄形路径，并且可以转变为准卫星轨道。克鲁特尼不绕地球运行，有时位于太阳的另一侧，使它远在地球的希尔球之外。其轨道使它接近水星轨道并越过火星轨道。克鲁特尼绕太阳运行约一个地球年，但需要 770 年才能完成围绕地球的马蹄形运动系列。
		#RSSOrigin2_Cruithne_Biome1 = 高地
		#RSSOrigin2_Cruithne_Biome2 = 中地
		#RSSOrigin2_Cruithne_Biome3 = 低地

		#RSSOrigin2_Toutatis_name = 托塔蒂斯（Toutatis）
		#RSSOrigin2_Toutatis_desc = 托塔蒂斯（Toutatis）（小行星编号：4179 Toutatis，临时编号：1989 AC），是一颗拉长的石质小行星和慢自转天体，被归类为近地天体和阿波罗群及阿林达群的潜在危险小行星，直径约 2.5 公里。1989 年由法国天文学家克里斯蒂安·波拉斯在考索勒发现，以凯尔特神话中的托塔蒂斯命名。
