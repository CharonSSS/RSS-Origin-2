		#RSSOrigin2_Kamo`oalewa_name = 振荡天星（Kamoʻoalewa）
		#RSSOrigin2_Kamo`oalewa_desc = 振荡天星（Kamoʻoalewa）（小行星编号：469219 Kamoʻoalewa，临时编号 2016 HO3）是一颗极小的小行星、快速自转天体和阿波罗群近地天体，直径约 40-100 米。目前它是地球的准卫星，且是目前已知最小、最近、最稳定的此类准卫星。该小行星于 2016 年 4 月 27 日由泛星计划在哈莱阿卡拉天文台发现。它被命名为卡莫奥阿莱瓦——一个夏威夷语词，指振荡的天体。其类地轨道和类月硅酸盐可能是它是月球抛射物的结果。
		#RSSOrigin2_Kamo`oalewa_Biome1 = 高地
		#RSSOrigin2_Kamo`oalewa_Biome2 = 低地

		#RSSOrigin2_Kagara_name = ǂKá,gára
		#RSSOrigin2_Kagara_desc = ǂKá,gára（小行星编号：469705 ǂKá,gára，临时编号 2005 EF298）是一颗海外天体和联星系统，属于核心柯伊伯带，位于太阳系最外区域。它于 2005 年 3 月 11 日由美国天文学家马克·布伊在亚利桑那州基特峰天文台发现。主天体直径约 140 公里。其 120 公里伴星 ǃHãunu 于 2009 年由哈勃空间望远镜发现。ǂKá,gára-ǃHãunu 系统目前正在经历相互掩食事件，其中一个天体从地球视角看在另一个天体上投下阴影或遮挡其视野。
		#RSSOrigin2_Kagara_Biome1 = 撞击坑
		#RSSOrigin2_Kagara_Biome2 = 南部低地
		#RSSOrigin2_Kagara_Biome3 = 北部低地
