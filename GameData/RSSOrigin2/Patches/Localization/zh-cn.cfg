		#RSSOrigin2_Camilla_Biome6 = 南半球

		#RSSOrigin2_S-2001_107_1_name = S/2001 （107） 1
		#RSSOrigin2_S-2001_107_1_desc = 2001 年 3 月 1 日，卡米拉的一颗小行星卫星由 A·斯托尔斯、F·维拉斯、R·兰迪斯、E·威尔斯、C·伍兹、B·泽尔纳和 M·加菲使用哈勃太空望远镜发现。其临时编号为 S/2001 （107） 1，但尚未获得正式名称。2005 年 9 月使用甚大望远镜（VLT）的进一步观测允许确定轨道。除了右侧信息框中的数据外，还发现倾角为 3 ± 1°（相对于指向 （β, λ） = （+55°, 75°） 的轴）。鉴于卡米拉实际旋转轴约 10° 的不确定度，可以说轨道倾角小于 10°。
