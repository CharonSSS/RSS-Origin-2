		#RSSOrigin2_2005HC4_Biome3 = 低地

		#RSSOrigin2_2012VP113_name = 2012 VP113
		#RSSOrigin2_2012VP113_desc = 2012 VP113，昵称"拜登"，是赛德娜族族群的海外天体，位于太阳系最外区域。它于 2012 年 11 月 5 日由美国天文学家斯科特·谢泼德和查德·特鲁希略在智利托洛洛山美洲际天文台首次观测。发现于 2014 年 3 月 26 日公布。该天体直径可能在 300-1000 公里之间，可能足够大到是矮行星。
		#RSSOrigin2_2012VP113_Biome1 = 撞击坑
