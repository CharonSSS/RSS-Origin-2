		#RSSOrigin2_Cleoselene_desc = 艳卫二（Remus），学术正式编号为 （87） Sylvia II Remus，是建国英雄罗穆卢斯形影不离的双胞胎弟弟。它是三合星系统——艳神星（87 Sylvia）的第二颗被发现、也是较小的一颗内侧卫星。
