		#RSSOrigin2_Naiad_name = 海卫三（Naiad）
		#RSSOrigin2_Naiad_desc = 海卫三（Naiad）（又称 Neptune III，旧编号 S/1989 N 6），以希腊传说中的那伊阿得斯命名，是海王星最内侧的卫星，也是所有有卫星的气态巨行星中距离行星中心最近的卫星，距行星中心 48224 公里。其轨道周期短于一个海王星日，由此产生的潮汐耗散将导致其轨道衰减。最终它要么坠入海王星大气层，要么分裂成为新的环。
