		#RSSOrigin2_Heracles_name = 大力士星（Heracles）
		#RSSOrigin2_Heracles_desc = 大力士星（Heracles）（小行星编号：5143 Heracles，临时编号：1991 VL）是一颗高偏心率、罕见类型的小行星和同步双星系统，被归类为阿波罗群的近地天体，直径约 4.8 公里。1991 年 11 月 7 日由美国天文学家卡罗琳·苏梅克在加利福尼亚州帕洛玛天文台发现。以希腊神话中的神圣英雄赫拉克勒斯命名。与地球的最小轨道交叉距离为 0.058 AU（870 万公里），与金牛座 β 白昼流星雨有关。
