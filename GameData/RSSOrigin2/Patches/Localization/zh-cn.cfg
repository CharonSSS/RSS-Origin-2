		#RSSOrigin2_Elektra_name = 怂女星（Elektra）
		#RSSOrigin2_Elektra_desc = 怂女星（Elektra）（小行星编号：130 Elektra）是一颗大型外主带小行星，是拥有三颗小行星卫星的四重系统。1873 年 2 月 17 日由天文学家克里斯蒂安·彼得斯在纽约利奇菲尔德天文台发现，以希腊神话中的复仇者厄勒克特拉命名。
