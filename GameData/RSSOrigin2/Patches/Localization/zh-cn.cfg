		#RSSOrigin2_Elara_name = 木卫七（Elara）
		#RSSOrigin2_Elara_desc = 木卫七（Elara）由利克天文台的查尔斯·狄龙·佩林于 1905 年 1 月 6 日发现，即佩林宣布发现木卫六的次日。由于天气恶劣，确认发现的工作推迟到 2 月 21 日才完成。它以宙斯的情人之一、巨人提提俄斯的母亲埃拉拉命名。木卫七直到 1975 年才获得现在的名字；此前它仅被称为 Jupiter VII。在 1955 年至 1975 年间，它有时被称为"赫拉"。
