		#RSSOrigin2_S-2000_90_1_name = 休卫一（Antiope B）
		#RSSOrigin2_S-2000_90_1_desc = 休神星最显著的特征是它由两个几乎同等大小的组成部分构成（质量差异小于 2.5%），使其成为真正意义上的"双"小行星。其双星性质于 2000 年 8 月 10 日由一组天文学家在莫纳克亚的凯克望远镜上使用自适应光学技术发现。此前，IRAS 观测曾表明该小行星直径为 120 公里。
