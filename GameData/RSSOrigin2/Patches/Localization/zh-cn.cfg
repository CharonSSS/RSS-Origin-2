		#RSSOrigin2_Achlys_name = 霭神星（Achlys）
		#RSSOrigin2_Achlys_desc = 霭神星（Achlys）（小行星编号：208996 Achlys，临时编号 2003 AZ84）是一颗大型海外天体，在柯伊伯带——海王星之外的冰冷天体区域——绕太阳运行。它于 2003 年 1 月 13 日由查德·特鲁希略和迈克尔·E·布朗在帕洛马天文台发现。霭神星具有拉长形状，被认为是由其 6.8 小时的快速自转所扭曲。其直径估计赤道方向约 940 公里，极方向约 490 公里。继冥王星和亡神星之后，霭神星是冥族小天体中第三大成员——这一族群是与海王星 2:3 轨道共振的柯伊伯带天体，即每完成三圈海王星轨道，它们完成两圈。霭神星表面呈暗灰色，主要由水冰组成。恒星掩星观测显示，霭神星表面有一道 8-13 公里深的峡谷或凹陷，类似于冥王星及其卫星卡戎上所见。霭神星有一颗已知直径约 80 公里的卫星。霭神星的质量和密度尚未测量，但基于其形状和自转的预测表明其密度低于水冰。
