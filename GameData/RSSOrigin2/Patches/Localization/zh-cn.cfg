		#RSSOrigin2_Ida_name = 艾女星（Ida）
		#RSSOrigin2_Ida_desc = 艾女星（Ida）（小行星编号：243 Ida）是小行星带科罗尼斯族的一颗小行星。1884 年 9 月 29 日由奥地利天文学家约翰·帕利萨在维也纳天文台发现，以希腊神话中的仙女命名。后来的望远镜观测将艾女星归类为 S 型小行星，这是内小行星带中数量最多的类型。1993 年 8 月 28 日，伽利略号航天器在前往木星途中飞掠了艾女星。它是第二颗被航天器到访的小行星，也是第一颗被发现拥有天然卫星的小行星。
		#RSSOrigin2_Ida_Biome1 = 叶瓣1
		#RSSOrigin2_Ida_Biome2 = 叶瓣2
		#RSSOrigin2_Ida_Biome3 = 翁达拉撞击坑
		#RSSOrigin2_Ida_Biome4 = 拉斯科撞击坑
		#RSSOrigin2_Ida_Biome5 = 腰部

		#RSSOrigin2_Dactyl_name = 艾卫一（Dactyl）
		#RSSOrigin2_Dactyl_desc = 艾卫一（Dactyl）（小行星编号： 243 Ida I Dactyl）是绕小行星 243 艾女星运行的微小卫星（直径 1.6 公里）。1993 年 8 月 28 日由伽利略号航天器成像；艾卫一是在 1994 年 2 月 17 日检查伽利略号延迟下载的图像时被发现的。临时编号为 S/1993 （243） 1。艾卫一以 1.54 天的周期、108 公里的平均距离绕艾女星运行，轨道倾角相对于艾女星赤道为 9°。艾卫一的起源尚不清楚，但有两种主要假说：一是艾卫一和艾女星同时形成，二是艾卫一由后来的撞击中被剥离出来。艾卫一是第一颗被发现的小行星卫星。它的发现解决了关于小行星卫星存在与否的长期争论。
		#RSSOrigin2_Dactyl_Biome1 = 高地
		#RSSOrigin2_Dactyl_Biome2 = 低地

		#RSSOrigin2_Mathilde_name = 梅西尔德星（Mathilde）
		#RSSOrigin2_Mathilde_desc = 梅西尔德星（Mathilde）（小行星编号：253 Mathilde）是中间小行星带的一颗小行星，直径约 50 公里，1885 年 11 月 12 日由奥地利天文学家约翰·帕利萨在维也纳天文台发现。它的轨道相对椭圆，绕太阳一周需要四年多的时间。这颗翻滚的小行星自转速度异常缓慢，需要 17.4 天才能完成绕轴 360° 旋转一周。它是一颗原始的 C 型小行星，这意味着表面碳含量高；表面暗淡，仅反射 4% 的入射光。
		#RSSOrigin2_Mathilde_Biome1 = 石狩撞击坑
		#RSSOrigin2_Mathilde_Biome2 = 库兹涅茨克撞击坑
		#RSSOrigin2_Mathilde_Biome3 = 卡鲁撞击坑
