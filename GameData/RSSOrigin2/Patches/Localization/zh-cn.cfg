		#RSSOrigin2_APL_Biome3 = 低地

		#RSSOrigin2_Nix_name = 冥卫二（Nix）
		#RSSOrigin2_Nix_desc = 冥卫二（Nix）是冥王星的天然卫星，最长方向直径 49.8 公里。它于 2005 年 5 月 15 日与冥王星最外层卫星冥卫五许德拉一起由天文学家使用哈勃空间望远镜发现，以希腊神话夜之女神倪克斯命名。冥卫二是冥王星按距离排列的第三颗卫星，在冥卫五和冥卫四之间运行。
		#RSSOrigin2_Nix_Biome1 = 高地
		#RSSOrigin2_Nix_Biome2 = 中地
		#RSSOrigin2_Nix_Biome3 = 低地

		#RSSOrigin2_Hydra_name = 冥卫三（Hydra）
		#RSSOrigin2_Hydra_desc = 冥卫三（Hydra）是冥王星的天然卫星，最长方向直径约 51 公里。它是冥王星第二大卫星，略大于冥卫二。冥卫三与冥卫二一起于 2005 年 5 月 15 日由天文学家使用哈勃空间望远镜发现，以希腊神话中冥界九头蛇许德拉命名。按距冥王星距离排列，冥卫三是冥王星的第五颗也是最外层卫星，在冥王星第四颗卫星冥卫四之外运行。
		#RSSOrigin2_Hydra_Biome1 = 高地
		#RSSOrigin2_Hydra_Biome2 = 中地
		#RSSOrigin2_Hydra_Biome3 = 低地

		#RSSOrigin2_Kerberos_name = 冥卫四（Kerberos）
		#RSSOrigin2_Kerberos_desc = 冥卫四（Kerberos）是冥王星的小型天然卫星，最长方向约 19 公里。它是冥王星第四颗被发现的卫星，其存在于 2011 年 7 月 20 日公布。2015 年 7 月新视野号探测器对它及冥王星及其其他四颗卫星进行了成像。飞掠获得的首张冥卫四图像于 2015 年 10 月 22 日向公众发布。
		#RSSOrigin2_Kerberos_Biome1 = 瓣
		#RSSOrigin2_Kerberos_Biome2 = 颈部

		#RSSOrigin2_Styx_name = 冥卫五（Styx）
		#RSSOrigin2_Styx_desc = 冥卫五（Styx）是冥王星的小型天然卫星，其发现于 2012 年 7 月 11 日公布，由哈勃空间望远镜发现。截至 2022 年，它是冥王星已知最小的卫星。2015 年 7 月新视野号探测器对它及冥王星及其其他卫星进行了成像，但成像质量较差，仅获得一张冥卫五图像。冥卫五是已知第二接近冥王星的卫星，也是第五颗被发现的。它在冥卫四发现一年后被发现。冥卫五最长方向约 16 公里，轨道周期 20.1 天。
		#RSSOrigin2_Styx_Biome1 = 高地区
		#RSSOrigin2_Styx_Biome2 = 低地区

		#RSSOrigin2_Haumea_name = 妊神星（Haumea）
		#RSSOrigin2_Haumea_desc = 妊神星（Haumea）（小行星编号：136108 Haumea）是位于海王星轨道之外的矮行星。它于 2004 年由美国加州理工学院迈克·布朗领导的团队在帕洛马天文台发现，存争议地也于 2005 年由西班牙何塞·路易斯·奥尔蒂斯·莫雷诺领导的团队在内华达山天文台发现，尽管后者的主张存在争议。2008 年 9 月 17 日，在国际天文联合会（IAU）预期它将被证明是矮行星的情况下，以夏威夷生育女神妊神星命名。名义估计使其成为已知第三大海外天体，仅次于阋神星和冥王星，尽管最佳拟合模型的不确定性稍与创神星的较大尺寸估计重叠。
		#RSSOrigin2_Haumea_Biome1 = 红斑区
		#RSSOrigin2_Haumea_Biome2 = 深谷
		#RSSOrigin2_Haumea_Biome3 = 撞击坑
		#RSSOrigin2_Haumea_Biome4 = 赤道高地
		#RSSOrigin2_Haumea_Biome5 = 北半球
		#RSSOrigin2_Haumea_Biome6 = 南半球
		#RSSOrigin2_Haumea_Biome7 = 南极区

		#RSSOrigin2_Hi'iaka_name = 妊卫一（Hiʻiaka）
		#RSSOrigin2_Hi'iaka_desc = 妊卫一（Hiʻiaka）是海外矮行星妊神星较大、较外的卫星。以妊神星之女之一、夏威夷大岛守护女神希伊阿卡命名。它以 49.12±0.03 天的周期在 49880±198 公里距离处绕行，偏心率 0.0513±0.0078，倾角 126.356±0.064°。假设其估计直径超过 300 公里准确，它可能是海外天体已知第四或第五大卫星，仅次于冥卫一卡戎、阋卫一狄斯诺米亚、亡卫一，以及可能的伐卫一伊尔玛雷和萨卫一阿克泰亚。
		#RSSOrigin2_Hi'iaka_Biome1 = 撞击坑
		#RSSOrigin2_Hi'iaka_Biome2 = 南极区
		#RSSOrigin2_Hi'iaka_Biome3 = 北极区
		#RSSOrigin2_Hi'iaka_Biome4 = 赤道隆起
		#RSSOrigin2_Hi'iaka_Biome5 = 北半球
		#RSSOrigin2_Hi'iaka_Biome6 = 南半球

		#RSSOrigin2_Namaka_name = 妊卫二（Namaka）
		#RSSOrigin2_Namaka_desc = 妊卫二（Namaka）是海外矮行星妊神星较小、较内的卫星。以夏威夷神话中的海神、妊神星之女之一纳玛卡命名。
