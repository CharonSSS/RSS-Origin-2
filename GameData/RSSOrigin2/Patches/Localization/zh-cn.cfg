		#RSSOrigin2_Juno_Biome4 = 赤道隆起带
		#RSSOrigin2_Juno_Biome5 = 北半球
		#RSSOrigin2_Juno_Biome6 = 南半球

		#RSSOrigin2_Hygiea_name = 健神星（Hygiea）
		#RSSOrigin2_Hygiea_desc = 健神星（Hygiea）（小行星编号：10 Hygiea）是位于主小行星带的一颗主要小行星。平均直径在 425 至 440 公里之间，质量估计为小行星带总质量的 3%，按体积和质量计算是太阳系第四大小行星，也是在使用 G 型归类谷神星的分类中最大的 C 型小行星（具有碳质表面的暗小行星）。它非常接近球形，显然是因为在产生大型健神星族小行星的破坏性撞击后重新吸积而成。
