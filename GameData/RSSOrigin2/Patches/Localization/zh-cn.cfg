		#RSSOrigin2_Kleopatra_name = 艳后星（Kleopatra）
		#RSSOrigin2_Kleopatra_desc = 艳后星（Kleopatra）（小行星编号：216 Kleopatra）是一颗大型 M 型小行星，平均直径 120 公里（75 英里），以其拉长的骨头或哑铃形状著称。1880 年 4 月 10 日由奥地利天文学家约翰·帕利萨在奥地利海军波拉天文台（今克罗地亚普拉）发现，以著名的埃及女王克娄巴特拉命名。它有两颗小行星卫星，分别于 2008 年发现，后命名为亚历克斯赫利俄斯和克莱奥塞勒涅。
