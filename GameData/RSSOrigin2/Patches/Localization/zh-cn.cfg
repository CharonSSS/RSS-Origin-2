		#RSSOrigin2_S-2011_5143_1_desc = 2012 年 7 月 12 日宣布大力士星是一颗假定的同步双星小行星，其小行星卫星以逆行方式约每 16 小时绕主星运行一周。该伴星于 2011 年 12 月由一组天文学家使用波多黎各阿雷西博天文台的雷达观测发现，此前进行了数月的密集光度光变曲线观测。
