		#RSSOrigin2_Donaldjohanson_name = 唐纳德·约翰森（Donaldjohanson）
		#RSSOrigin2_Donaldjohanson_desc = 唐纳德·约翰森（Donaldjohanson）（小行星编号：52246 Donaldjohanson，临时编号 1981 EQ5）是一颗来自小行星带内部区域的碳质埃里戈尼族小行星，直径约 4 公里。它于 1981 年 3 月 2 日由美国天文学家谢尔特·巴斯在澳大利亚赛丁泉天文台发现。这颗 C 型小行星是露西号任务的目标，恰如其名地以美国古人类学家唐纳德·约翰森命名。
