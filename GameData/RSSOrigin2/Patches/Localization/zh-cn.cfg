		#RSSOrigin2_Helene_name = 土卫十二（Helene）
		#RSSOrigin2_Helene_desc = 土卫十二（Helene）是土星的一颗卫星。1980 年由皮埃尔·拉克斯和让·勒卡什从皮克迪米迪天文台的地面观测中发现，编号为 S/1980 S 6。1988 年正式以特洛伊的海伦命名，在希腊神话中她是克洛诺斯（土星）的孙女。土卫十二也编号为 Saturn XII（12），这是 1982 年分配的，以及 Dione B，因为它与土卫四共轨并位于其前导拉格朗日点（L4）。它是四颗已知特洛伊卫星之一。
