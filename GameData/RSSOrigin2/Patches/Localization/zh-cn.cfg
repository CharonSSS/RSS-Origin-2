		#RSSOrigin2_311P-PanSTARRS_Biome2 = 中地
		#RSSOrigin2_311P-PanSTARRS_Biome3 = 低地

		#RSSOrigin2_S-0000_311P_1_name = 311P/PanSTARRS的伴星
		#RSSOrigin2_S-0000_311P_1_desc = 2018 年 4 月 19 日，基于光曲线的观测表明 311P/PanSTARRS 周围可能存在一颗接近 200 米的卫星。如果属实，这将是少数被指定为彗星且已知拥有卫星的小行星之一。
