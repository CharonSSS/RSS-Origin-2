		#RSSOrigin2_S-0000_50000_1_name = 创卫二（Quaoar II）
		#RSSOrigin2_S-0000_50000_1_desc = 2025 年报道称创神星可能存在第二颗卫星，当时天文学家理查德·诺尔瑟纽斯和柯克·本德各自在同一天文台的不同望远镜中，于 2025 年 6 月 25 日观测到创神星附近一颗背景星（UCAC4 376-136839）出现意外的 1.23 秒掩星。这次掩星与维沃特和创神星已知环的预测时间和位置不符，表明它要么是由一颗未知小卫星引起，要么是由创神星周围的致密环弧造成。他们认为可以排除当地的竞争性原因。在两种可能选项中，未知卫星是最可能的。创神星假定的第二颗卫星估计直径至少 30 公里，质量比维沃特小 100 倍。这意味着这颗卫星将极其暗淡，视星等 28——几乎无法用任何现有望远镜（包括詹姆斯·韦伯空间望远镜）探测。只有恒星掩星观测和未来的极大望远镜才能探测到创神星的第二颗卫星。
