		#RSSOrigin2_Paaliaq_name = 土卫二十（Paaliaq）
		#RSSOrigin2_Paaliaq_desc = 土卫二十（Paaliaq）是土星的一颗顺行不规则卫星。2000 年 10 月初由 J·J·卡韦拉尔斯、布雷特·J·格拉德曼、让-马克·佩蒂特、汉斯·肖尔、马修·J·霍尔曼、布莱恩·G·马斯登、菲利普·D·尼科尔森和约瑟夫·A·伯恩斯发现，临时编号为 S/2000 S 2。2003 年 8 月以迈克尔·库苏加克所著《萨满的诅咒》一书中的虚构萨满命名，库苏加克向卡韦拉尔斯提供了因纽特神话中的巨人名字，用于其他土星卫星。土卫二十直径约 29 公里，以平均 1500 万公里的距离绕土星运行，周期 687 天。它是不规则卫星因纽特群的成员。它呈浅红色，在红外波段，土卫二十的光谱与因纽特群卫星基维乌克和西亚尔纳克非常相似，支持了因纽特群可能源于一个更大天体分裂的共同起源假说。其光变曲线有四个极小值的异常模式，表明它具有非常特殊的形状。
		#RSSOrigin2_Paaliaq_Biome1 = 高地
		#RSSOrigin2_Paaliaq_Biome2 = 中地
		#RSSOrigin2_Paaliaq_Biome3 = 低地

		#RSSOrigin2_Kiviuq_name = 土卫二十四（Kiviuq）
		#RSSOrigin2_Kiviuq_desc = 土卫二十四（Kiviuq）是土星的一颗顺行不规则卫星。2000 年由 J·J·卡韦拉尔斯等人发现，临时编号为 S/2000 S 5。以因纽特神话中的英雄基维乌克命名。土卫二十四直径约 17 公里，以平均 1130 万公里的距离绕土星运行，周期 449 天。它是不规则卫星因纽特群的成员。它呈浅红色，基维乌克的红外光谱与因纽特群卫星西亚尔纳克和帕利亚克非常相似，支持了因纽特群可能源于一个更大天体分裂的共同起源假说。土卫二十四被认为处于柯扎伊共振中，周期性地降低轨道倾角同时增加偏心率，反之亦然。其当前轨道要素与土卫九的轨道强烈重叠，这两颗卫星最终可能会相撞。土卫二十四的光变曲线振幅很大，亮度变化超过 2 个星等。土卫二十四的大振幅表明它具有拉长的形状，可能是一个接触双星。
