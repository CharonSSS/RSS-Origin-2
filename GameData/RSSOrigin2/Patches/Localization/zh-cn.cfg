		#RSSOrigin2_Arrokoth_name = 天涯海角（Arrokoth）
		#RSSOrigin2_Arrokoth_desc = 天涯海角（Arrokoth）（小行星编号：486958 Arrokoth，临时编号 2014 MU69）是位于柯伊伯带的一颗海外天体。2019 年 1 月 1 日 NASA 新视野号探测器飞掠时，天涯海角成为太阳系中被航天器拜访的最远、最原始天体。天涯海角是一个长 36 公里的接触双星，由两个直径分别为 21 公里和 15 公里的微行星沿长轴相连组成。轨道周期约 298 年，轨道倾角和偏心率较低，天涯海角被归类为冷经典柯伊伯带天体。
		#RSSOrigin2_Arrokoth_Biome1 = 维约瓣
		#RSSOrigin2_Arrokoth_Biome2 = 韦努瓣
		#RSSOrigin2_Arrokoth_Biome3 = 阿卡萨颈部

		#RSSOrigin2_Ka`epaoka`awela_name = 卡埃帕奥卡阿韦拉（Kaʻepaokaʻāwela）
		#RSSOrigin2_Ka`epaoka`awela_desc = 卡埃帕奥卡阿韦拉（Kaʻepaokaʻāwela）（小行星编号：514107 Kaʻepaokaʻāwela，临时编号 2015 BZ509，昵称 Bee-Zed）是一颗小行星，直径约 3 公里，与木星共振共轨运动。它是一颗不寻常的小行星，其轨道是逆行的，与太阳系中大多数其他天体的方向相反。它于 2014 年 11 月 26 日由泛星计划巡天的天文学家在美国毛伊岛哈莱阿卡拉天文台发现。卡埃帕奥卡阿韦拉是首颗与任何行星 1:-1 共振的小行星实例。这种共振类型在该天体发现前几年才被研究。一项研究表明它是一颗 45 亿年前被捕获到绕太阳轨道上的星际小行星。
		#RSSOrigin2_Ka`epaoka`awela_Biome1 = 赤道隆起
		#RSSOrigin2_Ka`epaoka`awela_Biome2 = 北半球
		#RSSOrigin2_Ka`epaoka`awela_Biome3 = 南半球

		#RSSOrigin2_Zoozve_name = 祖兹维（Zoozve）
		#RSSOrigin2_Zoozve_desc = 祖兹维（Zoozve）（小行星编号：524522 Zoozve，临时编号 2002 VE68）是一颗亚公里级小行星，金星的临时准卫星。2002 年发现，它是太阳系中围绕主行星发现的首个此类天体。它的绕日轨道周期与金星几乎相同。在与金星共转的参考系中，它在一个金星年内看似绕金星运行，但它绕的是太阳而非金星。
