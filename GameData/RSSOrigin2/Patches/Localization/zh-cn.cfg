		#RSSOrigin2_Himalia_name = 木卫六（Himalia）
		#RSSOrigin2_Himalia_desc = 木卫六（Himalia），即 Jupiter VI，是木星最大的不规则卫星，直径至少 140 公里（90 英里）。它是木星第六大卫星，仅次于四颗伽利略卫星和木卫五。1904 年 12 月 3 日，查尔斯·狄龙·佩林在利克天文台发现了它，并以仙女希玛利亚命名，她为宙斯（即罗马神话中的朱庇特）生了三个儿子。它是太阳系中最大的未被详细成像的行星卫星之一，也是海王星轨道内未被详细成像的第三大卫星。
