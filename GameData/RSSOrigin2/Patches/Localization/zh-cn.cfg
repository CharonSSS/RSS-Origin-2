		#RSSOrigin2_Eros_name = 爱神星（Eros）
		#RSSOrigin2_Eros_desc = 爱神星（Eros）（小行星编号：433 Eros），临时编号 1898 DQ，是阿莫尔群的一颗石质小行星，也是第一颗被发现和第二大的近地天体，形状拉长，平均直径约 16.8 公里（10.4 英里）。1998 年由近地小行星探测器（NEAR Shoemaker）到访，成为第一颗被航天器从轨道上研究的小行星。
		#RSSOrigin2_Eros_Biome1 = 沙卢瓦地区
