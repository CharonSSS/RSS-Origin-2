		#RSSOrigin2_Ryugu_name = 龙宫（Ryugu）
		#RSSOrigin2_Ryugu_desc = 龙宫（Ryugu）（小行星编号：162173 Ryugu，临时编号 1999 JU3）是一颗近地天体和阿波罗群潜在危险小行星。直径约 1 公里，是罕见的 Cb 光谱型暗天体，兼具 C 型和 B 型小行星的特征。2018 年 6 月，日本航天器隼鸟 2 号抵达该小行星。在完成测量和采样后，隼鸟 2 号于 2019 年 11 月离开龙宫返回地球，并于 2020 年 12 月 5 日将样品舱送回地球。
