		#RSSOrigin2_1994CC_name = 1994 CC
		#RSSOrigin2_1994CC_desc = （小行星编号：（136617） 1994 CC ）是一颗亚公里级三联小行星，被归类为近地天体和阿波罗群潜在危险小行星。1994 CC 由一颗直径约 700 米的中心天体和围绕它运行的两颗卫星组成。科学家对系统的初步分析表明，卫星直径至少 50 米。在类似的研究中，由迈克·诺兰领导的波多黎各阿雷西博天文台雷达观测也确认探测到全部三个天体。科学家计划利用金石和阿雷西博天文台的联合观测进一步研究 1994 CC 的轨道和物理性质。
