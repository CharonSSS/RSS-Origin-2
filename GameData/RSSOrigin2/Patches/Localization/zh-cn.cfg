		#RSSOrigin2_Alexhelios_name = 艳卫一（Alexhelios）
		#RSSOrigin2_Alexhelios_desc = 艳卫一（Romulus），学术正式编号为 （87） Sylvia I Romulus，是罗马建国者罗穆卢斯在太空中的化身。它是三合星系统——艳神星（87 Sylvia）的第一颗被发现、也是较大的一颗外侧卫星。
