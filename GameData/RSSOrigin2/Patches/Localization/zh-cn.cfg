		#RSSOrigin2_2017OF201_Biome5 = 北半球
		#RSSOrigin2_2017OF201_Biome6 = 南半球

		#RSSOrigin2_1P-Halley_name = 哈雷彗星（1P/Halley）
		#RSSOrigin2_1P-Halley_desc = 哈雷彗星（正式编号：1P/Halley）是一颗短周期彗星，每 75-79 年可从地球上见到一次。哈雷是已知唯一一颗能定期从地球上用肉眼看到的短周期彗星，因此也是唯一一颗能在人一生中两次出现的肉眼彗星。哈雷上次出现在太阳系内部是 1986 年，下次将在 2061 年年中出现。
		#RSSOrigin2_1P-Halley_Biome1 = 长端
		#RSSOrigin2_1P-Halley_Biome2 = 短端
		#RSSOrigin2_1P-Halley_Biome3 = 主体

		#RSSOrigin2_2P-Encke_name = 恩克彗星（2P/Encke）
		#RSSOrigin2_2P-Encke_desc = 恩克彗星（正式编号：2P/Encke）是一颗周期彗星，每 3.3 年完成一次绕日轨道。（这是相当明亮的彗星中最短的周期；较暗的主带彗星 311P/PanSTARRS 周期为 3.2 年。）恩克彗星最早由皮埃尔·梅尚于 1786 年 1 月 17 日记录，但直到 1819 年约翰·弗朗茨·恩克计算出其轨道才被认定为周期彗星。与哈雷彗星一样，它的不寻常之处在于以轨道计算者而非发现者命名。与大多数彗星一样，它的反照率非常低，仅反射其彗核接收光的 4.6%，不过彗星产生的巨大彗发和彗尾可使它们在近日点（最接近太阳）时更为可见。
		#RSSOrigin2_2P-Encke_Biome1 = 高地
		#RSSOrigin2_2P-Encke_Biome2 = 中地
		#RSSOrigin2_2P-Encke_Biome3 = 低地

		#RSSOrigin2_6P-d'Arrest_name = 达雷彗星（6P/d'Arrest）
		#RSSOrigin2_6P-d'Arrest_desc = 达雷彗星（正式编号：6P/d'Arrest）是一颗周期彗星，每 6.54 年在火星与木星之间绕行一圈。它是德国天文学家海因里希·路德维希·达雷斯特发现的三颗彗星中的第二颗。下次将于 2028 年 3 月 31 日到达近日点，距太阳 1.35 AU，预计亮度约视星等 11。
		#RSSOrigin2_6P-d'Arrest_Biome1 = 高地
		#RSSOrigin2_6P-d'Arrest_Biome2 = 中地
		#RSSOrigin2_6P-d'Arrest_Biome3 = 低地

		#RSSOrigin2_8P-Tuttle_name = 塔特尔彗星（8P/Tuttle）
		#RSSOrigin2_8P-Tuttle_desc = 塔特尔彗星（正式编号：8P/Tuttle）是一颗周期 13.6 年的周期彗星。它符合木星族彗星经典定义（轨道周期小于 20 年），但不符合现代定义（2 < T木星 < 3）。它上次过近日点是 2021 年 8 月 27 日，太阳距角约 26 度，视星等约 9。两周后的 2021 年 9 月 12 日，它距地球约 1.8 AU（2.7 亿公里），约为彗星在近日点附近时距地球的最远距离。8P/塔特尔彗星是 12 月下旬小熊座流星雨的母彗星。
		#RSSOrigin2_8P-Tuttle_Biome1 = 大瓣
		#RSSOrigin2_8P-Tuttle_Biome2 = 小瓣
		#RSSOrigin2_8P-Tuttle_Biome3 = 颈部

		#RSSOrigin2_9P-Tempel1_name = 坦普尔1号彗星（9P/Tempel）
		#RSSOrigin2_9P-Tempel1_desc = 坦普尔1号彗星（正式编号：9P/Tempel）是一颗周期性木星族彗星，由威廉·坦普尔于 1867 年发现。每 5.5 年完成一次绕日轨道。坦普尔1号是深度撞击空间任务的目标，该任务于 2005 年拍摄了对彗星的故意高速撞击。2011 年 2 月 14 日星尘号航天器再次探访，并于 2016 年 8 月回到近日点。
		#RSSOrigin2_9P-Tempel1_Biome1 = 高地
		#RSSOrigin2_9P-Tempel1_Biome2 = 中地
		#RSSOrigin2_9P-Tempel1_Biome3 = 低地

		#RSSOrigin2_10P-Tempel2_name = 坦普尔二号彗星（10P/Tempel）
		#RSSOrigin2_10P-Tempel2_desc = 坦普尔二号彗星（正式编号：10P/Tempel）是一颗轨道周期 5 年的周期性木星族彗星。它于 1873 年 7 月 4 日由威廉·坦普尔发现。下次过近日点为 2021 年 3 月 24 日，太阳距角 30 度，视星等约 11。2021 年过境期间最接近地球直到数月后的 2021 年 11 月 3 日才发生，距离 1.6 AU（2.4 亿公里）。
		#RSSOrigin2_10P-Tempel2_Biome1 = 高地
		#RSSOrigin2_10P-Tempel2_Biome2 = 中地
		#RSSOrigin2_10P-Tempel2_Biome3 = 低地

		#RSSOrigin2_19P-Borrelly_name = 包瑞利彗星（19P/Borrelly）
		#RSSOrigin2_19P-Borrelly_desc = 包瑞利彗星（正式编号：19P/Borrelly）是一颗周期彗星，2001 年被深空 1 号航天器拜访。该彗星上次于 2022 年 2 月 1 日到达近日点，下次将于 2028 年 12 月 11 日到达近日点。
		#RSSOrigin2_19P-Borrelly_Biome1 = 长端
		#RSSOrigin2_19P-Borrelly_Biome2 = 短端
		#RSSOrigin2_19P-Borrelly_Biome3 = 主体

		#RSSOrigin2_21P-Giacobini-Zinner_name = 贾可比尼-秦诺彗星（21P/Giacobini-Zinner）
		#RSSOrigin2_21P-Giacobini-Zinner_desc = 贾可比尼-秦诺彗星（正式编号：21P/Giacobini-Zinner）是太阳系中的一颗周期彗星。它由米歇尔·贾可比尼于 1900 年 12 月 20 日在宝瓶座观测到。两个轨道后，恩斯特·金纳于 1913 年 10 月 23 日在观测盾牌座β附近的变星时重新发现它。
