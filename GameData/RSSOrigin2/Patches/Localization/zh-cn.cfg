		#RSSOrigin2_Makemake_name = 鸟神星（Makemake）
		#RSSOrigin2_Makemake_desc = 鸟神星（Makemake）（小行星编号：136472 Makemake）是一颗矮行星，根据定义方式不同，是经典族群中第二大的柯伊伯带天体，直径约为冥王星的 60%。它有一颗已知卫星。其极低的平均温度（约 40 K，即 −230 °C）意味着表面被甲烷、乙烷和可能的氮冰覆盖。
