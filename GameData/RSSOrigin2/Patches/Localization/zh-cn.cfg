		#RSSOrigin2_Zoozve_Biome3 = 颈部

		#RSSOrigin2_Chiminigagua_name = 奇米尼加瓜（Chiminigagua）
		#RSSOrigin2_Chiminigagua_desc = 奇米尼加瓜（Chiminigagua）（小行星编号：532037 Chiminigagua，临时编号 2013 FY27）是黄道离散盘中的一颗大型海外天体。它于 2013 年 3 月 17 日由斯科特·谢泼德和查德·特鲁希略在智利托洛洛山天文台发现。奇米尼加瓜名义直径约 740 公里，足够大，一些天文学家认为它可能是矮行星。奇米尼加瓜呈中度红色，表明其表面古老、贫冰，被宇宙射线和微流星体轰击所暗化。它有一颗未命名的卫星，直径约 190 公里，被认为是由对奇米尼加瓜的巨大撞击形成。
