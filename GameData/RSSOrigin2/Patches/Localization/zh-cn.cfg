		#RSSOrigin2_S-2012_2577_1_name = S/2012 （2577） 1
		#RSSOrigin2_S-2012_2577_1_desc = 2012 年发现了距主星 378 公里处运行的第二颗卫星，直径 1.2 公里，轨道周期 214 天。该发现于 2013 年底公布。这使 2577 立陶宛成为第 11 颗被发现的三重系统小行星。
		#RSSOrigin2_S-2012_2577_1_Biome1 = 高地
		#RSSOrigin2_S-2012_2577_1_Biome2 = 中地
