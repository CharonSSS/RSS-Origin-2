		#RSSOrigin2_Uni_name = 尤尼（Uni）
		#RSSOrigin2_Uni_desc = 尤尼（Uni）（小行星编号：55637 Uni，临时编号 2002 UX25）是一颗大型海外天体，在海王星之外的柯伊伯带绕太阳运行。当发现其密度意外低至约 0.82 g/cm³ 时，它曾短暂引起科学界关注。它于 2002 年 10 月 30 日由空间监测计划发现。尤尼绝对星等约 4.0，斯皮策空间望远镜结果估计其直径约 660 公里。该天体及许多中等大小海外天体的低密度意味着它们从未被压缩成完全固态天体，更未分化或塌缩至流体静力平衡，因此不太可能是矮行星。尤尼有一颗已知卫星蒂尼亚，于 2005 年发现。
