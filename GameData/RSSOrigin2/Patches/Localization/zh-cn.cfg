		#RSSOrigin2_Telesto_name = 土卫十三（Telesto）
		#RSSOrigin2_Telesto_desc = 土卫十三（Telesto）是土星的一颗卫星。1980 年由史密斯、赖茨玛、拉森和方丹从地面观测中发现，临时编号为 S/1980 S 13。在随后的几个月中，观测到了它的数次出现：S/1980 S 24、S/1980 S 33 和 S/1981 S 1。1983 年正式以希腊神话中的忒勒斯托命名。它也被编号为 Saturn XIII 或 Tethys B。土卫十三与土卫三共轨，位于土卫三的前导拉格朗日点（L4）。这一关系最早由赛德尔曼等人于 1981 年确认。另一颗卫星土卫十四位于土卫三的另一个（尾随）拉格朗日点，与土卫三相差 60 度。土星系统还有两颗额外的特洛伊卫星。
