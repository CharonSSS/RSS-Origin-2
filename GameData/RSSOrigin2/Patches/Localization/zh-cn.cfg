		#RSSOrigin2_S-2003_130_1_name = S/2003 （130） 1
		#RSSOrigin2_S-2003_130_1_desc = S/2003 （130） 1 是怂女星最大、最外侧的卫星，直径约 6 公里（3.7 英里），假设与主星反照率相同。2003 年 8 月 15 日由 W·J·默林领导的团队在夏威夷莫纳克亚天文台使用凯克 II 望远镜发现。发现图像显示该卫星在近红外 K 波段的视星等差为 8.5。团队于 2003 年 8 月 17 日用凯克 II 望远镜重新观测后确认了卫星的存在。发现于同日公布，该卫星获得临时编号 S/2003 （130） 1。
