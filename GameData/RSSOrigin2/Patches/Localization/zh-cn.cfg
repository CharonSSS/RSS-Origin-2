		#RSSOrigin2_Minerva_name = 慧神星（Minerva）
		#RSSOrigin2_Minerva_desc = 慧神星（Minerva）（93 Minerva）是一颗大型三重主带小行星。它是 C 型小行星，意味着表面暗淡，可能具有原始碳质成分。1867 年 8 月 24 日由 J·C·沃森发现，以罗马神话中相当于雅典娜的智慧女神密涅瓦命名。1982 年 11 月 22 日在法国、西班牙和美国观测到密涅瓦掩星。从观测中测得掩星直径约 170 公里。此后又观测到两次掩星，给出估计平均直径约 150 公里。
