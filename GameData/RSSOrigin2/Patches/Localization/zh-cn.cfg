		#RSSOrigin2_S-2001_107_1_Biome2 = 中地
		#RSSOrigin2_S-2001_107_1_Biome3 = 低地

		#RSSOrigin2_S-2016_107_1_name = S/2016 （107） 1
		#RSSOrigin2_S-2016_107_1_desc = 2016 年，智利塞罗帕拉纳尔甚大望远镜的天文学家报告了卡米拉第二颗卫星的发现。其临时编号为 S/2016 （107） 1。观测于 2015 年 5 月 29 日至 2016 年 7 月 30 日之间进行，使用 VLT-SPHERE（安装在 VLT 8 米"梅利帕尔"（UT3） 单元上的主要仪器）。在 5 次观测中，有 3 次可探测到新卫星。该天体轨道半长轴为 340 公里。
