		#RSSOrigin2_Calypso_name = 土卫十四（Calypso）
		#RSSOrigin2_Calypso_desc = 土卫十四（Calypso）是土星的一颗卫星。1980 年由丹·帕斯库、P·肯尼斯·赛德尔曼、威廉·A·鲍姆和道格拉斯·G·柯里从地面观测中发现，临时编号为 S/1980 S 25（1980 年发现的第 25 颗土星卫星）。在随后的几个月中记录了它的数次出现：S/1980 S 29、S/1980 S 30、S/1980 S 32 和 S/1981 S 2。1983 年正式以希腊神话中的卡吕普索命名。它也被编号为 Saturn XIV 或 Tethys C。土卫十四与土卫三共轨，位于土卫三的尾随拉格朗日点（L5），落后土卫三 60 度。这一关系最早由赛德尔曼等人于 1981 年确认。卫星土卫十三位于土卫三的另一个（前导）拉格朗日点，与土卫三相差 60 度。土卫十四和土卫十三被称为"土卫三特洛伊卫星"，类似于特洛伊小行星，是四颗已知特洛伊卫星的一半。
