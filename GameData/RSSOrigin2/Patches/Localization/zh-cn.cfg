		#RSSOrigin2_Dinkinesh_name = 丁基内什星（Dinkinesh）
		#RSSOrigin2_Dinkinesh_desc = 丁基内什星（Dinkinesh）（小行星编号：152830 Dinkinesh，临时编号 1999 VD57）是一颗联星主带小行星，直径约 790 米。它于 1999 年 11 月 4 日由林肯近地小行星研究（LINEAR）巡天在新墨西哥州索科罗发现。丁基内什——这个名字借自埃塞俄比亚语中对露西化石的称呼——是 NASA 露西号任务的第一个飞掠目标，2023 年 11 月 1 日飞船从距小行星 425 公里处接近。飞掠期间，露西号航天器发现丁基内什星有一颗接触双星天然卫星，名为丁卫一，直径 220 米。丁基内什星是迄今为止航天器探测过的最小主带小行星，尽管一些更小的近地小行星也已被探测。
		#RSSOrigin2_Dinkinesh_Biome1 = 赤道脊
		#RSSOrigin2_Dinkinesh_Biome2 = 北半球
		#RSSOrigin2_Dinkinesh_Biome3 = 南半球

		#RSSOrigin2_Selam_name = 丁卫一（Selam）
		#RSSOrigin2_Selam_desc = 丁基内什星和丁卫一共同构成联星小行星系统。丁基内什星是航天器探测的第二颗联星主带小行星，继 1993 年伽利略号探测的 243 艾达之后。丁基内什联星系统在大小和成分上类似于 65803 迪迪莫斯近地小行星联星系统，但距太阳的位置不同，使科学家得以比较不同环境下联星小行星的性质。飞掠前数周，露西号航天器发现丁基内什星的亮度未如预期变化，这提供了丁基内什联星性质的首个线索。露西号接近后拍摄的丁卫一图像显示，它是一个由两个瓣相连的接触双星。虽然接触双星小行星在太阳系中很常见，但丁卫一星是首个已知的小行星接触双星卫星。
