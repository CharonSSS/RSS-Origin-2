		#RSSOrigin2_Interamnia_name = 因太拉尼亚（Interamnia）
		#RSSOrigin2_Interamnia_desc = 因太拉尼亚（Interamnia）（小行星编号：704 Interamnia）是一颗大型 F 型小行星。平均直径约 330 公里，是第五大小行星，仅次于谷神星、灶神星、智神星和健神星。其与太阳的平均距离为 3.067 AU。1910 年 10 月 2 日由温琴佐·切鲁利发现，以切鲁利工作地意大利特拉莫的拉丁名命名。其质量可能在小行星带中排名第五到第十之间，估计约为整个小行星带质量的 1.2%。甚大望远镜的 SPHERE 成像仪在 2017-2019 年间的观测，结合掩星结果，表明因太拉尼亚的形状可能与其密度天体在自转周期 7.6 小时下的流体静力平衡一致。（其当前周期为 8.7 小时。）这表明因太拉尼亚可能最初以平衡体的形式形成，撞击在其完全凝固后改变了自转周期。
		#RSSOrigin2_Interamnia_Biome1 = 撞击坑
		#RSSOrigin2_Interamnia_Biome2 = 南部低地
