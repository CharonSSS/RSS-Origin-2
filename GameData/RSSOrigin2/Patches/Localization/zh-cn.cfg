		#RSSOrigin2_Chaos_name = 卡俄斯（Chaos）
		#RSSOrigin2_Chaos_desc = 卡俄斯（Chaos）（小行星编号：19521 Chaos，临时编号 1998 WH24）是一颗经典柯伊伯带天体（cubewano），不与任何行星共振。卡俄斯于 1998 年由深黄道巡天使用基特峰 4 米望远镜发现。掩星观测表明它是一个紧凑型或接触双星，等效球体直径 400-500 公里。2020 年 11 月 20 日，卡俄斯掩了一颗 16.8 等星，三位观测者探测到掩星，发现该天体直径可能小于 600 公里。2022 年 1 月 14 日又记录到一次掩星；关于大小、形状、几何反照率和自转轴方向的完整结果尚未公布。2023 年 9 月 28 日又发生一次掩星，掩带横跨北美大部分地区，30 多位观测者进行了观测；初步分析表明卡俄斯是双星（可能是接触双星）。
