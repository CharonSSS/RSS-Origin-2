		#RSSOrigin2_Ferdinand_name = 天卫二十四（Ferdinand）
		#RSSOrigin2_Ferdinand_desc = 天卫二十四（Ferdinand）是天王星最外侧的逆行不规则卫星。2001 年 8 月 13 日由马修·J·霍尔曼、约翰·J·卡韦拉尔斯、丹·米利萨夫列维奇和布雷特·J·格拉德曼首次在天王星附近观测到，9 月 21 日再次观测。随后该天体失联，无法确认它是否确实在绕天王星运行。2003 年 8 月 29 日和 30 日，斯科特·S·谢泼德领导的团队使用昴星望远镜对天王星周围的天空进行了巡天，在天王星附近探测到两个未知天体。2003 年 9 月 20 日，谢泼德等人用双子星望远镜重新观测了这两个新天体，并作为可能的新天王星卫星报告给小行星中心。2003 年 9 月 24 日，小行星中心的布莱恩·G·马斯登将谢泼德等人报告的一个未知天体与霍尔曼等人 2001 年观测到的失联天体关联起来。霍尔曼随后在 2003 年 9 月 30 日通过麦哲伦-巴德望远镜观测其位置，确认了 2001 年和 2003 年天体之间的关联。2003 年 10 月 1 日，关联后的 2001 年和 2003 年天体被给予临时编号 S/2001 U 2，正式确认为新天王星卫星。现编号为 Uranus XXIV，天卫二十四以莎士比亚戏剧《暴风雨》中那不勒斯国王之子斐迪南命名。谢泼德等人 2003 年观测到的第二个新天体也是新天王星卫星，现名为天卫二十三。
