		#RSSOrigin2_Chiminigagua_Biome6 = 南半球

		#RSSOrigin2_S-2018_532037_1_name = S/2018 （532037） 1
		#RSSOrigin2_S-2018_532037_1_desc = 奇米尼加瓜是一个有一颗已知天然卫星的联星系统，截至 2025 年该卫星无正式编号或名称。该卫星由斯科特·谢泼德使用哈勃空间望远镜第三代广域照相机于 2018 年 1 月 15 日发现，其高分辨率图像显示为奇米尼加瓜旁的一个暗淡点。谢泼德向国际天文联合会报告了该卫星，联合会于 2018 年 8 月 10 日通过中央天文电报局公布了该发现。
