		#RSSOrigin2_Proteus_name = 海卫八（Proteus）
		#RSSOrigin2_Proteus_desc = 海卫八（Proteus），又称 Neptune VIII，是海王星第二大卫星，也是海王星最大的内卫星。1989 年由旅行者 2 号航天器发现，以希腊神话中能变形的海神普罗透斯命名。海卫八以近乎赤道的轨道绕海王星运行，距离约为海王星赤道半径的 4.75 倍。
