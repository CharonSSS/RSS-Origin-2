		#RSSOrigin2_2012VP113_Biome5 = 北半球
		#RSSOrigin2_2012VP113_Biome6 = 南半球

		#RSSOrigin2_2014FE72_name = 2014 FE72
		#RSSOrigin2_2014FE72_desc = 2014 FE72 是一颗海外天体，2014 年 3 月 26 日在智利拉塞雷纳的托洛洛山美洲际天文台首次观测。它可能是矮行星，是黄道离散盘成员，其轨道延伸至内奥尔特云。由斯科特·谢泼德和查德·特鲁希略发现，该天体的存在于 2016 年 8 月 29 日公布。该天体的轨道周期和远日点距离都得到良好约束。2014 FE72 在 2018 年前具有最大的质心远日点。然而，2014 FE72 的日心远日点在海外天体中排名第二（仅次于达摩克族 2017 MB7）。
		#RSSOrigin2_2014FE72_Biome1 = 撞击坑
		#RSSOrigin2_2014FE72_Biome2 = 南部低地
		#RSSOrigin2_2014FE72_Biome3 = 北部低地
		#RSSOrigin2_2014FE72_Biome4 = 赤道隆起
