		#RSSOrigin2_S-2008_153591_2_desc = S/2008 (153591) 2，在天文学界常被称为 Gamma，是近地三合星系统 2001 SN263 中公转轨道最靠内的内侧卫星。它虽然体型较小，但运行速度极快。
