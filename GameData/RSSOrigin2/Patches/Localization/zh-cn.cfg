		#RSSOrigin2_Varuna_name = 伐楼拿（Varuna）
		#RSSOrigin2_Varuna_desc = 伐楼拿（Varuna）（小行星编号：20000 Varuna，临时编号 2000 WR106）是柯伊伯带中的一颗大型海外天体。它于 2000 年 11 月由美国天文学家罗伯特·麦克米兰在基特峰国家天文台的空间监测巡天中发现。它以吠陀文献中提及的最古老神祇之一、印度教神祇伐楼拿命名。伐楼拿的光变曲线与雅可比椭球体相符，表明其因快速自转而呈拉长形状。由于表面存在复杂有机化合物，伐楼拿表面呈中度红色。其表面也存在水冰，被认为是过去碰撞所暴露的，这些碰撞可能也导致了伐楼拿的快速自转。尽管尚未发现或直接成像伐楼拿的天然卫星，2019 年对其光变曲线变化的分析表明可能存在一颗近距离绕行的卫星。
