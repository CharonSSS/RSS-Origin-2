		#RSSOrigin2_Mathilde_Biome5 = 表面

		#RSSOrigin2_Nike_name = 小行星 307（Nike）
		#RSSOrigin2_Nike_desc = 小行星 307（Nike）（小行星编号：307 Nike）是小行星带的一颗较大小行星。1891 年 3 月 5 日由奥古斯特·沙卢瓦在尼斯天文台发现。沙卢瓦以希腊胜利女神以及发现地的希腊语名称为它命名。2000 年对该小行星光变曲线的测量表明自转周期为 7.902 ± 0.005 小时。
