		#RSSOrigin2_Achlys_Biome6 = 南半球

		#RSSOrigin2_S-2005_208996_1_name = S/2005 （208996） 1
		#RSSOrigin2_S-2005_208996_1_desc = 霭神星有一颗已知的天然卫星，没有正式名称或编号。它由迈克尔·E·布朗和特里-安·苏尔在哈勃空间望远镜 2005 年 12 月 2 日拍摄的图像中发现。霭神星卫星的发现于 2007 年 2 月 22 日通过中央天文电报局发布的国际天文联合会快报公布。自发现以来，霭神星的卫星再未被观测到。缺乏再探测意味着无法确定霭神星卫星的轨道，从而阻碍了霭神星质量的精确确定。尽管如此，基于发现时观测到的与霭神星的分离距离，已预测了卫星轨道的某些性质。
