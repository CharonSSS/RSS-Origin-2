		#RSSOrigin2_Hale-Bopp_name = 海尔-波普彗星（C/1995 O1）
		#RSSOrigin2_Hale-Bopp_desc = 海尔-波普彗星（正式编号：C/1995 O1）是 20 世纪被最广泛观测的彗星之一，也是数十年来所见最亮的彗星之一。艾伦·海尔和托马斯·波普于 1995 年 7 月 23 日分别独立发现海尔-波普彗星，当时它还未达肉眼可见。预测新彗星的最大亮度很难有任何确定性，但海尔-波普在 1997 年 4 月 1 日过近日点时达到并超越了大多数预测，亮度约 -1.8 等。由于其巨大的彗核尺寸，它肉眼可见时间创下 18 个月的纪录。这是 1811 年大彗星（前一纪录保持者）的两倍。因此，海尔-波普被称为 1997 年大彗星。
