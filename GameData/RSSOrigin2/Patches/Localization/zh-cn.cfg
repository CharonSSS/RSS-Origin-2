		#RSSOrigin2_S-2014_130_1_name = S/2014 （130） 1
		#RSSOrigin2_S-2014_130_1_desc = S/2014 （130） 1 按距离和发现顺序是怂女星的第二颗卫星。2014 年 12 月 6 日由 B·杨领导的团队在智利塞罗帕拉纳尔的甚大望远镜"梅利帕尔"（UT3） 望远镜上使用 SPHERE 自适应光学系统发现。发现观测显示该卫星的近红外星等差为 10，如果与主星反照率相同，则对应直径约 2 公里（1.2 英里）。发现于 2014 年 12 月 16 日公布，但卫星曾被错误地编号为 S/2014 （130） 2，随后立即更正为 S/2014 （130） 1。
		#RSSOrigin2_S-2014_130_1_Biome1 = 高地
