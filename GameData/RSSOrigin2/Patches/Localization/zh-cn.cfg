		#RSSOrigin2_2014FE72_Biome6 = 南半球

		#RSSOrigin2_2017OF201_name = 2017 OF201
		#RSSOrigin2_2017OF201_desc = 2017 OF201 是一颗极端海外天体和矮行星候选体，估计直径约 500-900 公里。它于 2025 年由程思昊、李家璇和杨奕然公布，他们在 2011 至 2018 年的档案望远镜图像中发现了该天体。绝对星等在 3-4 之间，2017 OF201 是太阳系中没有直接测量大小、已知最亮的天体之一。2017 OF201 的轨道极大且拉长，使其距太阳 45 至 1610 天文单位（0.00071 至 0.02546 光年）。2017 OF201 不被视为赛德娜族天体，因为其近日点（最接近太阳的点）低于 60 AU，这意味着该天体足够接近海王星，行星的引力影响会影响 2017 OF201 的轨道。
		#RSSOrigin2_2017OF201_Biome1 = 撞击坑
		#RSSOrigin2_2017OF201_Biome2 = 南部低地
