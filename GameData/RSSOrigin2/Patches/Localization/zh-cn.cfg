		#RSSOrigin2_'Aylo'chaxnim_name = 爱洛查赫妮姆（'Ayló'chaxnim）
		#RSSOrigin2_'Aylo'chaxnim_desc = 爱洛查赫妮姆（'Ayló'chaxnim）（小行星编号：594913 'Ayló'chaxnim，临时编号 2020 AV2）是一颗大型近地小行星，由兹威基瞬态设施于 2020 年 1 月 4 日发现。它是首颗被发现轨道完全位于金星轨道内的小行星，因此是阿提拉级小行星中以它命名的 'Ayló'chaxnim 族群（发现前非正式命名为 Vatira）首个也是唯一已知的成员。'Ayló'chaxnim 在所有小行星中具有已知最小的远日点和第三小的半长轴。绝对星等约 16.2，预计该小行星直径大于 1 公里。
