		#RSSOrigin2_Camilla_name = 驶神星（Camilla）
		#RSSOrigin2_Camilla_desc = 驶神星（Camilla）（107 Camilla）是小行星带最外缘最大的小行星之一，直径约 250 公里（160 英里）。它是茜尔维亚族的成员，位于原神星群内。1868 年 11 月 17 日由英国天文学家诺曼·普格森在印度马德拉斯天文台发现，以罗马神话中沃尔西人的女王卡米拉命名。这颗 X 型小行星是一颗罕见的三重小行星，分别于 2001 年和 2016 年发现了两颗小行星卫星。它形状拉长，自转周期短，为 4.8 小时。
