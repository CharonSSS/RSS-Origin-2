		#RSSOrigin2_S-2009_136617_2_desc = S/2009 (1994 CC) 2，常被称为 Gamma，是近地小行星 1994 CC 的第二颗被发现、也是位于较远轨道的外侧卫星。它的存在构成了完美的近地三合星结构。
