		#RSSOrigin2_Kagara_Biome6 = 南半球

		#RSSOrigin2_!Haunu_name = ǃHãunu
		#RSSOrigin2_!Haunu_desc = 469705 ǂKá,gára 有一颗已知卫星 ǃHãunu。ǂKá,gára 和 ǃHãunu 之间的星等差为 0.59 等。如果两天体反照率相同，这对应直径差 13%。系统质量为 （2.18±0.12）×10¹⁸ 公斤，给定反照率，两天体等效于直径 174+27-32 公里的单一球体。这对应密度 1.1+0.9-0.4 g/cm³。这并不能特别约束天体的成分，因为误差范围同时涵盖小而多孔天体和较大塌缩天体的密度。假设两天体反照率和密度相同，其质量分别为 （1.29±0.07）×10¹⁸ 公斤和 （0.89±0.05）×10¹⁸ 公斤，直径分别为 138+21-25 公里和 122+16-19 公里。
