		#RSSOrigin2_Cybele_name = 原神星（Cybele）
		#RSSOrigin2_Cybele_desc = 原神星（Cybele），小行星编号 65 Cybele，是太阳系最大的小行星之一。位于外小行星带。被认为是一颗原始天体遗骸。它以自己命名了一群在外小行星带、从与木星 2:1 轨道共振处向外运行的小行星——原神星群。这颗 X 型小行星自转周期较短，为 6.0814 小时。1861 年由威廉·坦普尔发现，以大地女神库柏勒命名。
