		#RSSOrigin2_Quaoar_name = 创神星（Quaoar）
		#RSSOrigin2_Quaoar_desc = 创神星（Quaoar）（小行星编号：50000 Quaoar，临时编号 2002 LM60）是柯伊伯带中的一颗矮行星——海王星之外的冰冷微行星区域。作为非共振天体（经典柯伊伯带天体），其直径约 1121 公里，约为冥王星直径的一半。该天体由美国天文学家查德·特鲁希略和迈克尔·布朗于 2002 年 6 月 4 日在帕洛马天文台发现。创神星表面已发现水冰迹象，表明可能正在发生冰火山活动。其表面存在少量甲烷，只有最大的柯伊伯带天体才能保留。2007 年 2 月，布朗发现了一颗绕创神星运行的同步卫星维沃特。维沃特测量直径约 170 公里。
