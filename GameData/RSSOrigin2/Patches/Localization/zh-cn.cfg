		#RSSOrigin2_Dziewanna_name = 蕊神星（Dziewanna）
		#RSSOrigin2_Dziewanna_desc = 蕊神星（Dziewanna）（小行星编号：471143 Dziewanna，临时编号 2010 EK139）是一颗黄道离散盘中的海外天体，在太阳系最外区域绕太阳运行。蕊神星于 2010 年 3 月 13 日由天文学家安德烈·乌达尔斯基、斯科特·谢泼德、马尔钦·库比亚克和查德·特鲁希略在智利拉斯坎帕纳斯天文台发现。基于其绝对星等和假设反照率，估计其直径约 470 公里。它以斯拉夫荒野、森林和狩猎女神代瓦纳（波兰语形式：Dziewanna）命名，以纪念它是在华沙大学由乌达尔斯基领导的波兰 OGLE 项目期间发现的。
		#RSSOrigin2_Dziewanna_Biome1 = 撞击坑
