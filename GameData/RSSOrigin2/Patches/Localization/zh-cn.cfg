		#RSSOrigin2_Kalliope_desc = 司赋星（Kalliope）（22 Kalliope）是小行星带的一颗大型 M 型小行星，由 J·R·欣德于 1852 年 11 月 16 日发现。以希腊史诗缪斯卡利俄佩命名。它有一颗名为林努斯的小型卫星。
