		#RSSOrigin2_Sylvia_name = 林神星（Sylvia）
		#RSSOrigin2_Sylvia_desc = 林神星（Sylvia）（小行星编号：87 Sylvia）是最大的小行星之一（大约并列第七，在测量不确定度范围内）。它是林神星族的母体，也是位于主小行星带之外的原神星群的成员（见小行星群）。林神星是第一颗已知拥有多颗卫星的小行星。
