		#RSSOrigin2_Linus_name = 林努斯星（Linus）
		#RSSOrigin2_Linus_desc = 林努斯（Linus），正式编号 （22） Kalliope I，是绕大型 M 型小行星 22 司赋星运行的小行星卫星。2001 年 8 月 29 日由天文学家让-吕克·马戈和迈克尔·E·布朗在夏威夷凯克望远镜上发现。另一个团队也于 2001 年 9 月 2 日用加法夏望远镜探测到该卫星。两台望远镜都位于莫纳克亚。它获得临时编号 S/2001 （22） 1，直到被命名。命名提案出现在发现论文中，并于 2003 年 7 月获得国际天文联合会批准。虽然命名提案提及了神话中的林努斯——缪斯卡利俄佩之子、旋律和节奏的发明者，但该名字也旨在向 Linux 操作系统内核发明者林纳斯·托瓦兹和《花生漫画》中的角色莱纳斯·范佩尔特致敬。
