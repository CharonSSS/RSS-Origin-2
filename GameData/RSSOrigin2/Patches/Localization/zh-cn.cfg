		#RSSOrigin2_Apollo_name = 阿波罗（Apollo）
		#RSSOrigin2_Apollo_desc = 阿波罗（Apollo）（小行星编号：1862 Apollo）是一颗石质小行星，直径约 1.5 公里，被归类为近地天体（NEO）。1932 年 4 月 24 日由德国天文学家卡尔·莱因穆特在海德堡天文台发现，但随后失联，直到 1973 年才重新找回。
		#RSSOrigin2_Apollo_Biome1 = 赤道脊
		#RSSOrigin2_Apollo_Biome2 = 北半球
		#RSSOrigin2_Apollo_Biome3 = 南半球

		#RSSOrigin2_S-2005_1862_1_name = S/2005 （1862） 1
		#RSSOrigin2_S-2005_1862_1_desc = 2005 年 11 月 4 日宣布，通过波多黎各阿雷西博天文台 2005 年 10 月 29 日至 11 月 2 日的雷达观测，探测到阿波罗的一颗小行星卫星。公告载于国际天文联合会快报（IAUC）8627。该卫星仅 80 米（260 英尺）宽，距小行星本身仅 3 公里（1.9 英里）处绕阿波罗运行。从阿波罗表面看，S/2005 （1862） 1 的角直径约为 2.0835 度。
		#RSSOrigin2_S-2005_1862_1_Biome1 = 高地
		#RSSOrigin2_S-2005_1862_1_Biome2 = 低地

		#RSSOrigin2_Daedalus_name = 代达罗斯（Daedalus）
		#RSSOrigin2_Daedalus_desc = 代达罗斯（Daedalus）（小行星编号：1864 Daedalus，临时编号：1971 FA），是一颗石质小行星和阿波罗群的近地天体，直径约 3 公里。1971 年 3 月 24 日由荷兰裔美国天文学家汤姆·赫雷尔斯在加利福尼亚州帕洛玛天文台发现，以希腊神话中的代达罗斯命名。
		#RSSOrigin2_Daedalus_Biome1 = 高地
		#RSSOrigin2_Daedalus_Biome2 = 中地
		#RSSOrigin2_Daedalus_Biome3 = 低地

		#RSSOrigin2_Chiron_name = 喀戎星（Chiron）
		#RSSOrigin2_Chiron_desc = 喀戎星（Chiron）（小行星编号：2060 Chiron）是外太阳系的一颗小太阳系天体，在土星和天王星之间绕太阳运行。1977 年由查尔斯·科瓦尔发现，是现在被称为半人马族——在小行星带和柯伊伯带之间运行的天体——这一新类别天体中第一个被识别的成员。虽然最初被称为小行星并仅归类为编号"2060 Chiron"的小行星，但 1989 年发现它表现出典型的彗星行为。现在它被同时归类为小行星和彗星，因此也有彗星编号 95P/Chiron。喀戎以希腊神话中的半人马喀戎命名。
		#RSSOrigin2_Chiron_Biome1 = 撞击坑
		#RSSOrigin2_Chiron_Biome2 = 南极地区
		#RSSOrigin2_Chiron_Biome3 = 北极地区
		#RSSOrigin2_Chiron_Biome4 = 赤道隆起
		#RSSOrigin2_Chiron_Biome5 = 北半球
		#RSSOrigin2_Chiron_Biome6 = 南半球

		#RSSOrigin2_Aten_name = 阿顿（Aten）
		#RSSOrigin2_Aten_desc = 阿顿（Aten）（小行星编号：2062 Aten，临时编号：1976 AA），是一颗石质亚公里级小行星，也是阿顿型小行星的同名天体，阿顿型是近地天体的一个子群。该小行星以埃及神话中的阿顿命名。
		#RSSOrigin2_Aten_Biome1 = 高地
		#RSSOrigin2_Aten_Biome2 = 中地
		#RSSOrigin2_Aten_Biome3 = 低地

		#RSSOrigin2_Ra-Shalom_name = 拉-和平星（Ra-Shalom）
		#RSSOrigin2_Ra-Shalom_desc = 拉-和平星（Ra-Shalom）（小行星编号：2100 Ra-Shalom，临时编号：1978 RA）是阿顿群的一颗小行星和近地天体，在内太阳系的偏心轨道上运行。1978 年 9 月 10 日由美国天文学家埃莉诺·赫林在加利福尼亚州帕洛玛天文台发现，她以戴维营和平协议纪念而命名。这颗 C 型小行星（Xc, K 型）自转周期 19.8 小时，直径约 2.7 公里（1.7 英里）。
		#RSSOrigin2_Ra-Shalom_Biome1 = 高地
		#RSSOrigin2_Ra-Shalom_Biome2 = 中地
		#RSSOrigin2_Ra-Shalom_Biome3 = 低地

		#RSSOrigin2_Litva_name = 立陶宛（Litva）
		#RSSOrigin2_Litva_desc = 立陶宛（Litva）（小行星编号：2577 Litva，临时编号：1975 EE3），是一颗匈牙利型火星穿越者和罕见的三重小行星，来自小行星带内区域，直径约 4 公里。1975 年 3 月 12 日由苏维埃-乌克兰天文学家尼古拉·切尔尼赫在克里米亚半岛瑙奇内的克里米亚天体物理天文台发现。以前立陶宛苏维埃社会主义共和国命名，即现在的立陶宛国。
		#RSSOrigin2_Litva_Biome1 = 高地
		#RSSOrigin2_Litva_Biome2 = 中地
		#RSSOrigin2_Litva_Biome3 = 低地

		#RSSOrigin2_S-2009_2577_1_name = S/2009 （2577） 1
		#RSSOrigin2_S-2009_2577_1_desc = 2009 年 3 月，中央天文电报局宣布发现了绕该小行星运行的卫星。该卫星直径约 1.4 公里，距立陶宛 21 公里处运行，轨道周期 1 天 11 小时 53 分钟。
		#RSSOrigin2_S-2009_2577_1_Biome1 = 高地
		#RSSOrigin2_S-2009_2577_1_Biome2 = 中地
