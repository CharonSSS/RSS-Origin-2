		#RSSOrigin2_Albiorix_name = 土卫二十六（Albiorix）
		#RSSOrigin2_Albiorix_desc = 土卫二十六（Albiorix），又称 Saturn XXVI，是高卢群的最大成员，也是土星第三大不规则卫星。2000 年由霍尔曼及其同事发现，临时编号为 S/2000 S 11。2003 年 8 月以阿尔比奥里克斯命名，他是"被认为是世界之王的高卢巨人"。这个名字来自法国萨布莱镇附近发现的一处铭文，将他等同于罗马战神玛尔斯。目前尚不清楚阿尔比奥里克斯只是一个尊称后缀（字面意思是"玛尔斯，世界之王"）还是一个被等同于玛尔斯的凯尔特神祇。
