		#RSSOrigin2_Menoetius_Biome6 = 南半球

		#RSSOrigin2_Hektor_name = 赫克托（Hektor）
		#RSSOrigin2_Hektor_desc = 赫克托（Hektor）（小行星编号：624 Hektor）是最大的木星特洛伊小行星，也是赫克托尔族的同名天体，形状高度拉长，体积相当于直径约 225 至 250 公里的球体。1907 年 2 月 10 日由天文学家奥古斯特·科普夫在德国西南部海德堡天文台发现，以希腊神话中的特洛伊王子赫克托尔命名。它有一颗直径约 12 公里的小卫星斯卡曼德里俄斯，于 2006 年发现。
		#RSSOrigin2_Hektor_Biome1 = 大叶瓣北半球
