		#RSSOrigin2_S-2014_130_2_name = S/2014 （130） 2
		#RSSOrigin2_S-2014_130_2_desc = 2021 年 11 月 6 日，天文学家 A·贝尔杜、M·朗格卢瓦和 F·瓦希耶报告在 2014 年 12 月 9 日至 31 日之间拍摄的 VLT-SPHERE 存档图像中发现了第三颗更内侧的卫星，使怂女星成为主小行星带中第一个被发现和成像的四重系统。这第三颗卫星——临时编号为 S/2014 （130） 2——在图像拍摄时因暗淡且靠近怂女星的明亮光晕而未被发崅。由于这些原因，S/2014 （130） 2 必须通过怂女星明亮光晕的图像减法来测量。该卫星直径约 1.6 公里（0.99 英里），基于 10.5 的近红外星等差。该卫星在 2016 年 2 月和 2019 年 7-8 月的后续 VLT 图像中也得到了识别。
