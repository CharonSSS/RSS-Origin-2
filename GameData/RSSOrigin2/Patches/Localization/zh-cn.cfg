		#RSSOrigin2_Scottmanley_name = 斯科特·曼利（Scottmanley）
		#RSSOrigin2_Scottmanley_desc = （小行星编号：33434 Scottmanley）为表彰其作为知名科学传播者的工作，小行星 33434 Scottmanley 以他的名字命名。正式命名引文由小行星中心于 2019 年 5 月 18 日公布（M.P.C. 114954）。这颗外主带小行星由 OCA-DLR 小行星巡天的天文学家于 1999 年发现，是石质柯罗尼斯族成员，直径约 4.6 公里。
