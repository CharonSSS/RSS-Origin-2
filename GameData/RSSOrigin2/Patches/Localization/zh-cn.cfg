		#RSSOrigin2_Dysnomia_name = 阋卫一（Dysnomia）
		#RSSOrigin2_Dysnomia_desc = 阋卫一（Dysnomia）（正式编号 （136199） Eris I Dysnomia）是矮行星阋神星唯一已知的卫星，可能是已知矮行星卫星中第二大者，仅次于冥卫一卡戎。它于 2005 年由迈克·布朗和 W·M·凯克天文台的激光导星自适应光学团队发现，临时编号 S/2005 （2003 UB313） 1，后正式命名为狄斯诺米亚（源自古希腊语 Δυσνομία，意为无政府/无法无天），以希腊女神厄里斯之女命名。
