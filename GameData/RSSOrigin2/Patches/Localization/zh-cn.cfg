		#RSSOrigin2_Phoebe_name = 土卫九（Phoebe）
		#RSSOrigin2_Phoebe_desc = 土卫九（Phoebe）是土星质量最大的不规则卫星，平均直径 213 公里（132 英里）。1899 年 3 月 18 日由威廉·亨利·皮克林从摄影底片上发现，这些底片自 1898 年 8 月 16 日起由德里斯尔·斯图尔特在秘鲁阿雷基帕附近的卡门阿尔托天文台博伊登站拍摄。它是第一颗通过摄影方式发现的卫星。土卫九是 2004 年卡西尼号航天器抵达土星系统时首先遭遇的目标，因此作为其大小的不规则卫星，它的研究异常充分。卡西尼号前往土星的轨迹和到达时间都是专门为允许这次飞掠而选择的。遭遇后进入轨道后，卡西尼号没有越过土卫八的轨道。土卫九大致呈球形，具有分化的内部。它在早期历史中是球形且炽热的，后来被反复撞击使其偏离了球形。人们认为它是一颗被捕获的半人马族天体，起源于柯伊伯带。土卫九是太阳系中仅次于海卫一的第二大逆行卫星。
