		#RSSOrigin2_Adrastea_Biome2 = 赤道低地
		#RSSOrigin2_Adrastea_Biome3 = 极地低地

		#RSSOrigin2_Metis_name = 木卫十六（Metis）
		#RSSOrigin2_Metis_desc = 木卫十六（Metis），又称 Jupiter XVI，是已知距离木星最近的卫星。它于 1979 年在旅行者 1 号拍摄的图像中被发现，1983 年以宙斯的第一任妻子墨提斯命名。伽利略号航天器在 1996 年初至 2003 年 9 月期间的进一步观测使其表面得以成像。木卫十六与木星潮汐锁定，其形状高度不对称，其中一个直径几乎是最小直径的两倍。它也是已知绕木星运行周期短于木星自转周期的两颗卫星之一，另一颗是木卫十五。它在木星主环内运行，被认为是木星环物质的主要贡献者之一。
		#RSSOrigin2_Metis_Biome1 = 赤道高地
