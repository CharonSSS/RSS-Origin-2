		#RSSOrigin2_S-2005_1139_1_name = S/2005 （1139） 1
		#RSSOrigin2_S-2005_1139_1_desc = S/2005 （1139） 1是热海（Atami）的卫星，2005 年的光度和阿雷西博回波光谱观测确认了一颗直径 5 公里的卫星，距主星至少 15 公里处运行。由于主星和次要天体大小相似，小行星中心将其列为双星伴星。
