		#RSSOrigin2_Psamathe_name = 海卫十（Psamathe）
		#RSSOrigin2_Psamathe_desc = 海卫十（Psamathe），又称 Neptune X，是海王星的一颗逆行不规则卫星。以涅瑞伊得斯之一的普萨玛忒命名。2003 年由斯科特·S·谢泼德和大卫·C·朱维特使用 8.2 米昴星望远镜发现。在 2007 年 2 月 3 日正式命名（IAUC 8802）之前，其临时编号为 S/2003 N 1。海卫十直径约 38 公里。它在 2570 万至 6770 万公里之间绕海王星运行（作为比较，太阳-水星距离在 4600 万至 6980 万公里之间变化），完成一圈轨道几乎需要 25 个地球年。该卫星的轨道接近海王星逆行轨道天体的理论稳定分离距离。考虑到海卫十的轨道参数与海卫十三（S/2002 N 4）的相似性，有人认为这两颗不规则卫星可能源自一个更大卫星的分裂。它们都距离母星比太阳系中大多数其他已知卫星更远（尽管不如 S/2021 N 1 远）。
		#RSSOrigin2_Psamathe_Biome1 = 高地
		#RSSOrigin2_Psamathe_Biome2 = 中地
		#RSSOrigin2_Psamathe_Biome3 = 低地

		#RSSOrigin2_Sao_name = 海卫十一（Sao）
		#RSSOrigin2_Sao_desc = 海卫十一（Sao）是海王星的一颗顺行不规则卫星。2002 年 8 月 14 日由马修·J·霍尔曼等人发现。海卫十一以约 2240 万公里的距离绕海王星运行，直径约 44 公里（假设反照率为 0.04）。海卫十一沿着一条与其他海王星不规则卫星相比异常倾斜且中等偏心的轨道运行。水平轴上方的卫星为顺行，下方的为逆行。黄色线段从近日点延伸到远日点，显示偏心率。该卫星处于柯扎伊共振中，即其倾角和偏心率耦合（轨道倾角降低时偏心率增加，反之亦然）。海卫十一，即 Neptune XI，与海王星的许多外侧卫星一样，以涅瑞伊得斯之一命名；萨俄与航海有关，被称为"拯救者"或"安全"。在 2007 年 2 月 3 日宣布其名字（IAUC 8802）之前，海卫十一临时编号为 S/2002 N 2。
		#RSSOrigin2_Sao_Biome1 = 高地
		#RSSOrigin2_Sao_Biome2 = 中地
		#RSSOrigin2_Sao_Biome3 = 低地

		#RSSOrigin2_Laomedeia_name = 海卫十二（Laomedeia）
		#RSSOrigin2_Laomedeia_desc = 海卫十二（Laomedeia），又称 Neptune XII，是海王星的一颗顺行不规则卫星。2002 年 8 月 13 日由马修·J·霍尔曼等人发现。在 2007 年 2 月 3 日宣布其名字（IAUC 8802）之前，其编号为 S/2002 N 3。它以约 23571000 公里的距离绕海王星运行，直径约 42 公里（假设反照率为 0.04）。以 50 个涅瑞伊得斯之一的拉俄墨狄亚命名。
		#RSSOrigin2_Laomedeia_Biome1 = 高地
		#RSSOrigin2_Laomedeia_Biome2 = 中地
		#RSSOrigin2_Laomedeia_Biome3 = 低地

		#RSSOrigin2_Neso_name = 海卫十三（Neso）
		#RSSOrigin2_Neso_desc = 海卫十三（Neso），又称 Neptune XIII，是已知海王星最外侧的天然卫星。它是一颗逆行不规则卫星，2002 年 8 月 14 日由马修·J·霍尔曼、布雷特·J·格拉德曼等人发现，但直到 2003 年才被注意到。海卫十三以超过 48 千万公里（百万公里）的距离绕海王星运行，使其成为（截至 2015 年）已知距离行星最远的卫星。在远日点，该卫星距离海王星超过 72 千万公里。这一距离足以超过水星的远日点，水星距太阳约 70 千万公里。
		#RSSOrigin2_Neso_Biome1 = 高地
		#RSSOrigin2_Neso_Biome2 = 中地
		#RSSOrigin2_Neso_Biome3 = 低地

		#RSSOrigin2_Hippocamp_name = 海卫十四（Hippocamp）
		#RSSOrigin2_Hippocampus_desc = 海卫十四（Hippocamp），编号 Neptune XIV，是 2013 年 7 月 1 日发现的海王星小卫星。由天文学家马克·肖沃尔特通过分析哈勃太空望远镜在 2004 年至 2009 年间拍摄的海王星存档照片发现。该卫星非常暗淡，1989 年旅行者 2 号探测器飞掠海王星及其卫星时未能观测到。其直径约 35 公里（20 英里），绕海王星运行约 23 小时，略少于一个地球日。由于它与海王星最大的内卫星海卫八距离异常接近，有人推测海卫十四可能是由数十亿年前海卫八遭撞击喷出的物质吸积而成。该卫星在 2019 年 2 月之前使用临时编号 S/2004 N 1，之后被正式命名为海卫十四，以希腊神话中象征波塞冬的海马命名。
		#RSSOrigin2_Hippocamp_Biome1 = 高地
		#RSSOrigin2_Hippocamp_Biome2 = 中地
		#RSSOrigin2_Hippocamp_Biome3 = 低地

		#RSSOrigin2_Pallas_name = 智神星（Pallas）
		#RSSOrigin2_Pallas_desc = 智神星（Pallas）（小行星编号：2 Pallas）是继谷神星之后发现的第二颗小行星。人们认为它的矿物成分类似于碳质球粒陨石，像谷神星一样，但含水量明显低于谷神星。按体积和质量计算，它是太阳系第三大小行星，很可能是一颗原行星遗骸。它的质量是灶神星的 79%，谷神星的 22%，约占小行星带总质量的 7%。其估计体积相当于一个直径 507 至 515 公里（315 至 320 英里）的球体，为灶神星体积的 90-95%。
