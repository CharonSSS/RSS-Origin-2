		#RSSOrigin2_S-2017_163693_1_name = S/2017 （163693） 1
		#RSSOrigin2_S-2017_163693_1_desc = 2017 年 1 月阿提拉距地球 0.207 AU（3100 万公里），是 2003 年发现以来最近的一次。这为雷达研究该小行星提供了机会。2017 年 1 月 20 日阿雷西博天文台拍摄的图像显示，阿提拉是一颗同步联星小行星，拥有一颗在轨的小行星卫星。直径 4.8±0.5 公里的主星可能呈拉长且棱角分明的形状。次星被潮汐锁定，直径 1.0±0.3 公里。2017 年 1 月 23 日拍摄的附加图像显示，两个组件以约 6 公里的距离相互绕行，轨道周期 15.5 小时。
