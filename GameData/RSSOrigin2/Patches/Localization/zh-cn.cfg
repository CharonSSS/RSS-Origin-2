		#RSSOrigin2_Menoetius_name = 帕卫一（Menoetius）
		#RSSOrigin2_Menoetius_desc = 帕卫一（小行星编号：S/2001 （617） 1），2001 年发现普特洛克勒斯是由两个大小相似的天体组成的双小行星。普特洛克勒斯之名现归于较大的组成部分，直径约 110-115 公里，而略小的次要组成部分直径约 100-105 公里，被命名为墨诺提俄斯。这是第一颗被发现的特洛伊双星小行星。
