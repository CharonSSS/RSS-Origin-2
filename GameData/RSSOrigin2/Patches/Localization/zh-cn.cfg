		#RSSOrigin2_26P-Grigg-Skjellerup_name = 葛里格-斯杰勒鲁普彗星（26P/Grigg-Skjellerup）
		#RSSOrigin2_26P-Grigg-Skjellerup_desc = 葛里格-斯杰勒鲁普彗星（正式编号：26P/Grigg-Skjellerup）是一颗周期彗星。1992 年 7 月乔托号探测器拜访了它。航天器接近至 200 公里，但因部分仪器在与哈雷彗星相遇时损坏而无法拍摄图像。
