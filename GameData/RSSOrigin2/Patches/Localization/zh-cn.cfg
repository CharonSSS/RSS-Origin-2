		#RSSOrigin2_Prometheus_name = 土卫十六（Prometheus）
		#RSSOrigin2_Prometheus_desc = 土卫十六（Prometheus）是土星的一颗内卫星。1980 年 10 月 24 日从旅行者 1 号探测器拍摄的照片中发现，临时编号为 S/1980 S 27。1985 年末正式以希腊神话中的泰坦普罗米修斯命名。它也被编号为 Saturn XVI。土卫十六极度拉长，尺寸约为 137 公里 × 81 公里 × 56 公里（85 英里 × 50 英里 × 35 英里）。它有数条山脊和山谷，可见若干直径约 20 公里（12 英里）的撞击坑，但其撞击坑比附近的土卫十七、土卫十一和土卫十要少。从其极低的密度和相对较高的反照率来看，土卫十六很可能是一个非常多孔的冰冷天体。不过这些值存在很大的不确定性，因此尚待确认。
		#RSSOrigin2_Prometheus_Biome1 = 赤道高地
		#RSSOrigin2_Prometheus_Biome2 = 赤道低地
		#RSSOrigin2_Prometheus_Biome3 = 北半球
		#RSSOrigin2_Prometheus_Biome4 = 南半球

		#RSSOrigin2_Pandora_name = 土卫十七（Pandora）
		#RSSOrigin2_Pandora_desc = 土卫十七（Pandora）是土星的一颗内卫星。1980 年从旅行者 1 号探测器拍摄的照片中发现，临时编号为 S/1980 S 26。1985 年末正式以希腊神话中的潘多拉命名。它也被编号为 Saturn XVII。土卫十七曾被认为是 F 环的外侧牧羊卫星。然而，最近的研究表明它并不扮演这样的角色，只有内侧牧羊卫星土卫十六对窄环的约束有贡献。它的撞击坑比附近的土卫十六更密集，至少有两个直径 30 公里（19 英里）的大型撞击坑。土卫十七上的大多数撞击坑因被碎片填充而较浅。卫星表面也存在山脊和沟槽。
