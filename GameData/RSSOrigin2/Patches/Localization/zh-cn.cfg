		#RSSOrigin2_Antiope_name = 休神星（Antiope）
		#RSSOrigin2_Antiope_desc = 休神星（Antiope）（小行星编号：90 Antiope）是外小行星带的一颗双小行星。1866 年 10 月 1 日由罗伯特·路德发现。2000 年发现它由两个几乎同等大小的天体组成，相互绕转。平均直径分别约 88 公里和 84 公里，两个组成部分都在 500 颗大小行星之列。休神星是拥有相似轨道要素的忒弥斯族小行星成员。
