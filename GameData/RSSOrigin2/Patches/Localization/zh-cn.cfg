		#RSSOrigin2_81P-Wild2_Biome3 = 南半球

		#RSSOrigin2_103P-Hartley2_name = 哈特雷二号彗星（103P/Hartley）
		#RSSOrigin2_103P-Hartley2_desc = 哈特雷二号彗星（正式编号：103P/Hartley），是一颗小型周期彗星，轨道周期 6.46 年。它由马尔科姆·哈特雷于 1986 年在澳大利亚赛丁泉天文台施密特望远镜单元发现。直径估计 1.2-1.6 公里。
		#RSSOrigin2_103P-Hartley2_Biome1 = 小瓣
		#RSSOrigin2_103P-Hartley2_Biome2 = 大瓣

		#RSSOrigin2_153P-Ikeya-Zhang_name = 池谷-张彗星（153P/Ikeya-Zhang）
		#RSSOrigin2_153P-Ikeya-Zhang_desc = 池谷-张彗星（正式编号：153P/Ikeya-Zhang）是 2002 年由日本和中国两位天文学家独立发现的一颗彗星。它是编号周期彗星中轨道周期迄今最长的。上次观测于 2002 年 10 月，距太阳约 3.3 AU（4.9 亿公里）。
		#RSSOrigin2_153P-Ikeya-Zhang_Biome1 = 高地
		#RSSOrigin2_153P-Ikeya-Zhang_Biome2 = 中地
		#RSSOrigin2_153P-Ikeya-Zhang_Biome3 = 低地

		#RSSOrigin2_311P-PanSTARRS_name = 311P/PanSTARRS
		#RSSOrigin2_311P-PanSTARRS_desc = 311P/PanSTARRS，亦称 P/2013 P5 （PanSTARRS），是一颗活跃小行星和恩克型彗星，由布莱斯·T·博林使用泛星计划望远镜于 2013 年 8 月 27 日发现。哈勃空间望远镜的观测显示它有六条类似彗星的尾巴。这些尾巴被认为是小行星因作为碎石堆自转足够快而抛射物质形成的物质流。这类似于 331P/Gibbs，后者也被发现是快速自转的碎石堆。
