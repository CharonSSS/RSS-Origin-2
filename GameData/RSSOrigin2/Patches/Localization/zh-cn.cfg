		#RSSOrigin2_S-2002_121_1_name = S/2002 （121） 1
		#RSSOrigin2_S-2002_121_1_desc = 赫女星的一颗卫星于 2002 年用凯克 II 望远镜发现。该卫星临时编号为 S/2002 （121） 1。它尚未被正式命名，但一组天文学家提议将其命名为"拉法耶特"，以纪念拉法耶特侯爵秘密用来前往美洲帮助起义者的那艘护卫舰。
