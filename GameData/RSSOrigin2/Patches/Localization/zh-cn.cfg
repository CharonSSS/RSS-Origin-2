		#RSSOrigin2_Pholus_name = 福鲁斯（Pholus）
		#RSSOrigin2_Pholus_desc = 福鲁斯（Pholus）（小行星编号：5145 Pholus）是外太阳系的一颗偏心半人马族天体，直径约 180 公里（110 英里），穿越土星和海王星的轨道。1992 年 1 月 9 日由美国天文学家大卫·拉比诺维茨（未署名）在亚利桑那州基特峰国家天文台的空间监测巡天中发现。这颗非常偏红的天体形状拉长，自转周期 9.98 小时。以希腊神话中的半人马福鲁斯命名。
