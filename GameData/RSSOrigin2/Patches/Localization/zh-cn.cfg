		#RSSOrigin2_Lempo_name = 伦波（Lempo）
		#RSSOrigin2_Lempo_desc = 伦波（Lempo）（小行星编号：47171 Lempo），或作为联星 （47171） Lempo-Hiisi（亦称 1999 TC36），是来自柯伊伯带的海王星外天体三星系统，位于太阳系最外区域。它于 1999 年 10 月 1 日由美国天文学家埃里克·鲁本斯坦和路易-格雷瓜里·斯特罗尔格在亚利桑那州基特峰国家天文台观测时发现。鲁本斯坦当时在搜寻斯特罗尔格为近邻星系超新星搜寻项目拍摄的图像。它被归类为冥族小天体，与海王星 2:3 平均运动共振，是较亮的海外天体之一。它于 2015 年 7 月到达近日点。这颗小行星以芬兰神话中的伦波命名。
