		#RSSOrigin2_Typhon_name = 台神星（Typhon）
		#RSSOrigin2_Typhon_desc = 台神星（Typhon）（小行星编号：42355 Typhon，临时编号 2002 CR46）是一颗黄道离散天体，于 2002 年 2 月 5 日由 NEAT 计划发现。直径 162±7 公里，以希腊神话中的怪物提丰命名。提丰是已知第一颗联星半人马族天体（采用半人马的扩展定义，即在非共振（不稳定）轨道上、近日点在海王星轨道内的天体）。
