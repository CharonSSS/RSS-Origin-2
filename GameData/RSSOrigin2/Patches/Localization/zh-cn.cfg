		#RSSOrigin2_Weywot_name = 创卫一（Weywot）
		#RSSOrigin2_Weywot_desc = 创卫一（Weywot），（小行星编号：（50000） Quaoar I Weywot），是海外小天体 50000 创神星唯一已知的卫星。由迈克尔·布朗和 T·A·苏尔使用哈勃空间望远镜于 2006 年 2 月 14 日获取的图像发现，其存在在 2007 年 2 月 22 日公布的 IAU 快报中宣布。维沃特估计直径约 170 公里（约为主星的 15%）。该卫星在距创神星 0.35 角秒处被发现，视星等差为 5.6。
