		#RSSOrigin2_Aegis_name = 慧卫一（Aegis）
		#RSSOrigin2_Aegis_desc = 慧卫一（Aegis），学术正式编号为 （93） Minerva I Aegis，是智慧与战争女神密涅瓦（慧神星）身边最强大的守护神盾。它是大型三重主带小行星——慧神星（93 Minerva）的第一颗、也是较大的一颗外侧卫星。
