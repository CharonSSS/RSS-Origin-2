		#RSSOrigin2_Hermione_name = 赫女星（Hermione）
		#RSSOrigin2_Hermione_desc = 赫女星（Hermione）（小行星编号：121 Hermione）是一颗非常大的双小行星，1872 年发现。它在原神星群中运行，位于外小行星带远端。作为暗 C 光谱型小行星，它可能由碳质材料组成。2002 年，发现有一颗小卫星绕赫女星运行。
