		#RSSOrigin2_Manwe_Biome6 = 颈部

		#RSSOrigin2_Thorondor_name = 曼卫一（Thorondor）
		#RSSOrigin2_Thorondor_desc = 作为联星系统的一部分，曼威有一颗已知伴星索隆多，正式编号 （385446） Manwë I Thorondor。估计约为主星三分之二大小，体积等效直径约 108 公里。索隆多的自转周期不确定，尽管最佳拟合模型表明其自转周期非常缓慢，为 309.3 天。预期索隆多的自转像冥王星较小的卫星一样混乱，这是曼威在偏心互绕轨道过程中施加引力扭矩的结果。
		#RSSOrigin2_Thorondor_Biome1 = 撞击坑
