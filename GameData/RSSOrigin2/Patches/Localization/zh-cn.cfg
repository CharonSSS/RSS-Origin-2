		#RSSOrigin2_Xiangliu_name = 共卫一（Xiangliu）
		#RSSOrigin2_Xiangliu_desc = 共卫一（Xiangliu），全称 225088 Gonggong I Xiangliu，是黄道离散盘可能的矮行星 225088 共工唯一已知的卫星。它由乔鲍·基什领导的天文学家团队在分析共工的哈勃空间望远镜档案图像时发现。发现团队怀疑共工的缓慢自转是由绕行卫星施加的潮汐力所致。共卫一最早在 2010 年 9 月 18 日用哈勃第三代广域照相机拍摄的档案图像中被识别。其发现由加博尔·马尔顿、乔鲍·基什和托马斯·穆勒于 2016 年 10 月 17 日在行星科学部第 48 次会议上报告并公布。该卫星以中国神话中九头毒蛇怪相柳命名——相柳是水神共工的主臣。
