		#RSSOrigin2_Duende_name = 杜恩德（Duende）
		#RSSOrigin2_Duende_desc = 杜恩德（Duende）（小行星编号：367943 Duende，临时编号 2012 DA14）是一颗微大小行星，Aten 和 Atira 群近地天体，直径约 30 米。它于 2012 年由马略卡天文台的天文学家在其 robotic 拉萨格拉天文台发现，以伊比利亚和菲律宾神话及民间传说中类似哥布林的小精灵杜恩德命名。杜恩德可能是罕见的 L 型小行星，形状显著拉长。对于这种大小的小行星，它的自转周期相对较长，为 9.485 小时。
		#RSSOrigin2_Duende_Biome1 = 高地
		#RSSOrigin2_Duende_Biome2 = 低地

		#RSSOrigin2_Manwe_name = 曼威（Manwë）
		#RSSOrigin2_Manwe_desc = 曼威（Manwë）（小行星编号：385446 Manwë），或 （385446） Manwë-Thorondor，是一颗共振柯伊伯带联星天体，与海王星 4:7 平均运动共振。它于 2003 年 8 月 25 日由美国天文学家马克·布伊在智利北部的托洛洛山天文台发现。2019 年对曼威光变曲线的研究表明它可能是接触双星天体。
		#RSSOrigin2_Manwe_Biome1 = 撞击坑
		#RSSOrigin2_Manwe_Biome2 = 瓣1北半球
