		#RSSOrigin2_Atira_name = 阿提拉（Atira）
		#RSSOrigin2_Atira_desc = 阿提拉（Atira）（小行星编号：163693 Atira，临时编号 2003 CP20）是一颗石质小行星，居住在地球轨道内部。它被归类为近地天体。阿提拉是联星小行星，即两颗小行星绕共同质心运行的系统。主组件直径约 4.8 公里，由一颗约 1 公里的小行星卫星绕行。阿提拉于 2003 年 2 月 11 日由林肯近地小行星研究在美国新墨西哥州索科罗附近的林肯实验室实验测试场的天文学家发现。
