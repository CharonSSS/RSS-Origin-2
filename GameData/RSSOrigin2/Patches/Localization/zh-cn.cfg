		#RSSOrigin2_Ymir_name = 土卫十九（Ymir）
		#RSSOrigin2_Ymir_desc = 土卫十九（Ymir），即 Saturn XIX，是土星第二大逆行不规则卫星。2000 年由布雷特·J·格拉德曼等人发现，临时编号为 S/2000 S 1。与帕利亚克一起，2000 年的发现是一个世纪前发现土卫九之后首次探测到土星的不规则卫星。2003 年 8 月以尤弥尔命名，在北欧神话中他是所有巨人或霜巨人的祖先。
