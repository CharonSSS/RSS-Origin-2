		#RSSOrigin2_Virginia_name = 弗吉尼亚星（Virginia）
		#RSSOrigin2_Virginia_desc = 弗吉尼亚（Virginia）（小行星编号：50 Virginia）是一颗大而非常暗的主带小行星。1857 年 10 月 4 日由美国天文学家詹姆斯·弗格森在华盛顿特区的美国海军天文台发现。德国天文学家罗伯特·路德于 10 月 19 日在杜塞尔多夫独立发现，其发现最先被公布。
