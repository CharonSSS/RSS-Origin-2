		#RSSOrigin2_Aya_name = 阿亚（Aya）
		#RSSOrigin2_Aya_desc = 阿亚（Aya）（小行星编号：55565 Aya，临时编号 2002 AW197）是经典柯伊伯带中的一颗大型海外天体。它于 2002 年 1 月 10 日由帕洛马天文台的天文学家发现。阿雅是一个大型天体，直径很可能至少 700 公里。自转周期 8.8 小时，呈中度红色。该天体亮度随自转无明显变化，表明它可能呈球形。
