		#RSSOrigin2_Arawn_name = 酆神星（Arawn）
		#RSSOrigin2_Arawn_desc = 酆神星（Arawn）（小行星编号：15810 Arawn，临时编号 1994 JR1）是来自柯伊伯带内部区域的海外天体（TNO），直径约 133 公里。它属于冥族小天体，这是共振海外天体中数量最多的一类。它以威尔士神话中彼世之主阿拉温命名，于 1994 年 5 月 12 日由天文学家迈克尔·欧文和安娜·日特科夫在西班牙加那利群岛罗克·德·洛斯·穆查乔斯天文台使用 2.5 米艾萨克·牛顿望远镜发现。阿拉温的特殊之处在于它被新视野号探测器在远比大多数柯伊伯带天体近的距离上观测过，2016 年 4 月从 1.11 亿公里（0.74 AU）处拍摄了它的图像；这与其他观测使其自转周期得以确定。
