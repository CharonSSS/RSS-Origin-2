		#RSSOrigin2_Namaka_Biome6 = 南半球

		#RSSOrigin2_Eris_name = 阋神星（Eris）
		#RSSOrigin2_Eris_desc = 阋神星（Eris）（小行星编号：136199 Eris）是太阳系中质量最大、第二大已知的矮行星。它是黄道离散盘中的海外天体（TNO），轨道偏心率较高。阋神星于 2005 年 1 月由帕洛马天文台迈克·布朗领导的团队发现，并于同年晚些时候得到验证。2006 年 9 月，以希腊-罗马神话中的纷争与不和女神厄里斯命名。阋神星是绕太阳运行的已知第九大质量天体，也是太阳系总体（含卫星）第十六大质量天体。它也是尚未被航天器拜访的最大天体。阋神星测量直径 2326 ± 12 公里；质量为地球的 0.28%，比冥王星大 27%，尽管冥王星体积略大。
		#RSSOrigin2_Eris_Biome1 = 撞击坑
		#RSSOrigin2_Eris_Biome2 = 冰川平原
		#RSSOrigin2_Eris_Biome3 = 沙丘
		#RSSOrigin2_Eris_Biome4 = 山脉
		#RSSOrigin2_Eris_Biome5 = 崎岖地
		#RSSOrigin2_Eris_Biome6 = 深谷
