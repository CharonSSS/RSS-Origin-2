		#RSSOrigin2_Ixion_name = 伊克西翁（Ixion）
		#RSSOrigin2_Ixion_desc = 伊克西翁（Ixion）（小行星编号：28978 Ixion，临时编号 2001 KX76）是一颗大型海外天体和可能的矮行星。它位于柯伊伯带——外太阳系海王星轨道之外的冰冷天体区域。伊克西翁被归类为冥族小天体，即与海王星 2:3 轨道共振的一类动力学天体。它于 2001 年 5 月由深黄道巡天的天文学家在托洛洛山美洲际天文台发现，并于 2001 年 7 月公布。该天体以希腊神话人物、拉庇泰人之王伊克西翁命名。
