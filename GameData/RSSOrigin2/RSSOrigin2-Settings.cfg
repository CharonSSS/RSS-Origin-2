RSSOrigin2Settings
{

	//////////////////////////////////// GENERAL USER SETTINGS ////////////////////////////////////


	AppearanceStyle = Origin // Origin, Sol
	// Some celestial bodies in Sol are derived from RSS-Origin 2, they are:
	// Amalthea, Thebe, Hyperion, Phoebe, Puck, Proteus, Nereid, Nix, Hydra, Kerberos, Styx, Pallas, Psyche, Ida, Eros, Arrokoth.
	// For the derived ones, they more or less have changes in their appearance and detail compared to Origin (mainly surface color, terrain texture, surface scatter, etc.).
	// You can choose the appearance and detail style for them, Origin-style or Sol-style. Default is Origin-style.


	ScatterQuality = Default // High, Default, Low
	// Controls the amount and loading range of scatters (mainly rocks) on the surface, moderate GPU and VRAM impact. Default is Default.
	// Quality are based on default Parallax Global Settings.
	// High - 1.0x surface scatter density and loading range, recommended for mid-to-high tier GPU and 6GB of VRAM at least.
	// Default - 0.7x surface scatter density, 0.8-1.0x loading range, default.
	// Low - 0.4x surface scatter density, 0.6-0.8x loading range, switch to this if your game lags a lot when landing on the surface.


	///////////////////////////////////////////////////////////////////////////////////////////////

}













































































///-----------------------------------------///
/// DO NOT TOUCH ANY VALUES BELOW THIS LINE ///
///-----------------------------------------///

@Kopernicus:FOR[RSSOrigin2]
{
	RSSOrigin2Settings
	{
		AppearanceStyle = #$@RSSOrigin2Settings/AppearanceStyle$
	}
}
@Kopernicus:FOR[RSSOrigin2]
{
	RSSOrigin2Settings
	{
		ScatterQuality = #$@RSSOrigin2Settings/ScatterQuality$
	}
}
@ParallaxTerrain:FOR[RSSOrigin2]
{
	RSSOrigin2Settings
	{
		AppearanceStyle = #$@RSSOrigin2Settings/AppearanceStyle$
	}
}
@ParallaxScatters:FOR[RSSOrigin2]
{
	RSSOrigin2Settings
	{
		AppearanceStyle = #$@RSSOrigin2Settings/AppearanceStyle$
	}
}
@ParallaxScatters:FOR[RSSOrigin2]
{
	RSSOrigin2Settings
	{
		ScatterQuality = #$@RSSOrigin2Settings/ScatterQuality$
	}
}